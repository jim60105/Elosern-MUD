[project]
name = "elosern-map-editor"
version = "0.1.0"
description = "Independent local map editor service for the Elosern authored map documents. Runs without the game, Evennia, Django, a database, Node or network assets."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # The core generation extra (NumPy/SciPy) for explicit partition jobs.
    "elosern-map-core[generation]",
    "starlette>=0.47",
    "uvicorn>=0.35",
    # Workspace notifications (continuous file following, map-editor-file-following).
    "watchfiles>=1.1",
]

[project.scripts]
elosern-map-editor = "elosern_map_editor.__main__:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["elosern_map_editor"]

[tool.uv]
required-version = ">=0.12.0"

[tool.uv.sources]
# The shared pure core, consumed from the repository checkout. The editor never
# installs the root game project or any of its dependencies.
elosern-map-core = { path = "../../packages/map-core", editable = true }

[dependency-groups]
capture = [
    "pillow>=11.0",
    # The same browser automation runtime the repository's browser suites use,
    # so one installed Chromium build serves both and versions never drift.
    "playwright==1.62.0",
]
dev = [
    "httpx>=0.28",
    "pytest>=8.4.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
