x-evennia-build: &evennia-build
  context: .
  dockerfile: Containerfile
  args:
    UID: ${CONTAINER_UID:-1001}
    VERSION: ${VERSION:-EDGE}
    RELEASE: ${RELEASE:-0}

services:
  evennia:
    image: localhost/elosern-mud:${IMAGE_TAG:-edge}
    build: *evennia-build
    ports:
      - "4000:4000"
      - "4001:4001"
      - "4002:4002"
    env_file: .env
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.containers.internal:11434}
      # Optional LLM knobs forward with an empty default, so a host without a
      # variable set contributes the blank omit-sentinel (settings treats it
      # as unset) rather than a literal. Project-root .env feeds these
      # interpolations. LLM_API_KEY stays non-secret in this file: an unset
      # host value forwards blank (= omit), never a literal key.
      LLM_PATH: ${LLM_PATH:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_APP_TITLE: ${LLM_APP_TITLE:-}
      LLM_APP_URL: ${LLM_APP_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-}
      LLM_FREQUENCY_PENALTY: ${LLM_FREQUENCY_PENALTY:-}
      LLM_PRESENCE_PENALTY: ${LLM_PRESENCE_PENALTY:-}
      LLM_TOP_K: ${LLM_TOP_K:-}
      LLM_TOP_P: ${LLM_TOP_P:-}
      LLM_REPETITION_PENALTY: ${LLM_REPETITION_PENALTY:-}
      LLM_MIN_P: ${LLM_MIN_P:-}
      LLM_TOP_A: ${LLM_TOP_A:-}
      LLM_REASONING_ENABLED: ${LLM_REASONING_ENABLED:-}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-}
      LLM_REASONING_STYLE: ${LLM_REASONING_STYLE:-}
      LLM_MAX_COMPLETION_TOKENS: ${LLM_MAX_COMPLETION_TOKENS:-}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-}
      LLM_SUPPORTS_RESPONSE_FORMAT: ${LLM_SUPPORTS_RESPONSE_FORMAT:-}
      LLM_ENABLED: ${LLM_ENABLED:-}
      SD_WEBUI_BASE_URL: ${SD_WEBUI_BASE_URL:-http://host.containers.internal:7860}
      # Non-interactive superuser creation for a fresh database: the Evennia
      # launcher's `check_database` creates Account #1 from these vars at
      # boot; without them it falls back to an interactive prompt and
      # recurses until it crashes (RecursionError) on a fresh volume.
      EVENNIA_SUPERUSER_USERNAME: ${EVENNIA_SUPERUSER_USERNAME:-browserplayer}
      EVENNIA_SUPERUSER_EMAIL: ${EVENNIA_SUPERUSER_EMAIL:-browser@example.test}
      EVENNIA_SUPERUSER_PASSWORD: ${EVENNIA_SUPERUSER_PASSWORD:-ElosernBrowserTest!2026}
      # The official-artwork bind mount below is read from exactly this
      # container path. This is deliberately a literal, never an
      # interpolation: a host ART_OFFICIAL_ROOT exported for a bare-metal run
      # must not leak into the container. The named-volume alternative is
      # configured by editing this value together with its volume line
      # (docs/development/official-artwork-deployment.md).
      ART_OFFICIAL_ROOT: /app/art-official
    security_opt:
      - no-new-privileges
    stop_signal: SIGINT
    stop_grace_period: 30s
    tmpfs:
      - /tmp:rw,nosuid,nodev,mode=1777
    volumes:
      - evennia-db:/app/server/db
      - evennia-art:/app/server/.art
      - evennia-rembg:/app/server/.rembg
      - evennia-translate:/app/server/.translate
      - evennia-logs:/app/server/logs
      - evennia-static:/app/server/.static
      - evennia-media:/app/server/.media
      - ${PROMPTS_DIR:-./prompts}:/app/prompts:ro,z
      - ${ART_SEED_DIR:-./art-seed}:/app/art-seed:ro,z
      - ${ART_OFFICIAL_DIR:-./art-official}:/app/art-official:ro,z

  # Deployment-time only: populate the named official-artwork volume from one
  # trusted operator archive (docs/development/official-artwork-deployment.md).
  #   ART_OFFICIAL_ARCHIVE=official-art-2026-10.tar.gz \
  #     podman compose --profile artwork-prepare run --rm artwork-prepare
  # The archive is read from ${ART_OFFICIAL_ARCHIVES_DIR} mounted read-only;
  # without ART_OFFICIAL_ARCHIVE the run is a no-op. Game startup never invokes
  # this service and the game process never extracts anything, so no
  # extraction tooling lives in the evennia service.
  artwork-prepare:
    profiles:
      - artwork-prepare
    image: localhost/elosern-mud:${IMAGE_TAG:-edge}
    build: *evennia-build
    # The repository script, mounted read-only: the runtime image itself
    # carries no artwork, archive, or extraction workflow.
    entrypoint:
      - /bin/sh
      - /app/prepare-official-artwork.sh
    command: []
    environment:
      ART_OFFICIAL_ARCHIVE: ${ART_OFFICIAL_ARCHIVE:-}
      ART_OFFICIAL_CONTENT_DIR: /app/art-official/content
      ART_OFFICIAL_MAX_ENTRIES: ${ART_OFFICIAL_MAX_ENTRIES:-50000}
      ART_OFFICIAL_MAX_FILE_BYTES: ${ART_OFFICIAL_MAX_FILE_BYTES:-67108864}
      ART_OFFICIAL_MAX_TOTAL_BYTES: ${ART_OFFICIAL_MAX_TOTAL_BYTES:-8589934592}
    network_mode: none
    read_only: true
    security_opt:
      - no-new-privileges
    tmpfs:
      - /tmp:rw,nosuid,nodev,mode=1777
    volumes:
      # Write access to the volume's content subdirectory only; the volume
      # root is never replaced and the game mounts this same volume read-only.
      - evennia-art-official:/app/art-official
      - ${ART_OFFICIAL_ARCHIVES_DIR:-./art-official-archives}:/app/art-official-archives:ro,z
      - ./scripts/prepare-official-artwork.sh:/app/prepare-official-artwork.sh:ro,z

  # First run only: podman compose --profile bootstrap run --rm bootstrap
  bootstrap:
    profiles:
      - bootstrap
    image: localhost/elosern-mud:${IMAGE_TAG:-edge}
    build: *evennia-build
    entrypoint:
      - /usr/local/bin/dumb-init
      - --
    command:
      - /bin/sh
      - -c
      - evennia migrate --noinput && exec evennia createsuperuser
    stdin_open: true
    tty: true
    env_file: .env
    environment:
      EVENNIA_SUPERUSER_USERNAME: ${EVENNIA_SUPERUSER_USERNAME:-browserplayer}
      EVENNIA_SUPERUSER_EMAIL: ${EVENNIA_SUPERUSER_EMAIL:-browser@example.test}
      EVENNIA_SUPERUSER_PASSWORD: ${EVENNIA_SUPERUSER_PASSWORD:-ElosernBrowserTest!2026}
    security_opt:
      - no-new-privileges
    tmpfs:
      - /tmp:rw,nosuid,nodev,mode=1777
    volumes:
      - evennia-db:/app/server/db

volumes:
  evennia-db:
  evennia-art:
  evennia-rembg:
  evennia-translate:
  evennia-logs:
  evennia-static:
  evennia-media:
  evennia-art-official:
