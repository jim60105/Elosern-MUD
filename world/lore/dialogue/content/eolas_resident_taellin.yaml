schema_version: 1
greeting: 泰林把額前被蒸汽蒸得貼住的髮往耳後一別，笑著迎上來：「是要泡泉，還是問池子的事？我帶路。」
topics:
- topic_id: eolas_resident_taellin.topic_01
  keyword: 温泉
  label: 温泉
  fallback:
    scene_id: eolas_resident_taellin.topic_01_scene
    revision: r1
    lines:
    - kind: speech
      speaker: actor
      text: 「哪口池子最適合頭一次來的人？」
    - kind: speech
      speaker: host
      text: 「外頭那口最溫，先坐進去把身子焐軟。裡頭那口能把人燙得直叫喚，我勸你別一頭栽進去，對不對？」
    - kind: narration
      text: 她伸腳在池邊試了試水面，再朝你招手。
    - kind: speech
      speaker: host
      text: 「泡到腳心發熱再往裡換。放心，谷裡沒人笑你，大夥都一樣脫個乾淨。」
- topic_id: eolas_resident_taellin.topic_02
  keyword: 布巾
  label: 布巾
  fallback:
    scene_id: eolas_resident_taellin.topic_02_scene
    revision: r1
    lines:
    - kind: speech
      speaker: actor
      text: 「你在這兒都忙些什麼？」
    - kind: speech
      speaker: host
      text: 「遞布、添柴、撈落葉。誰泡完澡手一伸，乾淨的布就送到他跟前。我幹這活，一天看遍谷裡光著的身子。」
    - kind: speech
      speaker: host
      text: 「看久了就知道，誰愛先暖腳、誰一進水就閉眼。身子軟了，人心也軟，講的話都像從水裡浮起來。」
- topic_id: eolas_resident_taellin.topic_03
  keyword: 姊妹
  label: 姊妹
  fallback:
    scene_id: eolas_resident_taellin.topic_03_scene
    revision: r1
    lines:
    - kind: speech
      speaker: actor
      text: 「你家裡還有別的人嗎？」
    - kind: speech
      speaker: host
      text: 「我娘佩倫林顧著池子，我妹妹伊倫林老泡在最燙那口，喊都喊不動。一家三口白天各忙一頭，夜裡在池邊才算齊。」
    - kind: speech
      speaker: host
      text: 「我妹妹那性子，你要是泡著泡著想瞇一覺，就跟去她那口，她一整個下午不挪窩，安靜得像池子裡養出來的水草。」
- topic_id: eolas_resident_taellin.topic_04
  keyword: 谷裡
  label: 谷裡
  fallback:
    scene_id: eolas_resident_taellin.topic_04_scene
    revision: r1
    lines:
    - kind: speech
      speaker: actor
      text: 「谷裡晚上也這麼靜嗎？」
    - kind: speech
      speaker: host
      text: 「才不。夜裡才是熱鬧的開始，泉邊人聲、水聲、聽不出誰跟誰的喘息攪在一塊。谷裡的夜不藏著，你待一夜就曉得。」
    - kind: speech
      speaker: host
      text: 「有些人家做完愛就泡進池裡，再接著說第二天的活。這裡沒有見不得人的事，只有燙熨得身子更軟。」
- topic_id: eolas_resident_taellin.topic_05
  keyword: 名字
  label: 名字
  fallback:
    scene_id: eolas_resident_taellin.topic_05_scene
    revision: r1
    lines:
    - kind: speech
      speaker: actor
      text: 「你們家怎麼就叫溫德松？」
    - kind: speech
      speaker: host
      text: 「我娘說，泉眼冒出的白氣像林裡的風，吹過松針會唱。這家守著水，也守著那陣歌聲，就成了溫德松。」
    - kind: narration
      text: 她伸手接了一捧水汽，攤開掌心給你看，又任它散掉。
    - kind: speech
      speaker: host
      text: 「名字這東西說不清，像這霧。你在谷裡住久了，也就懂了。」
- topic_id: eolas_resident_taellin.topic_06
  keyword: 私事
  label: 私事
  requires:
    kind: affinity_at_least
    stage_key: trusted
  unavailable: locked
  refusal:
    scene_id: eolas_resident_taellin.topic_06_refusal
    revision: r1
    lines:
    - kind: speech
      speaker: host
      text: 「這是我心裡的小事，等哪天你在池邊跟我坐熟了，我再說。」
  fallback:
    scene_id: eolas_resident_taellin.topic_06_scene
    revision: r1
    lines:
    - kind: speech
      speaker: actor
      text: 「你有沒有只屬於自己的小喜好？」
    - kind: speech
      speaker: host
      text: 「有。我喜歡剛洗完、身子還滾燙的時候，一個人裹著半濕的布站在池邊，讓夜風吹乾。風貼著紅透的皮，一涼一熱，人都站不穩。」
    - kind: narration
      text: 她說得眉飛色舞，酒窩漾開，像是正享受那陣風。
    - kind: speech
      speaker: host
      text: 「這種舒服只有自己知道夠不夠。你哪天想試，我教你怎麼站著等風。」