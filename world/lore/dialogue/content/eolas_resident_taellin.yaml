schema_version: 1
greeting: 泰林把貼在額角的濕髮撥開，笑著迎上來。「要泡泉？還是問池子？我帶你去，省得你踩滑。」
topics:
- topic_id: eolas_resident_taellin.topic_01
  keyword: 溫泉
  label: 溫泉
  fallback:
    scene_id: eolas_resident_taellin.topic_01_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「哪口池子適合頭一次來的人？」
    - kind: speech
      speaker: host
      text: 「外頭那口最溫，先坐進去，把腳泡熱了再說。裡頭那口燙得人直叫，你別一頭栽進去，對不對？」
    - kind: narration
      text: 她伸腳在池邊試了試水，回頭朝你招手。
    - kind: speech
      speaker: host
      text: 「腳心熱了再往裡換，中間隔著石階，踩穩了挪過去。」
    - kind: speech
      speaker: host
      text: 「放心，谷裡沒人笑你。大夥都脫得乾淨，誰也不看誰。」
- topic_id: eolas_resident_taellin.topic_02
  keyword: 布巾
  label: 布巾
  fallback:
    scene_id: eolas_resident_taellin.topic_02_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「你在這兒都忙些什麼？」
    - kind: speech
      speaker: host
      text: 「遞布、添柴、撈落葉。誰泡完手一伸，乾淨的布就送到他手上。」
    - kind: speech
      speaker: host
      text: 「一天看下來，誰愛先暖腳、誰一下水就閉眼，我心裡都有數。」
    - kind: narration
      text: 她把一疊布巾往石台上一放，順手壓平邊角。
    - kind: speech
      speaker: host
      text: 「身子泡軟了，話也跟著軟。池邊聽見的閒話，比屋裡多。」
- topic_id: eolas_resident_taellin.topic_03
  keyword: 姊妹
  label: 姊妹
  fallback:
    scene_id: eolas_resident_taellin.topic_03_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「你家裡還有別人嗎？」
    - kind: speech
      speaker: host
      text: 「娘佩倫林顧著池子，我妹妹伊倫林老泡在最燙那口，喊都喊不動。」
    - kind: narration
      text: 她往裡頭那口池子抬了抬下巴，水氣後面有個人影靠著石壁。
    - kind: speech
      speaker: host
      text: 「白天各忙一頭，夜裡在池邊才湊齊。誰先到就先佔位置。」
    - kind: speech
      speaker: host
      text: 「你想安靜瞇一下，就去我妹妹那口。她一下午不挪窩，比石頭還穩。」
- topic_id: eolas_resident_taellin.topic_04
  keyword: 谷裡
  label: 谷裡
  fallback:
    scene_id: eolas_resident_taellin.topic_04_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「谷裡的晚上，也這麼安靜嗎？」
    - kind: speech
      speaker: host
      text: 「才不。夜裡才熱鬧。泉邊人聲、水聲，還有聽不出誰跟誰的喘氣，全攪在一塊。」
    - kind: speech
      speaker: host
      text: 「有的人摟完就下水，泡著泡著又講起明天要做的活。」
    - kind: narration
      text: 她笑了笑，拿布巾擦了擦石階上的水。
    - kind: speech
      speaker: host
      text: 「這裡沒有見不得人的事。水一燙，人就鬆，話也好講。」
- topic_id: eolas_resident_taellin.topic_05
  keyword: 名字
  label: 名字
  fallback:
    scene_id: eolas_resident_taellin.topic_05_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「你們家怎麼就叫溫德松？」
    - kind: speech
      speaker: host
      text: 「我娘說，泉眼冒的白氣讓風一吹，繞過松林會哼。這家守著水，也守著那聲音，就叫溫德松。」
    - kind: narration
      text: 她伸手接了一捧水氣，攤開掌心，又任它散掉。
    - kind: speech
      speaker: host
      text: 「名字這種東西，抓不住。你喊久了，它自己就長出意思。」
    - kind: speech
      speaker: host
      text: 「你在谷裡住一陣，聽見風吹松針，大概就懂。」
- topic_id: eolas_resident_taellin.topic_06
  keyword: 私事
  label: 私事
  requires:
    kind: affinity_at_least
    stage_key: trusted
  unavailable: locked
  refusal:
    scene_id: eolas_resident_taellin.topic_06_refusal
    revision: r2
    lines:
    - kind: speech
      speaker: host
      text: 「這是我自己留著的小事，不隨便講。等你在池邊跟我坐熟了，我再說。」
  fallback:
    scene_id: eolas_resident_taellin.topic_06_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「你有沒有只屬於自己的小習慣？」
    - kind: speech
      speaker: host
      text: 「有。剛洗完，身上還燙，我就裹著半濕的布站在池邊，讓夜風吹乾。」
    - kind: narration
      text: 她說得起勁，嘴角的窩都笑出來。
    - kind: speech
      speaker: host
      text: 「風貼著發熱的皮，一涼一熱，人站都站不穩。那種舒服，只有自己知道夠不夠。」
    - kind: speech
      speaker: host
      text: 「你哪天試一回，別急著穿衣裳。」
