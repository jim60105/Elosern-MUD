schema_version: 1
greeting: 瑞拉拉頭也不抬，梭子在手裡穿得飛快。等你站定了，她才從織機後頭瞥你一眼：「有話就講，我這匹布趕在今天下機。」
topics:
- topic_id: ciaran_resident_rellara.topic_01
  keyword: 織布
  label: 織布
  fallback:
    scene_id: ciaran_resident_rellara.topic_01_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「你織布怎麼這麼快？我看梭子都快看不清了。」
    - kind: speech
      speaker: host
      text: 「這手藝練了很多年。從小坐在這張機前，手先學會，腦子後頭才跟上。」
    - kind: speech
      speaker: host
      text: 「村裡要緊的布都先找我，慢一天，人家就少一件衣裳穿。慢不得。」
    - kind: narration
      text: 她腳下一踩，踏板響了一聲，布面又往前挪了一截。
    - kind: speech
      speaker: host
      text: 「你坐遠一點，線頭會勾人。想看清楚就從側面看，別擋光。」
- topic_id: ciaran_resident_rellara.topic_02
  keyword: 花色
  label: 花色
  fallback:
    scene_id: ciaran_resident_rellara.topic_02_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「你們織的花色，都是從哪兒來的？」
    - kind: speech
      speaker: host
      text: 「坡上的葉子、溪裡的水光，還有誰隨口講過的一句話。娘把顏色染出來，我把紋織上去，小妹分線。」
    - kind: speech
      speaker: host
      text: 「有些花樣只給一個人。織進去的時候心裡就想著她，等哪天她穿在身上，我一眼就認得。」
    - kind: narration
      text: 她伸手扯了扯機上那條還沒收邊的布，指節上有一道被線勒出的紅痕。
- topic_id: ciaran_resident_rellara.topic_03
  keyword: 家人
  label: 家人
  fallback:
    scene_id: ciaran_resident_rellara.topic_03_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「你家裡三個人，誰的手藝最好？」
    - kind: speech
      speaker: host
      text: 「娘的染最穩，小妹分線最準，我織最快。缺一個，這匹布就不是這個樣子。」
    - kind: narration
      text: 她嘴上說著，手沒停，嘴角往上一挑。
    - kind: speech
      speaker: host
      text: 「收了工，三個人擠在窗邊看新布。那時候誰也不嫌誰慢。」
    - kind: speech
      speaker: host
      text: 「你要找小妹，她在窗邊排線。別催她，催了她就分錯。」
- topic_id: ciaran_resident_rellara.topic_04
  keyword: 名字
  label: 名字
  fallback:
    scene_id: ciaran_resident_rellara.topic_04_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 「特魯松，是那排筆直的松樹嗎？」
    - kind: speech
      speaker: host
      text: 「那排就是真松，坡上長得直，風大也不歪。」
    - kind: narration
      text: 她抬手比了比機上繃緊的經線，一條一條，沒有哪條鬆。
    - kind: speech
      speaker: host
      text: 「我家做布也這脾氣。紋路要正，話也直說，繞彎子我聽不懂。」
    - kind: speech
      speaker: host
      text: 「你要是也這樣講話，這織房就容得下你。」
- topic_id: ciaran_resident_rellara.topic_05
  keyword: 私語
  label: 私語
  requires:
    kind: affinity_at_least
    stage_key: trusted
  unavailable: locked
  refusal:
    scene_id: ciaran_resident_rellara.topic_05_refusal
    revision: r2
    lines:
    - kind: speech
      speaker: host
      text: 「我藏不住話，可心事不一樣。等我把你當成自己人，再講給你聽。」
  fallback:
    scene_id: ciaran_resident_rellara.topic_05_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「你織過最捨不得放手的一匹布，是什麼？」
    - kind: speech
      speaker: host
      text: 「一匹貼身的薄布。織給夜裡會來我房裡的人，裹住她的腰和肩，最後是我親手解開。」
    - kind: speech
      speaker: host
      text: 「我織了拆，拆了再織。布要貼著皮膚才知道對不對，差一線都嫌粗。」
    - kind: narration
      text: 她手底下的梭子停了一下，又接上，像什麼都沒發生。
    - kind: speech
      speaker: host
      text: 「布裡織進去的是念頭。你哪天成了我的念頭，我就替你織一匹。」
