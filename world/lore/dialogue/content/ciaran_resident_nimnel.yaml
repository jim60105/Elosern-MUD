schema_version: 1
greeting: 寧內爾膝上還坐著一個孩子，另一隻手把跑遠的那個撈回來。她抬頭，辮子滑到肩前：「你來得正好，幫我看著這些孩子，我去把鍋蓋掀開。」
topics:
- topic_id: ciaran_resident_nimnel.topic_01
  keyword: 孩子
  label: 孩子
  fallback:
    scene_id: ciaran_resident_nimnel.topic_01_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「村裡的孩子，白天都往你這裡跑？」
    - kind: speech
      speaker: host
      text: 「對啊，誰家忙不過來，就往我這兒一塞。我帶他們認樹、認路，順便認哪家的果子還沒熟，免得他們先摘。」
    - kind: narration
      text: 一個孩子從她背後探出頭，鼻子上掛著一條鼻涕，她順手用袖口擦掉。
    - kind: speech
      speaker: host
      text: 「全村一起養的嘛。今天我看，明天換人看，孩子認得的是整條谷，不是哪一扇門。」
    - kind: speech
      speaker: actor
      text: 「那你自己呢？整天被他們纏著，不累嗎？」
    - kind: speech
      speaker: host
      text: 「累啊。可是他們一走，屋子靜得讓人心慌。我就是閒不住，熱鬧一點才踏實。」
- topic_id: ciaran_resident_nimnel.topic_02
  keyword: 哄睡
  label: 哄睡
  fallback:
    scene_id: ciaran_resident_nimnel.topic_02_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「孩子鬧到晚上不肯睡，你有什麼辦法？」
    - kind: speech
      speaker: host
      text: 「先看是餓了還是氣了。餓的塞塊餅，氣的抱起來走兩圈。真不肯睡，就抱到古樹下，風一吹，眼皮就沉了。」
    - kind: narration
      text: 她說話的時候，懷裡那個孩子已經把臉埋進她肩窩，呼吸拖得長。
    - kind: speech
      speaker: host
      text: 「唱歌也有用。我娘的故事我講不全，拿來哼成調，孩子聽著聽著就睡了。」
    - kind: speech
      speaker: actor
      text: 「那你自己睡不著的時候呢？」
    - kind: speech
      speaker: host
      text: 「我喔，就爬起來煮點熱的喝。沒有人哄我，久了也習慣。說來也不好聽，我哄別人都有一套，輪到自己就沒轍了。」
- topic_id: ciaran_resident_nimnel.topic_03
  keyword: 家人
  label: 家人
  fallback:
    scene_id: ciaran_resident_nimnel.topic_03_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「你家裡三個人，各自忙些什麼？」
    - kind: speech
      speaker: host
      text: 「娘埃林溫說故事，一開口就收不住。姊奈爾內爾記從前的事，誰家哪一年種過什麼，她腦子裡都有一本。」
    - kind: narration
      text: 她抬手指了指村裡另一頭，辮子跟著晃了一下。
    - kind: speech
      speaker: host
      text: 「我在家最小，撿了最吵的活。孩子一哭就往我這兒送，我這屋子從早到晚沒安靜過。」
    - kind: speech
      speaker: host
      text: 「晚上孩子散了，三個人坐回火塘邊，反倒話少。你要熱鬧找我，要清靜就去找我姊。」
- topic_id: ciaran_resident_nimnel.topic_04
  keyword: 名字
  label: 名字
  fallback:
    scene_id: ciaran_resident_nimnel.topic_04_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 「溫特爾松，這個姓是冬松的意思嗎？」
    - kind: speech
      speaker: host
      text: 「冬松，說的就是村外那排松。冬天風一過就響起來，像有人在裡頭哼歌。」
    - kind: narration
      text: 她把嘴一抿，壓低聲音學了一段風聲，膝上的孩子笑得往後仰。
    - kind: speech
      speaker: host
      text: 「我小時候聽那聲音，總覺得是在喊我。現在帶孩子去，他們也這麼說。」
    - kind: speech
      speaker: host
      text: 「所以你哪天在谷裡迷路，聽風往哪邊吹，順著走，多半會走到那排松樹下。」
- topic_id: ciaran_resident_nimnel.topic_05
  keyword: 私語
  label: 私語
  requires:
    kind: affinity_at_least
    stage_key: trusted
  unavailable: locked
  refusal:
    scene_id: ciaran_resident_nimnel.topic_05_refusal
    revision: r2
    lines:
    - kind: speech
      speaker: host
      text: 「這種話我留給真的坐下來、陪我哄完一整晚孩子的人。你現在問，我只會拿哭聲擋你。」
  fallback:
    scene_id: ciaran_resident_nimnel.topic_05_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「你最累的時候，會想有人怎麼陪你？」
    - kind: speech
      speaker: host
      text: 「哄完最後一個，屋裡忽然靜下來那一下，我最受不了。孩子都走了，我還蹲在門邊，手上留著他們的體溫。」
    - kind: narration
      text: 她低頭，指腹在膝上蹭了蹭，掌心還熱著。
    - kind: speech
      speaker: host
      text: 「那時候我想有人把我抱到榻上，什麼都別問。我平常話多，真累了只想把臉埋進誰的肩窩，聽心跳就好。」
    - kind: speech
      speaker: host
      text: 「哄人哄久了，也想被哄一次。這種話我自己也知道說出來難為情，可我就是這麼想。」
