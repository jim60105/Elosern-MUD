schema_version: 1
greeting: 科瑞爾把槌衣的石板往池邊一擱，抬手抹掉額角的汗，紅眼掃了你一下。「有話就說。這雙手停不得太久，衣裳泡著會走味。」
topics:
- topic_id: ciaran_resident_coriel.topic_01
  keyword: 槌衣
  label: 槌衣
  fallback:
    scene_id: ciaran_resident_coriel.topic_01_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 「這池衣裳，你一天要槌多少件？」
    - kind: speech
      speaker: host
      text: 「從天亮洗到天黑，手沒停過，數也數不清。」
    - kind: speech
      speaker: host
      text: 「下槌要實，也要勻。衣裳浸透了，先把泥水槌出來，再換清水漂。偷懶少槌兩下，領口就留一圈灰。」
    - kind: narration
      text: 她彎腰拎起一件濕衣，擰得水線直冒，胳膊上的筋全浮了起來。
    - kind: speech
      speaker: host
      text: 「力氣用對地方，衣裳才透亮。人也一樣，累透了，夜裡才睡得沉。」
- topic_id: ciaran_resident_coriel.topic_02
  keyword: 力氣
  label: 力氣
  fallback:
    scene_id: ciaran_resident_coriel.topic_02_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「你這身力氣，是天生就有，還是後來練的？」
    - kind: speech
      speaker: host
      text: 「底子天生就有。後來槌得多了，才長成這樣。」
    - kind: speech
      speaker: host
      text: 「水軟，布軟，手不能軟。手一軟，衣裳就洗不乾淨。」
    - kind: speech
      speaker: host
      text: 「谷裡人不興嬌氣。我也不會。」
    - kind: narration
      text: 她把手掌翻過來給你看，指節粗，掌心是一片被水泡白的厚皮。
    - kind: speech
      speaker: host
      text: 「幹活幹到骨頭痠，晚上有人替我揉一揉，那才叫舒服。你有累到那個程度過嗎？」
- topic_id: ciaran_resident_coriel.topic_03
  keyword: 家人
  label: 家人
  fallback:
    scene_id: ciaran_resident_coriel.topic_03_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「你們家三個人，怎麼分這些活？」
    - kind: speech
      speaker: host
      text: 「娘瑞爾溫管洗。我槌。妹妹邁特希爾疊。」
    - kind: speech
      speaker: host
      text: 「髒的進來，乾淨的出去。一條線，誰也不欠誰。」
    - kind: narration
      text: 她朝池邊那排疊得齊整的布抬了抬下巴，布角對得很齊。
    - kind: speech
      speaker: host
      text: 「我們話不多。晚上收了工，各回各的鋪。你要洗衣，找我。要拿乾淨衣裳，找邁特希爾。」
- topic_id: ciaran_resident_coriel.topic_04
  keyword: 名字
  label: 名字
  fallback:
    scene_id: ciaran_resident_coriel.topic_04_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 「拉文伍德，是林子裡那些鴉嗎？」
    - kind: speech
      speaker: host
      text: 「拉文伍德說的鴉林，就是林子裡那些鴉。天黑牠們繞著樹叫，翅膀一張一合。」
    - kind: speech
      speaker: host
      text: 「我槌累了，就坐在池邊聽一會。那聲音不中聽，可是踏實。」
    - kind: narration
      text: 她抬頭看了一眼將暗的天，靜下來聽。
    - kind: speech
      speaker: host
      text: 「名字這東西，用久了就認。跟這池水一樣，碰得久了，也就親了。」
- topic_id: ciaran_resident_coriel.topic_05
  keyword: 私語
  label: 私語
  requires:
    kind: affinity_at_least
    stage_key: trusted
  unavailable: locked
  refusal:
    scene_id: ciaran_resident_coriel.topic_05_refusal
    revision: r2
    lines:
    - kind: speech
      speaker: host
      text: 「我話少，心裡的事更少。你先別急，這種話我不隨便給人。」
  fallback:
    scene_id: ciaran_resident_coriel.topic_05_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「你什麼時候最想有人在身邊？」
    - kind: speech
      speaker: host
      text: 「槌完最後一件，胳膊痠到抬不起來的時候。」
    - kind: speech
      speaker: host
      text: 「我整個人泡進水裡，靠著池邊，連手指都不想動。」
    - kind: narration
      text: 她捏了捏自己的肩，力道放得很輕，眼神卻鬆了下來。
    - kind: speech
      speaker: host
      text: 「那時候要是有人從背後抱住我，替我揉開每一寸硬，我大概會整個人散掉。力氣全交出去，讓誰接手都好。」
    - kind: speech
      speaker: host
      text: 「再硬的胳膊也有軟的時候。你懂我這身力氣，就懂我這塊軟。」
