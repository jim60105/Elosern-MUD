schema_version: 1
greeting: 科瑞爾放下槌衣的石板，抹了把額角：「有話直說，我這槌子還沒停。」
topics:
- topic_id: ciaran_resident_coriel.topic_01
  keyword: 槌衣
  label: 槌衣
  fallback:
    scene_id: ciaran_resident_coriel.topic_01_scene
    revision: r1
    lines:
    - kind: speech
      speaker: actor
      text: 「槌衣裳，怎麼才槌得乾淨？」
    - kind: speech
      speaker: host
      text: 「下槌要實，力道要勻。衣裳浸透了，槌去穢氣，再漂洗。槌衣槌出了我這雙胳膊。」
    - kind: narration
      text: 她掄起槌子，又穩穩落下，濺起一蓬水花。
    - kind: speech
      speaker: host
      text: 「力氣使足了，衣裳才透亮。人也是，累透了，睡得才沉。」
- topic_id: ciaran_resident_coriel.topic_02
  keyword: 力氣
  label: 力氣
  fallback:
    scene_id: ciaran_resident_coriel.topic_02_scene
    revision: r1
    lines:
    - kind: speech
      speaker: actor
      text: 「你這身力氣，是天生的？」
    - kind: speech
      speaker: host
      text: 「天生的底子，加上天天槌。水軟，衣裳軟，全靠我這雙硬手。谷裡人不嬌氣，我也不。」
    - kind: speech
      speaker: host
      text: 「幹活幹到骨頭痠，晚上有人揉一揉，最解乏。你累過，就曉得那滋味。」
- topic_id: ciaran_resident_coriel.topic_03
  keyword: 家人
  label: 家人
  fallback:
    scene_id: ciaran_resident_coriel.topic_03_scene
    revision: r1
    lines:
    - kind: speech
      speaker: actor
      text: 「你家裡人，各管哪樣？」
    - kind: speech
      speaker: host
      text: 「娘瑞爾溫管洗，我槌衣，妹妹邁特希爾疊布。仨人一條龍，髒衣裳進來，疊得方整出去。」
    - kind: narration
      text: 她朝池邊堆得齊整的布摞抬了抬下巴。
    - kind: speech
      speaker: host
      text: 「一家人話少，活多。夜裡收工，各找各的鋪。你要衣裳，就尋妹妹；要洗衣，尋我。」
- topic_id: ciaran_resident_coriel.topic_04
  keyword: 名字
  label: 名字
  fallback:
    scene_id: ciaran_resident_coriel.topic_04_scene
    revision: r1
    lines:
    - kind: speech
      speaker: actor
      text: 「拉文伍德，是林裡的鴉？」
    - kind: speech
      speaker: host
      text: 「鴉林。天黑牠們繞著林子叫，翅膀一收一放。我槌衣累了，就聽那聲歇口氣。」
    - kind: narration
      text: 她仰頭望了望天，日頭正往西沉。
    - kind: speech
      speaker: host
      text: 「那聲不中聽，卻實在。像這家，不花俏，就是個實。」
- topic_id: ciaran_resident_coriel.topic_05
  keyword: 私語
  label: 私語
  requires:
    kind: affinity_at_least
    stage_key: trusted
  unavailable: locked
  refusal:
    scene_id: ciaran_resident_coriel.topic_05_refusal
    revision: r1
    lines:
    - kind: speech
      speaker: host
      text: 「我話少，心更沉。等我把你當自家人，再抖摟。」
  fallback:
    scene_id: ciaran_resident_coriel.topic_05_scene
    revision: r1
    lines:
    - kind: speech
      speaker: actor
      text: 「你最想要人照顧的時候，是什麼樣？」
    - kind: speech
      speaker: host
      text: 「是槌完最後一件，胳膊痠得抬不動，泡進水裡動彈不得。那時我最想有人從背後抱住我，替我捏開每一寸僵。力氣全交出去，任她擺布，那才叫痛快。」
    - kind: narration
      text: 她揉著自己的肩，難得地露了軟。
    - kind: speech
      speaker: host
      text: 「再硬的胳膊，也有軟的時候。你懂我這身力氣，就懂我這份軟。」