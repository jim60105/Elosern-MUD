schema_version: 1
greeting: 翁德溫把一株草湊到鼻尖，聞了聞，才抬眼。「你聞見了嗎？這株的味道很衝。你剛要問什麼，我大概沒聽清。」
topics:
- topic_id: eolas_resident_ondwyn.topic_01
  keyword: 香草
  label: 香草
  fallback:
    scene_id: eolas_resident_ondwyn.topic_01_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 「石階菜畦那幾樣香草，聞起來都不一樣嗎？」
    - kind: speech
      speaker: host
      text: 「每一樣都不一樣，有的清涼，有的發苦，有的聞著甜，放進嘴裡卻辣舌頭。」
    - kind: narration
      text: 她撕下一小片葉子，在指腹搓開，抬手遞到你鼻前。
    - kind: speech
      speaker: host
      text: 「我不用低頭找，湊近一聞，就知道是哪一株，長在哪一階。」
    - kind: speech
      speaker: host
      text: 「草不會講話，味道就是它的話。你靜下來聞，比聽誰報名字都準。」
- topic_id: eolas_resident_ondwyn.topic_02
  keyword: 採集
  label: 採集
  fallback:
    scene_id: eolas_resident_ondwyn.topic_02_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 「採草要挑時辰嗎？還是看見就摘？」
    - kind: speech
      speaker: host
      text: 「要挑時辰。晨露還沒散，草頭最飽；日頭過正午，葉子就垂。我天剛亮上山，揀嫩的掐，不連根拔。」
    - kind: speech
      speaker: host
      text: 「採回來倒掛在樑下，讓風從葉縫穿過去。乾透了才收，收晚了會悶壞。」
    - kind: narration
      text: 她抬手比了比頭頂那排草束，指間還留著草汁的顏色。
    - kind: speech
      speaker: host
      text: 「草壞了只能當柴燒。費這點工，留住的是它整年的氣味。」
- topic_id: eolas_resident_ondwyn.topic_03
  keyword: 家人
  label: 家人
  fallback:
    scene_id: eolas_resident_ondwyn.topic_03_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「你一個人蹲在這兒，家裡人都不來嗎？」
    - kind: speech
      speaker: host
      text: 「娘在菜畦那頭，姊姊阿拉瑞斯翻土。我管草。三個人各忙一攤，飯點才碰頭。」
    - kind: narration
      text: 她說話時眼睛還黏在手裡那株草上，拇指捻著葉柄。
    - kind: speech
      speaker: host
      text: 「姊姊說我拔草能拔出神。我就是這樣，蹲下去就忘了站起來。」
    - kind: speech
      speaker: host
      text: 「其實我在聽草。它往哪邊扭，我就知道這階的土太濕。」
- topic_id: eolas_resident_ondwyn.topic_04
  keyword: 名字
  label: 名字
  fallback:
    scene_id: eolas_resident_ondwyn.topic_04_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 「『格林拉德』是這片坡的名字嗎？」
    - kind: speech
      speaker: host
      text: 「格林拉德說的是綠穀。春天一到，坡上的青從上頭往下鋪，遠看整條坡都在流。」
    - kind: narration
      text: 她閉了閉眼，鼻尖抽動，跟著風向偏了偏頭。
    - kind: speech
      speaker: host
      text: 「這姓就長在那片青裡。報上姓，人家就知道我從哪條坡來。」
    - kind: speech
      speaker: host
      text: 「我喜歡這姓。念一遍，嘴裡都是草味。」
- topic_id: eolas_resident_ondwyn.topic_05
  keyword: 私語
  label: 私語
  requires:
    kind: affinity_at_least
    stage_key: trusted
  unavailable: locked
  refusal:
    scene_id: eolas_resident_ondwyn.topic_05_refusal
    revision: r2
    lines:
    - kind: speech
      speaker: host
      text: 「草的事我肯講，我的事得先把你當成自己人。你再來幾回，等我把你認熟了。」
  fallback:
    scene_id: eolas_resident_ondwyn.topic_05_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 「採回來的香草，你最中意哪一株？」
    - kind: speech
      speaker: host
      text: 「每一株我都中意。真要挑，我會抓幾把丟進鍋裡煮，等熱氣起來，脫了衣裳坐進去。」
    - kind: narration
      text: 她眼底亮了一下，隨即又低下去看手裡的草。
    - kind: speech
      speaker: host
      text: 「草香貼在皮膚上，洗過還留著。半夜翻個身，聞到的還是它。」
    - kind: speech
      speaker: host
      text: 「身子泡在草湯裡，比裹著被子還安穩。你試過一次，大概會跟我一樣上癮。」
