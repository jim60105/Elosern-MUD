schema_version: 1
greeting: 翁德溫正把一株草湊近鼻尖，聞了聞，才轉向你：「你聞見了嗎？這是香草。」
topics:
- topic_id: eolas_resident_ondwyn.topic_01
  keyword: 香草
  label: 香草
  fallback:
    scene_id: eolas_resident_ondwyn.topic_01_scene
    revision: r1
    lines:
    - kind: speech
      speaker: actor
      text: 「石階菜畦那幾樣香草，各是什麼味？」
    - kind: speech
      speaker: host
      text: 「有的清涼，有的發苦，還有的聞著甜、入口卻辛。我不用看，湊近一嗅就知道是哪株。」
    - kind: narration
      text: 她撕下一小片草葉，在指尖搓了搓，遞到你鼻前。
    - kind: speech
      speaker: host
      text: 「草不會說話，味就是它的話。你靜下心聞，比聽誰報名字都清楚。」
- topic_id: eolas_resident_ondwyn.topic_02
  keyword: 採集
  label: 採集
  fallback:
    scene_id: eolas_resident_ondwyn.topic_02_scene
    revision: r1
    lines:
    - kind: speech
      speaker: actor
      text: 「採草要挑時辰嗎？」
    - kind: speech
      speaker: host
      text: 「要。晨露沒散，草頭最鮮；過了正午就蔫。我專挑天剛亮那陣上山，一縷一縷摘，不連根拔。」
    - kind: speech
      speaker: host
      text: 「摘回來的倒掛在樑下，風乾了封好。別嫌費工，草要是存壞了，就是一捧枯柴。」
- topic_id: eolas_resident_ondwyn.topic_03
  keyword: 家人
  label: 家人
  fallback:
    scene_id: eolas_resident_ondwyn.topic_03_scene
    revision: r1
    lines:
    - kind: speech
      speaker: actor
      text: 「你一個人在這兒，家人呢？」
    - kind: speech
      speaker: host
      text: 「娘布瑞米爾在菜畦，姊姊阿拉瑞斯翻土。我管草。仨人各忙一頭，到飯點才碰頭。」
    - kind: narration
      text: 她目光還落在手裡的草上，語氣心不在焉。
    - kind: speech
      speaker: host
      text: 「姊姊總說我拔草能拔出神。其實我是在跟草說話，它扭一扭，我聽見了。」
- topic_id: eolas_resident_ondwyn.topic_04
  keyword: 名字
  label: 名字
  fallback:
    scene_id: eolas_resident_ondwyn.topic_04_scene
    revision: r1
    lines:
    - kind: speech
      speaker: actor
      text: 「『格林拉德』是這坡的名字？」
    - kind: speech
      speaker: host
      text: 「綠穀。春來坡上一片青，像一條綠色的穀子流下去。這家的姓，就長在那片青裡。」
    - kind: narration
      text: 她閉了閉眼，像在聞那時的風。
    - kind: speech
      speaker: host
      text: 「我喜歡這姓。它讓我想起草還短、葉還嫩的年頭。」
- topic_id: eolas_resident_ondwyn.topic_05
  keyword: 私語
  label: 私語
  requires:
    kind: affinity_at_least
    stage_key: trusted
  unavailable: locked
  refusal:
    scene_id: eolas_resident_ondwyn.topic_05_refusal
    revision: r1
    lines:
    - kind: speech
      speaker: host
      text: 「草的心事我肯說，我的心事，得等我把你當草一樣認了。」
  fallback:
    scene_id: eolas_resident_ondwyn.topic_05_scene
    revision: r1
    lines:
    - kind: speech
      speaker: actor
      text: 「採回來的香草，你最中意哪一株？」
    - kind: speech
      speaker: host
      text: 「是把採回的香草熬成一鍋，熱氣漫天的時候，解了衣裳泡進去。草香貼著皮膚，滲到骨裡，像被整片菜畦抱住了。」
    - kind: narration
      text: 她眼底亮了一下，轉瞬又埋進草叢裡。
    - kind: speech
      speaker: host
      text: 「身子裹著草香，比裹著誰都安穩。你試過，便曉得這癮戒不掉。」