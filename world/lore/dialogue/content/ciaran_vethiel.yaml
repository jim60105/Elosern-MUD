schema_version: 1
greeting: 織機在安靜的木屋裡發出規律的叩響，維特希爾‧威爾德布瑞亞爾停下手裡的木梭，從經線間轉過身來。她腰間繫著寬帶，指尖還勾著幾縷剛染好的深紫絲線：「你來了。墨黑、月白，或是山谷晨霧那樣的淡綠，你平時喜愛哪種顏色？架上的衣裳隨便看，若有中意款式，我取下來讓你摸一下料子的質地。」
topics:
- topic_id: ciaran_vethiel_home.topic_01
  keyword: 織衣
  label: 織衣
  fallback:
    scene_id: ciaran_vethiel_home.topic_01_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 「這屋裡的經緯線排得真整齊，我想了解你平時都在這架織機上織些什麼樣的衣裳？」
    - kind: narration
      text: 維特希爾‧威爾德布瑞亞爾伸手理順垂落的經線，神情沉靜柔和。
    - kind: speech
      speaker: host
      text: 「經線我自己漿，緯線我自己採草木汁液浸染。坐在這架機子前，一匹布從清晨織到星光落進窗檻。」
    - kind: speech
      speaker: host
      text: 「架上陳列的是族裡的兩件常服，貼身俐落的精靈短袍傳統服飾，和林子裡好展身手的精靈戰鬥服飾。布都先用谷裡的植物染過，喜歡哪件，換去穿就是。」
    - kind: speech
      speaker: actor
      text: 「每一件的織紋和色澤看著都很特別，挑選時該怎麼看？」
    - kind: speech
      speaker: host
      text: 「不必光用眼睛看，伸手體會質地吧。經緯交錯緊實的布料適合禦風，織得疏朗的布透氣順滑。挑選衣物全憑穿在身上的感覺，合意最要緊。」
- topic_id: ciaran_vethiel_home.topic_02
  keyword: 戰衣
  label: 戰衣
  fallback:
    scene_id: ciaran_vethiel_home.topic_02_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「我看架上那件墨黑的戰鬥服飾剪裁十分俐落，這套衣裳穿去林地狩獵合適嗎？」
    - kind: narration
      text: 維特希爾‧威爾德布瑞亞爾從木架取下一襲黑衣，雙手展開平鋪在檯面上。
    - kind: speech
      speaker: host
      text: 「這件精靈戰鬥服飾通體墨黑，線條貼著筋骨走，進林子伏在樹影裡最是不顯眼。」
    - kind: speech
      speaker: host
      text: 「我在腰胯與關節處留出足夠空隙，奔跑跳躍都不會受牽扯。這套衣服遮掩的地方不多，全是為了讓身軀動得舒展俐落，村裡的獵手都喜愛穿它。」
    - kind: speech
      speaker: actor
      text: 「布料摸起來既輕盈又韌實，即使穿過灌木叢也不容易被樹枝勾破吧？」
    - kind: speech
      speaker: host
      text: 「緯線裡絞了幾股山裡的韌草纖維，耐磨得很。穿上它進林子，你只管專注聽風聲和足音，衣裳絕不會拖累你的動作。」
- topic_id: ciaran_vethiel_home.topic_03
  keyword: 禮袍
  label: 禮袍
  fallback:
    scene_id: ciaran_vethiel_home.topic_03_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 「架上那件墨黑的精靈短袍傳統服飾，剪裁和族裡平日穿的很不一樣，是祭禮用的嗎？」
    - kind: narration
      text: 維特希爾‧威爾德布瑞亞爾把那件短袍從架上取下，手腕一抖，布料便順著她的手臂滑開。
    - kind: speech
      speaker: host
      text: 「這件是基亞蘭族自己的衣著，祭禮不穿它。領口與腰間收得貼身，下襬卻放得開，走動、練刀都不礙事。」
    - kind: speech
      speaker: host
      text: 「身子本來就值得坦然露出來。族人在谷裡穿成這樣，誰也不會多看一眼；外頭來的人頭一回見，常把眼睛別開，過幾天就習慣了。」
    - kind: speech
      speaker: actor
      text: 「那白色的蛛絲長袍和晨霧一樣的輕紗，你這裡也織嗎？」
    - kind: speech
      speaker: host
      text: 「那兩件不在這座織房。白的蛛絲袍出自幽月谷村，輕紗由翠綠森林村的伊斯爾林‧斯塔爾威維爾在樹冠吊橋上織。三個村子的族人偶爾互相走動，她們的手藝我見過，都細得很。」
- topic_id: ciaran_vethiel_home.topic_04
  keyword: 舊衣
  label: 舊衣
  fallback:
    scene_id: ciaran_vethiel_home.topic_04_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 「若是向你換走的衣服穿舊了、破損了，還能帶回這座織房嗎？」
    - kind: narration
      text: 維特希爾‧威爾德布瑞亞爾取下一柄骨製挑針，撥弄著身旁竹簍裡的舊線團。
    - kind: speech
      speaker: host
      text: 「只要是我這架機子上織出來的精靈短袍傳統服飾、精靈戰鬥服飾，穿舊了、穿破了，隨時拿回來就是。」
    - kind: speech
      speaker: host
      text: 「我收下舊衣，會挑開針腳拆下完好的線，洗淨後重新紡進新的布料裡。衣料成色還在，我會算些銅幣給你。」
    - kind: speech
      speaker: actor
      text: 「如果是從王都或其他城鎮帶來的舊衣，你這裡也能幫忙拆線收購嗎？」
    - kind: speech
      speaker: host
      text: 「別人織的布，經緯用料和走線我摸不透，混進織機只會壞了整匹布料。外頭帶來的衣服我就不收了，請帶回山外處置吧。」
