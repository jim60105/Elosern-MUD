schema_version: 1
greeting: 櫃檯後頭，瑪爾特‧金秤埋頭對帳，炭筆在頁邊畫著只有自己看得懂的記號。他抬眼，把炭筆往耳後一別：「要出城，還是剛回王都？出城就照著價目把燈啊羅盤的挑齊；剛回來就先把貨擱上秤，我替你估個價。」
topics:
- topic_id: altoria_general_store.topic_01
  keyword: 賣什麼
  label: 賣什麼
  fallback:
    scene_id: altoria_general_store.topic_01_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 「想請問一下，你這間店主要賣些什麼？出城要用的東西都有嗎？」
    - kind: narration
      text: 瑪爾特‧金秤把算盤往手邊一拉，朝身後排得整齊的深色木架抬了抬下巴。
    - kind: speech
      speaker: host
      text: 「出城要用的大半都在這一排。魔法燈、附魔羅盤、迷宮探照符，還有露營魔導具，攤開就是一小間擋風雨的帳篷。底層還擺著粗鐵礦和魔獸結晶，都是打鐵的料子。」
    - kind: speech
      speaker: actor
      text: 「那價錢怎麼算？多買幾樣，能算便宜一點嗎？」
    - kind: speech
      speaker: host
      text: 「價錢都刻在牆上那塊價目板上，我照著收，分毫不差。殺價就省點口水吧。這把黃銅秤在東市替人過磅三十年，分量向來公道。照價目挑，買賣乾脆點。」
- topic_id: altoria_general_store.topic_02
  keyword: 材料
  label: 材料
  fallback:
    scene_id: altoria_general_store.topic_02_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 「聽說你這裡也收冒險者從外頭帶回來的素材？收購價怎麼算？」
    - kind: narration
      text: 瑪爾特‧金秤用指節敲了敲擦得發亮的小黃銅秤盤，像等著客人把貨擺上去。
    - kind: speech
      speaker: host
      text: 「收。哥布林耳朵、史萊姆黏液、巨魔尖牙、地龍鱗片，全都收。一整袋也好，一枚也好，擱上秤，我過磅就照實報價，銅幣當著你的面點清楚。」
    - kind: speech
      speaker: actor
      text: 「那你架上也有稀罕的材料賣嗎？都是些什麼好貨？」
    - kind: speech
      speaker: host
      text: 「有。最上層留著幾樣貴貨，識貨的一眼就認得。魔導晶核、龍鱗碎片，還有商隊從中央山脈那頭帶回來的精靈蛛絲。想看哪樣跟我說，我親手拿給你。」
- topic_id: altoria_general_store.topic_03
  keyword: 行頭
  label: 行頭
  fallback:
    scene_id: altoria_general_store.topic_03_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 「這是我第一次出城，想準備周全一點。你會建議我帶哪些東西？」
    - kind: narration
      text: 瑪爾特‧金秤放下炭筆，抬眼打量面前的生面孔，神情也認真了幾分。
    - kind: speech
      speaker: host
      text: 「頭一回出城，那得聽我多說兩句。魔法燈先備好，迷宮深處黑得連手都看不清；再帶個附魔羅盤，走岔了路也找得回方向。迷宮探照符也帶幾張，撕開就能照亮前頭一小段路。」
    - kind: speech
      speaker: host
      text: 「要過夜，就把露營魔導具帶上，展開就是一小間擋風雨的帳篷，夜裡的小魔獸進不來。再帶個通訊法螺，萬一跟同伴走散，吹一聲就能彼此認出位置。出城前把行囊再查一遍，這趟才走得安心。」
- topic_id: altoria_general_store.topic_04
  keyword: 飾品藥水
  label: 飾品藥水
  fallback:
    scene_id: altoria_general_store.topic_04_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 「另外想問，你這裡有護身的首飾，或是療傷的藥水嗎？」
    - kind: narration
      text: 瑪爾特‧金秤搖了搖頭，把剛寫好的單據翻到下一頁，答得乾脆。
    - kind: speech
      speaker: host
      text: 「護身飾品和療傷藥水，各有專門的店。飾品去隔壁找艾蓮娜，她那間首飾坊的手藝一流；藥水沿著市場街往東走，到東市找希碧拉的鍊金坊。兩位都是我認識多年的老街坊，照我說的找，準能找到合用的東西。」
    - kind: speech
      speaker: actor
      text: 「那我想找受洗聖水，該往哪裡走？」
    - kind: speech
      speaker: host
      text: 「那得上城去。沿著大道一路往上，走到大神殿，聖所的櫃檯有發放受洗聖水。到了那兒，直接問櫃檯就成。」
