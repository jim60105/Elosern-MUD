schema_version: 1
greeting: 櫃檯後頭，瑪爾特‧金秤低頭對帳，炭筆在頁邊畫著只有他自己看得懂的記號。他抬眼，把炭筆往耳後一別：「出城，還是剛回來？要出城就講一聲要去哪兒，我照著路替你挑東西；剛回來就把貨擱上秤，我替你估個價。」
topics:
- topic_id: altoria_general_store.topic_01
  keyword: 賣什麼
  label: 賣什麼
  fallback:
    scene_id: altoria_general_store.topic_01_scene
    revision: r4
    lines:
    - kind: speech
      speaker: actor
      text: 「你這裡主要賣些什麼？我第一次出城，站在架子前面不知道該從哪樣看起。」
    - kind: narration
      text: 他把算盤往手邊一拉，朝身後那排深色木架抬了抬下巴。
    - kind: speech
      speaker: host
      text: 「先從最要緊的兩樣講起。魔法燈，走進迷宮深處就靠它，不然黑得連自己的手都看不見。」
    - kind: speech
      speaker: host
      text: 「附魔羅盤給你認方向。走岔了路，它不指北，只指著地表，順著它往上爬，總能出去。」
    - kind: speech
      speaker: actor
      text: 「那符紙和帳篷那些呢？也是非帶不可嗎？」
    - kind: speech
      speaker: host
      text: 「迷宮探照符撕一張，前頭一小段路就亮起來。露營魔導具攤開是一頂小帳篷，擋風擋雨，夜裡的蟲獸也進不來。通訊法螺留給跟同伴走散的時候，吹一聲，彼此聽得見。」
    - kind: narration
      text: 他伸手把一只羅盤轉了半圈，指針晃了兩下，停住不動。
    - kind: speech
      speaker: host
      text: 「底下那層是粗鐵礦和魔獸結晶，打鐵的料。用得上的拿，用不上的別亂買，錢留著路上花。」
- topic_id: altoria_general_store.topic_02
  keyword: 材料
  label: 材料
  fallback:
    scene_id: altoria_general_store.topic_02_scene
    revision: r4
    lines:
    - kind: speech
      speaker: actor
      text: 「聽說你也收冒險者帶回來的素材？什麼都收嗎？」
    - kind: narration
      text: 他用指節敲了敲擦得發亮的小黃銅秤盤，敲完就抬眼望向門口。
    - kind: speech
      speaker: host
      text: 「收。哥布林耳朵、史萊姆黏液、地龍鱗片、巨魔尖牙，全收。一整袋也行，一枚也行，擱上秤我照實報，銅幣當你的面點清楚。」
    - kind: speech
      speaker: actor
      text: 「那你自己架上那些貴的材料，又是從哪來的？」
    - kind: speech
      speaker: host
      text: 「商隊帶回來的貨。魔導晶核、龍鱗碎片，還有中央山脈那頭來的精靈蛛絲。這幾樣不擺外頭，識貨的問了，我才從裡頭拿。」
    - kind: narration
      text: 他往架頂瞟了一眼，像怕有人順手摸走。
    - kind: speech
      speaker: host
      text: 「看可以，別用手指去刮。刮花了，我賣給誰？」
- topic_id: altoria_general_store.topic_03
  keyword: 行頭
  label: 行頭
  fallback:
    scene_id: altoria_general_store.topic_03_scene
    revision: r4
    lines:
    - kind: speech
      speaker: actor
      text: 「我頭一回出城，想一次備齊。你會叫我帶哪些？」
    - kind: narration
      text: 他放下炭筆，把你從頭看到腳，看得很慢。
    - kind: speech
      speaker: host
      text: 「頭一回啊，那就聽我說完再挑。魔法燈一盞，附魔羅盤一顆，這兩樣不帶，出了事連後悔都來不及。」
    - kind: speech
      speaker: host
      text: 「迷宮探照符帶幾張，撕開就亮。要過夜，露營魔導具攤開就是帳篷，風雨進不來。再帶個通訊法螺，跟同伴走散了，吹一聲就能認出位置。」
    - kind: speech
      speaker: actor
      text: 「這樣就夠了？還是我再多帶點什麼？」
    - kind: speech
      speaker: host
      text: 「夠了。多帶是給自己添重量。出門前把行囊再翻一遍，少帶一樣，都比多背十斤好。」
- topic_id: altoria_general_store.topic_04
  keyword: 飾品藥水
  label: 飾品藥水
  fallback:
    scene_id: altoria_general_store.topic_04_scene
    revision: r4
    lines:
    - kind: speech
      speaker: actor
      text: 「那護身的首飾、療傷的藥水，你這裡也有嗎？」
    - kind: narration
      text: 他搖了搖頭，把剛寫好的單據翻到下一頁，答得很乾脆。
    - kind: speech
      speaker: host
      text: 「沒有。飾品去隔壁的首飾坊找艾蓮娜，她那雙手做的東西我服氣。藥水沿市場街往東，東市鍊金坊的希碧拉，配方實在。」
    - kind: speech
      speaker: actor
      text: 「受洗聖水呢？那個總該有吧？」
    - kind: speech
      speaker: host
      text: 「那個在上城。大道往上走到大神殿，聖所的櫃檯有賣，你到了直接問。」
    - kind: narration
      text: 他把單據往你面前一推，指尖在最後一行點了點。
    - kind: speech
      speaker: host
      text: 「照我說的走，省得白繞一圈。我這櫃檯只賣出城要用的東西，別家的生意我不搶。」
