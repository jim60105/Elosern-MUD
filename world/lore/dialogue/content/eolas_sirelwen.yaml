schema_version: 1
greeting: 希瑞爾溫‧布瑞特瓦特爾從一塊石板前抬頭，指尖還沾著墨。她把石板往旁一擱，指向木架：「你來得正好。八種元素裡，你比較喜歡哪一種？架上的杖隨你看，要試就試，燒焦了也不用你賠。」說著她把被火燎過的衣襟拉開透氣，胸口一片讓火烤紅的痕跡，她也不急著遮。
topics:
- topic_id: eolas_sirelwen_home.topic_01
  keyword: 法術
  label: 法術
  fallback:
    scene_id: eolas_sirelwen_home.topic_01_scene
    revision: r1
    lines:
    - kind: speech
      speaker: actor
      text: 「試煉場那邊的地上到處是燒過、裂過的痕跡，你們平日都在那裡練什麼？」
    - kind: speech
      speaker: host
      text: 「元素法術。火的燒、冰的凍、雷的劈，全往那塊地上招呼。離住屋遠一點，屋子才保得住。」
    - kind: speech
      speaker: host
      text: 「試之前我先寫下要試什麼，試完再記下實際的變化。真正有用的東西多半在第二次失敗裡。」
    - kind: speech
      speaker: actor
      text: 「失敗也算有用的話，你們怎麼知道哪一次算成功？」
    - kind: speech
      speaker: host
      text: 「看它下一次還能不能重來。只靈一次的法術，我當它沒成。」
- topic_id: eolas_sirelwen_home.topic_02
  keyword: 短杖
  label: 短杖
  fallback:
    scene_id: eolas_sirelwen_home.topic_02_scene
    revision: r1
    lines:
    - kind: speech
      speaker: actor
      text: 「架上那支幽月練習短杖是用什麼削的？拿在手裡有什麼不同？」
    - kind: speech
      speaker: host
      text: 「谷裡的老枝，去皮、陰乾，再按元素的性子修長短。木頭認得住魔力，導起來比空手順。」
    - kind: speech
      speaker: host
      text: 「它不會替你唸咒，也不會自己生出魔力。可是魔力順著杖身走，同一道法術出手會更沉，耗在你身上的力氣也少一些。」
    - kind: narration
      text: 她從架上取下一支杖，遞過來時杖身還帶著木頭的氣味。
    - kind: speech
      speaker: actor
      text: 「所以剛開始學的人拿它，是為了少燒壞自己的手？」
    - kind: speech
      speaker: host
      text: 「對。手燒壞了要養很久，杖燒壞了再削一支就有。」
- topic_id: eolas_sirelwen_home.topic_03
  keyword: 元素
  label: 元素
  fallback:
    scene_id: eolas_sirelwen_home.topic_03_scene
    revision: r1
    lines:
    - kind: speech
      speaker: actor
      text: 「聽說幻童精靈對每一種元素都親近，是真的嗎？你自己試起來是什麼感覺？」
    - kind: speech
      speaker: host
      text: 「八種都摸得到，但沒有一種不需要代價。火要你忍得住燙，水要你肯放掉力氣，風最難，它不聽話。」
    - kind: speech
      speaker: host
      text: 「我試過同時拉兩種元素，結果整間屋子燒起來。那一次我學到的是自己的身體能撐到哪裡。」
    - kind: speech
      speaker: host
      text: 「法術折騰完，人會累，也會鬆。剩下的力氣我常拿來做別的事，身體被折騰過一遍，夜裡反而更清楚自己要什麼。」
    - kind: speech
      speaker: actor
      text: 「你這樣講，好像練法術和別的事在你看來差不多。」
    - kind: speech
      speaker: host
      text: 「都是把身體用到極限，再從極限裡回來。差別只在燒不燒得壞。」
- topic_id: eolas_sirelwen_home.topic_04
  keyword: 收回
  label: 收回
  fallback:
    scene_id: eolas_sirelwen_home.topic_04_scene
    revision: r1
    lines:
    - kind: speech
      speaker: actor
      text: 「用不上的杖，或是削壞的杖，能拿回來給你嗎？」
    - kind: speech
      speaker: host
      text: 「我削的杖，沒有折斷的都可以拿回來，我收下算銅幣。斷了的就別帶了，我燒掉。」
    - kind: speech
      speaker: host
      text: 「外面買來的杖我不收。木頭不認得我，我也不知道它先前導過什麼。」
    - kind: speech
      speaker: actor
      text: 「如果只是杖頭磨損，還能修嗎？」
    - kind: speech
      speaker: host
      text: 「磨損的我自己再修一支就好。你手上那支留著用，真的不能用了再拿來。」
