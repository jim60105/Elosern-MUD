schema_version: 1
greeting: 賽莉爾從蜂箱後探出頭，手裡舉著一柄滴著蜜的木勺：「你來得剛好！這勺還溫著，要不要舔一口？」
topics:
- topic_id: fionnen_resident_saeliel.topic_01
  keyword: 採蜜
  label: 採蜜
  fallback:
    scene_id: fionnen_resident_saeliel.topic_01_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 「你採蜜不怕被蜇嗎？我站這麼遠都覺得蜂在瞪我。」
    - kind: speech
      speaker: host
      text: 「不怕啊。手放輕，別擋住巢門，牠們就自己忙去。」
    - kind: speech
      speaker: host
      text: 「真被蜇一下也沒什麼。腫一塊，過兩天就消。我反而覺得那天的蜜特別甜。」
    - kind: narration
      text: 她把手裡的木勺舉高，蜜沿著勺柄往下滴。
    - kind: speech
      speaker: host
      text: 「這園子的蜂都認得我。你要不怕，跟我去看牠們怎麼把花裡的水變成蜜。」
- topic_id: fionnen_resident_saeliel.topic_02
  keyword: 花
  label: 花
  fallback:
    scene_id: fionnen_resident_saeliel.topic_02_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 「這片花圃，你認得幾種花？」
    - kind: speech
      speaker: host
      text: 「都認得，哪朵幾時開、哪朵蜜多，我閉著眼也摸得出來。」
    - kind: speech
      speaker: host
      text: 「春天的花蜜清，夏天的花蜜厚。同樣是蜜，顏色和味道都不一樣。」
    - kind: narration
      text: 她彎腰湊近一朵花，鼻尖幾乎碰到花瓣。
    - kind: speech
      speaker: host
      text: 「你聞聞看，風從那邊吹過來，整片園子都是甜味。」
- topic_id: fionnen_resident_saeliel.topic_03
  keyword: 家人
  label: 家人
  fallback:
    scene_id: fionnen_resident_saeliel.topic_03_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 「你們家三個人都喜歡這座蜜園嗎？」
    - kind: speech
      speaker: host
      text: 「我們三個都喜歡。娘看蜂，姊姊熬蜜，我採，三個人一回家，滿屋子都是甜味。」
    - kind: speech
      speaker: host
      text: 「姊姊總嫌我吵。可我要是安靜一天，她又要問我是不是病了。」
    - kind: narration
      text: 她舔了舔指尖沾到的蜜，笑得眼睛都瞇起來。
    - kind: speech
      speaker: host
      text: 「我採的蜜最新鮮。你要嚐，我舀一勺給你看，還會冒泡。」
- topic_id: fionnen_resident_saeliel.topic_04
  keyword: 名字
  label: 名字
  fallback:
    scene_id: fionnen_resident_saeliel.topic_04_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 「希爾維爾布魯克，是月光下的銀溪？」
    - kind: speech
      speaker: host
      text: 「希爾維爾布魯克說的是銀溪。夜裡月亮照在溪上，整條水亮得像有人灑了東西下去。」
    - kind: narration
      text: 她踮起腳，朝溪水的方向張望。
    - kind: speech
      speaker: host
      text: 「有一回我踩滑掉進去，爬起來頭髮上全是水，還在發亮。」
    - kind: speech
      speaker: host
      text: 「這名字好聽。你晚上跟我去溪邊，我指給你看哪裡最亮。」
- topic_id: fionnen_resident_saeliel.topic_05
  keyword: 私語
  label: 私語
  requires:
    kind: affinity_at_least
    stage_key: trusted
  unavailable: locked
  refusal:
    scene_id: fionnen_resident_saeliel.topic_05_refusal
    revision: r2
    lines:
    - kind: speech
      speaker: host
      text: 「我最甜的那句話，要留給幫我舔手指的人。你先別急嘛。」
  fallback:
    scene_id: fionnen_resident_saeliel.topic_05_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「採完蜜滿手黏的時候，你會怎麼辦？」
    - kind: speech
      speaker: host
      text: 「先舔一舔。可指縫裡的舔不到，得有人幫忙。」
    - kind: speech
      speaker: host
      text: 「有人拉我坐下，一根一根替我舔乾淨。她的舌頭又暖又慢，我一邊躲一邊笑。」
    - kind: narration
      text: 她臉紅到耳根，眼睛卻亮著。
    - kind: speech
      speaker: host
      text: 「最後我笑到沒力氣，整個人癱在她懷裡。蜜沾了手，總得有人收。」
    - kind: speech
      speaker: host
      text: 「你哪天也沾一沾，就知道有多甜。」
