schema_version: 1
greeting: 盧梅斯‧布瑞特莉夫正把一鍋熬好的蜜從灶上端下來，指尖往鍋裡一蘸，湊到你嘴邊，「先嚐一口。這鍋裡是今早採的花瓣，香都還在。」她等著，也不收手，笑起來眼尾都往上挑，「你來找蜜呀，還是專程來看我？」
topics:
- topic_id: fionnen_lumeth_home.topic_01
  keyword: 養蜂
  label: 養蜂
  fallback:
    scene_id: fionnen_lumeth_home.topic_01_scene
    revision: r4
    lines:
    - kind: speech
      speaker: actor
      text: 「花蕊蜜園這些蜂，都是你在照看嗎？」
    - kind: narration
      text: 她把鍋擱到石板上，走到窗邊，蜂箱就排在樹蔭底下。
    - kind: speech
      speaker: host
      text: 「是呀。蜂箱擱在畦邊，花開到哪兒，牠們就飛到哪兒。我呀，只負責把箱子擺對地方，別讓雨淋進去。」
    - kind: speech
      speaker: host
      text: 「森林百花蜜一年收幾回，全看花期。開得旺，蜜裡嚐得出好多種花；開得少，味兒就純一點。」
    - kind: speech
      speaker: actor
      text: 「收蜜的時候，蜂不螫你嗎？」
    - kind: speech
      speaker: host
      text: 「會繞著人轉呀。動作慢些，牠們知道你沒想搶蜜，就自己忙去了，懶得理你。我收蜜收得慢，牠們認我，多半只來聞聞我沾著蜜的手腕。」
- topic_id: fionnen_lumeth_home.topic_02
  keyword: 蜜漬
  label: 蜜漬
  fallback:
    scene_id: fionnen_lumeth_home.topic_02_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 「精靈蜜漬花蕊是怎麼做的呀？」
    - kind: narration
      text: 她從架上取下一罐，掀開布，裡頭的花瓣還透著光。
    - kind: speech
      speaker: host
      text: 「花瓣洗乾淨，晾到沒水氣，再跟蜜一塊兒下鍋。火不能大，一滾就得離火，不然花瓣就爛了。」
    - kind: speech
      speaker: host
      text: 「熬好裝罐封口。你聞，春天的香，甜裡帶一點青。我封罐前總要舔一下木勺，嚐嚐是哪一枝花的味道。」
    - kind: speech
      speaker: actor
      text: 「這一罐，你自己也捨得拿來賣？」
    - kind: speech
      speaker: host
      text: 「捨得呀。好東西光自己吃多沒趣。你含一小塊，花瓣在舌尖上化開，甜味順著喉嚨往下走。嚐過的人，回頭多半分不清自己惦的是蜜，還是我這根手指。」
- topic_id: fionnen_lumeth_home.topic_03
  keyword: 蜜漬房
  label: 蜜漬房
  fallback:
    scene_id: fionnen_lumeth_home.topic_03_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「蜜漬房是村裡大家共用的嗎？」
    - kind: narration
      text: 她朝花圃那頭比了比，蜜漬房就在幾棵樹後頭。
    - kind: speech
      speaker: host
      text: 「是呀。灶和鍋都在那兒，誰要熬什麼就拿去用。村裡要吃的甜食，都放在那幾格架上。」
    - kind: speech
      speaker: actor
      text: 「在那兒拿東西，要留銅幣嗎？」
    - kind: speech
      speaker: host
      text: 「蜜漬房裡頭不收銅幣。誰缺什麼就取多少，不夠了大家再一塊兒做。」
    - kind: speech
      speaker: host
      text: 「客人想帶走我熬的蜜，就上我家來，用銅幣換。這樣你才知道哪一罐出自誰的手，吃得安心。」
- topic_id: fionnen_lumeth_home.topic_04
  keyword: 收回
  label: 收回
  fallback:
    scene_id: fionnen_lumeth_home.topic_04_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「我從你這兒帶走的蜜和飯食，用不完能拿回來嗎？」
    - kind: speech
      speaker: host
      text: 「森林百花蜜、精靈蜜漬花蕊，還有普通餐食，用不上就拿來，我瞧過成色，算銅幣給你。」
    - kind: speech
      speaker: host
      text: 「別的吃食我沒備，也就不收。我架上只放自己熬、自己做的東西，別人家的混進來，我分不出好壞。」
    - kind: speech
      speaker: actor
      text: 「那我從山外帶回來的甜食呢？」
    - kind: narration
      text: 她搖了頭，把手裡那罐擱回架上。
    - kind: speech
      speaker: host
      text: 「你自己留著呀。那不是我架子上的東西，收了我也沒地方擱，白佔一塊地。」
