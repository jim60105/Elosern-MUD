schema_version: 1
greeting: 盧梅斯‧布瑞特莉夫正把一鍋熬好的蜜從灶上端下來。她伸指蘸了一下，舉到你面前，「先嚐。這一鍋是早上採的花，甜得很乾淨。」等你看過那層蜜，她才笑著問：「你來找蜜，還是有別的事呀？」
topics:
- topic_id: fionnen_lumeth_home.topic_01
  keyword: 養蜂
  label: 養蜂
  fallback:
    scene_id: fionnen_lumeth_home.topic_01_scene
    revision: r1
    lines:
    - kind: speech
      speaker: actor
      text: 「花蕊蜜園的蜂，都是你在照顧嗎？」
    - kind: narration
      text: 她把鍋擱到一旁的石板上，走到窗邊，蜂箱就擱在外頭的樹蔭下。
    - kind: speech
      speaker: host
      text: 「蜂箱在畦邊，花開到哪裡，牠們就飛到哪裡。我做的事只是把箱子擺對位置，別讓雨淋進去。」
    - kind: speech
      speaker: host
      text: 「森林百花蜜一年收幾回，看花期。開得旺的那一年，蜜裡嚐得出很多種花；開得少，味道就單純一些。」
    - kind: speech
      speaker: actor
      text: 「收蜜的時候，蜂不會螫你嗎？」
    - kind: speech
      speaker: host
      text: 「會呀。被螫幾次就曉得哪一種動作會惹牠們，動作慢一點，牠們也就懶得理你。」
- topic_id: fionnen_lumeth_home.topic_02
  keyword: 蜜漬
  label: 蜜漬
  fallback:
    scene_id: fionnen_lumeth_home.topic_02_scene
    revision: r1
    lines:
    - kind: speech
      speaker: actor
      text: 「精靈蜜漬花蕊是怎麼做的？」
    - kind: narration
      text: 她從架上取下一罐，掀開布，裡頭的花瓣還透著光。
    - kind: speech
      speaker: host
      text: 「花瓣洗乾淨，晾到沒有水氣，再和蜜一起下鍋。火不能大，一滾就要離火，花瓣才不會爛。」
    - kind: speech
      speaker: host
      text: 「煮好的裝進罐裡封起來，放到涼。冬天拿出來，配熱水或配麵包都好。」
    - kind: speech
      speaker: actor
      text: 「所以這一罐是今年春天的花？」
    - kind: speech
      speaker: host
      text: 「春天的最香。夏天雨多，花瓣薄，煮起來容易散，我就少做一點。」
- topic_id: fionnen_lumeth_home.topic_03
  keyword: 蜜漬房
  label: 蜜漬房
  fallback:
    scene_id: fionnen_lumeth_home.topic_03_scene
    revision: r1
    lines:
    - kind: speech
      speaker: actor
      text: 「蜜漬房是村裡共用的地方嗎？」
    - kind: narration
      text: 她朝花圃那頭比了一下，蜜漬房就在幾棵樹之外。
    - kind: speech
      speaker: host
      text: 「是。灶和鍋都在那裡，誰要熬什麼就拿去用。村裡要吃的甜食，也都放在那幾格架子上。」
    - kind: speech
      speaker: actor
      text: 「在那裡拿東西，要留銅幣嗎？」
    - kind: speech
      speaker: host
      text: 「蜜漬房裡的東西不收銅幣。村裡的人取自己需要的量，不夠了再一起做。」
    - kind: speech
      speaker: host
      text: 「客人想帶走我熬的蜜，就到我家來找我，用銅幣換。這樣你曉得哪一罐出自誰的手。」
- topic_id: fionnen_lumeth_home.topic_04
  keyword: 收回
  label: 收回
  fallback:
    scene_id: fionnen_lumeth_home.topic_04_scene
    revision: r1
    lines:
    - kind: speech
      speaker: actor
      text: 「我帶走的蜜和飯食，用不完還能拿回來嗎？」
    - kind: speech
      speaker: host
      text: 「森林百花蜜、精靈蜜漬花蕊，還有我備的普通餐食，沒用完都可以拿回來。我看過成色，算銅幣給你。」
    - kind: speech
      speaker: host
      text: 「別的東西我不收。我的架子只放自己熬和自己做的東西；別人的東西擺進來，我也分不出好壞。」
    - kind: speech
      speaker: actor
      text: 「那從外頭買來的甜食呢？」
    - kind: narration
      text: 她搖了搖頭，把手上那罐放回架上。
    - kind: speech
      speaker: host
      text: 「外頭的我不收。花從哪裡來、熬了多久，我都不曉得，擺上架子只會亂了我自己的東西。」
