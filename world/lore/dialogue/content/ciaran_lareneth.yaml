schema_version: 1
greeting: 溪畔小徑旁的石屋裡，夜綻花釀的甜香從灶邊漫出來。拉瑞內斯‧妮特布倫正把陶甕裡的糖漿舀進小罐，聽見腳步聲便轉過身來，用木碟托著一小盞夜綻花釀：「遠來的客人……先嚐一口吧。花要入夜才開，我守著它釀了一整季，坐下多聊幾句。」
topics:
- topic_id: ciaran_lareneth_home.topic_01
  keyword: 花饌
  label: 花饌
  fallback:
    scene_id: ciaran_lareneth_home.topic_01_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 屋裡這股甜香和花蜜不太一樣，你甕裡釀的是什麼？
    - kind: narration
      text: 拉瑞內斯‧妮特布倫用細麻布擦淨指尖，把一個封了蠟的小陶罐往客人面前推了推。
    - kind: speech
      speaker: host
      text: 「這是暗影谷夜綻花釀……谷裡的夜綻花要等天色全暗才開，花瓣一開就香得藏不住。我天一黑就提著籃子出門，趁花剛開的時候採下來。」
    - kind: speech
      speaker: host
      text: 「花浸進糖漿裡要放足一季，等香氣全化進糖裡才算成。急不得，早了就只剩甜味。」
    - kind: speech
      speaker: actor
      text: 原來得等這麼久。這釀好的花，吃起來是什麼滋味？
    - kind: speech
      speaker: host
      text: 「入口先是糖的甜，過一會兒花的香才從喉嚨裡漫上來……配一杯淡茶正好。」
- topic_id: ciaran_lareneth_home.topic_02
  keyword: 山產
  label: 山產
  fallback:
    scene_id: ciaran_lareneth_home.topic_02_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 暗影谷周圍的山林裡，每個時節都能採到合用的山產嗎？
    - kind: narration
      text: 拉瑞內斯‧妮特布倫轉頭望向窗外青翠的林木，唇角泛起溫和的笑意。
    - kind: speech
      speaker: host
      text: 「谷底的物產跟著時序轉變，四時送來的東西各不相同……春末採花，盛夏採野蜜，秋風起時採野果，雨季過後山澗邊滿是鮮蕈。」
    - kind: speech
      speaker: host
      text: 「蕈子採回來，串在竹籤上擱炭火烤透，就是暗影谷炭烤蕈串。走路的時候拿著吃，比什麼都實在。」
    - kind: speech
      speaker: actor
      text: 要是跟你換的蕈串一時吃不完，或是釀罐還沒開封就帶不動了，能拿回來嗎？
    - kind: speech
      speaker: host
      text: 「蕈串趁熱吃最好。釀罐只要封泥沒拆、罐身完整，原樣送回我這裡，我都替你收下……山林贈予族人的東西，不能浪費。」
- topic_id: ciaran_lareneth_home.topic_03
  keyword: 茶點
  label: 茶點
  fallback:
    scene_id: ciaran_lareneth_home.topic_03_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 我看你窗邊矮凳上擺著木盤與陶壺，那些點心是特地備給客人的嗎？
    - kind: narration
      text: 拉瑞內斯‧妮特布倫提起爐邊溫著的泥壺，往木杯裡倒了一杯清澄的花茶。
    - kind: speech
      speaker: host
      text: 「那是讓經過這條小徑的人歇腳的地方。走累了就進來坐下，喝杯花茶潤喉……擺著的花釀和蕈串也儘管取用，這原本就是村裡人互相關照的習慣。」
    - kind: speech
      speaker: actor
      text: 若想帶幾罐花釀和幾串蕈串上路饋贈友人，也能請你妥善打包嗎？
    - kind: speech
      speaker: host
      text: 「只要跟我說一聲，我會用厚樹葉襯底、細草繩綁緊，罐子穩當得很；蕈串用荷葉裹上，涼了也還香。」
    - kind: speech
      speaker: actor
      text: 這樣包著走山路，真不怕磕碰嗎？
    - kind: speech
      speaker: host
      text: 「山路顛簸我曉得……綁緊了就不怕。喝完茶再啟程吧。」
- topic_id: ciaran_lareneth_home.topic_04
  keyword: 口味
  label: 口味
  fallback:
    scene_id: ciaran_lareneth_home.topic_04_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 聽說基亞蘭族平日調製飯食，口味和外頭的大城很不一樣？
    - kind: narration
      text: 拉瑞內斯‧妮特布倫指尖拂過竹篩裡晾乾的花瓣，眼神悠遠而寧靜。
    - kind: speech
      speaker: host
      text: 「村裡做飲食偏重清淡、講究原味，甜多鹹少，圖的是留住食材本來的香氣……外頭王國的大城裡，聽說人們喜歡油重味濃，來到谷底恐怕會覺得太素雅了些。」
    - kind: speech
      speaker: actor
      text: 你在夜綻花釀裡調的甜味，也是照這個心思拿捏嗎？
    - kind: speech
      speaker: host
      text: 「哪怕是釀花，糖我也只放最少的一點，糖下多了就蓋過花瓣原有的香氣。若是喜歡天然甘甜，帶一罐暗影谷夜綻花釀回去細品，最能喝出山谷的真滋味。」
