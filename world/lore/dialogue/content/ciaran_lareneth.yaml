schema_version: 1
greeting: 溪畔小徑旁的石屋裡透著清甜的花蜜香氣。拉瑞內斯‧妮特布倫正用木匙調勻陶甕裡的蜜汁，聽見腳步聲便轉過身來，用木碟托著一片厚葉，上面擱著一枚精靈蜜漬花蕊：「遠來的客人……先嚐一口吧。含著花香定下心，想問些什麼我們都能坐下聊。」
topics:
- topic_id: ciaran_lareneth_home.topic_01
  keyword: 花饌
  label: 花饌
  fallback:
    scene_id: ciaran_lareneth_home.topic_01_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 屋裡這股甜香聞著格外清雅，你手裡做著的花饌，都是怎麼調製出來的？
    - kind: narration
      text: 拉瑞內斯‧妮特布倫用細麻布擦淨指尖，指著身後幾隻封了蠟的粗陶罐。
    - kind: speech
      speaker: host
      text: 「這罐裡封著的是精靈蜜漬花蕊……每年春末谷裡繁花開得最盛那幾天，天還沒亮我就出門採擷，只挑帶著晨露的花芯，浸進深山採來的野蜜裡泡足三個月。」
    - kind: speech
      speaker: actor
      text: 聽說這種漬花很受往來旅人歡迎，帶在行囊裡方便路上充飢嗎？
    - kind: speech
      speaker: host
      text: 「趕路的時候含上一顆，既能解渴也能頂住飢餓，放幾個月也不會壞。想帶兩罐在行囊裡防身，拿幾枚銅幣跟我換就行……比粗糙的乾糧好吃多啦。」
- topic_id: ciaran_lareneth_home.topic_02
  keyword: 山產
  label: 山產
  fallback:
    scene_id: ciaran_lareneth_home.topic_02_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 暗影谷周圍的山林裡，每個時節都能採到合用的山產嗎？
    - kind: narration
      text: 拉瑞內斯‧妮特布倫轉頭望向窗外青翠的林木，唇角泛起溫和的笑意。
    - kind: speech
      speaker: host
      text: 「谷底隨時序轉變，四時送來的物產各不相同……春末採繁花與嫩芽，盛夏採深林野蜜，秋風起時採野果，雨季過後山澗邊滿是鮮蕈。我做點心只取自己親手採摘的新鮮料子。」
    - kind: speech
      speaker: actor
      text: 要是向你換的花饌一時吃不完，留在行囊裡受潮變質該如何處置？
    - kind: speech
      speaker: host
      text: 「只要封泥沒拆、罐身完整，原樣送回我這裡，我都替你收下。山林贈予族人的東西絕不浪費，換回來的銅幣也照數退你……不必掛在心上。」
- topic_id: ciaran_lareneth_home.topic_03
  keyword: 茶點
  label: 茶點
  fallback:
    scene_id: ciaran_lareneth_home.topic_03_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 我看你窗邊矮凳上擺著木盤與陶壺，那些點心是特地備給客人的嗎？
    - kind: narration
      text: 拉瑞內斯‧妮特布倫提起爐邊溫著的泥壺，往木杯裡注入一泓清澄的花茶。
    - kind: speech
      speaker: host
      text: 「那是留給經過這條小徑的人歇腳之用。走累了就進來坐下，喝杯花茶潤喉消渴……想嚐盤裡的點心隨時取用，這原本就是村裡人互相關照的習慣。」
    - kind: speech
      speaker: actor
      text: 若想帶幾罐花蕊上路饋贈友人，也能請你妥善打包嗎？
    - kind: speech
      speaker: host
      text: 「只要跟我說一聲，我會取兩層厚樹葉襯好細草繩，替你把陶罐綁得密實穩當。山路顛簸也不怕磕碰……喝完茶再啟程吧。」
- topic_id: ciaran_lareneth_home.topic_04
  keyword: 口味
  label: 口味
  fallback:
    scene_id: ciaran_lareneth_home.topic_04_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 聽說基亞蘭族平日調製飯食，口味和外頭的大城很不一樣？
    - kind: narration
      text: 拉瑞內斯‧妮特布倫指尖拂過竹篩裡晾乾的花瓣，眼神悠遠而寧靜。
    - kind: speech
      speaker: host
      text: 「村裡做飲食偏重清淡原生，甜多鹹少，講究留住食材本來的香氣……外頭王國的大城裡聽說喜歡重油烈料，來到谷底恐怕會覺得太素雅了些。」
    - kind: speech
      speaker: actor
      text: 你在蜜漬花蕊裡調配的甜味，也是照這個心思拿捏分寸嗎？
    - kind: speech
      speaker: host
      text: 「哪怕是釀蜜，我也只下最克制的分量，多添半勺蜜汁都會遮蓋花瓣原有的芬芳。若是喜歡天然甘甜，挑一罐精靈蜜漬花蕊回去細品，最能嚐出山林的真滋味。」
