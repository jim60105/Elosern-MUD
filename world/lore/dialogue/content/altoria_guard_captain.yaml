schema_version: 1
greeting: 衛兵駐所的值房裡，托瓦德‧鄧堡正立在窗前，盯著南門拱道下的動靜。聽見腳步聲，他俐落轉過身，鎖子甲在火盆映照下泛著冷光：「從南門進城的？這一帶市街的防務歸我管。問路、治安，我都能交代清楚。只有一樣先說明白，本駐所不發委託，也不貼懸賞，找差事請往冒險者公會去。」
topics:
- topic_id: altoria_guardhouse.topic_01
  keyword: 進城
  label: 進城
  fallback:
    scene_id: altoria_guardhouse.topic_01_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 「衛兵隊長，我頭一回進這王都，城裡主要的路該怎麼認？」
    - kind: narration
      text: 托瓦德‧鄧堡走到牆邊的羊皮輿圖前，手指沿著南大道的走向一路比劃上去。
    - kind: speech
      speaker: host
      text: 「記住這條線。腳下是南大道，朝聖之路的第一段，順著它筆直往北，先到中央廣場。王都的路都從那座廣場向四面張開。」
    - kind: speech
      speaker: host
      text: 「廣場以東是公會前，冒險者公會的大門開在那兒；市場街沿著舊牆線橫過城裡，是城裡最長的商街。出了廣場再往北，是大道北段；聖階則一路攀到上城，大神殿與王宮都在那上頭。」
    - kind: speech
      speaker: host
      text: 「要緊的路口都立著木牌。把這幾處地標記牢，在下城就不會走岔。」
- topic_id: altoria_guardhouse.topic_02
  keyword: 差事
  label: 差事
  fallback:
    scene_id: altoria_guardhouse.topic_02_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 「駐所這裡，有公家派發的討伐或巡守差事能接嗎？」
    - kind: narration
      text: 托瓦德‧鄧堡按著腰間佩劍的黃銅劍柄，火光映著他左眉的舊傷。
    - kind: speech
      speaker: host
      text: 「沒有。衛兵隊的職責是守城門、維持街面秩序，駐所一概不發委託，往後也不發。」
    - kind: speech
      speaker: host
      text: 「要接差事，沿南大道往北到中央廣場，往東一拐就是公會前的冒險者公會。大廳的告示板上列著各級委託，去櫃檯找辦事員登記。」
    - kind: speech
      speaker: host
      text: 「街坊私下拜託的雜活，是市民之間的互助，駐所不過問。公私分明，這座城才走得穩。」
- topic_id: altoria_guardhouse.topic_03
  keyword: 治安
  label: 治安
  fallback:
    scene_id: altoria_guardhouse.topic_03_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 「南門這一帶治安如何？要是街面上遇到糾紛或是竊案，該找誰？」
    - kind: narration
      text: 托瓦德‧鄧堡微仰起頭，目光從城門洞下的石板通道冷靜掠過。
    - kind: speech
      speaker: host
      text: 「南門一帶由衛兵隊日夜輪值巡邏。遇見竊盜、械鬥或魔獸驚擾，找身穿藍罩袍、胸掛銅牌的執勤衛兵，他們會接手。」
    - kind: speech
      speaker: host
      text: 「駐所管的是城區安全與公眾秩序。買賣價錢談不攏，或是賭桌上的糾紛，雙方自行了斷，不歸駐所裁斷。」
    - kind: speech
      speaker: host
      text: 「阿爾托利亞王國重騎士精神與律法。安分守己，巡邏的衛兵自然看顧你一路平安。」
- topic_id: altoria_guardhouse.topic_04
  keyword: 過夜
  label: 過夜
  fallback:
    scene_id: altoria_guardhouse.topic_04_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 「天快黑了，南門附近哪裡有乾淨又安全的客棧能投宿？」
    - kind: narration
      text: 托瓦德‧鄧堡朝值房角落兩張擦得光潔的硬木長凳示意。
    - kind: speech
      speaker: host
      text: 「要過夜，趁日落前順南大道往北，拐進客棧巷，那兒有爐火旅店，隔壁是醉月酒館。」
    - kind: speech
      speaker: host
      text: 「爐火旅店的門閂厚實，床鋪乾爽，收費公道，遠道來的商旅多半落腳那兒。醉月酒館開得晚，只想喝一杯再睡的也方便。」
    - kind: speech
      speaker: host
      text: 「我這值房只有兩張硬木長凳，沒有棉被，也不留宿。走累了可以坐下歇口氣，天黑了就動身去客棧巷。」
