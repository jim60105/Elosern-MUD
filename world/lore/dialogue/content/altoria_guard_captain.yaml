schema_version: 1
greeting: 衛兵駐所的門半開著，托瓦德‧鄧堡站在窗邊，正盯著南門拱道底下的人來人往。聽見腳步，他轉過身，鎖子甲上的火光跟著晃了一下：「從南門進來的？這一帶歸我管。問路、問治安，我都答得上。先說明白一件事，駐所不發委託，也不貼懸賞，找差事請去冒險者公會，別在這裡耗。」
topics:
- topic_id: altoria_guardhouse.topic_01
  keyword: 進城
  label: 進城
  fallback:
    scene_id: altoria_guardhouse.topic_01_scene
    revision: r4
    lines:
    - kind: speech
      speaker: actor
      text: 「隊長，我頭一回進王都。從南門往北走，主要的路該怎麼認？」
    - kind: narration
      text: 托瓦德走到牆邊那張羊皮輿圖前，食指從南門的位置往上壓，順著一條粗線一路滑到廣場。
    - kind: speech
      speaker: host
      text: 「腳下這條就是南大道，朝聖之路的第一段。你順著它直走，不用拐彎，走到底就是中央廣場。王都的路都從那座廣場散出去，記住這一點，剩下的好辦。」
    - kind: speech
      speaker: host
      text: 「廣場往東是公會前，冒險者公會的大門開在那邊。市場街沿著舊牆線橫過城裡，是全王都最長的一條街，買什麼都往那裡找。再往北是大道北段。要往上城，走聖階，大神殿和王宮都在上頭。」
    - kind: speech
      speaker: host
      text: 「路口都立了木牌。這幾處記牢，下城就繞不丟。我當年守南門十年，頭一個月也走錯過兩回，不丟臉。」
    - kind: narration
      text: 他把手收回來，指尖在輿圖上留下一小塊擦痕。
- topic_id: altoria_guardhouse.topic_02
  keyword: 差事
  label: 差事
  fallback:
    scene_id: altoria_guardhouse.topic_02_scene
    revision: r5
    lines:
    - kind: speech
      speaker: actor
      text: 「駐所有沒有公家派下來的討伐或巡守差事？我想接點活。」
    - kind: narration
      text: 托瓦德按住腰間佩劍的銅柄，火光映到他左眉那道舊傷上，眼神沒有鬆。
    - kind: speech
      speaker: host
      text: 「衛兵隊守城門、管街面秩序，駐所的職責就到這裡，一概不發委託，以後也一樣。這不是推託，分內分外要先弄清楚。」
    - kind: speech
      speaker: host
      text: 「要接差事，往北走到中央廣場，往東拐進公會前。大廳那面看板釘著各級委託，你看上哪張，去櫃檯找辦事員登記。他們核過，才算數。」
    - kind: speech
      speaker: host
      text: 「街坊私下拜託的雜活，是市民之間互相幫忙，駐所不管。公私分清楚，這座城才站得穩。」
- topic_id: altoria_guardhouse.topic_03
  keyword: 治安
  label: 治安
  fallback:
    scene_id: altoria_guardhouse.topic_03_scene
    revision: r4
    lines:
    - kind: speech
      speaker: actor
      text: 「南門這一帶治安怎麼樣？街上遇到糾紛或竊案，該找誰？」
    - kind: narration
      text: 托瓦德偏過頭，目光掃過門洞下那條石板通道，把今天走過的人數了一遍。
    - kind: speech
      speaker: host
      text: 「南門由衛兵隊日夜輪值，街上一直有人。遇上竊盜、械鬥，或是魔獸闖進來，找穿藍罩袍、胸前掛銅牌的執勤衛兵，報給他們，他們接手。」
    - kind: speech
      speaker: host
      text: 「駐所管的是城區安全和公眾秩序。買賣價錢談不攏，賭桌上輸贏有爭執，那些雙方自己解決，駐所不坐下來替人評理。」
    - kind: speech
      speaker: host
      text: 「我在南門站了十年，什麼樣的糾紛都見過。真動了手，吃虧的通常不是先出手那個。」
    - kind: speech
      speaker: host
      text: 「王國講騎士精神，也講律法。你自己守規矩，巡邏的人自然會多看顧你一眼。」
- topic_id: altoria_guardhouse.topic_04
  keyword: 過夜
  label: 過夜
  fallback:
    scene_id: altoria_guardhouse.topic_04_scene
    revision: r4
    lines:
    - kind: speech
      speaker: actor
      text: 「天快黑了。南門附近哪裡有乾淨、睡得安穩的客棧？」
    - kind: narration
      text: 托瓦德朝值房角落兩張硬木長凳點了下頭。
    - kind: speech
      speaker: host
      text: 「要過夜，趁天還沒全黑，順南大道往北，拐進客棧巷。那裡有爐火旅店，隔壁是醉月酒館，兩間挨著。」
    - kind: speech
      speaker: host
      text: 「爐火旅店的門閂厚，床鋪乾爽，價錢公道，跑遠路的商旅多半住那兒。醉月酒館開到很晚，只想喝一杯再睡也方便。」
    - kind: speech
      speaker: host
      text: 「我這值房只有兩張長凳，沒有棉被，不留人過夜。坐著歇口氣可以，天黑之前動身。睡不好，明天上路照樣出事。」
