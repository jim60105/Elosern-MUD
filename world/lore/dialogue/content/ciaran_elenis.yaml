schema_version: 1
greeting: 長老古樹下的坐石被山風吹得有點涼，艾莉妮斯‧達恩斯特瑞德爾赤著腳坐在盤根之間，膝上擱著一縷剛剝下的樹皮。她抬起眼，眼角的笑紋擠在一塊：「來啦，小傢伙，坐。我這裡沒什麼要交代你，也沒有寶貝等著你伸手。想聽村子的來歷、林子裡的規矩，還是那些放了很久的舊事，我這顆腦袋都還裝得下。」
topics:
- topic_id: ciaran_elenis_home.topic_01
  keyword: 村子
  label: 村子
  fallback:
    scene_id: ciaran_elenis_home.topic_01_scene
    revision: r4
    lines:
    - kind: speech
      speaker: actor
      text: 「我在谷口繞了半天才找到路。這村子到底是怎麼落到這片谷底的？你們平常都怎麼過日子？」
    - kind: speech
      speaker: host
      text: 「嗯……說來話長。早先村子不在這裡。山上的溪水改了道，水聲換了地方，族人就拎著家當跟著搬下來，把谷底的岩洞和林子都走熟了。」
    - kind: narration
      text: 她把樹皮翻了個面，指腹沿著上頭的紋路一路壓過去。
    - kind: speech
      speaker: host
      text: 「這裡沒有官，也沒有人管誰。肚子餓了去村中廣場的共食棚，手癢去練刀場。夜裡想跟誰擠一張鋪，自己看著辦，不用問過誰。」
    - kind: speech
      speaker: actor
      text: 「連個拿主意的人都沒有？真吵起來，大家聽誰的？」
    - kind: speech
      speaker: host
      text: 「嗯……很少吵。真遇上拿不準的事，幾個人在樹下坐下來聊幾句，話講開就散了。要說誰記性好，那是我。可我只管記事情，不管人。」
- topic_id: ciaran_elenis_home.topic_02
  keyword: 基亞蘭
  label: 基亞蘭
  predecessors:
  - ciaran_elenis_home.topic_01
  disclosure: pure_chain
  fallback:
    scene_id: ciaran_elenis_home.topic_02_scene
    revision: r4
    lines:
    - kind: speech
      speaker: actor
      text: 「你剛說村子順著水搬下來。那基亞蘭這一族，又為什麼認了刀？山外的人都講，黑暗精靈最會用刀。」
    - kind: narration
      text: 她朝練刀場的方向望了一眼，眼底那點笑意沒有收。
    - kind: speech
      speaker: host
      text: 「記性好罷了。刀柄上一道一道刻著名字，握久了木頭都發亮，上頭的心意還在。我送走過好些握過這些刀的人，有的折在山裡，有的老到走不動。我卻還記得她們手心貼上刀柄時的溫度。對我們這一族來說，刀握在手裡，是為了守住還活著的人。」
    - kind: speech
      speaker: actor
      text: 「那村裡的孩子，也都這樣一路練上來？」
    - kind: speech
      speaker: host
      text: 「嗯，都是。練刀場邊有對黑髮的雙生姊妹，也是在谷裡長大。悠花小時候脾氣硬，從起霧練到落霜，泰莉爾就站在旁邊看。她頭一回把木刀握穩，整片場子忽然靜下來。看著這些孩子把刀拿起來，我就知道，村子想記住的東西，還有人接著。」
- topic_id: ciaran_elenis_home.topic_03
  keyword: 森林
  label: 森林
  fallback:
    scene_id: ciaran_elenis_home.topic_03_scene
    revision: r4
    lines:
    - kind: speech
      speaker: actor
      text: 「我從西邊的坡上來，林子一密就分不清方向。你們進山都怎麼走，才不會出事？」
    - kind: narration
      text: 她側過頭聽了一會樹梢上的風，神情鬆下來。
    - kind: speech
      speaker: host
      text: 「林子認得腳步。打獵走固定的山脊，採藥看時令，哪片坡該歇上幾年，老一輩都替草木記著。你踩在落葉上的步子一急，樹根和蟲鳥全聽得出來。山裡的路，靠腳底和背脊記，眼睛反而幫不上忙。」
    - kind: speech
      speaker: actor
      text: 「所以只要對這片林子存點敬意，它就不會為難人？」
    - kind: speech
      speaker: host
      text: 「帶走多少果子，就留下多少。山林不開口討，可你每回取用，它都記在枝葉裡。心裡不貪，順著山勢走，這片樹海自然留一條路給你回來。我年輕時在山裡過夜，數不清幾回，一次也沒走丟。你把腳步放慢一點就行。」
- topic_id: ciaran_elenis_home.topic_04
  keyword: 往事
  label: 往事
  fallback:
    scene_id: ciaran_elenis_home.topic_04_scene
    revision: r5
    lines:
    - kind: speech
      speaker: actor
      text: 「你在這棵樹下坐這麼久，看過的人大概比誰都多。有沒有一件事，到現在還留在你心裡？」
    - kind: narration
      text: 她笑出聲，把樹皮擱回膝頭，指尖繞著另一隻手腕打轉，目光落進暗下來的林子。
    - kind: speech
      speaker: host
      text: 「我記得一雙手。打刀的女人，指腹全是繭。頭一回在溪邊，水很冷，她把我脫到只剩一條腰帶，掌心從我的背脊一路滑到大腿。那晚我喘著要她慢一點，她不肯，湊到我耳邊笑，說我這身子怎麼還是這麼燙。後來她折在山裡，連刀都沒帶回來。我記得那雙手，比她葬在哪裡還清楚。」
    - kind: speech
      speaker: actor
      text: 「你記的是那份熱，還有她的笑。擱在心裡這麼久，不累嗎？」
    - kind: speech
      speaker: host
      text: 「不累，小傢伙。想要誰、暖過誰、誰先走，這些就是我活著的滋味。族人來問我拿主意，我多半勸她們想抱誰就去抱，別等到手腳都涼了。我送走的人多得記不清，可每一雙摟過我的胳膊，重量還壓在我腰上。那些名分、那些爭執，比不過夜裡一個人的體溫。」
