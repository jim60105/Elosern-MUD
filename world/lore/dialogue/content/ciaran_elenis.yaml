schema_version: 1
greeting: 山風把古樹下的坐石吹得微涼，艾莉妮斯‧達恩斯特瑞德爾赤著腳坐在盤根之間，膝上擱著一縷剛剝下的樹皮。她抬起眼，眼角的笑紋深了幾分：「過來坐吧，小傢伙。我這兒沒有差事要派你，也沒有寶貝等著你伸手。想聽村子的來歷、林子裡的規矩，還是這近千年裡沒人再提的舊事，我這把老骨頭都還記得。」
topics:
- topic_id: ciaran_elenis_home.topic_01
  keyword: 村子
  label: 村子
  fallback:
    scene_id: ciaran_elenis_home.topic_01_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 請問老人家，這座暗影谷村是怎麼落定在這兒的？住了這麼久，大家平常都怎麼過日子？
    - kind: narration
      text: 艾莉妮斯‧達恩斯特瑞德爾低下頭，指尖順著樹皮上的紋路摸過去，聲音像山風一樣慢。
    - kind: speech
      speaker: host
      text: 「早年村子不在這片谷底。幾百年前山上的溪水改了道，族人就順著水聲搬到這兒，把谷底的岩洞和林地都走熟了。這兒沒有官，也沒人管誰。想吃的去共食棚，想練的去練刀場；入了夜，想跟誰同鋪，隨自己的意。日子就這麼過下來了。」
    - kind: speech
      speaker: actor
      text: 連個拿主意的人都沒有？要是真起了爭執，大家聽誰的？
    - kind: speech
      speaker: host
      text: 「你們外頭的人，總愛分個高下。這兒遇上拿不準的事，大夥兒坐在老樹下商量幾句，也就散了。真要論誰年長、誰記性好，那是我，可我只記往事，不管人。你瞧，沒人發號施令，大家不也平穩過了一千年嗎？」
- topic_id: ciaran_elenis_home.topic_02
  keyword: 基亞蘭
  label: 基亞蘭
  predecessors:
  - ciaran_elenis_home.topic_01
  disclosure: pure_chain
  fallback:
    scene_id: ciaran_elenis_home.topic_02_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 方才你提起村子的來歷，我還想問，基亞蘭一族為什麼認了刀？外頭都說，黑暗精靈最會使刀。
    - kind: narration
      text: 艾莉妮斯‧達恩斯特瑞德爾望向練刀場的方向，眼底浮起一點暖意。
    - kind: speech
      speaker: host
      text: 「記性好罷了。刀柄上的刻痕一代傳一代，握柄磨得光滑，那上頭的名字和心意卻都還在。我親手送走過好幾個握過這些刀的人，有的死在山裡，有的老了走不動，我卻記得他們手心貼著刀柄時的溫度。對這支族人來說，握刀是為了守住還在的人。」
    - kind: speech
      speaker: actor
      text: 那村裡的後輩，也都是這麼一路練上來的嗎？
    - kind: speech
      speaker: host
      text: 「嗯，都是。那對黑髮的雙生子，也是在谷裡長大。悠花小時候脾氣倔，在練刀場從晨霧練到落霜，泰莉爾就守在旁邊看。她頭一回把木刀握穩的那天，滿場子的風都停了。看著這些孩子握起刀，我就曉得，村子想記住的東西，一直有人在接。」
- topic_id: ciaran_elenis_home.topic_03
  keyword: 森林
  label: 森林
  fallback:
    scene_id: ciaran_elenis_home.topic_03_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 老人家，中央山脈西側這片林子地勢複雜，外人一進山就容易迷路。要怎麼走，才不至於出事？
    - kind: narration
      text: 艾莉妮斯‧達恩斯特瑞德爾側耳聽樹冠裡掠過的風，神情安詳。
    - kind: speech
      speaker: host
      text: 「林子認得人的腳步。打獵有固定的山脊，採藥草要順著時令，哪片坡該歇幾年，族裡的老人替草木都記著。林木有它自己的呼吸，你踩在落葉上的步子一急，樹根和蟲鳥就都聽得出來。山裡的路，靠腳底板和背脊記，不靠眼睛。」
    - kind: speech
      speaker: actor
      text: 這麼說，只要對這片山林存著敬意，它就不會與人為難？
    - kind: speech
      speaker: host
      text: 「帶走多少果子，就留下多少敬意。山林不開口討要，可你每一次取用，它都記在枝葉之間。只要心裡不存貪念，順著山勢走，這片樹海自然替你留一條回來的路。我年輕時在山裡過夜，數都數不清，卻從沒走丟過。你只消把身子放慢些。」
- topic_id: ciaran_elenis_home.topic_04
  keyword: 往事
  label: 往事
  fallback:
    scene_id: ciaran_elenis_home.topic_04_scene
    revision: r4
    lines:
    - kind: speech
      speaker: actor
      text: 老人家，你在這棵古樹下坐了這麼多年，該見過不少世代來去。有什麼事，是你到了今天還記得清的？
    - kind: narration
      text: 艾莉妮斯‧達恩斯特瑞德爾輕聲笑起來，把樹皮擱回膝頭，指尖繞著另一隻手腕打轉，目光落進暗下來的林子。
    - kind: speech
      speaker: host
      text: 「我記得一雙手。打刀的女人，指腹上全是繭。頭一回在溪邊就著冷水，她把我脫到只剩一條腰帶，掌心沿著我的背脊一路滑到大腿上。那晚我喘著要她慢些，她偏不肯，湊在耳邊笑我，說我活了快一千年，身子倒還跟頭一回一樣燙。後來她死在山裡，連刀都沒能帶回來。我記得那雙手，比她下葬的地方還清楚。」
    - kind: speech
      speaker: actor
      text: 你記住的是那份熱，記得她的笑。這種事在心裡擱了幾百年，你從不覺得累嗎？
    - kind: speech
      speaker: host
      text: 「不累，小傢伙。想要誰、暖過誰、誰先離開，這些本就是我活著的滋味。族人來求我拿主意，我多半勸他們想抱誰就去抱，別等到手腳都涼了。我送走過的人多得數不清，可每一雙摟過我的胳膊，重量還壓在我腰上。那些名分、那些爭執，比不過夜裡一個人的體溫來得實在。」
