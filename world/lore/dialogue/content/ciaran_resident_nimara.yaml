schema_version: 1
greeting: 妮瑪拉把一匹藍布從染缸裡提起來，藍水順著布角滴回缸裡。「要問染布，還是看料子？」
topics:
- topic_id: ciaran_resident_nimara.topic_01
  keyword: 染布
  label: 染布
  fallback:
    scene_id: ciaran_resident_nimara.topic_01_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 「谷裡這種藍，是怎麼染出來的？」
    - kind: speech
      speaker: host
      text: 「溪邊的染草熬出來。浸一道，晾一道，再浸。藍才吃得進布裡。」
    - kind: speech
      speaker: host
      text: 「這種活急不得，一急色就浮在表面，洗兩次就掉了。」
    - kind: narration
      text: 她把布抖開，一縷靛藍順著布紋滑下去，滴在她腳邊的石板上。
    - kind: speech
      speaker: host
      text: 「顏色像人。深一層、淺一層，都得花日子養。你摸一下，這藍有活氣。」
- topic_id: ciaran_resident_nimara.topic_02
  keyword: 織房
  label: 織房
  fallback:
    scene_id: ciaran_resident_nimara.topic_02_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「織房坡上，平常都掛著些什麼？」
    - kind: speech
      speaker: host
      text: 「新染的布晾在繩上。藍、青、黑，風一吹，滿坡都是顏色。」
    - kind: speech
      speaker: host
      text: 「人走在裡頭，像游在一池染料裡。」
    - kind: narration
      text: 她朝坡上望了一眼，風正好把一排布吹得鼓起來。
    - kind: speech
      speaker: host
      text: 「夜裡坡上很靜，只剩布拍打的聲音。那時候說話，最真。」
- topic_id: ciaran_resident_nimara.topic_03
  keyword: 家人
  label: 家人
  fallback:
    scene_id: ciaran_resident_nimara.topic_03_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 「織房坡這一攤，都是你們三個人顧？」
    - kind: speech
      speaker: host
      text: 「是我們三個。我染，大女兒瑞拉拉織，小女兒伊倫溫分線。」
    - kind: speech
      speaker: host
      text: 「三個人從早泡到晚，手上、胳膊上都是洗不掉的藍。」
    - kind: narration
      text: 她攤開手掌，掌心的藍暈像一朵開在皮膚上的花。
    - kind: speech
      speaker: host
      text: 「一匹布過三個人的手，顏色才穩。」
- topic_id: ciaran_resident_nimara.topic_04
  keyword: 名字
  label: 名字
  fallback:
    scene_id: ciaran_resident_nimara.topic_04_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 「特魯松，是什麼意思？」
    - kind: speech
      speaker: host
      text: 「特魯松就是真松，坡上那排松長得直，不歪。」
    - kind: speech
      speaker: host
      text: 「我家做布也求個直。紋路、染色，都不許走樣。」
    - kind: narration
      text: 她朝坡上那排松影看了一眼，沒有多說。
    - kind: speech
      speaker: host
      text: 「直是谷裡的老規矩。你來久了，也看得出哪匹布直、哪匹歪。」
- topic_id: ciaran_resident_nimara.topic_05
  keyword: 私語
  label: 私語
  requires:
    kind: affinity_at_least
    stage_key: trusted
  unavailable: locked
  refusal:
    scene_id: ciaran_resident_nimara.topic_05_refusal
    revision: r2
    lines:
    - kind: speech
      speaker: host
      text: 「顏色以外的心事，我向來收在缸底。你還沒到能一起看的時候。」
  fallback:
    scene_id: ciaran_resident_nimara.topic_05_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「染了這些年，你最喜歡哪一缸？」
    - kind: speech
      speaker: host
      text: 「最深的那缸靛藍。」
    - kind: speech
      speaker: host
      text: 「布一出缸，我整個人也鬆了。衣裳半褪，靠著缸沿喘氣。」
    - kind: speech
      speaker: host
      text: 「要是有人在身後，用沾了藍的手順著我的背往下抹，把我當一匹剛染好的布，那就穩了。」
    - kind: narration
      text: 她眼裡浮起一點慵懶，像還泡在那缸藍裡。
    - kind: speech
      speaker: host
      text: 「染布的人，也盼著被染。你哪天想試這份藍，再來找我。」
