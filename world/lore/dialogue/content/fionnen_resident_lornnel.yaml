schema_version: 1
greeting: 洛爾內爾一手攀著枝，從上頭翻下來，膝蓋一彎就站直：「有話就講，我還要上去。」
topics:
- topic_id: fionnen_resident_lornnel.topic_01
  keyword: 爬樹
  label: 爬樹
  fallback:
    scene_id: fionnen_resident_lornnel.topic_01_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「你上瞭望枝，怎麼都不必看路？」
    - kind: speech
      speaker: host
      text: 「看了。只是看得比別人快。哪根枝能踩、哪根踩了會空，腳底記得比腦子清楚。」
    - kind: narration
      text: 她抬手拍了拍身旁那根粗枝，樹皮上的苔被拍落一層。
    - kind: speech
      speaker: host
      text: 「我爬了這麼久，摔過的枝比走過的路多。摔一次，下次就知道手要抓哪兒。」
    - kind: speech
      speaker: host
      text: 「要試就從最下面那根開始。我不拉你，拉了你就學不會。」
- topic_id: fionnen_resident_lornnel.topic_02
  keyword: 高處
  label: 高處
  fallback:
    scene_id: fionnen_resident_lornnel.topic_02_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「站這麼高，風一吹，你不怕掉下來？」
    - kind: speech
      speaker: host
      text: 「怕過。第一次站上最頂那根，腿抖得厲害。後來發現，樹不會突然斷，怕的是自己先鬆手。」
    - kind: speech
      speaker: host
      text: 「高處看得遠。雲從哪邊來、獵隊走到哪個坡，我一眼就報下去。村裡靠這個決定今天出不出獵。」
    - kind: narration
      text: 她瞇眼望向樹冠外，風把她額前的頭髮掀起來。
    - kind: speech
      speaker: host
      text: 「衣裳被風扯得響，耳邊什麼都清楚。你在下面聽不見這些。」
- topic_id: fionnen_resident_lornnel.topic_03
  keyword: 家人
  label: 家人
  fallback:
    scene_id: fionnen_resident_lornnel.topic_03_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「你們一家人，是不是都愛往樹上跑？」
    - kind: speech
      speaker: host
      text: 「娘看天，我爬樹，妹妹聽風。三個人各占一個高度，各看各的一片。」
    - kind: narration
      text: 她朝樹下抬了抬下巴，那裡站著一個仰頭的身影。
    - kind: speech
      speaker: host
      text: 「我妹翁德斯話少。可她比我先知道雨要來，因為風會先變聲。」
    - kind: speech
      speaker: host
      text: 「我們不常湊在一起講話。各做各的事，有事喊一聲就夠了。」
- topic_id: fionnen_resident_lornnel.topic_04
  keyword: 名字
  label: 名字
  fallback:
    scene_id: fionnen_resident_lornnel.topic_04_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「蒙斯哈德，是月影的意思？」
    - kind: speech
      speaker: host
      text: 「月影。夜裡的影子落在樹冠上，一塊一塊，風一吹就換位置。」
    - kind: speech
      speaker: host
      text: 「我夜裡也上樹。影子在腳邊移，我踩著亮的地方往上，暗的地方留給手。」
    - kind: narration
      text: 她伸手在眼前晃了一下，像要把什麼撥開。
    - kind: speech
      speaker: host
      text: 「這名字不壞。你哪天夜裡看見樹上有人，喊一聲，我會應。」
- topic_id: fionnen_resident_lornnel.topic_05
  keyword: 私語
  label: 私語
  requires:
    kind: affinity_at_least
    stage_key: trusted
  unavailable: locked
  refusal:
    scene_id: fionnen_resident_lornnel.topic_05_refusal
    revision: r2
    lines:
    - kind: speech
      speaker: host
      text: 「那種話得等我從樹上下來，跟你並肩坐過一回再說。現在講，太輕了。」
  fallback:
    scene_id: fionnen_resident_lornnel.topic_05_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「你在最高的地方，最想跟誰一起看？」
    - kind: speech
      speaker: host
      text: 「日落。整片林子從綠變成金，再變成灰，最後只剩樹梢還亮著。」
    - kind: speech
      speaker: host
      text: 「有個人跟我並排坐，腳懸在外頭。她不抓樹枝，抓我的手腕。風大，我們誰也不講話。」
    - kind: narration
      text: 她的聲音低了一點，眼睛還望著樹冠外。
    - kind: speech
      speaker: host
      text: 「我在高處從來不覺得孤單。只有那種時候，會想旁邊多一個人。」
