schema_version: 1
greeting: 浴場管理員伊莎貝爾‧葦沼抱著一疊摺妥的乾淨布巾從水氣深處走出來，嗓門清脆：「新來的吧！男左女右，各自走各自的門，池水引自河水燒得滾燙。要問浴場的規矩就快點問，我後頭還有一大疊布巾等著摺呢！」
topics:
- topic_id: altoria_bathhouse.topic_01
  keyword: 規矩
  label: 規矩
  variants:
  - variant_id: elf_guest
    priority: 20
    when:
      kind: race_is
      race_key: elf
    scene:
      scene_id: altoria_bathhouse.topic_01_scene_elf
      revision: r2
      lines:
      - kind: speech
        speaker: actor
        text: 「進這座浴場，有什麼我該照著做的規矩？」
      - kind: speech
        speaker: host
        text: 「哎呀，是精靈客人！規矩很簡單，男左女右，兩邊各走各的門。」
      - kind: speech
        speaker: host
        text: 「我們王都的人族跟獸人習慣遮掩身子進池子，要是看見精靈不遮不掩，大家只敢低頭避開視線，心裡敬畏得很，可不敢多說一句話。」
      - kind: narration
        text: 伊莎貝爾把懷裡的布巾往上托了托，眼神裡滿是好奇。
      - kind: speech
        speaker: host
        text: 「要是覺得那道隔牆礙事，挑個人少的時候進去，隨心所欲泡個痛快就好啦！」
  - variant_id: high_exposure
    priority: 10
    when:
      kind: exposure
      minimum: 3
    scene:
      scene_id: altoria_bathhouse.topic_01_scene_exposed
      revision: r2
      lines:
      - kind: speech
        speaker: actor
        text: 「這裡更衣和入池有什麼講究？」
      - kind: speech
        speaker: host
        text: 「哎唷！衣裳都褪成這樣了才來問規矩？快把布巾圍上！」
      - kind: narration
        text: 伊莎貝爾手腳俐落抽出大布巾遞過來，順手往兩側通道指了指。
      - kind: speech
        speaker: host
        text: 「男左女右，門簾後頭有木櫃能放隨身物件。在外頭大道上露著走會惹衛兵盤問，進了這扇門，就快點進池子暖身子吧！」
  fallback:
    scene_id: altoria_bathhouse.topic_01_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「請問這座浴場有什麼規矩？」
    - kind: speech
      speaker: host
      text: 「規矩就一條，男左女右，中間一道厚實磚牆隔開，各走各的門！」
    - kind: speech
      speaker: host
      text: 「今天水氣重，我已經在門口叫回來好幾個差點走錯邊的新面孔了。門後有木格能放布鞋與外衣，可別把泥巴踩進池子裡去喔！」
- topic_id: altoria_bathhouse.topic_02
  keyword: 精靈
  label: 精靈
  fallback:
    scene_id: altoria_bathhouse.topic_02_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「聽說浴場偶爾會有精靈過來？」
    - kind: speech
      speaker: host
      text: 「精靈客人幾個月難得遇上一次，全大陸據說也就幾百位呢！看待身子的想法跟我們完全不同。」
    - kind: speech
      speaker: host
      text: 「我們平原民跟獸人脫了衣裳都要遮掩，彼此避開視線。精靈可不一樣，袒胸露體如同吹風喝水般自然，根本沒有羞恥觀念。」
    - kind: narration
      text: 伊莎貝爾放慢了說話節奏，目光饒富興味。
    - kind: speech
      speaker: host
      text: 「而且大家見了精靈，敬畏都來不及了，哪有人敢多嘴？進了水池各泡各處，相安無事就好啦！」
- topic_id: altoria_bathhouse.topic_03
  keyword: 泡湯
  label: 泡湯
  fallback:
    scene_id: altoria_bathhouse.topic_03_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「這池水泡起來感覺如何？」
    - kind: speech
      speaker: host
      text: 「水溫燒得夠熱，引的是乾淨河水。泡到額頭冒汗再爬起來，拿木桶舀水沖個涼，骨頭裡的酸痛就散了大半！」
    - kind: speech
      speaker: host
      text: 「不過可別聽信外頭的傳言，說什麼泡湯能治刀傷箭傷。真受了重傷就去找治療師施法或是買藥水，我的池子可沒有神力喔！」
- topic_id: altoria_bathhouse.topic_04
  keyword: 歇息
  label: 歇息
  fallback:
    scene_id: altoria_bathhouse.topic_04_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「泡完湯之後，這裡有地方歇會兒嗎？」
    - kind: speech
      speaker: host
      text: 「前堂擺著兩排長凳，擦乾身子坐著吹風、喝口清水很舒服。不過這邊水氣暖熱，坐久了眼皮直打架。」
    - kind: speech
      speaker: host
      text: 「真要找張舒服的床躺下睡一整夜，順著客棧巷走兩步去爐火旅店找溫弗蕾德，她那邊棉被曬得乾鬆，睡起來才踏實呢！」
