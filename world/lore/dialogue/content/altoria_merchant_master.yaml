schema_version: 1
greeting: 商會公所的尤斯汀‧柯德溫會長從稅率長桌後起身，向來客鄭重欠身：「歡迎來到商會公所。閣下想了解東市商隊、貿易路線或公所會務，本人樂意說明。只有一點先講明，公所不發放護衛委託，也不替商隊招募人手。」
topics:
- topic_id: altoria_merchant_hall.topic_01
  keyword: 商隊
  label: 商隊
  variants:
  - variant_id: morning_caravan_dispatch
    priority: 10
    when:
      kind: time_period
      start_daypart: dawn
      end_daypart: noon
    scene:
      scene_id: altoria_merchant_hall.topic_01_dawn_scene
      revision: r3
      lines:
      - kind: speech
        speaker: actor
        text: 「尤斯汀會長，這大清早公所門外車馬不停，商隊正忙著清點貨物、準備啟程嗎？」
      - kind: narration
        text: 尤斯汀‧柯德溫的目光掠過窗外晨曦下的貨運馬車，拿起粉筆，核對牆上的商隊名冊。
      - kind: speech
        speaker: host
        text: 「正是。黎明到正午，是東門商隊出城最忙的時辰，書記趕在城門大開前，一隊一隊核對貨單。公所掌的是登記與協調，替各商號排開行程，免得官道上擠成一團。」
      - kind: speech
        speaker: host
        text: 「只是公所歷來中立，既不替商隊招募同行護衛，也不為任何一批貨作保。閣下若想查本季出發的商隊字號，牆邊粉筆寫的名牌都在上頭。」
  fallback:
    scene_id: altoria_merchant_hall.topic_01_fallback_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 「尤斯汀會長，想請教本季進出王都的商隊怎麼運作，公所平時如何調度？」
    - kind: narration
      text: 尤斯汀‧柯德溫拿起粉筆，指向牆上地圖旁成排的商號名錄。
    - kind: speech
      speaker: host
      text: 「本季進出王都的各支商隊，書記都以粉筆記在地圖側旁。公所掌的是行程登錄、關稅評議與行會協調，維持貨運的秩序。」
    - kind: speech
      speaker: actor
      text: 「那若是有旅人、護衛想隨商隊同行，公所能代為安排嗎？」
    - kind: speech
      speaker: host
      text: 「不能。公所不安排旁人搭車同行，也不替任何行商擔保私運的貨。商隊與護衛之間的私下約定，一概與公所無涉，這點得先向閣下講明。」
- topic_id: altoria_merchant_hall.topic_02
  keyword: 貿易路線
  label: 貿易路線
  fallback:
    scene_id: altoria_merchant_hall.topic_02_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 「王都對外的貿易路線是怎麼分的？大宗貨物多半從哪座城門出入？」
    - kind: narration
      text: 尤斯汀‧柯德溫走到懸掛的羊皮路線圖前，指尖沿著主幹商道劃過去。
    - kind: speech
      speaker: host
      text: 「大宗貨物多半出東門，沿官道往東。東市原是傍著舊城牆長起來的貨棧街，各國的穀物、玻璃都在這裡集散，外國硬幣也由東門流進來；工匠巷鍛出來的鐵器走市場街，鍊金坊熬藥用的原料，多半從東門進城。」
    - kind: speech
      speaker: actor
      text: 「東門外官道沿線的治安與岔路，公所能給些指引嗎？」
    - kind: speech
      speaker: host
      text: 「公所只管關稅核算，還有商道通不通暢，不掌沿線防務。閣下若問城外哨所與路況，駐守城門的聖潔王都衛兵隊，比本人清楚得多。」
- topic_id: altoria_merchant_hall.topic_03
  keyword: 委託
  label: 委託
  fallback:
    scene_id: altoria_merchant_hall.topic_03_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 「都說東市商隊常遭魔獸侵擾，公所可有張貼護衛商隊、運貨的差事？」
    - kind: narration
      text: 尤斯汀‧柯德溫神情肅然，雙手交疊壓在皮面帳冊上。
    - kind: speech
      speaker: host
      text: 「公所牆上沒有告示板，門邊也沒有僱傭名冊。商隊走荒野，確實需要得力護衛，可商會至今沒有正式的護衛委託規章。本人不能讓閣下去接一件權責不清、毫無著落的差事。」
    - kind: speech
      speaker: actor
      text: 「那想靠武藝賺酬勞，接護送或討伐的活兒，該往哪兒去？」
    - kind: speech
      speaker: host
      text: 「請移步到公會前的冒險者公會大廳。那裡立有合格的任務公告板，討伐、採集、押運，每樣都有法度保障。要找活計，那兒才是正途。」
- topic_id: altoria_merchant_hall.topic_04
  keyword: 會務
  label: 會務
  fallback:
    scene_id: altoria_merchant_hall.topic_04_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 「商會公所在王都具體掌管哪些政務？行會之間的糾紛，也由公所裁決嗎？」
    - kind: narration
      text: 尤斯汀‧柯德溫撫過胸前的商會徽章，指著窗下長桌上那疊帳簿。
    - kind: speech
      speaker: host
      text: 「公所掌三項要務，協調各行會的利益、評議關稅章程，還有季末清算各家帳目。商號要申請入會，得備齊保薦人的文書，當面商議。」
    - kind: speech
      speaker: actor
      text: 「評議定案的關稅細則與章程，外來的行商也能查閱嗎？」
    - kind: speech
      speaker: host
      text: 「稅率條文都擺在窗下長桌上，白紙黑字。閣下需要，自可翻閱，當場手抄一份帶回也無妨。」
