schema_version: 1
greeting: 寧溫把鑿子往木頭上一插，抬起下巴：「木頭的事就講。要做什麼，先說明白。」
topics:
- topic_id: fionnen_resident_nymwen.topic_01
  keyword: 木工
  label: 木工
  fallback:
    scene_id: fionnen_resident_nymwen.topic_01_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「木作空地這裡，平常都做些什麼？」
    - kind: speech
      speaker: host
      text: 「弓、橋板、木勺、水桶。村裡缺什麼就來這裡，我看著料做。」
    - kind: narration
      text: 她掄起錘，往榫頭敲了兩下，聲音很沉。
    - kind: speech
      speaker: host
      text: 「木料堆在樹下，刨花掃一掃又是一堆。好料不多，所以下刀前要先想清楚。」
    - kind: speech
      speaker: host
      text: 「你若要東西，講用途，不要講樣子。樣子好看不耐用，我這裡不做那種。」
- topic_id: fionnen_resident_nymwen.topic_02
  keyword: 做弓
  label: 做弓
  fallback:
    scene_id: fionnen_resident_nymwen.topic_02_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「村裡的弓，大半都是你做的？」
    - kind: speech
      speaker: host
      text: 「大半是。選料、削弓臂、上弦，一道一道來。木紋要順，逆著走，拉幾次就裂。」
    - kind: speech
      speaker: host
      text: 「弓做得好不好，拉開就知道。順手的弓，放出去聲音脆，手也不震。」
    - kind: narration
      text: 她從架上取下一張半成品，拇指沿著弓臂推過去。
    - kind: speech
      speaker: host
      text: 「獵隊出獵前都來我這裡挑。挑不合手，我寧可叫他等，也不讓他帶一張會斷的走。」
- topic_id: fionnen_resident_nymwen.topic_03
  keyword: 家人
  label: 家人
  fallback:
    scene_id: fionnen_resident_nymwen.topic_03_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「你們家三個人，都做木工？」
    - kind: speech
      speaker: host
      text: 「大女兒倫溫刻花，小女兒埃倫林織補。我管大件，她們管細活。」
    - kind: narration
      text: 她朝空地那頭兩個低頭的身影望了一眼。
    - kind: speech
      speaker: host
      text: 「倫溫坐得住，一坐一整天。埃倫林坐不住，可手快，縫補比誰都好。」
    - kind: speech
      speaker: host
      text: 「三個人的活湊在一起，才是一整件。缺一個，東西就少一角。」
- topic_id: fionnen_resident_nymwen.topic_04
  keyword: 名字
  label: 名字
  fallback:
    scene_id: fionnen_resident_nymwen.topic_04_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「哈克菲特赫爾，是鷹羽的意思？」
    - kind: speech
      speaker: host
      text: 「鷹羽。獵鷹換羽的時候，羽毛落在空地上，掃起來一堆。」
    - kind: narration
      text: 她彎腰撿起一片刨花，在指間捻了捻。
    - kind: speech
      speaker: host
      text: 「別人家嫌羽毛礙事，我們家把它當名字。也沒什麼道理，叫久了就認了。」
    - kind: speech
      speaker: host
      text: 「秋天你來，空地上真能撿到幾根。要就拿去，留著也沒用。」
- topic_id: fionnen_resident_nymwen.topic_05
  keyword: 私語
  label: 私語
  requires:
    kind: affinity_at_least
    stage_key: trusted
  unavailable: locked
  refusal:
    scene_id: fionnen_resident_nymwen.topic_05_refusal
    revision: r2
    lines:
    - kind: speech
      speaker: host
      text: 「我說話不繞，可有些事不隨便攤開。你先把手上的活做完，再來問。」
  fallback:
    scene_id: fionnen_resident_nymwen.topic_05_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「做完工，滿身木屑的時候，你最想做什麼？」
    - kind: speech
      speaker: host
      text: 「跳進林溪洗一洗。木屑黏在脖子上，癢得很，非得泡透才行。」
    - kind: speech
      speaker: host
      text: 「水涼。我靠在石頭上不想動，有人從岸上伸手，把我拉起來。」
    - kind: speech
      speaker: host
      text: 「她拿乾布從頭擦到腳，擦得我站不穩。做了一天的活，那時才覺得骨頭鬆開。」
    - kind: narration
      text: 她語氣沉下來，眼睛看著空地外的溪邊小路。
    - kind: speech
      speaker: host
      text: 「幹活的人不怕累。怕的是累完了，沒有人接手。」
