schema_version: 1
greeting: 奎內爾停下織機，梭子還捏在手裡。「來問布，還是問織法？先說好，我講起來話長。」
topics:
- topic_id: eolas_resident_quennel.topic_01
  keyword: 織布
  label: 織布
  fallback:
    scene_id: eolas_resident_quennel.topic_01_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「谷裡的布，怎麼織得又輕又結實？」
    - kind: speech
      speaker: host
      text: 「經線拉勻，緯線壓實。手要穩，眼睛要盯著每一根線，冒出一個線頭就得拆。」
    - kind: narration
      text: 她拍了拍織機的木框，那上頭被手磨得發亮。
    - kind: speech
      speaker: host
      text: 「拆到我自己點頭，才肯往下織。布騙不了人，哪裡鬆，一眼就看出來。」
    - kind: speech
      speaker: host
      text: 「你上手摸這匹。貼在臉上也不扎，比聽我講十句都明白。」
- topic_id: eolas_resident_quennel.topic_02
  keyword: 染色
  label: 染色
  fallback:
    scene_id: eolas_resident_quennel.topic_02_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「谷裡的布，就只有白色嗎？」
    - kind: speech
      speaker: host
      text: 「白衣是底，想添點顏色，我去找泰莉斯討她燒瓷剩下的色料，能染出幾匹顏色淺的布。」
    - kind: speech
      speaker: host
      text: 「染缸小，一次只夠一匹。顏色深一點淺一點，我都記在本子上。」
    - kind: narration
      text: 她從織機旁抽出一小塊染過布頭，攤在光下。
    - kind: speech
      speaker: host
      text: 「這裡的人不靠衣裳認人。脫了都一樣，靠講話和身子認。」
- topic_id: eolas_resident_quennel.topic_03
  keyword: 家人
  label: 家人
  fallback:
    scene_id: eolas_resident_quennel.topic_03_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「這架織機，是你們家傳下來的？」
    - kind: speech
      speaker: host
      text: 「村裡最老的一架，到我手裡還在響。妮瑞爾接我的布去裁，凱勒斯管分線，三個人繞著它轉。」
    - kind: narration
      text: 她說起女兒，手裡的梭子多使了一分勁。
    - kind: speech
      speaker: host
      text: 「夜裡誰累了誰先躺，一間屋三張鋪。一家人，不必講究那些。」
    - kind: speech
      speaker: host
      text: 「線亂了喊一聲，三雙手就過來。這架機器認得我們三個人的聲音。」
- topic_id: eolas_resident_quennel.topic_04
  keyword: 名字
  label: 名字
  fallback:
    scene_id: eolas_resident_quennel.topic_04_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 「『維爾維特莉夫』這個姓，是誰取的？」
    - kind: speech
      speaker: host
      text: 「維爾維特莉夫說的是絨葉。岩屋坡那幾棵老樹，葉背有一層細絨，風一翻，整片坡泛白，跟下雪一樣。」
    - kind: narration
      text: 她瞇起眼，拇指在梭子邊上蹭了蹭，沒再說話。
    - kind: speech
      speaker: host
      text: 「取名的時候，眼前看見什麼，就取什麼。谷裡人的姓，多半就是這樣取。」
    - kind: speech
      speaker: host
      text: 「你聽多了就曉得，哪個姓住在哪片坡。」
- topic_id: eolas_resident_quennel.topic_05
  keyword: 私語
  label: 私語
  requires:
    kind: affinity_at_least
    stage_key: trusted
  unavailable: locked
  refusal:
    scene_id: eolas_resident_quennel.topic_05_refusal
    revision: r2
    lines:
    - kind: speech
      speaker: host
      text: 「有些話我織在布裡，不掛在嘴上。你多來坐幾回，等梭子認得你了，再說。」
  fallback:
    scene_id: eolas_resident_quennel.topic_05_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「織了這麼多年布，你最享受哪一刻？」
    - kind: speech
      speaker: host
      text: 「織完一匹，把布抖開，貼著臉蹭過去。那一整天的痠，全留在布面上。」
    - kind: narration
      text: 她垂下眼，指尖沿著布邊劃過去。
    - kind: speech
      speaker: host
      text: 「有時候我裹著它坐在窗邊，什麼也不做，就聽外頭風穿過屋角。」
    - kind: speech
      speaker: host
      text: 「歡喜不一定得靠誰。一塊好布貼著，比有的人還貼心。」
