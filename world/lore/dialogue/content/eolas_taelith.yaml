schema_version: 1
greeting: 泰莉斯‧恩貝爾莉夫把手上的窯灰在圍布上抹掉，從坯架邊捏起一枚剛涼下來的琉璃墜，湊到門口的光裡。「你看，這顆的顏色燒出來了喔。」她走過來，前臂還覆著一層薄灰，衣服給窯火烘得汗濕，貼在腰上，她也不在乎，只往窯邊讓了讓。「進來坐，窯邊最暖。你是來看琉璃，還是來看燈？」
topics:
- topic_id: eolas_taelith_home.topic_01
  keyword: 窯火
  label: 窯火
  fallback:
    scene_id: eolas_taelith_home.topic_01_scene
    revision: r4
    lines:
    - kind: speech
      speaker: actor
      text: 「這座窯是全村共用的嗎？平日都燒些什麼？」
    - kind: speech
      speaker: host
      text: 「共用啊，誰有坯誰來排。碗、盤、琉璃墜、燈罩，村裡要用的東西大半從這座窯出來啦。」
    - kind: speech
      speaker: host
      text: 「火不能一直猛，要看坯的厚薄。厚的多等一會，薄的快進快出，不然就裂。」
    - kind: speech
      speaker: host
      text: 「守窯的夜裡，我一身都被火烘得透紅，汗流到腰窩再往下，內衣都貼在皮肉上。可那熱從皮膚滲進骨頭，比跟人睡還暖。」
    - kind: speech
      speaker: actor
      text: 「燒窯的時候，你一直守在這裡？」
    - kind: speech
      speaker: host
      text: 「守著啊。火候跑掉一次，一整架的坯就白做，我哪敢走開。守到出窯，我才回去睡。」
- topic_id: eolas_taelith_home.topic_02
  keyword: 琉璃墜
  label: 琉璃墜
  fallback:
    scene_id: eolas_taelith_home.topic_02_scene
    revision: r4
    lines:
    - kind: speech
      speaker: actor
      text: 「你頸上那枚幽月琉璃墜是自己燒的嗎？戴著它有什麼用？」
    - kind: speech
      speaker: host
      text: 「自己燒的喔。琉璃在火裡定形，戴在身上施法，心比較定，魔力也走得穩。」
    - kind: speech
      speaker: host
      text: 「可老實講，我喜歡的是它貼在皮膚上的感覺。夏天流滿身汗，它跟著在鎖骨和乳溝間滑來滑去，有時涼，有時熱，舒服得很喔。」
    - kind: narration
      text: 她把墜子從頸間取下，放進掌心，琉璃裡的光隨手勢流動。
    - kind: speech
      speaker: actor
      text: 「所以它只讓你靜得下來，擋不了什麼？」
    - kind: speech
      speaker: host
      text: 「差不多啦。它不替我擋什麼，就是不讓我心慌。燒窯、施法，手上有一件摸慣、有點像身體溫度的東西，心就定。」
- topic_id: eolas_taelith_home.topic_03
  keyword: 魔法燈
  label: 魔法燈
  fallback:
    scene_id: eolas_taelith_home.topic_03_scene
    revision: r4
    lines:
    - kind: speech
      speaker: actor
      text: 「架上的魔法燈，燈罩是這裡燒的？拿到深林裡真的管用嗎？」
    - kind: speech
      speaker: host
      text: 「罩子由這裡吹成，玻璃薄，所以光透得遠。深林獸徑再往北走，樹密得看不見路，沒有燈就會迷路啦。」
    - kind: speech
      speaker: host
      text: 「裡頭的光由別人點，我只管外面這一層。罩子薄到能透出裡頭的火，隔著它看，那點火就在掌心上亮著。暖黃的光照在身上，我才捨得半夜起來添坯。」
    - kind: speech
      speaker: actor
      text: 「燒壞的罩子多嗎？」
    - kind: speech
      speaker: host
      text: 「多的喔。玻璃在火裡脆，一急就破。破的我不留，摔碎了再揉進新的坯裡。」
- topic_id: eolas_taelith_home.topic_04
  keyword: 收回
  label: 收回
  fallback:
    scene_id: eolas_taelith_home.topic_04_scene
    revision: r4
    lines:
    - kind: speech
      speaker: actor
      text: 「琉璃或燈用久了，能拿回來給你嗎？」
    - kind: speech
      speaker: host
      text: 「我燒的琉璃，沒有裂的都可以拿回來，我算銅幣給你。燈也一樣，罩子完好我才收。」
    - kind: speech
      speaker: host
      text: 「別處帶來的玻璃和燈我不收喔。火候不一樣，混進我的窯裡只會壞一爐。我這雙手只認自個兒窯裡燒出的東西，出窯那時還燙著手。」
    - kind: speech
      speaker: actor
      text: 「有一點小裂痕，也不能收？」
    - kind: speech
      speaker: host
      text: 「裂了就不行啦。你留著當擺設，或帶回山外。我這裡只收自己燒出來的東西。」