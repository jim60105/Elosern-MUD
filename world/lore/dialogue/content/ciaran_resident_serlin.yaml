schema_version: 1
greeting: 塞爾林蹲在磨石旁，等你走近才抬眼。她把刀橫到膝上，聲音很輕：「磨刀，還是問別的？」
topics:
- topic_id: ciaran_resident_serlin.topic_01
  keyword: 磨刀
  label: 磨刀
  fallback:
    scene_id: ciaran_resident_serlin.topic_01_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「磨刀最要緊的是什麼？」
    - kind: speech
      speaker: host
      text: 「手要穩，角度不能變。歪一下，刃就白磨了。」
    - kind: speech
      speaker: host
      text: 「我不數下數。聽聲音，從粗到細，聲音滑順了就差不多。」
    - kind: narration
      text: 她舀了點水澆在磨石上，手腕帶著刀來回，沒有一點多餘的力。
    - kind: speech
      speaker: host
      text: 「刀鈍了要磨，人也一樣。急不得，急了只磨掉一層。」
- topic_id: ciaran_resident_serlin.topic_02
  keyword: 開刃
  label: 開刃
  fallback:
    scene_id: ciaran_resident_serlin.topic_02_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「你開出來的刃，為什麼特別快？」
    - kind: speech
      speaker: host
      text: 「摸得出來。指腹滑過去，哪裡厚、哪裡脆，我都知道。」
    - kind: speech
      speaker: host
      text: 「開刃那天我從早坐到晚，誰來都不理。手一抖，整把刀就廢了。」
    - kind: narration
      text: 她把刀舉到眼前，刃上有一線光。
    - kind: speech
      speaker: host
      text: 「刀快不難，難在拿刀的人穩不穩。你坐一會就知道，這裡只有磨石的聲音。」
- topic_id: ciaran_resident_serlin.topic_03
  keyword: 家人
  label: 家人
  fallback:
    scene_id: ciaran_resident_serlin.topic_03_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「家裡人都在練刀場，你怎麼不去？」
    - kind: speech
      speaker: host
      text: 「娘和姊上場，我留在這裡。姊菲林劈得漂亮，娘布瑞米斯下手狠。」
    - kind: speech
      speaker: host
      text: 「她們練完回來，刀往我手上一放，我磨。缺我這一步，前一天練的都白費。」
    - kind: narration
      text: 她低頭看著膝上的刀，語氣沒有起伏。
    - kind: speech
      speaker: host
      text: 「晚上姊累得不肯動，我把她的刀擦乾淨放回架上。那是我說話的方式。」
- topic_id: ciaran_resident_serlin.topic_04
  keyword: 名字
  label: 名字
  fallback:
    scene_id: ciaran_resident_serlin.topic_04_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 「杜斯克瓦爾克爾，是踏著黃昏回來的意思？」
    - kind: speech
      speaker: host
      text: 「踏昏說的是黃昏。那時候我在屋裡磨刀，聽得見娘和姊的腳步從場上回來。」
    - kind: narration
      text: 她停下手，頭偏著，聽屋外的腳步。
    - kind: speech
      speaker: host
      text: 「那腳步比刀聲好認。誰走得快，誰走得累，我不用看也知道。」
    - kind: speech
      speaker: host
      text: 「你來的次數多了，我也認得出你的腳步。別刻意放輕，我聽得出來。」
- topic_id: ciaran_resident_serlin.topic_05
  keyword: 私語
  label: 私語
  requires:
    kind: affinity_at_least
    stage_key: trusted
  unavailable: locked
  refusal:
    scene_id: ciaran_resident_serlin.topic_05_refusal
    revision: r2
    lines:
    - kind: speech
      speaker: host
      text: 「我話少，不等於什麼都能問。等我把你的腳步聽熟了，再說。」
  fallback:
    scene_id: ciaran_resident_serlin.topic_05_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「你最安靜的時候，心裡在想什麼？」
    - kind: speech
      speaker: host
      text: 「想有個人不講話，從背後抱住我，下巴靠在我肩上，看我磨刀。」
    - kind: speech
      speaker: host
      text: 「兩個人的呼吸都慢下來，磨石一下一下，像把整晚都磨進去。」
    - kind: narration
      text: 她的指尖停在刃口邊，沒有再往前。
    - kind: speech
      speaker: host
      text: 「有些話比刃還薄，碰一下就斷。我只留給聽得懂的人。」
