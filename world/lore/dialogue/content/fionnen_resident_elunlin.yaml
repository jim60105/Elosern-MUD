schema_version: 1
greeting: 埃倫林從木堆後探出頭，腰間別著一圈麻繩。「你找我？我正穿繩呢。」她把繩頭咬在嘴裡，含糊地補了一句。「繩子一放就散，我得先綁好。你等我一下，我動作快。」
topics:
- topic_id: fionnen_resident_elunlin.topic_01
  keyword: 穿繩
  label: 穿繩
  fallback:
    scene_id: fionnen_resident_elunlin.topic_01_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「你腰裡那圈麻繩，是做什麼用的？」
    - kind: speech
      speaker: host
      text: 「補橋、穿繩、捆木料，走到哪用到哪。樹冠吊橋上的結，一半出自我這雙手。鬆了我就去補，閒著反而難受。」
    - kind: narration
      text: 她從木堆間鑽出來，麻繩在腰間晃。
    - kind: speech
      speaker: host
      text: 「這谷裡要打結的地方多。你哪兒見著鬆了，喊我一聲。我愛跑，跑一趟不算什麼。」
- topic_id: fionnen_resident_elunlin.topic_02
  keyword: 吊橋
  label: 吊橋
  fallback:
    scene_id: fionnen_resident_elunlin.topic_02_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 「樹冠吊橋，都是你們在補？」
    - kind: speech
      speaker: host
      text: 「繩橋歸我們補。風大的日子繩橋會晃，我常上去看，哪兒磨了、哪兒鬆了，一眼就瞧見。補好了，人走著才踏實。」
    - kind: speech
      speaker: host
      text: 「橋連著一戶一戶。我補的不只是繩子，也是谷裡的往來。這麼說好像很了不起，其實就是爬上去綁幾個結。」
- topic_id: fionnen_resident_elunlin.topic_03
  keyword: 家人
  label: 家人
  fallback:
    scene_id: fionnen_resident_elunlin.topic_03_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「你家裡，你最像誰？」
    - kind: speech
      speaker: host
      text: 「像娘，閒不住，愛動手。姊姊坐得住，拿鑿子刻花，刻一整個下午。我滿場跑，她在一旁看我，也懶得管。」
    - kind: narration
      text: 她笑得燦爛，眼裡閃著活泛的光。
    - kind: speech
      speaker: host
      text: 「一家人裡就我坐不住。你要跑腿、傳話，找我最快。我記性差，傳話得講短一點。」
- topic_id: fionnen_resident_elunlin.topic_04
  keyword: 名字
  label: 名字
  fallback:
    scene_id: fionnen_resident_elunlin.topic_04_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 「哈克菲特赫爾，是天上落下的鷹羽？」
    - kind: speech
      speaker: host
      text: 「哈克菲特赫爾說的是鷹羽。換羽的時候落在空地上，我常撿來別在腰間，風一吹，羽絨就蓬開。」
    - kind: narration
      text: 她的手往腰間一按，像那兒真別著一根。
    - kind: speech
      speaker: host
      text: 「這名字輕，我也輕。你跟著我跑，保管摔不著。我走在橋上比走在地上穩，說出來沒人信。」
- topic_id: fionnen_resident_elunlin.topic_05
  keyword: 私語
  label: 私語
  requires:
    kind: affinity_at_least
    stage_key: trusted
  unavailable: locked
  refusal:
    scene_id: fionnen_resident_elunlin.topic_05_refusal
    revision: r2
    lines:
    - kind: speech
      speaker: host
      text: 「我閒不住，可是心裡的結，只給陪我解過繩的人。你多來幾趟，先幫我遞幾回繩子。」
  fallback:
    scene_id: fionnen_resident_elunlin.topic_05_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「你最痛快的時候，是什麼樣子？」
    - kind: speech
      speaker: host
      text: 「補完一座吊橋，站在橋中央，風把橋吹得晃。有人從後面追上來，一把攬住我的腰，兩個人在半空裡搖。」
    - kind: speech
      speaker: host
      text: 「我怕摔，抱她抱得死緊，笑聲全被風吞了。我平常嘴不停，那時一句話都講不出來。」
    - kind: narration
      text: 她眼裡發亮，像又站回那座橋。
    - kind: speech
      speaker: host
      text: 「懸著的時候才曉得，抱緊了有多踏實。你哪天跟我上橋，就懂了。」
