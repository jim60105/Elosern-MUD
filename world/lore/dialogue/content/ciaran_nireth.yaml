schema_version: 1
greeting: 藥草園旁的石屋裡瀰漫著微苦回甘的草木香氣。妮瑞斯‧米斯特瓦勒將藥爐風口掩小，轉過身仔細端詳你的步態與肩背：「身上沒帶重傷吧？那就好。這爐剛熬透，強效治療藥水和魔力藥水都妥善裝好了罐，打算帶幾罐上路防身就直接跟我說喔。」
topics:
- topic_id: ciaran_nireth_home.topic_01
  keyword: 調藥
  label: 調藥
  fallback:
    scene_id: ciaran_nireth_home.topic_01_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 屋裡這些陶罐與火爐，就是你平日熬製藥水的地方嗎？
    - kind: narration
      text: 妮瑞斯‧米斯特瓦勒拿布巾按了按額角滲出的細汗，目光掃過爐台上排列整齊的藥瓶。
    - kind: speech
      speaker: host
      text: 「藥草全是我每天清晨在門前園子裡摘採，配方依循族裡長輩傳下來的火候，用慢火細煨一整天。精靈雖然天生不受瘟病侵害，但筋骨創傷與枯竭的魔力，無論哪一族遇上都是同等凶險喔。」
    - kind: speech
      speaker: actor
      text: 你在這裡常備的藥水，主要能應對哪些凶險情況？
    - kind: speech
      speaker: host
      text: 「我手邊常備的就兩種，強效治療藥水用來封口止血、續接筋骨，魔力藥水用來充盈耗竭的魔力。藥效確實穩妥，絕無半點浮誇。」
- topic_id: ciaran_nireth_home.topic_02
  keyword: 重傷
  label: 重傷
  fallback:
    scene_id: ciaran_nireth_home.topic_02_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 如果遭遇魔獸撕咬或兵刃重創，該用哪種藥劑應急？
    - kind: narration
      text: 妮瑞斯‧米斯特瓦勒從木架上取下一隻封著紅繩的陶瓶，神情十分鄭重。
    - kind: speech
      speaker: host
      text: 「那得用這罐繫著紅繩的強效治療藥水。真傷及臟腑或是筋骨斷裂，仰頭喝下一整罐，藥力才能迅速穩住生機。若是尋常擦傷蹭破皮，用井水洗淨敷點草灰就能癒合，可別隨意糟蹋藥喔。」
    - kind: speech
      speaker: actor
      text: 準備出外歷練的話，能向你換幾罐帶在身上防範萬一嗎？
    - kind: speech
      speaker: host
      text: 「要帶去防身自然可以，照定好的價目留下銅幣便成。記得收妥在腰包內層，危急關頭才拿出來救命，平時切莫貪圖省事胡亂吞服。」
- topic_id: ciaran_nireth_home.topic_03
  keyword: 魔力
  label: 魔力
  fallback:
    scene_id: ciaran_nireth_home.topic_03_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 施展法術過度而魔力枯竭時，喝你調製的藥水真能平復過來嗎？
    - kind: narration
      text: 妮瑞斯‧米斯特瓦勒指了指另一側繫著藍繩的小釉罐，語氣篤定。
    - kind: speech
      speaker: host
      text: 「藍繩這罐便是魔力藥水。施法者若感到精神疲乏、體內魔力見底，拔開木塞飲用，乾涸的魔力便能逐步回湧。我們精靈日常若是魔力損耗過劇，同樣也是靠它平復元氣。」
    - kind: speech
      speaker: actor
      text: 要熬出一爐質地純淨的魔力藥水，你在藥草園裡平日都是怎麼照應的？
    - kind: speech
      speaker: host
      text: 「清晨天未明就得去剪凝魔草的新梢，趁著晨露未散放進陶鼎。火候全靠爐膛餘燼恆溫細煨，急躁不得。只要園子裡的草苗生得旺盛，多照料幾鼎備著，總能讓需要的人取用啊。」
- topic_id: ciaran_nireth_home.topic_04
  keyword: 藥草
  label: 藥草
  fallback:
    scene_id: ciaran_nireth_home.topic_04_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 如果有旅人從外地採得奇花異草，能拿來賣給你入藥調劑嗎？
    - kind: narration
      text: 妮瑞斯‧米斯特瓦勒擺了擺沾著草汁的手掌，語氣十分堅決。
    - kind: speech
      speaker: host
      text: 「外頭送來的生草我一概不收。採摘離根隔了幾日、曬乾時沾了風塵雜氣，藥性走失便會害人。我的藥只用這片藥草園親手培植的植株，根葉底細我都摸得透徹。」
    - kind: speech
      speaker: actor
      text: 要是換去的成藥始終沒機會用上，也能完好帶回來交還給你嗎？
    - kind: speech
      speaker: host
      text: 「未曾啟封、瓶塞蠟封完好的藥罐，你原封不動帶回來，我都照數收回，銅幣也會依規矩折算退你。調出來的好藥就該留給真正遇難受傷的人，擱在箱底發霉可不行喔。」
