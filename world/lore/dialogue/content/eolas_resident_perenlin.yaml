schema_version: 1
greeting: 佩倫林把手探進池水裡，停了一下才抽回來。「水溫正好。你是來泡，還是順路問谷裡的事？」
topics:
- topic_id: eolas_resident_perenlin.topic_01
  keyword: 溫泉
  label: 溫泉
  fallback:
    scene_id: eolas_resident_perenlin.topic_01_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「這兒的池子有幾座？每一座都一樣燙嗎？」
    - kind: speech
      speaker: host
      text: 「靠石壁那口最燙，手伸進去就想縮。外頭這幾口溫些，洗頭、擦身子都剛好。」
    - kind: narration
      text: 她抬手往谷壁那頭指，水氣順著手臂往上爬。
    - kind: speech
      speaker: host
      text: 「怕燙就從最外頭那口坐起，腳先進去，等腳心熱了再往裡挪。」
    - kind: speech
      speaker: host
      text: 「泡到身子鬆了，人就愛講話。谷裡的人不避諱光著，你來幾回就習慣了。」
- topic_id: eolas_resident_perenlin.topic_02
  keyword: 谷裡
  label: 谷裡
  fallback:
    scene_id: eolas_resident_perenlin.topic_02_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「谷裡的人一天到晚都在忙什麼？」
    - kind: speech
      speaker: host
      text: 「忙三餐，忙睡覺，忙著找誰抱一抱。白天分頭忙，夜裡都到池邊來。」
    - kind: speech
      speaker: host
      text: 「水一泡，話就鬆了。誰今天跟誰好上，誰又把誰惹毛，全在池邊講開。」
    - kind: narration
      text: 她把一塊布巾搭在池邊石上，邊角垂進水裡。
    - kind: speech
      speaker: host
      text: 「這裡的人不藏這種事。你要問哪家的事，問了我就答。」
- topic_id: eolas_resident_perenlin.topic_03
  keyword: 家人
  label: 家人
  fallback:
    scene_id: eolas_resident_perenlin.topic_03_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「你一個人守著這幾座池子？」
    - kind: speech
      speaker: host
      text: 「兩個女兒跟我住。泰林手快，泉邊誰滑了，她頭一個衝過去。伊倫林愛泡最燙那口，一泡就是半天。」
    - kind: narration
      text: 提到女兒，她眼裡鬆了些，手裡的布巾絞得慢下來。
    - kind: speech
      speaker: host
      text: 「忙完一夜，三個人並排泡著，話講到沒話才回屋。」
    - kind: speech
      speaker: host
      text: 「誰怕燙、誰愛坐在淺水那階，我心裡都有數。」
- topic_id: eolas_resident_perenlin.topic_04
  keyword: 名字
  label: 名字
  fallback:
    scene_id: eolas_resident_perenlin.topic_04_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「『溫德松』這名字，是怎麼取的？」
    - kind: speech
      speaker: host
      text: 「谷裡人取名，多半看住的地方。這家守著泉，白氣從水面升起來，繞著後山那片松林打轉，就叫溫德松。」
    - kind: narration
      text: 她伸手攪了攪水面，看漣漪散到池邊。
    - kind: speech
      speaker: host
      text: 「名字會換，往後搬了家、換了人喊，也能再取。」
    - kind: speech
      speaker: host
      text: 「你喊它，它知道你在喊誰，這就夠了。」
- topic_id: eolas_resident_perenlin.topic_05
  keyword: 季節
  label: 季節
  fallback:
    scene_id: eolas_resident_perenlin.topic_05_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 「這池子到了冬天，水不會冷掉嗎？」
    - kind: speech
      speaker: host
      text: 「這池子不會冷。泉從岩縫裡出來，天一冷反而更燙，白氣整座谷都看得見。」
    - kind: speech
      speaker: host
      text: 「天冷時，人都往最裡頭那口擠。肩膀碰肩膀，誰也不嫌誰。」
    - kind: narration
      text: 她把手背貼上池邊的石頭，試了試溫度。
    - kind: speech
      speaker: host
      text: 「那種夜裡，抱著誰泡著，風再冷也咬不進來。」
- topic_id: eolas_resident_perenlin.topic_06
  keyword: 私語
  label: 私語
  requires:
    kind: affinity_at_least
    stage_key: trusted
  unavailable: locked
  refusal:
    scene_id: eolas_resident_perenlin.topic_06_refusal
    revision: r2
    lines:
    - kind: speech
      speaker: host
      text: 「這種話，我不對頭一次進門的人講。你在池邊多坐幾回，等我認得你的腳步聲，再說。」
  fallback:
    scene_id: eolas_resident_perenlin.topic_06_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「你最喜歡這兒的哪個時候？」
    - kind: speech
      speaker: host
      text: 「夜裡人都散了，只剩我一個，泡在最燙那口。水貼著全身往上推，我就整個人滑進水裡，讓熱氣揉到指尖。」
    - kind: narration
      text: 她閉了閉眼，肩膀上還留著水痕。
    - kind: speech
      speaker: host
      text: 「一個人有一個人的快活，兩個人在水裡又是另一種。」
    - kind: speech
      speaker: host
      text: 「你哪天想知道，我再從頭講給你聽。」
