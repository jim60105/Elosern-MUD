schema_version: 1
greeting: 邁特希爾正把一摞布疊得方整，抬起頭：「你稍等，我把這摞疊完。」
topics:
- topic_id: ciaran_resident_maethiel.topic_01
  keyword: 疊布
  label: 疊布
  fallback:
    scene_id: ciaran_resident_maethiel.topic_01_scene
    revision: r1
    lines:
    - kind: speech
      speaker: actor
      text: 「疊布也有講究？」
    - kind: speech
      speaker: host
      text: 「有。對角要齊，折痕要正，疊出來才挺括。一件衣裳洗得再淨，疊得亂，也糟蹋了。」
    - kind: narration
      text: 她十指翻飛，一摞布在她手下變得服帖。
    - kind: speech
      speaker: host
      text: 「布也講個體面。人也是，衣裳理順了，心也跟著齊。」
- topic_id: ciaran_resident_maethiel.topic_02
  keyword: 整潔
  label: 整潔
  fallback:
    scene_id: ciaran_resident_maethiel.topic_02_scene
    revision: r1
    lines:
    - kind: speech
      speaker: actor
      text: 「你為什麼這麼愛整潔？」
    - kind: speech
      speaker: host
      text: 「亂了我就慌。東西歸了位，我才坐得住。娘和姊姊洗衣槌衣，末了都交給我，我疊得齊，一家人才舒坦。」
    - kind: speech
      speaker: host
      text: 「谷裡人隨性，就我愛收拾。可誰的衣服破了、髒了，也頭一個來尋我。」
- topic_id: ciaran_resident_maethiel.topic_03
  keyword: 家人
  label: 家人
  fallback:
    scene_id: ciaran_resident_maethiel.topic_03_scene
    revision: r1
    lines:
    - kind: speech
      speaker: actor
      text: 「你家裡人，都聽你安排？」
    - kind: speech
      speaker: host
      text: 「也不。娘瑞爾溫管洗，姊姊科瑞爾槌衣，我疊。姊姊力氣大，常把疊好的布碰亂，我就重新疊過，嘴上唸她兩句。」
    - kind: narration
      text: 她搖搖頭，語氣裡盡是無奈的寵。
    - kind: speech
      speaker: host
      text: 「一家人，就這點小摩擦。夜裡都累了，誰也不記仇。」
- topic_id: ciaran_resident_maethiel.topic_04
  keyword: 名字
  label: 名字
  fallback:
    scene_id: ciaran_resident_maethiel.topic_04_scene
    revision: r1
    lines:
    - kind: speech
      speaker: actor
      text: 「拉文伍德，是那幾隻夜裡的鴉？」
    - kind: speech
      speaker: host
      text: 「鴉林。天黑牠們叫得準時，比誰都守時。我這人愛整點，跟牠們倒合得來。」
    - kind: narration
      text: 她側耳，像在等那聲鴉鳴。
    - kind: speech
      speaker: host
      text: 「這名字聽久了，就覺著親。你往後夜裡來，也認得那幾聲。」
- topic_id: ciaran_resident_maethiel.topic_05
  keyword: 私語
  label: 私語
  requires:
    kind: affinity_at_least
    stage_key: trusted
  unavailable: locked
  refusal:
    scene_id: ciaran_resident_maethiel.topic_05_refusal
    revision: r1
    lines:
    - kind: speech
      speaker: host
      text: 「我的心事，得等我把你當家人一般收拾妥帖，才肯放。」
  fallback:
    scene_id: ciaran_resident_maethiel.topic_05_scene
    revision: r1
    lines:
    - kind: speech
      speaker: actor
      text: 「你最想有人陪的時刻，是什麼樣？」
    - kind: speech
      speaker: host
      text: 「是把一屋子布都疊完、燈也捻暗，忽然不想睡了。想有個人從背後環住我，讓我靠著，什麼都別收拾，就那樣歪在一處，貼到天亮。」
    - kind: narration
      text: 她低頭撫平腿上最後一道折痕，聲音輕得像怕驚了夜。
    - kind: speech
      speaker: host
      text: 「我收拾了一整天，就盼著那一下，被誰抱個散亂。」