schema_version: 1
greeting: 貝瑞娜拉從瞭望枝上下來，腳一落地就抬頭看天。「風快變了，你剛才問什麼？」她把被風吹亂的頭髮往耳後一撥。「我常待在高處，下來得慢，你別急著走。」
topics:
- topic_id: fionnen_resident_berenara.topic_01
  keyword: 天象
  label: 天象
  fallback:
    scene_id: fionnen_resident_berenara.topic_01_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「你怎麼看得出風要變？我站在這兒半天，什麼也沒看出來。」
    - kind: speech
      speaker: host
      text: 「雲的厚薄、風的乾濕，都寫在樹梢上。我在高處站久了，天還沒變，身子先知道。膝蓋痠，隔天多半有雨。」
    - kind: narration
      text: 她抬手，任風從指縫間穿過。
    - kind: speech
      speaker: host
      text: 「天不騙人。你學會看，林子就不再騙你。我別的不行，看天準，村裡要曬東西都先來問我。」
- topic_id: fionnen_resident_berenara.topic_02
  keyword: 瞭望
  label: 瞭望
  fallback:
    scene_id: fionnen_resident_berenara.topic_02_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「站那麼高，你都在看什麼？」
    - kind: speech
      speaker: host
      text: 「看雲，也看獵隊。東邊那片平原的晴雨，先從這裡過。我在樹頂，林子裡有什麼動靜，我多半先看到。」
    - kind: speech
      speaker: host
      text: 「高處風大，衣裳都往後扯。站久了腳會麻，可視野開，谷裡那些事看起來都小了。我怕吵，高處清靜。」
- topic_id: fionnen_resident_berenara.topic_03
  keyword: 家人
  label: 家人
  fallback:
    scene_id: fionnen_resident_berenara.topic_03_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「你家裡人，也都上高處看天？」
    - kind: speech
      speaker: host
      text: 「女兒一個爬樹快，替我上去；一個聽風，辨林子裡的動靜。我管看，她倆管傳。」
    - kind: narration
      text: 她朝樹下那兩個身影招了招手。
    - kind: speech
      speaker: host
      text: 「一家人分一雙眼睛、兩隻耳朵。天要變，谷裡頭一個知道的就是這家，第二個是趕著收衣裳的鄰居。」
- topic_id: fionnen_resident_berenara.topic_04
  keyword: 名字
  label: 名字
  fallback:
    scene_id: fionnen_resident_berenara.topic_04_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「蒙斯哈德，是月影的意思？」
    - kind: speech
      speaker: host
      text: 「月影。夜裡月亮把影子投進林間，一塊明一塊暗。這家住在光庭邊，那影就在門前晃。」
    - kind: narration
      text: 她指著腳下那片斑駁的月光。
    - kind: speech
      speaker: host
      text: 「名跟月亮走。你夜裡來，踏著影子走，就到這家門口。白天來也行，只是影子不認路。」
- topic_id: fionnen_resident_berenara.topic_05
  keyword: 私語
  label: 私語
  requires:
    kind: affinity_at_least
    stage_key: trusted
  unavailable: locked
  refusal:
    scene_id: fionnen_resident_berenara.topic_05_refusal
    revision: r2
    lines:
    - kind: speech
      speaker: host
      text: 「我站的這個高處，只留給交得過心的人。你多來幾趟，先讓我記住你的腳步聲。」
  fallback:
    scene_id: fionnen_resident_berenara.topic_05_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「你最享受的時候，是什麼樣子？」
    - kind: speech
      speaker: host
      text: 「風大的夜晚，我把衣裳褪了，靠在高處的枝幹上，讓風從頭到腳撫過去。有人爬上來，從身後抱住我，在風裡跟我一起抖。」
    - kind: speech
      speaker: host
      text: 「那時整片林子都在晃，只有她抓得緊。我平常站得穩，那晚才知道靠著別人也可以。」
    - kind: narration
      text: 她仰起臉，像還浸在那陣風裡。
    - kind: speech
      speaker: host
      text: 「高處的情比平地烈。你站上來，就懂了。」
