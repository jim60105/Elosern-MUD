schema_version: 1
greeting: 鍛造鋪裡爐火正旺，維爾登‧黑潭手裡的鐵錘砸在砧上，火星四濺。他頭也沒抬，嗓音壓過鐵聲：「要挑哪種兵器？慣用哪隻手，直接說。」
topics:
- topic_id: altoria_forge.topic_01
  keyword: 兵器
  label: 兵器
  fallback:
    scene_id: altoria_forge.topic_01_scene
    revision: r4
    lines:
    - kind: speech
      speaker: actor
      text: 「師傅，我想挑一把防身兼出城的隨身兵刃。鋪子裡主要備了哪些傢伙？」
    - kind: narration
      text: 維爾登‧黑潭收住鐵鉗，朝石牆邊那排兵器架偏了偏下巴。
    - kind: speech
      speaker: host
      text: 「牆上掛的都能挑。近身有普通劍、鐵短刀，還有狩獵擲斧。要拉開距離，左邊掛著獵手長弓和見習術師法杖。價錢都刻在門邊木牌上，試手感握穩，別揮到爐邊的學徒。」
    - kind: speech
      speaker: actor
      text: 「這些兵刃鋼火如何？劈砍順手嗎？」
    - kind: speech
      speaker: host
      text: 「用河裡打來的水淬火，鋼質厚實，握柄裹了硬皮，出汗不打滑。每把出爐我都用拇指甲刮過刃口，再敲一下聽聲，聲音脆了才掛上牆。」
- topic_id: altoria_forge.topic_02
  keyword: 好貨
  label: 好貨
  fallback:
    scene_id: altoria_forge.topic_02_scene
    revision: r4
    lines:
    - kind: speech
      speaker: actor
      text: 「想找真正能應付大陣仗的好貨，鋪子裡有壓箱底的稱手兵器嗎？」
    - kind: narration
      text: 維爾登‧黑潭目光微凝，轉身指向爐台最深處特地架著的兩柄長刃。
    - kind: speech
      speaker: host
      text: 「好貨都在裡頭。最裡面那把是騎士制式長劍，校場訂的配劍全出自這座爐子，鋼胚摺疊鍛打了千百遍。這把劍專供見習騎士出陣佩帶。」
    - kind: speech
      speaker: actor
      text: 「旁邊那把泛著火光的長劍呢？看起來很不尋常。」
    - kind: speech
      speaker: host
      text: 「魔導長劍，劍身注過城裡附魔師的元素精萃。刃能引魔力，劈斬帶火。要價不低，腰包夠鼓再來摸它。手上的本事還沒練到家，握著也是糟蹋好鐵。」
- topic_id: altoria_forge.topic_03
  keyword: 賣鐵
  label: 賣鐵
  fallback:
    scene_id: altoria_forge.topic_03_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 「冒險途中換下舊刀劍，你這裡收嗎？想折點盤纏。」
    - kind: narration
      text: 維爾登‧黑潭拿粗棉布擦手套上的煤灰，目光落在客人腰間的舊兵刃上。
    - kind: speech
      speaker: host
      text: 「牆上有掛的這幾種，我都收。劍身沒斷、刀柄沒散、刃口沒磨損過半，按成色折現錢。收回來的舊鐵熔回爐裡，照樣打出好鋼。」
    - kind: speech
      speaker: actor
      text: 「那在迷宮坑道裡挖到粗鐵礦、碎鐵，也能賣給你嗎？」
    - kind: speech
      speaker: host
      text: 「原礦別往這兒送，我這兒只收打好的兵器。要賣粗鐵礦，出巷子順著市場街走，雜貨店的瑪爾特店裡有桿黃銅秤，找他按斤兩過磅最合適。」
- topic_id: altoria_forge.topic_04
  keyword: 保養
  label: 保養
  variants:
  - variant_id: swordsman_advice
    priority: 10
    when:
      kind: skill_owned
      skill_key: basic_swordplay
      min_proficiency: 1
    scene:
      scene_id: altoria_forge.topic_04_swordsman_scene
      revision: r3
      lines:
      - kind: speech
        speaker: actor
        text: 「我剛開始研習劍術，常覺得刃口磨損得快。想跟師傅請教，長劍平日該怎麼養護？」
      - kind: narration
        text: 維爾登‧黑潭看過對方下盤，又掃過握劍那隻手上的厚繭，剛硬的嘴角鬆了些。
      - kind: speech
        speaker: host
        text: 「站得穩，握劍的手也紮實。每天收劍入鞘前，先用乾布抹淨血污和汗漬，再薄擦一層動物油，別讓鏽咬進鋼裡。」
      - kind: speech
        speaker: host
        text: 「隨身揣塊細磨石，刃口剛捲就要推回原位，別拿好劍硬劈硬石。劍脊要是震出裂痕，別捨不得，換一把；接回來的劍，拼命的時候會要你的命。」
  fallback:
    scene_id: altoria_forge.topic_04_fallback_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 「買了這柄兵器回去，平日該怎麼照料，才能經久耐用？」
    - kind: narration
      text: 維爾登‧黑潭一錘砸在紅透的鐵坯上，頭也沒抬，聲音壓過爐火的轟響。
    - kind: speech
      speaker: host
      text: 「隨身備粗細兩面磨石。刃口鈍了順著原先的刃線推磨，少拿劍鋒當撬棍。回鞘前擦乾水分，抹一層薄油防鏽。」
    - kind: speech
      speaker: host
      text: 「兵刃真折斷了，就丟掉，另買一把，別花錢熔接。接回來的斷劍結構已經鬆了，關鍵時候最先崩斷。照這幾句善待你的傢伙，它才保得住你的命。」
