schema_version: 1
greeting: 鍛造鋪裡爐火正旺，維爾登‧黑潭手裡的鐵錘敲在砧上，火星四濺。他頭也沒抬，嗓音混著鐵聲：「打算挑哪種兵器？平常用哪隻手揮刃？直接說吧。」
topics:
- topic_id: altoria_forge.topic_01
  keyword: 兵器
  label: 兵器
  fallback:
    scene_id: altoria_forge.topic_01_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 師傅，我想挑一把防身兼出城作戰的隨身兵刃。鋪子裡主要備了哪些傢伙？
    - kind: narration
      text: 維爾登‧黑潭收起手中的鐵鉗，朝石牆邊那排擺得整齊的兵器架偏了偏下巴。
    - kind: speech
      speaker: host
      text: 「牆上掛著的都可以挑。近身用的普通劍、鐵短刀，還有沉鐵打的狩獵擲斧，分量足又好上手。習慣使長距離傢伙的話，左邊掛著獵手長弓與見習術師法杖。價錢都刻在門邊木牌上，試手感時握穩點，可別揮到爐邊的學徒。」
    - kind: speech
      speaker: actor
      text: 這些兵刃鋼火如何？劈砍時順手嗎？
    - kind: speech
      speaker: host
      text: 「這批兵刃全用河裡打來的水淬火，鋼質厚實，握柄裹了硬皮，出汗也不打滑。每一把出爐前我都用拇指甲刮過刃口，再用指節敲一下，聽聲音清脆才掛上牆。這把劍只要握在你手裡，就絕不會平白誤事。」
- topic_id: altoria_forge.topic_02
  keyword: 好貨
  label: 好貨
  fallback:
    scene_id: altoria_forge.topic_02_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 如果想找真正能應付大陣仗的好貨，鋪子裡有壓箱底的稱手兵器嗎？
    - kind: narration
      text: 維爾登‧黑潭目光微凝，轉身指向爐台最深處特地架著的兩柄長刃。
    - kind: speech
      speaker: host
      text: 「真正的好貨都在裡頭。最裡面那把是騎士制式長劍，校場向我訂的配劍全出自這座爐子。鋼胚經過千百遍折疊鍛打，韌性最佳，專供王都騎士團的見習騎士出陣佩帶。」
    - kind: speech
      speaker: actor
      text: 旁邊那把泛著火光的長劍呢？看起來很不尋常。
    - kind: speech
      speaker: host
      text: 「那是魔導長劍，請城裡的附魔師親手刻上元素火紋。刃身能引導魔力，劈斬時帶著火焰，但這種劍要價不低。腰包夠鼓再來摸它，手上的本事還沒練到家的人握著也是糟蹋好鐵。」
- topic_id: altoria_forge.topic_03
  keyword: 賣鐵
  label: 賣鐵
  fallback:
    scene_id: altoria_forge.topic_03_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 冒險途中如果換下了舊的刀劍與兵器，你這裡收購嗎？我想折點盤纏。
    - kind: narration
      text: 維爾登‧黑潭拿粗棉布擦拭手套上的煤灰，目光落在客人腰間的舊兵刃上。
    - kind: speech
      speaker: host
      text: 「只要是牆上有掛的這幾種兵器，我都收。劍身沒斷、刀柄沒散、刃口沒磨損過半，拿回來我都按成色折算現錢給你。收回來的舊鐵重新熔進爐裡，照樣能打出好鋼。」
    - kind: speech
      speaker: actor
      text: 那要是在迷宮坑道裡挖到了粗鐵礦或碎鐵，也能直接賣給你嗎？
    - kind: speech
      speaker: host
      text: 「未經精煉的粗鐵礦別往我這兒送，我這兒只收打好的兵器。要賣原礦，出巷子順著市場街走，雜貨店的瑪爾特店裡有杆黃銅秤，找他按斤兩過磅最合適。」
- topic_id: altoria_forge.topic_04
  keyword: 保養
  label: 保養
  variants:
  - variant_id: swordsman_advice
    priority: 10
    when:
      kind: skill_owned
      skill_key: basic_swordplay
      min_proficiency: 1
    scene:
      scene_id: altoria_forge.topic_04_swordsman_scene
      revision: r2
      lines:
      - kind: speech
        speaker: actor
        text: 我剛開始專心研習劍術，常覺得刃口磨損得快。想向師傅請教，長劍平日該如何養護？
      - kind: narration
        text: 維爾登‧黑潭看過對方的步法，目光又掃過握劍那隻手上的厚繭，剛硬的嘴角鬆了些。
      - kind: speech
        speaker: host
        text: 「身形站得穩當，握劍的手勢也算紮實。每天收劍入鞘前，第一要緊的事是用乾布抹淨血污與汗漬，再拿動物油薄擦一層，別讓鏽斑咬進鋼裡。」
      - kind: speech
        speaker: host
        text: 「隨身揣一塊細磨石，刃口剛捲起來就要推回原位，千萬別拿好劍硬去劈砍硬石。要是劍脊被震出裂痕，別捨不得，馬上換一把；接回來的劍在真正拼命的時候隨時會要了你的命。」
  fallback:
    scene_id: altoria_forge.topic_04_fallback_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 買了這柄兵器回去，平日該怎麼照料才能讓它經久耐用？
    - kind: narration
      text: 維爾登‧黑潭一錘砸在紅透的鐵坯上，頭也沒抬，聲音低沉，壓過爐火的轟響。
    - kind: speech
      speaker: host
      text: 「隨身備妥粗細兩面磨石。刃口鈍了就順著原先的刃線推磨，少拿劍鋒當撬棍胡亂撬動。每次回鞘前務必擦乾水分，抹上一層薄油防生鏽。」
    - kind: speech
      speaker: host
      text: 「萬一兵刃真的折斷，當場丟掉換一把新品，別想著花錢熔接。接回來的斷劍結構已經鬆了，關鍵時候最先崩斷。照這幾句善待你的傢伙，它才能保住你的性命。」
