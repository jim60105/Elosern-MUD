schema_version: 1
greeting: 倫溫沒抬頭，刻刀在木頭上走完一小段才停：「等我收這刀。你說，我聽得見。」
topics:
- topic_id: fionnen_resident_lumwyn.topic_01
  keyword: 刻花
  label: 刻花
  fallback:
    scene_id: fionnen_resident_lumwyn.topic_01_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 「這些木器上的花，都是你一個人刻的？」
    - kind: speech
      speaker: host
      text: 「多半出自我的刀。順著木紋走，刀才不會咬住。刻壞一處，整塊料就廢了，所以我下刀前先看很久。」
    - kind: narration
      text: 她吹開木屑，剛成形的花瓣露出來，邊緣還帶著細毛。
    - kind: speech
      speaker: host
      text: 「花本來就在木頭裡。我只是把多出來的地方削掉。」
    - kind: speech
      speaker: host
      text: 「你摸這裡。花瓣的邊要薄，底下要留肉，不然一碰就斷。」
- topic_id: fionnen_resident_lumwyn.topic_02
  keyword: 手藝
  label: 手藝
  fallback:
    scene_id: fionnen_resident_lumwyn.topic_02_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 「刻花的刀法，是你娘教的嗎？」
    - kind: speech
      speaker: host
      text: 「娘教我握刀。她做弓，握刀和握刨子的道理差不多。刻花是我自己摸索出來。」
    - kind: speech
      speaker: host
      text: 「一開始刻壞一堆木片，娘沒罵，只把壞的拿去當柴燒。燒完了，我再刻下一塊。」
    - kind: narration
      text: 她把刻刀在指間轉了半圈，刀尖停在木頭上。
    - kind: speech
      speaker: host
      text: 「這刀法急不來。坐一整天，可能只成一朵。可那朵留下來，就是留下來了。」
- topic_id: fionnen_resident_lumwyn.topic_03
  keyword: 家人
  label: 家人
  fallback:
    scene_id: fionnen_resident_lumwyn.topic_03_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「你們家三個人，就你坐得住？」
    - kind: speech
      speaker: host
      text: 「娘揮錘，妹妹滿場跑。我坐在這裡，一鑿一鑿，坐到天黑也沒覺得久。」
    - kind: narration
      text: 她低頭笑了一下，笑紋很淺。
    - kind: speech
      speaker: host
      text: 「妹妹埃倫林會把我刻好的花拿去串。她串得亂，我也不管。花刻出來本來就要給人用。」
    - kind: speech
      speaker: host
      text: 「我們家的人講話都直。只有我話少，她們也習慣了。」
- topic_id: fionnen_resident_lumwyn.topic_04
  keyword: 名字
  label: 名字
  fallback:
    scene_id: fionnen_resident_lumwyn.topic_04_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 「哈克菲特赫爾，是鷹羽的意思嗎？」
    - kind: speech
      speaker: host
      text: 「哈克菲特赫爾說的是鷹羽。獵鷹換羽的時候，羽毛會落在空地上，掃起來一堆，風一吹就跑。」
    - kind: narration
      text: 她從木料堆邊拈起一根羽毛，湊到眼前。
    - kind: speech
      speaker: host
      text: 「羽毛的紋路和木紋一樣，都是一條一條順著長。只是羽毛輕，木頭沉。」
    - kind: speech
      speaker: host
      text: 「我留了幾根在架上。刻累的時候看一眼，手就會穩下來。」
- topic_id: fionnen_resident_lumwyn.topic_05
  keyword: 私語
  label: 私語
  requires:
    kind: affinity_at_least
    stage_key: trusted
  unavailable: locked
  refusal:
    scene_id: fionnen_resident_lumwyn.topic_05_refusal
    revision: r2
    lines:
    - kind: speech
      speaker: host
      text: 「我心裡的事刻得很深。要挖給人看，得先確定那個人坐得住。」
  fallback:
    scene_id: fionnen_resident_lumwyn.topic_05_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 「你一個人刻一整天，會不會想要有人陪？」
    - kind: speech
      speaker: host
      text: 「想啊，可有人的時候，我反而刻不好。得是不說話的那種陪。」
    - kind: speech
      speaker: host
      text: 「她坐在對面，看我把一朵花刻完。不催，也不問還有多久。最後一刀落下，她伸手把我手腕上的木屑拂掉。」
    - kind: narration
      text: 她的聲音低下去，指尖停在半空。
    - kind: speech
      speaker: host
      text: 「那一下比什麼都近。我這雙手整天握刀，只有那時手裡什麼都沒握。」
