schema_version: 1
greeting: 維拉拉蹲在溪邊，把一件白衣在水裡抖開，回頭笑。「喲，來啦。洗衣，還是陪我聊兩句？水還涼著呢。」
topics:
- topic_id: eolas_resident_vaelara.topic_01
  keyword: 洗衣
  label: 洗衣
  fallback:
    scene_id: eolas_resident_vaelara.topic_01_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「這衣裳在水裡搓一搓，怎麼就白成這樣？」
    - kind: speech
      speaker: host
      text: 「水涼，手勁勻，先泡軟再搓。急著用力，布面就起毛。」
    - kind: narration
      text: 她把漂遠的衣角撈回來，水花濺到下巴。
    - kind: speech
      speaker: host
      text: 「溪水一直在流，一路帶走。汗味和心事，都被它沖下去。」
    - kind: speech
      speaker: host
      text: 「手泡涼了，人也靜了。你有衣裳要洗，扔過來，我順手搓兩把。」
- topic_id: eolas_resident_vaelara.topic_02
  keyword: 溪邊
  label: 溪邊
  fallback:
    scene_id: eolas_resident_vaelara.topic_02_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 「溪邊白天都這麼多人嗎？」
    - kind: speech
      speaker: host
      text: 「白天人多。挑水的人、洗衣的人，都擠在這一段。日頭偏西就散了，剩幾個貪涼的脫乾淨往水裡躺。」
    - kind: speech
      speaker: host
      text: 「我也不例外。水托著身子，比床還舒服。」
    - kind: narration
      text: 她撩起一捧水，往自己小腿上澆。
    - kind: speech
      speaker: host
      text: 「這兒沒牆沒門，皮碰皮都平常。你別扭捏，扭捏了反倒好笑。」
- topic_id: eolas_resident_vaelara.topic_03
  keyword: 家人
  label: 家人
  fallback:
    scene_id: eolas_resident_vaelara.topic_03_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「你一個人洗這麼多衣裳？」
    - kind: speech
      speaker: host
      text: 「娘約洛溫挑水，姊姊阿拉妮斯看水槽。我管洗。三個人在溪邊各佔一段，喊一聲都聽得見。」
    - kind: narration
      text: 她捋了捋濕髮，露出半邊肩。
    - kind: speech
      speaker: host
      text: 「悶了我就唱歌。姊姊在岸上跟著哼，哼到跑調也不停。」
    - kind: speech
      speaker: host
      text: 「你哪天聽見歌聲，順著溪走，就是我。」
- topic_id: eolas_resident_vaelara.topic_04
  keyword: 名字
  label: 名字
  fallback:
    scene_id: eolas_resident_vaelara.topic_04_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 「你們家的姓，是清水的意思吧？」
    - kind: speech
      speaker: host
      text: 「我們家的姓說的是清水。水清得見底，石子數得出來。」
    - kind: narration
      text: 她說著，真把腳踩進溪裡，腳趾在石頭上動了動。
    - kind: speech
      speaker: host
      text: 「我愛光腳下去。涼從腳心往上爬，癢得人想笑。」
    - kind: speech
      speaker: host
      text: 「洗好的布晾在繩上，風一吹就鼓起來。整條溪都是我們家的味道。」
- topic_id: eolas_resident_vaelara.topic_05
  keyword: 私語
  label: 私語
  requires:
    kind: affinity_at_least
    stage_key: trusted
  unavailable: locked
  refusal:
    scene_id: eolas_resident_vaelara.topic_05_refusal
    revision: r2
    lines:
    - kind: speech
      speaker: host
      text: 「我話多，可心裡那口井，只給走得近的人舀。你再來幾趟。」
  fallback:
    scene_id: eolas_resident_vaelara.topic_05_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 「你有沒有哪天，特別想被人抱住？」
    - kind: speech
      speaker: host
      text: 「溪水漲到腰那天，我就想有個人從後面攬住我，兩個人一起在水裡晃。」
    - kind: narration
      text: 她臉頰紅了，笑起來卻一點也不躲。
    - kind: speech
      speaker: host
      text: 「水替兩個人托著，誰都不用出力，貼著就行。」
    - kind: speech
      speaker: host
      text: 「浸在水裡的滋味最軟。你哪天也脫了衣裳下來，試一回就曉得。」
