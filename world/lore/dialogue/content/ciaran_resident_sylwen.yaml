schema_version: 1
greeting: 希爾溫正把一碗剛熬好的湯放涼，抬起頭：「你嚐嚐，還是先問事？」
topics:
- topic_id: ciaran_resident_sylwen.topic_01
  keyword: 熬藥
  label: 熬藥
  fallback:
    scene_id: ciaran_resident_sylwen.topic_01_scene
    revision: r1
    lines:
    - kind: speech
      speaker: actor
      text: 「熬藥時，你怎麼知道火候到了？」
    - kind: speech
      speaker: host
      text: 「看氣。氣由白轉清，苦味裡透出香，就成了。我守著壺，寸步不離，像守一個要醒的人。」
    - kind: narration
      text: 她舀起一勺，湊近嘴邊吹了吹。
    - kind: speech
      speaker: host
      text: 「藥性最怕急。火一急，它就破了。你喝一碗我熬的湯，就懂這份慢。」
- topic_id: ciaran_resident_sylwen.topic_02
  keyword: 香草
  label: 香草
  fallback:
    scene_id: ciaran_resident_sylwen.topic_02_scene
    revision: r1
    lines:
    - kind: speech
      speaker: actor
      text: 「你這屋裡，是什麼香？」
    - kind: speech
      speaker: host
      text: 「幾味安神的草，加上姊姊夜裡採回的那種。混在一塊，聞久了就犯睏。」
    - kind: speech
      speaker: host
      text: 「谷裡有人夜裡睡不著，就來討一小把，點在榻邊。也有拿它助興，睡前煎一碗，身子放鬆，好說話。」
- topic_id: ciaran_resident_sylwen.topic_03
  keyword: 家人
  label: 家人
  fallback:
    scene_id: ciaran_resident_sylwen.topic_03_scene
    revision: r1
    lines:
    - kind: speech
      speaker: actor
      text: 「這園子裡，就你們仨忙活？」
    - kind: speech
      speaker: host
      text: 「就仨。娘種草，姊姊夜採，我熬。天不亮我生火，鍋裡的水開了，姊姊正好踏進門。」
    - kind: narration
      text: 她朝門外望了望，像是在等那個身影。
    - kind: speech
      speaker: host
      text: 「一家人話不多，可誰都不孤。夜裡我熬藥，姊姊在園子裡，娘在屋角配。各忙各活，心在一處。」
- topic_id: ciaran_resident_sylwen.topic_04
  keyword: 名字
  label: 名字
  fallback:
    scene_id: ciaran_resident_sylwen.topic_04_scene
    revision: r1
    lines:
    - kind: speech
      speaker: actor
      text: 「索爾恩伍德，就是那圈帶刺的老木？」
    - kind: speech
      speaker: host
      text: 「是。棘木圈著園子，開春會結小紅果，帶苦味。它擋獸，也擋那些亂踩進來的人。」
    - kind: narration
      text: 她抿了一口湯，慢慢嚥下。
    - kind: speech
      speaker: host
      text: 「我喜歡這姓。它讓我想起，再軟的草，也要一圈硬刺護著。」
- topic_id: ciaran_resident_sylwen.topic_05
  keyword: 私語
  label: 私語
  requires:
    kind: affinity_at_least
    stage_key: trusted
  unavailable: locked
  refusal:
    scene_id: ciaran_resident_sylwen.topic_05_refusal
    revision: r1
    lines:
    - kind: speech
      speaker: host
      text: 「我的心事，得等你喝慣了我這鍋湯，才肯端出來。」
  fallback:
    scene_id: ciaran_resident_sylwen.topic_05_scene
    revision: r1
    lines:
    - kind: speech
      speaker: actor
      text: 「你熬了這麼多藥，最想給誰喝？」
    - kind: speech
      speaker: host
      text: 「給一個我中意的人。煎一碗最烈的催情草，看那人的臉一點點紅起來，呼吸變沉。然後我餵她一口，自己也吞半碗，兩個人一齊燒。」
    - kind: narration
      text: 她說得柔，眼裡的溫度卻燙人。
    - kind: speech
      speaker: host
      text: 「藥能點火，也能暖人。等你哪天身子涼了，來找我，我替你溫一壺。」