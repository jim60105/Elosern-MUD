schema_version: 1
greeting: 櫃檯後頭，分會會長葛里安‧衛登正對著一本攤開的厚皮名冊核對單據。聽見腳步聲，他把羽毛筆往旁邊一擱，抬眼看來：「歡迎來到冒險者公會阿爾托利亞分會。是頭一回來王都辦理登記，還是要交接手頭上的委託？還沒登記入冊的話，先在名冊寫下名字，從 F 級踏實起步；要是剛辦完差事，拿著委託單過來，報上編號讓我查對。」
services:
- key: guild_report_dialogue
  topic_id: guild_staff.topic_04
  label: 交談回報委託
topics:
- topic_id: guild_staff.topic_01
  keyword: 註冊
  label: 註冊
  fallback:
    scene_id: guild_staff.topic_01_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 想請問一下，加入公會該怎麼辦理？登記之後就能接取各地的委託嗎？
    - kind: narration
      text: 葛里安翻開名冊全新的空白一頁，取過墨水瓶，把羽毛筆端正遞向櫃檯外。
    - kind: speech
      speaker: host
      text: 「手續並不繁複。在這本名冊寫下你的名字，公會便正式承認你的冒險者身分，替你建立第一筆履歷。」
    - kind: speech
      speaker: actor
      text: 登記之後的階級怎麼算？需要先繳納會費或通過比試嗎？
    - kind: speech
      speaker: host
      text: 「初來乍到不收分文會費，每個人都從 F 級起步。採集藥草或是隨隊護衛商隊，這些差事最適合新人磨練腳力。只要手腳勤快，名冊上記下的每一件功績，公會都負責到底。」
- topic_id: guild_staff.topic_02
  keyword: 任務
  label: 任務
  fallback:
    scene_id: guild_staff.topic_02_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 我想了解看板上的委託該如何接取。挑選工作時有什麼要注意的規矩？
    - kind: narration
      text: 葛里安伸手指了指大廳正中央那面釘滿羊皮紙單據的厚木看板，神情格外嚴肅。
    - kind: speech
      speaker: host
      text: 「委託單都釘在大廳看板上，每張單子都寫明了指定階級、目標地點與撥發報酬。挑一張合你當前階級的揭下來拿到櫃檯，我蓋印登載進名冊，這份委託才算你正式承接。」
    - kind: speech
      speaker: actor
      text: 要是走到半路遇上意外，發現委託超乎預期辦不下去，會受處罰嗎？
    - kind: speech
      speaker: host
      text: 「年輕人別把面子看得比性命還重。中途若是遇險辦不下去，把單子完好交還櫃檯便可，公會自會派人接手。寧可回頭換張簡單的差事，也別在荒野硬撐送命。」
- topic_id: guild_staff.topic_03
  keyword: 公會
  label: 公會
  variants:
  - variant_id: senior_standing
    priority: 10
    when:
      kind: guild_rank_at_least
      rank_key: E
    scene:
      scene_id: guild_staff.topic_03_senior
      revision: r2
      lines:
      - kind: speech
        speaker: actor
        text: 能跟我談談公會的體制與各地的運作嗎？晉升之後在各國走動會有什麼不同？
      - kind: narration
        text: 葛里安看著你胸前配戴的公會徽章，微微頷首，神情比起面對生面孔時溫和了幾分。
      - kind: speech
        speaker: host
        text: 「你通過考核脫離底層的新人階級，名冊上已經留有你的實績。冒險者公會是跨國中立組織，總部設在格蘭迪亞帝都，人類兩國與瓦爾哈拉獸王國共同承認公會的執照與權限。」
      - kind: speech
        speaker: host
        text: 「此處阿爾托利亞分會專責審核西部丘陵各處委託，並主持晉升考核。升階考核由住在公會前的資深冒險者主持，只要實績足夠，考核的大門隨時為你敞開。」
      - kind: speech
        speaker: host
        text: 「無論走到帝都還是獸王國城邑，憑著名冊上的名號，各大分會都會為你提供食宿指引與任務結算。踏實接案，名冊不會辜負任何一位可靠的戰士。」
  fallback:
    scene_id: guild_staff.topic_03_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 能跟我說說這座公會的背景嗎？為什麼在各國都能看到分會的招牌？
    - kind: narration
      text: 葛里安扶正制服胸前刻著紋章的銅徽，端正肩背，語調平穩而嚴謹。
    - kind: speech
      speaker: host
      text: 「冒險者公會是跨國中立組織，總部設在格蘭迪亞帝都，全大陸各大市鎮共有兩百餘處分會。三國共同承認公會的公正身分，公會負責登記名冊、發放結算委託，並主持考核。」
    - kind: speech
      speaker: actor
      text: 那王國的貴族或官員找上門來，公會也會照樣受理委託嗎？
    - kind: speech
      speaker: host
      text: 「不論是領地貴族開出的重賞，還是農家湊出的幾枚銅幣，送到櫃檯前全都照規矩排隊。公會只認名冊上寫下的事，只要站在這張櫃檯前，所有委託一律公正登載。」
- topic_id: guild_staff.topic_04
  keyword: 回報
  label: 回報
  fallback:
    scene_id: guild_staff.topic_04_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 關於完成委託後的結算與回報流程，能向你請教具體該帶哪些憑證嗎？
    - kind: narration
      text: 葛里安用食指輕敲厚重名冊的邊角，目光銳利而沉穩。
    - kind: speech
      speaker: host
      text: 「交付委託必須按部就班。名冊上還沒有名字的人，櫃檯無法受理結算；你得先辦妥登記，手頭上的事才算數。」
    - kind: speech
      speaker: actor
      text: 如果已經正式接案並辦妥委託，回來後該如何向櫃檯交付？
    - kind: speech
      speaker: host
      text: 「辦完差事回到這裡，向我報出委託單的編號，並遞交討伐信物或採集素材。我核對憑證蓋印註銷之後，銅幣便當面如數點清。帶著實據前來，公會絕不會少算你一分功勞。」
