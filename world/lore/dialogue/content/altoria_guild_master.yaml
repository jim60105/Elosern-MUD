schema_version: 1
greeting: 櫃檯後頭，葛里安‧衛登伏在名冊上核對一疊委託單，屋頂的雨聲壓著大廳裡的人聲。聽見腳步，那把羽毛筆擱回筆架，人抬起頭來：「歡迎，這裡是冒險者公會阿爾托利亞分會。還沒登記的人，先把名字寫進本名冊，公會從 F 級為你起算。已經登記的人，看板上的委託自己挑，辦完拿著單據回來回報。今天要辦哪一件？」
services:
- key: guild_report_dialogue
  topic_id: guild_staff.topic_04
  label: 交談回報委託
topics:
- topic_id: guild_staff.topic_01
  keyword: 註冊
  label: 註冊
  fallback:
    scene_id: guild_staff.topic_01_scene
    revision: r4
    lines:
    - kind: speech
      speaker: actor
      text: 「我想問加入公會的手續。名字寫進名冊以後，就能接看板上的委託了嗎？」
    - kind: narration
      text: 葛里安把名冊翻到一張空白頁，墨水瓶和削尖的羽毛筆挪到檯邊。
    - kind: speech
      speaker: host
      text: 「先寫名字。我核對過，替你開第一筆紀錄，再把見習徽記發到你手上。有了那枚徽記，你才算公會的人，才有資格站到看板前面。」
    - kind: speech
      speaker: actor
      text: 「登記要繳費嗎？還是得先通過什麼比試？我這樣的新手會從哪一級開始？」
    - kind: speech
      speaker: host
      text: 「登記不收費，也不用比試。每個人一律從 F 級起步，這是公會的規矩，我沒有權力替你跳過。採集藥草、跟著商隊護送，這些差事最適合新人磨手腳。」
    - kind: speech
      speaker: host
      text: 「往後每完成一件委託，我都會逐筆寫進名冊。公會只認名冊上寫下的事，嘴上說的不算。」
    - kind: speech
      speaker: host
      text: 「我在這張櫃檯後面寫過的名字，比這座大廳坐得下的人還多。哪個名字辦過什麼，我都記得住。」
- topic_id: guild_staff.topic_02
  keyword: 任務
  label: 任務
  fallback:
    scene_id: guild_staff.topic_02_scene
    revision: r5
    lines:
    - kind: speech
      speaker: actor
      text: 「我想接委託。看板上的單據怎麼挑，有什麼規矩？」
    - kind: narration
      text: 葛里安朝大廳中央釘滿羊皮紙的大任務板抬了抬下巴，神情收緊。
    - kind: speech
      speaker: host
      text: 「看板上每一張都經過我這關。委託人送進櫃檯，我核過內容，才釘上去。上面寫明指定階級、去處和報酬，你先看自己的階級能不能接。」
    - kind: speech
      speaker: host
      text: 「挑定一張，揭下來拿到櫃檯。我核對、蓋印、登進名冊，這張委託才正式落到你手上。沒蓋印的單子，不算數。」
    - kind: speech
      speaker: actor
      text: 「要是走到半路才發現太難，辦不下去，交回來會受罰嗎？」
    - kind: speech
      speaker: host
      text: 「不會。把單據完好交回櫃檯，我另外派人接手。寧可回頭換張簡單的差事，也別在荒野硬撐。」
    - kind: speech
      speaker: host
      text: 「我年輕時護送商隊，看過不肯回頭的人沒能回來。面子換不回命，這句話我說了二十年，還是要說。」
- topic_id: guild_staff.topic_03
  keyword: 公會
  label: 公會
  variants:
  - variant_id: senior_standing
    priority: 10
    when:
      kind: guild_rank_at_least
      rank_key: E
    scene:
      scene_id: guild_staff.topic_03_senior
      revision: r4
      lines:
      - kind: speech
        speaker: actor
        text: 「能跟我說說公會在各國怎麼運作嗎？我升上去以後，到別的城市會有什麼不同？」
      - kind: narration
        text: 葛里安的目光在對方胸前的公會徽記上停了一下，神色比面對生面孔時鬆了些。
      - kind: speech
        speaker: host
        text: 「你已經不是最底層的新人，名冊上有你的實績。公會是跨國的中立組織，總部設在格蘭迪亞帝都，人類兩國和瓦爾哈拉獸王國都承認公會的登記。走到哪座城，你的名字都算數。」
      - kind: speech
        speaker: host
        text: 「我們這個分會管西部丘陵一帶的委託，也辦晉升考核。考核由長住在公會前的資深冒險者主持。E 到 B 是霍克‧赤刃，A 是卡珊卓‧銀輝，S 是奧古斯丁‧無名。實績夠了，考核的門就替你開。」
      - kind: speech
        speaker: host
        text: 「憑名冊上的紀錄，各分會的櫃檯都查得到你接過什麼、辦完什麼。換一座城，不必從頭證明自己。這種事，我向來記得住。」
  fallback:
    scene_id: guild_staff.topic_03_scene
    revision: r4
    lines:
    - kind: speech
      speaker: actor
      text: 「能跟我說說這座公會的來歷嗎？為什麼各國都看得到分會的招牌？」
    - kind: narration
      text: 葛里安把胸前刻著公會紋章的銅徽扶正，肩背挺直。
    - kind: speech
      speaker: host
      text: 「冒險者公會是跨國的中立組織，總部設在格蘭迪亞帝都，全大陸大小城鎮加起來兩百多個分會。人類兩國和瓦爾哈拉獸王國共同承認公會，名冊歸公會自己管，不屬於任何一國。」
    - kind: speech
      speaker: actor
      text: 「那貴族或官員送來的委託，公會也照樣收嗎？」
    - kind: speech
      speaker: host
      text: 「照樣收。領地貴族出手重，農家湊出來的幾枚銅幣輕，送到櫃檯前面一樣排隊。怎麼登載看名冊上的紀錄，不看送委託的人是誰。」
    - kind: speech
      speaker: host
      text: 「我坐在這張櫃檯後面十五年，收過的委託裡有貴族的印，也有不識字的人畫的押。規矩只有一套，我才坐得穩。」
- topic_id: guild_staff.topic_04
  keyword: 回報
  label: 回報
  fallback:
    scene_id: guild_staff.topic_04_scene
    revision: r4
    lines:
    - kind: speech
      speaker: actor
      text: 「辦完委託回來回報，要帶哪些東西？我想先弄清楚。」
    - kind: narration
      text: 葛里安用指尖壓住名冊的邊角，等著。
    - kind: speech
      speaker: host
      text: 「結算只認名冊。名冊上還沒有名字的人，櫃檯無從受理，得先把登記辦妥，你手頭上的事才有憑據。」
    - kind: speech
      speaker: actor
      text: 「正式接下、也辦妥之後，回來這裡該怎麼交？」
    - kind: speech
      speaker: host
      text: 「報出委託單上的編號，再遞上討伐的信物或採集到的素材。我核對憑證、蓋印註銷，該給你的報酬當面點清，一文不少。」
    - kind: speech
      speaker: host
      text: 「帶實據來。公會不會少記你的功勞，也不會多記別人一分。」
