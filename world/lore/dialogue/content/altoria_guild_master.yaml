schema_version: 1
greeting: 櫃檯後頭，分會會長葛里安‧衛登伏在名冊上核對一疊委託單，屋頂的雨聲壓著大廳裡的人聲。他聽見腳步，把羽毛筆擱回筆架，抬眼看來：「歡迎來到冒險者公會阿爾托利亞分會。還沒入冊的人，先在本名冊寫下名字，公會便從 F 級為你起頭；已經入冊的人，看板上的委託任你挑選，辦完差事再持單據前來回報。你要辦哪一件，冒險者？」
services:
- key: guild_report_dialogue
  topic_id: guild_staff.topic_04
  label: 交談回報委託
topics:
- topic_id: guild_staff.topic_01
  keyword: 註冊
  label: 註冊
  fallback:
    scene_id: guild_staff.topic_01_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 想請問加入公會的手續。我在名冊上寫下名字，之後就能接看板上的委託了嗎？
    - kind: narration
      text: 葛里安把名冊翻到一張空白頁，將墨水瓶和一支削尖的羽毛筆移到檯邊。
    - kind: speech
      speaker: host
      text: 「先把姓名寫進本名冊，公會接著為你開立第一筆紀錄，再把執照一筆一劃謄寫好交到你手上。有了這張執照，你才有資格站到看板前挑選委託。」
    - kind: speech
      speaker: actor
      text: 入會要繳費，或得先通過什麼比試嗎？我這樣的新手，會從哪一級開始？
    - kind: speech
      speaker: host
      text: 「初入會不收分文，每個人一律從 F 級起步。採集藥草、隨隊護送商隊這類差事，最適合新人練手。你往後累積的每一件功績，都會逐筆寫進名冊。公會只認名冊上寫下的事。」
- topic_id: guild_staff.topic_02
  keyword: 任務
  label: 任務
  fallback:
    scene_id: guild_staff.topic_02_scene
    revision: r4
    lines:
    - kind: speech
      speaker: actor
      text: 我想接委託。看板上的單據該怎麼挑，又有什麼規矩？
    - kind: narration
      text: 葛里安朝大廳中央那面釘滿羊皮紙單據的大任務板抬了抬下巴，神情嚴肅起來。
    - kind: speech
      speaker: host
      text: 「委託全由中央公會派下，再釘到這面看板上，沒有一張是我擅自指派。每張單據都寫明指定階級、去處和報酬。你按自己的階級挑一張，揭下來送到櫃檯，我核對後蓋印登進名冊，這份委託才正式落到你手上。」
    - kind: speech
      speaker: actor
      text: 要是走到半路才發現委託太難，辦不下去，把單據交回來會受罰嗎？
    - kind: speech
      speaker: host
      text: 「不會。辦不下去就把單據完好交回櫃檯，之後公會自會派人接手。寧可回頭換張簡單的差事，也別在荒野硬撐。」
    - kind: speech
      speaker: host
      text: 「我年輕時護送商隊，親眼見過不肯回頭的人沒能回來。面子換不回命，冒險者。」
- topic_id: guild_staff.topic_03
  keyword: 公會
  label: 公會
  variants:
  - variant_id: senior_standing
    priority: 10
    when:
      kind: guild_rank_at_least
      rank_key: E
    scene:
      scene_id: guild_staff.topic_03_senior
      revision: r3
      lines:
      - kind: speech
        speaker: actor
        text: 能跟我談談公會在各國怎麼運作嗎？我晉升之後，到別處走動會有哪些不同？
      - kind: narration
        text: 葛里安的目光掃過對方胸前的公會徽章，神情比面對生面孔時緩和了幾分。
      - kind: speech
        speaker: host
        text: 「你已經不是最底層的新人，名冊上留著你的實績。公會是跨國中立組織，總部設在格蘭迪亞帝都，人類兩國與瓦爾哈拉獸王國都承認公會的執照。你走到哪座城，你的名字都作數。」
      - kind: speech
        speaker: host
        text: 「本分會專責西部丘陵一帶的委託，也主持晉升考核。考核由長住公會前的資深冒險者評斷，實績夠了，考核的大門隨時為你開著。」
      - kind: speech
        speaker: host
        text: 「憑名冊上的名號，各地分會都會替你指點食宿、辦理結算。踏實接案的人，公會向來記得他的名字。」
  fallback:
    scene_id: guild_staff.topic_03_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 能跟我說說這座公會的來歷嗎？為什麼各國都能見到分會的招牌？
    - kind: narration
      text: 葛里安扶正胸前刻著公會紋章的銅徽，把肩背挺直了些。
    - kind: speech
      speaker: host
      text: 「冒險者公會是跨國中立組織，總部設在格蘭迪亞帝都，全大陸大小城鎮共有兩百餘處分會。人類兩國與瓦爾哈拉獸王國共同承認公會的執照，而名冊歸公會自己掌管，不屬任何一國。你走到哪座城，憑名冊上的名字，分會都認。」
    - kind: speech
      speaker: actor
      text: 那貴族或官員遞來的委託，公會也照樣受理嗎？
    - kind: speech
      speaker: host
      text: 「照樣受理。不管是領地貴族的重賞，還是農家湊出的幾枚銅幣，送到櫃檯前一律排隊，按名冊上的紀錄公正登載。公會只認名冊上寫下的事，不替任何一方偏私。」
- topic_id: guild_staff.topic_04
  keyword: 回報
  label: 回報
  fallback:
    scene_id: guild_staff.topic_04_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 關於辦完委託之後的回報結算，我想先了解要帶哪些憑證。
    - kind: narration
      text: 葛里安用指尖輕點名冊的邊角，語氣沉穩。
    - kind: speech
      speaker: host
      text: 「結算只認名冊。名冊上還沒有名字的人，櫃檯無從受理，得先辦妥登記，你手頭上的事才有憑有據。」
    - kind: speech
      speaker: actor
      text: 那正式接下委託又辦妥之後，回到這裡該怎麼交？
    - kind: speech
      speaker: host
      text: 「報出委託單上的編號，再遞上討伐的信物或採集到的素材。我核對憑證，蓋印註銷，該給你的報酬當面如數點清。帶實據前來，公會不會少記你一分功勞。」
