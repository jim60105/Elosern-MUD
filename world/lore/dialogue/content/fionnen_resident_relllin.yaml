schema_version: 1
greeting: 瑞林赤腳站在土裡，彎腰把一株歪掉的菜苗扶正，才直起身：「問菜就問。我手上這點泥，等會再洗。」
topics:
- topic_id: fionnen_resident_relllin.topic_01
  keyword: 菜圃
  label: 菜圃
  fallback:
    scene_id: fionnen_resident_relllin.topic_01_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「林間菜圃這麼大一片，都是你一個人開出來的？」
    - kind: speech
      speaker: host
      text: 「一畦一畦開出來。巨樹之間的隙地，石頭多，土薄，先撿石再填土，才種得起來。」
    - kind: speech
      speaker: host
      text: 「菜成排種到樹根邊，果樹雜在中間。收成不算多，夠村裡吃，多的曬乾留到冬天。」
    - kind: narration
      text: 她彎腰摘下一片菜葉，掐掉邊上被蟲咬過的地方。
    - kind: speech
      speaker: host
      text: 「這片地養了整座村。土好，菜就肯長。人也一樣，腳踩得實，才站得穩。」
- topic_id: fionnen_resident_relllin.topic_02
  keyword: 收成
  label: 收成
  fallback:
    scene_id: fionnen_resident_relllin.topic_02_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 「收成的時候，你們忙得過來嗎？」
    - kind: speech
      speaker: host
      text: 「忙得過來，三個人一起上，採的採、裝的裝。中午就在圃邊吃，吃完接著做。」
    - kind: speech
      speaker: host
      text: 「收完那晚煮一大鍋，端去共食棚。村裡誰來都可以盛一碗，沒有人空手回去。」
    - kind: narration
      text: 她把手上的泥在衣襬上抹了兩下，抹不乾淨也不在意。
    - kind: speech
      speaker: host
      text: 「累了一季，就等這一口。那種踏實，比什麼都重。」
- topic_id: fionnen_resident_relllin.topic_03
  keyword: 家人
  label: 家人
  fallback:
    scene_id: fionnen_resident_relllin.topic_03_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「你家裡人都下圃嗎？」
    - kind: speech
      speaker: host
      text: 「大女兒伊斯爾溫澆水看渠，小女兒米拉拉採菜。我管種。」
    - kind: speech
      speaker: host
      text: 「三個人蹲在一排畦裡，話不多，就聽鋤頭碰到石頭的聲音。」
    - kind: narration
      text: 她朝菜圃另一頭揮了揮手，那裡有人直起腰來回應。
    - kind: speech
      speaker: host
      text: 「一家人靠這片地過活。你餓了，來摘兩把，不必客氣。」
- topic_id: fionnen_resident_relllin.topic_04
  keyword: 名字
  label: 名字
  fallback:
    scene_id: fionnen_resident_relllin.topic_04_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 「孫希斯佩爾，是日光在低聲說話的意思？」
    - kind: speech
      speaker: host
      text: 「是這個意思。日頭穿過樹冠，光斑落在菜圃上，風一吹就動，這家說是光在講話，就取了這個姓。」
    - kind: narration
      text: 她攤開手，接住一片漏下來的陽光。
    - kind: speech
      speaker: host
      text: 「我沒聽過光講話。可正午的時候，圃子最亮，菜也長得最快，這倒不假。」
    - kind: speech
      speaker: host
      text: 「你要看，往後晌午來。那時整片菜圃都亮。」
- topic_id: fionnen_resident_relllin.topic_05
  keyword: 私語
  label: 私語
  requires:
    kind: affinity_at_least
    stage_key: trusted
  unavailable: locked
  refusal:
    scene_id: fionnen_resident_relllin.topic_05_refusal
    revision: r2
    lines:
    - kind: speech
      speaker: host
      text: 「土裡的事我講得再多也不嫌，心裡的事得看人。你還沒跟我一起流過汗。」
  fallback:
    scene_id: fionnen_resident_relllin.topic_05_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「忙完一整季，你最想有人陪你做什麼？」
    - kind: speech
      speaker: host
      text: 「收完最後一畦，坐在圃邊看太陽下去。那時整個人都空了，什麼都不想動。」
    - kind: speech
      speaker: host
      text: 「有人遞一瓢水來，順手把我眉角的汗抹掉。我靠在她肩上，兩個人看那片綠，誰也不講話。」
    - kind: narration
      text: 她瞇起眼，像還坐在那時的夕照裡。
    - kind: speech
      speaker: host
      text: 「日子靠種，也靠人陪。土再肥，一個人守著也會荒。」
