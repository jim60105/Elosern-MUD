schema_version: 1
greeting: 妮絲塔‧狐溪從五彩斑斕的布匹堆裡探出頭來，脖子上掛著褪色的軟尺：「來，快進來坐！讓我打量一下你這身剪裁……哎呀，這是在收拾行裝，準備往哪裡遊歷去呢？」
topics:
- topic_id: altoria_tailor.topic_01
  keyword: 衣甲
  label: 衣甲
  fallback:
    scene_id: altoria_tailor.topic_01_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 妮絲塔坊主，我想挑一件能在路上護身的衣服。
    - kind: narration
      text: 妮絲塔‧狐溪笑著取下軟尺，拉過兩件樣衣在架前比劃。
    - kind: speech
      speaker: host
      text: 「要輕便活動，就選熟鞣的硬皮甲，耐磨又不礙手腳；想擋箭鏃刀鋒，這套鎖子甲最合適，鐵環全由隔壁鐵匠鋪親自敲打呢。」
    - kind: speech
      speaker: actor
      text: 那要是專研術法的人，該選哪一件？
    - kind: speech
      speaker: host
      text: 「術師長袍掛在那頭，內襯選了細羊毛，袖管特別放寬，念咒揮手都順暢。若是騎士扈從，那邊還有厚實的鐵盾與板甲，不過身骨得夠硬朗才撐得起喲。」
- topic_id: altoria_tailor.topic_02
  keyword: 旅裝
  label: 旅裝
  fallback:
    scene_id: altoria_tailor.topic_02_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 要是長途跋涉，身上這套旅裝該怎麼挑選？
    - kind: narration
      text: 妮絲塔‧狐溪退後兩步，眼光在客人的肩線與腰側仔細盤算。
    - kind: speech
      speaker: host
      text: 「出遠門最忌諱衣服不合身，肩頭勒緊、褲襠磨腿，走兩天就邁不開步子。一件合身的皮甲能陪你翻山越嶺，勝過三件湊合穿的粗料呢。」
    - kind: speech
      speaker: host
      text: 「若是精通各類魔法的大術師，內側滾了符文暗線的補綴長袍最省氣力，料子輕柔得像雲朵。雖然價錢稍微矜貴些，穿過的人可都捨不得換下來呢。」
- topic_id: altoria_tailor.topic_03
  keyword: 禮服
  label: 禮服
  variants:
  - variant_id: noble_formalwear
    priority: 10
    when:
      kind: social_identity_is
      identity_key: noble
    scene:
      scene_id: altoria_tailor.topic_03_noble_scene
      revision: r2
      lines:
      - kind: speech
        speaker: actor
        text: 聽聞上城貴族常向坊裡定製正式禮服？
      - kind: narration
        text: 妮絲塔‧狐溪收起剪刀，撫平展台上的一卷絲綢。
      - kind: speech
        speaker: host
        text: 「貴客好眼力。上城貴族府邸的晚宴正裝，向來都是我親自量度領口與褶邊，用的是王國最細密的織料，絕不失貴族排場呢。」
      - kind: speech
        speaker: host
        text: 「大神殿送來的聖袍訂單也是這兒包辦。修女聖袍講究自然坦蕩的教義，縫線絲毫不差；至於神殿聖女的祭典衣裳，更是嚴格按照光明女神的古儀剪裁，莊嚴得很呢。」
  fallback:
    scene_id: altoria_tailor.topic_03_fallback_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 坊裡除了冒險者的皮甲，也做貴族與神殿的禮袍嗎？
    - kind: narration
      text: 妮絲塔‧狐溪點了點頭，眼裡透出幾分對手藝的自豪。
    - kind: speech
      speaker: host
      text: 「上城北大道那些公爵與侯爵常派管事來訂禮服，樣式繁複得很。大神殿送來的修女聖袍訂單也都在這兒縫，聖職袍服講究遵循女神肉體坦露的教義，可費心思呢。」
    - kind: speech
      speaker: host
      text: 「至於聖女穿的聖袍，傳聞最早是精靈始祖女神親手留下來的式樣，我也只敢照著老圖紙描摹。要是想看私下穿的誘蠱蕾絲內衣，也可以私下跟我說喲。」
- topic_id: altoria_tailor.topic_04
  keyword: 收衣
  label: 收衣
  fallback:
    scene_id: altoria_tailor.topic_04_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 舊衣甲要是穿不下了，這裡還收購嗎？
    - kind: narration
      text: 妮絲塔‧狐溪側身讓開走道，指了指牆角一隻大藤條箱。
    - kind: speech
      speaker: host
      text: 「店裡賣出去的衣甲我都收，只要沒破成爛布條，帶回來先放藤箱裡。若是沾了泥水汗漬，記得在溪邊洗乾淨再拿來，不然煤灰布屑全沾上了。」
    - kind: speech
      speaker: host
      text: 「收回來的皮甲，我會拆掉舊縫線重新鞣製、換上牢固的牛筋線，再給下一位過路旅人穿。每一寸料子都是好東西，可不能平白糟蹋呢。」
