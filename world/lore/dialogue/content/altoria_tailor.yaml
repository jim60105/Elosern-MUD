schema_version: 1
greeting: 妮絲塔‧狐溪從五彩斑斕的布匹堆後探出頭，脖子上掛著褪色的軟尺，笑臉相迎：「來，快進屋坐！讓我打量一下你這身剪裁……哎呀，這是在收拾遠行裝束，打算往哪座城鎮遊歷去呢？」
topics:
- topic_id: altoria_tailor.topic_01
  keyword: 衣甲
  label: 衣甲
  fallback:
    scene_id: altoria_tailor.topic_01_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 妮絲塔坊主，我想挑一件能在荒野路上妥善護身的衣甲。坊裡都縫製些什麼樣式？
    - kind: narration
      text: 妮絲塔‧狐溪笑著取下頸上的軟尺，輕巧地拉過兩件樣衣在架前比對。
    - kind: speech
      speaker: host
      text: 「要輕便活動，就選熟鞣的硬皮甲，透氣耐磨又不礙著拳腳手腳；想抵擋箭鏃與刀鋒劈砍，這套鎖子甲最妥貼，裡頭每一枚鐵環全由隔壁鐵匠鋪親手敲打呢。」
    - kind: speech
      speaker: actor
      text: 那要是專心研習各系法術的人，該挑哪一件才合襯？
    - kind: speech
      speaker: host
      text: 「術師長袍掛在那頭，內襯選了細羊毛，袖管特別改寬放長，念咒展臂都順暢。要是騎士扈從，那邊還有厚實的鐵盾與整套騎士板甲，不過身子骨得夠硬朗才撐得起喲。」
- topic_id: altoria_tailor.topic_02
  keyword: 旅裝
  label: 旅裝
  fallback:
    scene_id: altoria_tailor.topic_02_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 如果要出遠門長途跋涉，身上這套旅裝該怎麼挑選才好？
    - kind: narration
      text: 妮絲塔‧狐溪後退半步，目光在客人的肩線與腰身間仔細衡量盤算。
    - kind: speech
      speaker: host
      text: 「出門走遠路，最忌諱衣服剪裁不合身。肩頭勒緊、褲襠磨腿，走不上兩天整個人就邁不開步子。挑一件合身妥貼的皮甲陪你翻山越嶺，勝過三件湊合穿的粗布行頭呢。」
    - kind: speech
      speaker: host
      text: 「要是在學院裡鑽研法術的人，內側滾了符文暗線的補綴長袍最省氣力，料子輕柔得像片雲彩。雖然價錢稍微矜貴些，穿過的人可都捨不得換下來呢。」
- topic_id: altoria_tailor.topic_03
  keyword: 禮服
  label: 禮服
  variants:
  - variant_id: noble_formalwear
    priority: 10
    when:
      kind: social_identity_is
      identity_key: noble
    scene:
      scene_id: altoria_tailor.topic_03_noble_scene
      revision: r2
      lines:
      - kind: speech
        speaker: actor
        text: 聽聞上城貴族府邸常向坊裡定製正裝。我想看看適合出席隆重場合的正式禮服。
      - kind: narration
        text: 妮絲塔‧狐溪收起手邊的剪刀，撫平展台上的一卷高級絲綢，神情多了幾分敬重。
      - kind: speech
        speaker: host
        text: 「貴客好眼力。上城貴族府邸的晚宴正裝，向來都是我親自量度領口與褶邊，用的是王國最細密的織料，穿出門赴宴絕不失貴族體面呢。」
      - kind: speech
        speaker: host
        text: 「大神殿送來的聖袍訂單也是這兒包辦。修女聖袍講究自然坦蕩的教義，縫線絲毫不差；至於神殿聖女的祭典衣裳，更是嚴格按照光明女神的古儀剪裁，莊嚴得很呢。」
  fallback:
    scene_id: altoria_tailor.topic_03_fallback_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 坊裡除了冒險者的皮甲，平時也替貴族或大神殿量身縫製禮袍嗎？
    - kind: narration
      text: 妮絲塔‧狐溪點了點頭，眼眸裡透出幾分對自家手藝的自豪神氣。
    - kind: speech
      speaker: host
      text: 「上城北大道那些公爵與侯爵常派管事來訂禮服，樣式繁複得很。大神殿送來的修女聖袍訂單也都在這兒縫，聖職袍服講究遵循女神肉體坦露的教義，可費心思呢。」
    - kind: speech
      speaker: host
      text: 「至於聖女穿的聖袍，傳聞最早是精靈始祖女神親手留下來的式樣，我也只敢照著老圖紙描摹。要是想私下量身訂做貼身的蕾絲內衣，等鋪子裡沒別的客人，再悄悄跟我說一聲喲。」
- topic_id: altoria_tailor.topic_04
  keyword: 收衣
  label: 收衣
  fallback:
    scene_id: altoria_tailor.topic_04_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 如果手邊有舊衣甲換了下來或是穿不合身，你這裡收購嗎？
    - kind: narration
      text: 妮絲塔‧狐溪側身讓開走道，指了指屋角一隻擦洗得乾乾淨淨的大藤條箱。
    - kind: speech
      speaker: host
      text: 「只要是店裡賣出去的衣甲，我都願意收購。只要沒破爛成布條，帶回來先擱進藤箱裡。若是沾了泥水汗漬，記得在溪邊洗乾淨再拿來，不然煤灰布屑全沾上了。」
    - kind: speech
      speaker: host
      text: 「收回來的皮甲，我會拆掉舊縫線重新鞣製、換上牢固的牛筋線，再給下一位過路旅人穿。每一寸料子都是好東西，可不能平白糟蹋呢。」
