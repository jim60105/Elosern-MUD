schema_version: 1
greeting: 妮絲塔‧狐溪從布匹堆後探出頭，脖子上掛著軟尺，笑臉相迎：「來，快進屋坐！讓我打量一下你這身剪裁。這是收拾遠行裝束，打算往哪座城鎮去呢？」
topics:
- topic_id: altoria_tailor.topic_01
  keyword: 衣甲
  label: 衣甲
  fallback:
    scene_id: altoria_tailor.topic_01_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 「妮絲塔坊主，我想挑一件在荒野路上能護身的衣甲。坊裡都縫些什麼樣式？」
    - kind: narration
      text: 妮絲塔‧狐溪笑著取下頸上的軟尺，從架上拎下兩件樣衣比對。
    - kind: speech
      speaker: host
      text: 「要輕便活動，就選耐用的硬皮甲，透氣耐磨，不礙著拳腳；想擋箭鏃和刀鋒，這套鎖子甲最妥貼，裡頭每一枚鐵環都是隔壁鐵匠鋪親手敲的呀。」
    - kind: speech
      speaker: actor
      text: 「那專心研習法術的人，該挑哪一件才合襯？」
    - kind: speech
      speaker: host
      text: 「術師長袍掛在那頭，內襯是細羊毛，袖管改寬放長，念咒展臂都順暢。要是騎士扈從，那邊還有厚實的鐵盾和騎士全套板甲，身子骨夠硬朗才撐得起喲。」
- topic_id: altoria_tailor.topic_02
  keyword: 旅裝
  label: 旅裝
  fallback:
    scene_id: altoria_tailor.topic_02_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 「要出遠門長途跋涉，旅裝該怎麼挑才好？」
    - kind: narration
      text: 妮絲塔‧狐溪後退半步，目光在客人的肩線和腰身間仔細打量。
    - kind: speech
      speaker: host
      text: 「走遠路最忌剪裁不合身。肩頭勒緊、褲襠磨腿，走不上兩天就邁不開步子。挑一件合身妥貼的皮甲陪你翻山越嶺，勝過三件湊合穿的粗布行頭呀。」
    - kind: speech
      speaker: host
      text: 「在學院裡鑽研法術的人，就選那件大術師補綴長袍，內側縫滿回復符文，料子輕柔，穿在身上沒什麼負擔。價錢高些，穿過的人可都捨不得換下來呢。」
- topic_id: altoria_tailor.topic_03
  keyword: 禮服
  label: 禮服
  variants:
  - variant_id: noble_formalwear
    priority: 10
    when:
      kind: social_identity_is
      identity_key: noble
    scene:
      scene_id: altoria_tailor.topic_03_noble_scene
      revision: r3
      lines:
      - kind: speech
        speaker: actor
        text: 「聽聞上城貴族府邸常向坊裡訂製正裝。我想挑一件適合出席隆重場合的正式禮服。」
      - kind: narration
        text: 妮絲塔‧狐溪收起手邊的剪刀，撫平展台上的一卷高級絲綢，神情多了幾分敬重。
      - kind: speech
        speaker: host
        text: 「貴客好眼力。上城府邸的晚宴正裝，向來是我親自量領口和褶邊，用的是王國最細密的織料，穿出門赴宴不折體面。」
      - kind: speech
        speaker: host
        text: 「大神殿送來的聖袍訂單也是這兒包辦。修女聖袍照著坦露的教義裁，前襟開到臍下；聖女聖袍料子薄得透光，也只敢照老圖紙描摹。」
  fallback:
    scene_id: altoria_tailor.topic_03_fallback_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 「坊裡除了冒險者的皮甲，平時也替貴族或大神殿量身縫禮袍嗎？」
    - kind: narration
      text: 妮絲塔‧狐溪點了點頭，眼裡透出對自家手藝的得意。
    - kind: speech
      speaker: host
      text: 「北大道那些公爵侯爵常派管事來訂禮服，樣式繁複得很。大神殿的修女聖袍也都在這兒縫，前襟自鎖骨一路開到臍下，兩側腰身只靠聖徽細鏈相連，這剪裁最講究，得讓料子貼著身子走，縫線才不勒肉。」
    - kind: speech
      speaker: host
      text: 「聖女聖袍傳聞由聖女親手繡成，料子薄得透光，我也只敢照老圖紙描摹。要是想私下量身訂貼身的蕾絲內衣，等鋪子裡沒別的客人，再低聲跟我說喲。」
- topic_id: altoria_tailor.topic_04
  keyword: 收購
  label: 收購
  fallback:
    scene_id: altoria_tailor.topic_04_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 「手邊有換下來的舊衣甲，或穿不合身的舊衣，你這裡收嗎？」
    - kind: narration
      text: 妮絲塔‧狐溪側身讓開走道，指了指屋角一個擦洗乾淨的大藤箱。
    - kind: speech
      speaker: host
      text: 「只要是店裡賣出去的衣甲，我都收。沒破爛成布條，帶回來先擱進藤箱裡。沾了泥水汗漬，記得在溪邊洗乾淨再拿來，髒水會沾到箱裡其他衣物。」
    - kind: speech
      speaker: host
      text: 「收回來的皮甲，我拆掉舊縫線重新鞣製，換上牢固的牛筋線，再給下一位過路旅人穿。每一寸料子都是好東西，可不能平白糟蹋呢。」
