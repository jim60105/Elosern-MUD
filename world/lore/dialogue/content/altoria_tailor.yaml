schema_version: 1
greeting: 布匹堆後頭探出一個腦袋，妮絲塔‧狐溪脖子上掛著軟尺，笑臉迎上來：「來，進來坐嘛。站直一點，我瞧一眼你的肩。是要出遠門，還是要去哪座城？」
topics:
- topic_id: altoria_tailor.topic_01
  keyword: 衣甲
  label: 衣甲
  fallback:
    scene_id: altoria_tailor.topic_01_scene
    revision: r4
    lines:
    - kind: speech
      speaker: actor
      text: 「坊主，我想挑一件能在荒野路上護身的衣甲。你這裡都縫些什麼？」
    - kind: narration
      text: 妮絲塔笑著把軟尺從脖子上取下來，從架上拎下兩件樣衣比對。
    - kind: speech
      speaker: host
      text: 「要活動方便，就拿皮甲。硬皮革曬過太陽，耐磨，手臂抬起來也不卡。」
    - kind: speech
      speaker: host
      text: 「想擋箭、擋刀，就這套鎖子甲。裡頭每一枚鐵環都出自隔壁鍛造鋪，一枚一枚敲出來，我縫的時候摸過，沒有半個毛邊。」
    - kind: speech
      speaker: actor
      text: 「那常要念咒、手要張得開的人呢？」
    - kind: speech
      speaker: host
      text: 「術師長袍掛在那邊。內襯細羊毛，袖管放寬加長，念咒展臂不會扯到肩。價錢比皮甲高，可穿過的人都捨不得換。」
    - kind: speech
      speaker: host
      text: 「要當騎士扈從，後頭還有鐵盾和整套板甲。那套重，身子骨撐不住就別硬穿，我看了也心疼。」
- topic_id: altoria_tailor.topic_02
  keyword: 旅裝
  label: 旅裝
  fallback:
    scene_id: altoria_tailor.topic_02_scene
    revision: r4
    lines:
    - kind: speech
      speaker: actor
      text: 「要出遠門走長路，旅裝該怎麼挑？」
    - kind: narration
      text: 她退了半步，目光在你肩線和腰身之間來回量。
    - kind: speech
      speaker: host
      text: 「走遠路最怕不合身。肩頭勒著、褲襠磨腿，走不到兩天就邁不開步。合身的皮甲勝過三件湊合穿的粗布衣，這點我講十年了。」
    - kind: speech
      speaker: host
      text: 「要是路上還要念咒，就挑大術師補綴長袍。內側縫滿回復符文，料子輕，穿一整天肩也不酸。」
    - kind: speech
      speaker: actor
      text: 「價錢差這麼多，值得嗎？」
    - kind: speech
      speaker: host
      text: 「你走一趟長路就知道了。衣服不合身，最先壞的是脾氣。脾氣一壞，同伴都躲你。」
- topic_id: altoria_tailor.topic_03
  keyword: 禮服
  label: 禮服
  variants:
  - variant_id: noble_formalwear
    priority: 10
    when:
      kind: social_identity_is
      identity_key: noble
    scene:
      scene_id: altoria_tailor.topic_03_noble_scene
      revision: r4
      lines:
      - kind: speech
        speaker: actor
        text: 「聽說上城貴族府邸常向坊裡訂正裝。我想挑一件能出席隆重場合的禮服。」
      - kind: narration
        text: 她收起手邊的剪刀，把展台上的一卷高級絲綢撫平，神情多了幾分認真。
      - kind: speech
        speaker: host
        text: 「你問對人了。上城府邸的晚宴正裝，向來是我親自量領口和褶邊。王國最細的織料，穿去赴宴，站一整晚也不會塌。」
      - kind: speech
        speaker: host
        text: 「大神殿的聖袍訂單也在這裡做。修女聖袍照教義裁，前襟開到臍下；聖女聖袍的料子薄到透光，我也只敢照老圖紙描。」
      - kind: speech
        speaker: actor
        text: 「聖袍也算禮服？」
      - kind: speech
        speaker: host
        text: 「算。穿在誰身上，就是給誰看。教會要的就是這個意思，我照著裁，一針都不多添。」
  fallback:
    scene_id: altoria_tailor.topic_03_fallback_scene
    revision: r4
    lines:
    - kind: speech
      speaker: actor
      text: 「坊裡除了冒險者的皮甲，也替貴族或大神殿縫禮袍嗎？」
    - kind: narration
      text: 妮絲塔點了點頭，眼裡透出對自家手藝的得意。
    - kind: speech
      speaker: host
      text: 「上城那些公爵侯爵，常派管事來訂禮服，樣式繁複得很。大神殿的修女聖袍也在這裡縫，前襟從鎖骨一路開到臍下，兩側腰身只靠聖徽細鏈相連。這種剪裁最講究，料子要貼著身子走，縫線才不勒肉。」
    - kind: speech
      speaker: host
      text: 「聖女聖袍聽說是聖女親手繡成，料子薄得透光，我只敢照老圖紙描。那種活，接一次要少睡好幾晚。」
    - kind: speech
      speaker: actor
      text: 「那貼身的內衣，你也做嗎？」
    - kind: speech
      speaker: host
      text: 「做呀。等鋪子裡沒別的客人，你再低聲跟我說。這種事，我替你留著面子。」
- topic_id: altoria_tailor.topic_04
  keyword: 收購
  label: 收購
  fallback:
    scene_id: altoria_tailor.topic_04_scene
    revision: r5
    lines:
    - kind: speech
      speaker: actor
      text: 「手邊有換下來的舊衣甲，還有穿不合身的舊衣，你這裡收嗎？」
    - kind: narration
      text: 她側身讓開走道，指了指屋角一個擦洗乾淨的大藤箱。
    - kind: speech
      speaker: host
      text: 「只要是我這間店賣出的衣甲，沒破成布條，帶回來擱進藤箱就行，我收。」
    - kind: speech
      speaker: host
      text: 「沾了泥水汗漬，先在溪邊洗乾淨再拿來。髒的擱進去，整箱都沾味，我可不收。」
    - kind: speech
      speaker: host
      text: 「收回來的皮甲，我拆掉舊縫線重新鞣過，換上牢一點的牛筋線，再給下一個過路的人穿。料子都是好東西，丟了可惜。」
    - kind: speech
      speaker: actor
      text: 「那要是我自己縫壞的呢？」
    - kind: speech
      speaker: host
      text: 「帶來，我幫你瞧。縫得歪，我拆了重來；料子裁壞了，那真的救不回來。下次先來問我一聲，省得糟蹋布。」
