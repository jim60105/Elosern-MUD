schema_version: 1
greeting: 門簾掀動，熱氣裹著肉香撲面而來。西格瑪‧庫柏正握著木湯杓在大鐵鍋前慢攪，聽見動靜便轉過身，用腰間的擦手布抹了抹掌心：「外頭風大，快進來坐吧。灶上的大鍋剛滾開，熱湯跟剛出爐的黑麥麵包都齊備。想吃飽了再走，還是備幾份帶出城的乾糧？櫃檯上的單子全寫得明白，看中哪樣直接跟我說。要是剛從野外回來，打了乾淨的新鮮好肉，也放上檯面讓我瞧瞧。」
topics:
- topic_id: altoria_eatery.topic_01
  keyword: 餐點
  label: 餐點
  fallback:
    scene_id: altoria_eatery.topic_01_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「老闆，今天爐子上有什麼能踏實填飽肚子的熱食？我想先吃點熱食暖身。」
    - kind: narration
      text: 西格瑪掀開熱氣蒸騰的厚重鐵鍋蓋，濃郁的肉香與麥香頓時漫滿整間屋子。
    - kind: speech
      speaker: host
      text: 「最踏實的莫過於一碗燉肉濃湯配厚切黑麥麵包，一碗熱湯落肚，渾身的寒氣全給逼出來。櫃檯上的單子寫著當天燉菜，檯邊也有剛烤好的硬麵包，隨挑隨有，現點現盛。」
    - kind: speech
      speaker: actor
      text: 「要是打算帶在路上吃，這黑麥麵包能放多久？出遠門耐不耐放？」
    - kind: speech
      speaker: host
      text: 「我這麵包用的是西部丘陵磨坊的老酵，烤得乾透，放上十天半個月都不走味，塞進背包不怕擠壓。吃飽了才有力氣拔劍，千萬別餓著肚子出城。」
- topic_id: altoria_eatery.topic_02
  keyword: 招牌
  label: 招牌
  fallback:
    scene_id: altoria_eatery.topic_02_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「聽常客說你店裡有幾樣遠近馳名的拿手好菜，不嘗可惜，真有這麼神？」
    - kind: narration
      text: 西格瑪順手拍了拍灶台邊懸掛的厚底銅鍋，眼角笑開幾道深紋，神色格外得意。
    - kind: speech
      speaker: host
      text: 「招牌自然是東南港灣龍蝦濃湯。二十年前一位老船工把手藝教給我，火候、熬汁和香料分量我半點都沒改動過，滿城就我這鍋熬得出這股鮮味。」
    - kind: speech
      speaker: host
      text: 「要是想嘗點甜嘴，帝國運來的蜜漬水果乾滋味厚實。偶爾還能碰上極少見的精靈蜜漬花蕊，那是商隊從翠綠森林帶出來的稀罕物，甜而不膩，架上有貨才能嘗上一口。」
    - kind: speech
      speaker: actor
      text: 「精靈做的花蕊蜜餞，在王都也能買得到？」
    - kind: speech
      speaker: host
      text: 「精靈老爺們難得流出一點點稀罕物，過路商隊一帶進南大道就給搶個精光，進價高昂，自然也賣得貴得多啦。」
- topic_id: altoria_eatery.topic_03
  keyword: 乾糧
  label: 乾糧
  fallback:
    scene_id: altoria_eatery.topic_03_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「如果準備出遠門進山冒險，背包裡帶哪些乾糧最不容易壞？」
    - kind: narration
      text: 西格瑪指了指櫃檯後方排列齊整的油紙厚包，語氣格外認真。
    - kind: speech
      speaker: host
      text: 「長途跋涉的話，硬麵包塊和獸王國燻獸肉乾是首選。高地獵手燻出來的肉乾雖然偏鹹，但在密林裡放上好幾天都不會走味，嚼幾塊就耐餓。」
    - kind: speech
      speaker: host
      text: 「不少生面孔總想著進了林子再獵野味，真遇上暴雨連生火的柴火都找不著。聽我一句勸，背包裡多帶兩包口糧，緊要關頭那可是救命的東西。」
    - kind: speech
      speaker: actor
      text: 「多謝老闆提醒，我這就照你說的挑幾份包好帶上。」
- topic_id: altoria_eatery.topic_04
  keyword: 收食
  label: 收食
  fallback:
    scene_id: altoria_eatery.topic_04_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「聽說冒險者從城外獵到的獵物和採集的好食材，店裡也收購？」
    - kind: narration
      text: 西格瑪收起方才的說笑神色，前臂搭在櫃檯上，表情十分嚴肅。
    - kind: speech
      speaker: host
      text: 「收啊，只要是乾淨新鮮的獸肉和野味，放上檯面過磅，我都照公道價給足銀錢。不過我醜話說在前頭，破口爛肉、隔夜帶怪味品項，我一概原樣退回。」
    - kind: speech
      speaker: host
      text: 「吃進客人肚子裡的東西半點馬虎不得。拿上好的新鮮貨來，我秤足分量付清；要是品質差了，任誰出面說情我也絕不收受。」
    - kind: speech
      speaker: actor
      text: 「掌廚講究良心與規矩，這道理我明白，一定帶新鮮的過來。」
