schema_version: 1
greeting: 薩拉拉捏碎一片草葉，湊到鼻下聞了聞，紅眸才抬起來：「身子哪裡不舒坦，還是來問草？你說，我聽著。」
topics:
- topic_id: ciaran_resident_thalara.topic_01
  keyword: 草
  label: 草
  fallback:
    scene_id: ciaran_resident_thalara.topic_01_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「藥草園裡都種些什麼？」
    - kind: speech
      speaker: host
      text: 「治傷的草、安神的草、驅蟲的草，還有幾味催情草。」
    - kind: speech
      speaker: host
      text: 「草各有各的脾氣。同一片園子，向陽那頭和背光那頭，長出來的味道就不一樣。」
    - kind: narration
      text: 她拈起一株葉緣帶鋸齒的草，在指間轉了半圈。
    - kind: speech
      speaker: host
      text: 「谷裡人不把身子當禁忌。累了要補，想要了也有草能點火。草是伺候身子的東西，不是拿來管人。」
- topic_id: ciaran_resident_thalara.topic_02
  keyword: 藥
  label: 藥
  fallback:
    scene_id: ciaran_resident_thalara.topic_02_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 「你們熬藥有什麼講究？」
    - kind: speech
      speaker: host
      text: 「最講究的是火候，大一分藥性散掉，小一分味道出不來。」
    - kind: speech
      speaker: host
      text: 「我守著壺，聞氣味從苦轉香，就知道成了。急也沒有用，藥不聽人。」
    - kind: narration
      text: 她掀開壺蓋一角，白氣衝上來，在臉前散開。
    - kind: speech
      speaker: host
      text: 「谷裡人不常病。真病了也不慌，身子自己會好，藥只是扶一把。」
- topic_id: ciaran_resident_thalara.topic_03
  keyword: 家人
  label: 家人
  fallback:
    scene_id: ciaran_resident_thalara.topic_03_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 「你家兩個女兒，都在園子裡幫忙？」
    - kind: speech
      speaker: host
      text: 「大的埃瑞妮爾夜裡採草，天亮才回。小的希爾溫清早熬藥，火一生起來，屋子就有味道。」
    - kind: narration
      text: 她往屋後那片草影望了一眼，語氣很平。
    - kind: speech
      speaker: host
      text: 「我管種，三個人湊齊的時候，園子裡都是人影。」
    - kind: speech
      speaker: host
      text: 「她們兩個都比我會說話。你要找誰，喊一聲，人就在草叢裡。」
- topic_id: ciaran_resident_thalara.topic_04
  keyword: 名字
  label: 名字
  fallback:
    scene_id: ciaran_resident_thalara.topic_04_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 「索爾恩伍德這個姓，是什麼意思？」
    - kind: speech
      speaker: host
      text: 「索爾恩伍德就是棘木，園子外圍那一圈帶刺的老木，是這家的界線。」
    - kind: narration
      text: 她抬手往園外那排黑成一片的枝影指了指。
    - kind: speech
      speaker: host
      text: 「取了這個姓，就要像它一樣，護著裡頭的草。」
    - kind: speech
      speaker: host
      text: 「你要認這家人，先認那排木。刺扎手，可是它擋風。」
- topic_id: ciaran_resident_thalara.topic_05
  keyword: 私語
  label: 私語
  requires:
    kind: affinity_at_least
    stage_key: trusted
  unavailable: locked
  refusal:
    scene_id: ciaran_resident_thalara.topic_05_refusal
    revision: r2
    lines:
    - kind: speech
      speaker: host
      text: 「有些話像藥，火候不到就端出來，只會燙人。你再多來幾趟。」
  fallback:
    scene_id: ciaran_resident_thalara.topic_05_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 「你自己最常喝哪一味？」
    - kind: speech
      speaker: host
      text: 「我最常煎催情草。夜裡一個人的時候，煎一碗喝了，熱從肚子裡往外走，指尖都發燙。」
    - kind: speech
      speaker: host
      text: 「然後我把衣裳褪了，靠在草堆邊，讓那股熱自己走完。」
    - kind: narration
      text: 她垂著眼，手貼在自己腰側。
    - kind: speech
      speaker: host
      text: 「草有活氣，會替你點火。你要試，得先信我，也信草。」
