schema_version: 1
greeting: 鍊金坊的希碧拉‧灰沼從一整牆瓶罐後面探出頭，指尖還沾著草綠色：「哪裡受傷了？還是先備著，以防萬一？說吧，我聽著。」
topics:
- topic_id: altoria_alchemist.topic_01
  keyword: 藥劑
  label: 藥劑
  fallback:
    scene_id: altoria_alchemist.topic_01_scene
    revision: r1
    lines:
    - kind: speech
      speaker: actor
      text: 藥劑
    - kind: speech
      speaker: host
      text: 「治療藥水，小傷用。強效治療藥水，傷得重才用，別拿來治擦傷，浪費。魔力藥水是藍色，施法施到頭昏的時候喝。瓶標上都有寫，看不懂再問我。」
- topic_id: altoria_alchemist.topic_02
  keyword: 外敷
  label: 外敷
  fallback:
    scene_id: altoria_alchemist.topic_02_scene
    revision: r1
    lines:
    - kind: speech
      speaker: actor
      text: 外敷
    - kind: speech
      speaker: host
      text: 「獸王國藥草膏，部族薩滿熬成，抹在腫痛的地方。王國礦工提神湯很辣，礦工下坑前灌一碗，有沒有用，看你自己撐不撐得住。這兩樣算不上正經藥水，塞在行囊底備著就好。」
- topic_id: altoria_alchemist.topic_03
  keyword: 特殊
  label: 特殊
  fallback:
    scene_id: altoria_alchemist.topic_03_scene
    revision: r1
    lines:
    - kind: speech
      speaker: actor
      text: 特殊
    - kind: speech
      speaker: host
      text: 「迷情藥？有。不過我得先問，要用在誰身上，對方知道嗎？藥效不強，意志硬一點的人抵擋得住。想清楚了再來跟我說。還有，紅標那排別自己伸手拿喔。」
- topic_id: altoria_alchemist.topic_04
  keyword: 聖水
  label: 聖水
  fallback:
    scene_id: altoria_alchemist.topic_04_scene
    revision: r1
    lines:
    - kind: speech
      speaker: actor
      text: 聖水
    - kind: speech
      speaker: host
      text: 「受洗聖水不在我這。那是聖所的東西，爬上聖階到大神殿前，聖所有自己的櫃檯。我這裡只有調出來的藥，祝福要找神官，不歸我管。」
