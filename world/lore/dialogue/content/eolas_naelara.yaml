schema_version: 1
greeting: 織機的聲音停下來，奈拉拉‧弗羅斯特威洛把木梭擱在經線上，轉過身。屋裡很靜，她開口時聲音也低：「腳步放輕一點，蛛剛結好新網。進來是想看絲，還是想看那件白衣？要看就自己取下來摸，線在我手上不會斷。」她身上那件白衣只搭在一邊肩上，說話時也沒有去攏。
topics:
- topic_id: eolas_naelara_home.topic_01
  keyword: 養蛛
  label: 養蛛
  fallback:
    scene_id: eolas_naelara_home.topic_01_scene
    revision: r1
    lines:
    - kind: speech
      speaker: actor
      text: 「林子裡的蛛是你在照顧的嗎？牠們平日吃什麼、怎麼結網？」
    - kind: narration
      text: 奈拉拉‧弗羅斯特威洛伸手把門邊一束絲線理順，動作很輕。
    - kind: speech
      speaker: host
      text: 「蛛不吃我給的東西，牠們自己抓林子裡的小蟲。我能做的只有不讓牠們受驚。」
    - kind: speech
      speaker: host
      text: 「腳步重一次，一張網就毀了。去年秋天有人在林子邊跑過去，我少收了一整季的絲。」
    - kind: speech
      speaker: actor
      text: 「一張網要多久才結得回來？」
    - kind: speech
      speaker: host
      text: 「快的隔一夜，慢的要等牠自己願意。所以我寧可多繞幾步路，也不催牠。」
- topic_id: eolas_naelara_home.topic_02
  keyword: 蛛絲
  label: 蛛絲
  fallback:
    scene_id: eolas_naelara_home.topic_02_scene
    revision: r1
    lines:
    - kind: speech
      speaker: actor
      text: 「一綑蛛絲能拿來做什麼？為什麼只有這座谷裡收得到這麼多？」
    - kind: speech
      speaker: host
      text: 「精靈蛛絲韌，拉細了也不斷，縫衣、綁物、做弓弦都合用。谷壁背風，蛛在這裡結網結得密。」
    - kind: speech
      speaker: host
      text: 「我把絲抽成線，線再上機。織衣剩下的線頭我留著補網，一點也不浪費。」
    - kind: narration
      text: 她把一綑絲放到你面前，絲在光裡泛著很淡的銀色。
    - kind: speech
      speaker: actor
      text: 「帶出山谷，這一綑能換到多少？」
    - kind: speech
      speaker: host
      text: 「外面的價錢我不管。你喜歡，留下銅幣帶走；不喜歡，放回架上就好。」
- topic_id: eolas_naelara_home.topic_03
  keyword: 白衣
  label: 白衣
  fallback:
    scene_id: eolas_naelara_home.topic_03_scene
    revision: r1
    lines:
    - kind: speech
      speaker: actor
      text: 「那件白色的精靈傳統服飾薄得幾乎透光，穿在身上不會太露嗎？」
    - kind: narration
      text: 奈拉拉‧弗羅斯特威洛把架上的白衣抖開，披在自己身前比了比，布下的身形看得分明。
    - kind: speech
      speaker: host
      text: 「這件就是村人平日穿的那件，從這片林子收的絲織成。織得薄，是為了讓身體透氣，也讓人看得清楚。」
    - kind: speech
      speaker: host
      text: 「身子本來就沒有需要遮的地方。族裡的人赤著身體走來走去，誰也不會多看一眼；性愛也一樣，想要的時候就做，像呼吸、像吃飯。」
    - kind: speech
      speaker: host
      text: 「外頭來的人若覺得太透，那是他把自己的規矩帶進谷裡。你在這裡穿不穿，都隨你。」
    - kind: speech
      speaker: actor
      text: 「所以你們不是故意穿得少，是根本不覺得需要多穿？」
    - kind: speech
      speaker: host
      text: 「就是這樣。你穿上它，皮膚碰得到風，才曉得這件布好在哪裡。」
- topic_id: eolas_naelara_home.topic_04
  keyword: 收回
  label: 收回
  fallback:
    scene_id: eolas_naelara_home.topic_04_scene
    revision: r1
    lines:
    - kind: speech
      speaker: actor
      text: 「如果絲用不完，或是衣裳穿舊了，還能帶回這裡嗎？」
    - kind: speech
      speaker: host
      text: 「我織的線、我裁的衣，沒有用過的都可以拿回來，我收下會算銅幣給你。」
    - kind: speech
      speaker: host
      text: 「別處織的布我不收。線的撚法、染的料子我都摸不透，混進我的線裡只會壞了整架。」
    - kind: speech
      speaker: actor
      text: 「外頭帶來的布料，真的一件都不行？」
    - kind: speech
      speaker: host
      text: 「不行。你留著自己用，或帶回山外處置。谷裡的絲只認谷裡的手。」
