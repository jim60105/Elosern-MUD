schema_version: 1
greeting: 首飾坊的艾蓮娜‧鴉丘放下鹿皮布，目光在你的衣領和手指上停了停：「隨意看。看中哪件，我取出來讓你迎著日光瞧。有舊飾件想弄清來歷或脫手，擱在絨布墊上，我一件一件看。」
topics:
- topic_id: altoria_jeweller.topic_01
  keyword: 飾品
  label: 飾品
  fallback:
    scene_id: altoria_jeweller.topic_01_scene
    revision: r4
    lines:
    - kind: speech
      speaker: actor
      text: 「坊主，我想挑一件能隨身戴的飾品。玻璃櫃裡都擺了些什麼？」
    - kind: narration
      text: 艾蓮娜把夾在右眼的放大鏡片推正，朝擦得乾淨的玻璃櫃抬了抬下巴。
    - kind: speech
      speaker: host
      text: 「這一櫃都是貼身的小件。銀髮簪是平原民的老工法，別在髮間不搶眼，收得住一綹頭髮。狼牙項鍊是獸人成年禮上獵到的狼牙串成，掛在頸上沉，走路時會碰到鎖骨。朝聖者銅符是光明教會信眾的聖徽，沿聖階上大神殿的人，胸前多半有一枚。」
    - kind: speech
      speaker: actor
      text: 「那枚有點微光的戒指呢？看起來不像普通貨。」
    - kind: speech
      speaker: host
      text: 「防禦戒指，戒面鑲了一整顆魔導結晶，是少見的細活。飾品貴在稱身，也貴在保護人。」
    - kind: speech
      speaker: host
      text: 「有人為了好看，滿身掛得叮噹響。我倒勸你挑一兩件真正合用的就好。戴久了，它會像長在你身上。」
- topic_id: altoria_jeweller.topic_02
  keyword: 鑲工
  label: 鑲工
  variants:
  - variant_id: inspect_protective_ring
    priority: 10
    when:
      kind: carries
      item_key: protective_ring
      minimum: 1
    scene:
      scene_id: altoria_jeweller.topic_02_protective_ring_scene
      revision: r4
      lines:
      - kind: speech
        speaker: actor
        text: 「我手邊帶著這枚防禦戒指。想請你過目，上面的鑲工有什麼講究？」
      - kind: narration
        text: 艾蓮娜眼裡浮起專注，隔著絲絨墊端詳戒環的爪座，指尖離結晶半寸，沒碰。
      - kind: speech
        speaker: host
        text: 「看鑲工先看爪座，別被寶石的光澤帶走。這枚的四角包爪用銀銅合金壓平，扣得住結晶的稜角，又不擋魔力流動。這種活全靠指腹的感覺，急不得。」
      - kind: speech
        speaker: host
        text: 「平時戴著，留心別讓硬物直撞爪尖。底座只要沒鬆，這枚戒指就能一直保護你。」
      - kind: speech
        speaker: host
        text: 「我看東西，先看它背後那雙手。爪座壓得平，做的人就有耐性。」
  fallback:
    scene_id: altoria_jeweller.topic_02_fallback_scene
    revision: r4
    lines:
    - kind: speech
      speaker: actor
      text: 「都說市場街首飾坊的鑲工出名。看飾品的時候，要怎麼分辨工法好壞？」
    - kind: narration
      text: 艾蓮娜托起一方深色平絨托盤，指尖掠過幾件精細的飾物。
    - kind: speech
      speaker: host
      text: 「先看爪座。這枚淨化吊墜，爪座用細銀打成，牧師用聖水反覆洗過，戴上能隔絕瘴毒。無懼胸針的底托是赤鐵鍛打而成，獵魔人偏愛這種沉手的分量，戴上就聽不見恐懼的低語。」
    - kind: speech
      speaker: host
      text: 「還有這枚光輝聖徽，是牧師祝禱過的日輪聖徽，虔信的人一戴上，聖光就替他癒傷驅邪。它的爪齒壓得平，貼著皮膚也不刮衣料。」
    - kind: speech
      speaker: host
      text: 「看得懂爪座的人，才挑得對首飾。光看亮不亮，遲早吃虧。」
- topic_id: altoria_jeweller.topic_03
  keyword: 奇物
  label: 奇物
  fallback:
    scene_id: altoria_jeweller.topic_03_scene
    revision: r4
    lines:
    - kind: speech
      speaker: actor
      text: 「隔壁雜貨店的瑪爾特說，你這裡收著幾樣不常見的魔導品。能看一眼嗎？」
    - kind: narration
      text: 艾蓮娜沒急著答，轉身從櫃檯最深處捧出木匣，揭開綢布，把兩件東西擱在絨布墊上。
    - kind: speech
      speaker: host
      text: 「瑪爾特記性好。這兩樣是難得的隨身魔導品。儲物袋是帝國的空間魔法製品，外頭只有巴掌大，裡頭裝得下比你行囊還多的東西。」
    - kind: speech
      speaker: actor
      text: 「那件疊得整齊的斗篷呢？看起來也不普通。」
    - kind: speech
      speaker: host
      text: 「滑翔斗篷，用中央山脈商隊帶回的精靈蛛絲混紡。從迷宮高處或山崖往下跳，張開它就能乘風滑行，落地平穩。價錢標在小木牌上，看中了再談。」
    - kind: speech
      speaker: host
      text: 「這兩樣我進貨不多。好東西不必擺滿整面牆。」
- topic_id: altoria_jeweller.topic_04
  keyword: 收購
  label: 收購
  fallback:
    scene_id: altoria_jeweller.topic_04_scene
    revision: r4
    lines:
    - kind: speech
      speaker: actor
      text: 「冒險路上換下來的舊首飾、舊配飾，你這裡收嗎？」
    - kind: narration
      text: 艾蓮娜把鹿皮布收好，取出一把擦得透亮的水晶放大鏡，平放在櫃檯上。
    - kind: speech
      speaker: host
      text: 「櫃上有的樣式，我都收。銀髮簪、狼牙項鍊、防禦戒指，斷了鏈、缺了細爪都不打緊，只要金屬成色還在，我照實估，折成現錢。」
    - kind: speech
      speaker: host
      text: 「藥師珠串是藥草樹脂煉成，迷情絲頸環浸過迷情藥，兩樣都不是尋常人家隨手會有的東西。你講得出它從哪裡來，我才收。」
    - kind: speech
      speaker: host
      text: 「我不是為難人。來歷問不清的東西，收進來就是替別人保管麻煩。」
