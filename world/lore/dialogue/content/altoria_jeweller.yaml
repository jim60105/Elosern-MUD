schema_version: 1
greeting: 首飾坊的艾蓮娜‧鴉丘放下鹿皮布，目光在客人衣領與指尖停了停，像在掂量對方身上已戴著什麼：「請隨意看。看中哪一件，我取出來讓你迎著日光瞧；有舊飾件想弄清來歷或脫手，就擱在絨布墊上，我替你逐件看過去。」
topics:
- topic_id: altoria_jeweller.topic_01
  keyword: 飾品
  label: 飾品
  fallback:
    scene_id: altoria_jeweller.topic_01_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 「坊主，我想挑一件能隨身戴的飾品。玻璃櫃裡都擺了些什麼？」
    - kind: narration
      text: 艾蓮娜‧鴉丘用指尖把單片放大鏡推正，朝擦得一塵不染的玻璃櫃抬了抬下巴。
    - kind: speech
      speaker: host
      text: 「這一櫃都是貼身的小件。銀髮簪是平原民的老工法，別在髮間不搶眼，收住一綹頭髮；狼牙項鍊是獸人成年禮上獵得的狼牙串成，掛在頸上很有分量；朝聖者銅符是光明教會信眾的聖徽，沿著聖階上大神殿的人，多半在胸前佩上一枚。」
    - kind: speech
      speaker: actor
      text: 「那枚泛著微光的戒指呢？看著不像尋常貨色。」
    - kind: speech
      speaker: host
      text: 「那是防禦戒指，戒面鑲了完整的魔導結晶，是罕見的精細物件。飾品貴在稱身，也貴在護得住人。有人為了好看，滿身掛得叮噹作響；我倒勸你挑一兩件真正合用的就好，日子久了，它會像長在你身上一樣。」
- topic_id: altoria_jeweller.topic_02
  keyword: 鑲工
  label: 鑲工
  variants:
  - variant_id: inspect_protective_ring
    priority: 10
    when:
      kind: carries
      item_key: protective_ring
      minimum: 1
    scene:
      scene_id: altoria_jeweller.topic_02_protective_ring_scene
      revision: r3
      lines:
      - kind: speech
        speaker: actor
        text: 「我手邊帶著這枚防禦戒指。想請坊主看看，上頭的鑲工有什麼講究？」
      - kind: narration
        text: 艾蓮娜‧鴉丘眼裡浮起專注，隔著絲絨墊端詳戒環的爪座，指尖離結晶半寸，卻不碰。
      - kind: speech
        speaker: host
        text: 「看鑲工先看爪座，別被寶石的光澤分了神。這枚防禦戒指的四角包爪用銀銅合金壓平，既扣得住結晶的稜角，又不擋住魔力流動。這種活兒全憑指尖的感覺，急不得。」
      - kind: speech
        speaker: host
        text: 「平日戴在手上，留心別讓硬物直撞爪尖。底座只要沒鬆，這枚戒指就能一直護著你。」
  fallback:
    scene_id: altoria_jeweller.topic_02_fallback_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 「都說市場街首飾坊的鑲工最出名。看飾品時，該怎麼分辨工法好壞？」
    - kind: narration
      text: 艾蓮娜‧鴉丘托起一方深色平絨托盤，指尖掠過幾件精細的飾物。
    - kind: speech
      speaker: host
      text: 「先看爪座。這枚淨化吊墜，爪座用細銀打成，經牧師以聖水反覆洗淨，戴上便能隔絕瘴毒；無懼胸針的底托是赤鐵反覆鍛打而成，獵魔人偏愛這種沉手的分量，戴上就不再聽見恐懼的低語。」
    - kind: speech
      speaker: host
      text: 「還有這枚光輝聖徽，是牧師祝禱過的日輪聖徽，虔信者一戴上，聖光就能替他癒傷驅邪。它的爪齒壓得平整圓滑，貼著皮膚也不刮衣料。看得懂爪座的人，才挑得對首飾。」
- topic_id: altoria_jeweller.topic_03
  keyword: 奇物
  label: 奇物
  fallback:
    scene_id: altoria_jeweller.topic_03_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 「隔壁雜貨店的瑪爾特說，你鋪子裡還收著幾樣不常見的魔導奇物。能瞧瞧嗎？」
    - kind: narration
      text: 艾蓮娜‧鴉丘沒急著答話，轉身從櫃檯最深處捧出一個木匣，揭開綢布，把兩件東西擱在絨布墊上。
    - kind: speech
      speaker: host
      text: 「瑪爾特倒是記性好。這裡備著的兩樣，是難得的隨身魔導品。儲物袋是帝國的空間魔法製品，外頭只有巴掌大，裡頭卻塞得下比你行囊還多的東西。」
    - kind: speech
      speaker: actor
      text: 「那件疊得齊整的斗篷呢？看著也不尋常。」
    - kind: speech
      speaker: host
      text: 「滑翔斗篷，用中央山脈商隊帶回的精靈蛛絲混紡。從迷宮高處或山崖往下跳，張開它就能乘風滑行，平穩落地。價錢都標在小木牌上，看中了再談。」
- topic_id: altoria_jeweller.topic_04
  keyword: 收購
  label: 收購
  fallback:
    scene_id: altoria_jeweller.topic_04_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 「冒險路上換下來的舊首飾、舊配飾，你這裡願意收嗎？」
    - kind: narration
      text: 艾蓮娜‧鴉丘把鹿皮布收好，取出一把擦得透亮的水晶放大鏡，平放在櫃檯上。
    - kind: speech
      speaker: host
      text: 「櫃上有的樣式，我都收。銀髮簪、狼牙項鍊、防禦戒指，斷了鏈、缺了細爪都不打緊，只要金屬成色還在，我照實估，折成現錢。」
    - kind: speech
      speaker: host
      text: 「藥師珠串、迷情絲頸環這兩樣，得先問清來歷。一個煉自藥草樹脂，一個浸過迷情藥，都不是尋常人家隨手能得的東西。你講得出它從哪兒來，我才能收。」
