schema_version: 1
greeting: 伊倫溫把一綹線繞在指上，過了一會才抬眼：「線的事嗎？你先坐，我把這綹分完。」
topics:
- topic_id: ciaran_resident_yrenwen.topic_01
  keyword: 線
  label: 線
  fallback:
    scene_id: ciaran_resident_yrenwen.topic_01_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 「這麼多線，你真的分得清？」
    - kind: speech
      speaker: host
      text: 「分得清啊，深一線、淺一線，閉著眼摸也知道。」
    - kind: speech
      speaker: host
      text: 「我生在染房，眼睛先學會的是顏色。線一亂，我心裡就跟著亂。」
    - kind: narration
      text: 她舉起一綹線，對著窗光看，線在指間鬆開。
    - kind: speech
      speaker: host
      text: 「線不會騙人。你對它耐心，它就把顏色給你。」
- topic_id: ciaran_resident_yrenwen.topic_02
  keyword: 顏色
  label: 顏色
  fallback:
    scene_id: ciaran_resident_yrenwen.topic_02_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「你最喜歡哪一種顏色？」
    - kind: speech
      speaker: host
      text: 「一種說不清的藍，夾在夜色和溪水中間。」
    - kind: speech
      speaker: host
      text: 「染出來的那天晚上，我把它捧在手心，捨不得放進染缸。」
    - kind: narration
      text: 她低下頭，指尖在膝上的線堆裡撥了撥。
    - kind: speech
      speaker: host
      text: 「顏色看久了會有人味。你要有心，我指給你看。」
- topic_id: ciaran_resident_yrenwen.topic_03
  keyword: 家人
  label: 家人
  fallback:
    scene_id: ciaran_resident_yrenwen.topic_03_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「你家裡人整天都繞著布轉？」
    - kind: speech
      speaker: host
      text: 「娘妮瑪拉染布，姊瑞拉拉織布，我分線。三個人一天到晚都埋在顏色裡。」
    - kind: speech
      speaker: host
      text: 「連作夢都是藍色。醒來手指還記得線的粗細。」
    - kind: narration
      text: 她瞇起眼，像又回到那個夢裡。
    - kind: speech
      speaker: host
      text: 「姊總催我快一點。可線這東西，一急就亂。你多坐一會，我分給你看。」
- topic_id: ciaran_resident_yrenwen.topic_04
  keyword: 名字
  label: 名字
  fallback:
    scene_id: ciaran_resident_yrenwen.topic_04_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 「特魯松，是那排挺直的松樹？」
    - kind: speech
      speaker: host
      text: 「那排就是真松，坡上的松都長得直，風再大也不彎。」
    - kind: speech
      speaker: host
      text: 「我家的人也直。只有我溫吞，常被姊笑。」
    - kind: narration
      text: 她縮了縮肩，自己先笑了。
    - kind: speech
      speaker: host
      text: 「可是線不能太直，得有一點軟。這個家，總算也留得住我。」
- topic_id: ciaran_resident_yrenwen.topic_05
  keyword: 私語
  label: 私語
  requires:
    kind: affinity_at_least
    stage_key: trusted
  unavailable: locked
  refusal:
    scene_id: ciaran_resident_yrenwen.topic_05_refusal
    revision: r2
    lines:
    - kind: speech
      speaker: host
      text: 「我心裡的事是一團亂線，外人一碰就打結。你先陪我在這裡坐一會。」
  fallback:
    scene_id: ciaran_resident_yrenwen.topic_05_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「你一個人待著的時候，最想要什麼？」
    - kind: speech
      speaker: host
      text: 「想有個人把我當成一綹亂掉的線，攤在她膝上，從一頭開始理順。」
    - kind: speech
      speaker: host
      text: 「手指繞著我，不快也不趕，繞過的線都順了。」
    - kind: narration
      text: 她垂下眼，指尖無意識地絞著線。
    - kind: speech
      speaker: host
      text: 「理到最後，我就軟了，化在她腿上。」
    - kind: speech
      speaker: host
      text: 「線亂了要理，人亂了也要。你哪天想理我，就會懂。」
