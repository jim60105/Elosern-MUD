schema_version: 1
greeting: 醉月酒館的老闆蘿溫‧古橡將抹布甩上右肩，耳垂的小銅鈴叮噹作響。她靠著吧台挑眉一笑：「唷，新面孔。我這兒規矩最簡單，屋裡說過的話，出了門誰也別拿去搬弄是非。想打聽消息就多聽多問，碰上性情相投的人，喝兩杯再提結伴同行。消息都在過客嘴裡，光坐著發呆可不會有人替你開口。」
topics:
- topic_id: altoria_tavern.topic_01
  keyword: 傳聞
  label: 傳聞
  variants:
  - variant_id: var_companion_violet
    priority: 10
    when:
      kind: companion_present
      source_kind: preset
      source_key: violet_altoria
    scene:
      scene_id: altoria_tavern.topic_01_scene_violet
      revision: r2
      lines:
      - kind: speech
        speaker: actor
        text: 「老闆娘，最近城裡有什麼值得留意的風聲？我想打聽些動靜。」
      - kind: narration
        text: 蘿溫目光掠過身旁衣著考究的同行少女，嘴角浮起一抹意味深長的笑意，用手背輕叩吧台。
      - kind: speech
        speaker: host
        text: 「哎呀，看來你身邊跟了位氣度不凡的同伴呢。在這客棧巷裡，眼神銳利的人可不少，貴氣藏得再深也瞞不過常客。」
      - kind: speech
        speaker: actor
        text: 「我們只是途經酒館稍作歇息，喝杯飲品順便聽聽路況。」
      - kind: speech
        speaker: host
        text: 「放心，我屋裡的常客懂得進退。想打聽城外道路動靜，多留意西邊桌那幾位斥候的閒聊便是，他們剛從西陵谷地探路回來。」
  fallback:
    scene_id: altoria_tavern.topic_01_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「老闆娘，最近這附近有什麼值得留意的傳聞？我想知道哪裡有活路或麻煩。」
    - kind: narration
      text: 蘿溫提起銅壺斟滿木杯推到櫃檯邊緣，目光朝熱鬧的酒桌方向示意。
    - kind: speech
      speaker: host
      text: 「消息全在客人的嘴裡打轉呢。誰剛從迷宮深處脫身、哪條商道有魔獸出沒，你坐過去跟人多聊兩句便分曉。大夥兒喝了酒，話匣子自然打開。」
    - kind: speech
      speaker: host
      text: 「我只管看著吧台與維持規矩。誰要是探人隱私踩了線，我可會請他出門吹冷風。挑張合眼緣的桌子坐下吧，自己開口問最準確。」
    - kind: speech
      speaker: actor
      text: 「多謝老闆娘指點，我這就找幾位聊得來的冒險者喝一杯。」
- topic_id: altoria_tavern.topic_02
  keyword: 同伴
  label: 同伴
  predecessors:
  - altoria_tavern.topic_01
  disclosure: pure_chain
  fallback:
    scene_id: altoria_tavern.topic_02_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「在酒館裡想結識一起出城冒險的同伴，該怎麼看人才靠得住？」
    - kind: narration
      text: 蘿溫收斂起方才調侃的神情，指節在厚實的橡木吧台上沉沉敲了兩記。
    - kind: speech
      speaker: host
      text: 「找同伴可不是買菜挑瓜。同桌喝酒聊得痛快是一回事，進了迷宮把後背交給對方又是另一回事。得先看那人臨危時的眼神沉不沉穩。」
    - kind: speech
      speaker: host
      text: 「我接手這間店十年，看過太多熱血沸騰組隊出城的年輕人，再也沒回這條巷子。脾氣投合、知根知底，彼此信得過，才能談得上相伴前行。」
    - kind: speech
      speaker: actor
      text: 「看來凡事謹慎觀察、多喝兩次酒深談，才是保全性命的長久之道。」
    - kind: speech
      speaker: host
      text: 「正是這道理。先一起喝杯薄酒聊聊彼此身手與脾氣，別急著許下諾言，看準了再作打算。」
- topic_id: altoria_tavern.topic_03
  keyword: 委託
  label: 委託
  fallback:
    scene_id: altoria_tavern.topic_03_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「店裡有商隊或領主托付的委託單子可以接嗎？我想找點差事做。」
    - kind: narration
      text: 她俐落將擦乾淨的玻璃杯倒扣上架，朝著巷口方向揚了揚下巴。
    - kind: speech
      speaker: host
      text: 「想找正規差事請出門右轉去公會大廳，那裡木板上的單子才合法規。我這兒是喝酒聊天的酒館，不替官府或商會派活。」
    - kind: speech
      speaker: host
      text: 「在公會看板挑好討伐或護衛任務，再拉人回我這兒圍著壁爐細談分工，那才是老手慣常的做法。酒桌上把利害講透，路上少吃虧。」
    - kind: speech
      speaker: actor
      text: 「分工清楚、規矩定妥才不至於忙中出錯，我這就去公會大廳瞧瞧。」
- topic_id: altoria_tavern.topic_04
  keyword: 歇腳
  label: 歇腳
  fallback:
    scene_id: altoria_tavern.topic_04_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「天色已經黑透了，這條巷子裡哪裡能安心歇下腳步睡個好覺？」
    - kind: narration
      text: 蘿溫指了指酒館與隔壁共用火塘的厚實石牆，語氣變得十分溫和。
    - kind: speech
      speaker: host
      text: 「只想歇歇腳暖暖身子，我店裡火塘邊長凳隨你坐；若是想闔眼沉睡，隔壁就是溫弗蕾德經營的爐火旅店。」
    - kind: speech
      speaker: host
      text: 「她那裡的被褥勤洗勤曬，每扇客房木門的門栓都結實得很，牆厚隔音。喝完了杯裡的酒就趕緊過去投宿，別等到深夜熄燈才去敲門。」
    - kind: speech
      speaker: actor
      text: 「好，趁著還沒熄燈，我喝完這杯就去隔壁櫃檯尋個安靜房間。」
