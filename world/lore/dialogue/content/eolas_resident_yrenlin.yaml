schema_version: 1
greeting: 伊倫林從水氣裡轉過臉，眼神還留在水面上。「你找我有事？我剛才在聽水聲。」
topics:
- topic_id: eolas_resident_yrenlin.topic_01
  keyword: 溫泉
  label: 溫泉
  fallback:
    scene_id: eolas_resident_yrenlin.topic_01_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「你為什麼特別喜歡最燙的那口池子？」
    - kind: speech
      speaker: host
      text: 「燙到骨頭都忘了自己。泡在裡頭，什麼都想不起來，只剩水貼著皮膚推過來，別的都沒有。」
    - kind: narration
      text: 她低頭看著水面，指尖在水裡畫圈。
    - kind: speech
      speaker: host
      text: 「外頭太吵。這裡最靜，靜得能聽見自己吞口水。」
    - kind: speech
      speaker: host
      text: 「你身子受得住，就進來陪我坐一會。」
- topic_id: eolas_resident_yrenlin.topic_02
  keyword: 谷裡
  label: 谷裡
  fallback:
    scene_id: eolas_resident_yrenlin.topic_02_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 「谷裡的人都跟你一樣，話這麼少嗎？」
    - kind: speech
      speaker: host
      text: 「谷裡的人不像我這樣。就我話少，娘和姊姊都愛講，講到池水都涼了還不收。」
    - kind: speech
      speaker: host
      text: 「晚上人來池邊，把白天的事都倒進水裡。我在旁邊聽，不插嘴。」
    - kind: narration
      text: 她把下巴擱在池邊的石頭上，眼睛半闔。
    - kind: speech
      speaker: host
      text: 「聽多了就知道，誰昨夜在誰那兒睡，誰又想換個人。這兒沒秘密，我只撿著聽。」
- topic_id: eolas_resident_yrenlin.topic_03
  keyword: 家人
  label: 家人
  fallback:
    scene_id: eolas_resident_yrenlin.topic_03_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「你一個人住嗎？」
    - kind: speech
      speaker: host
      text: 「跟娘佩倫林、姊姊泰林住。娘顧池子，姊姊遞布，我就泡在最燙那口，替她們試水溫。」
    - kind: narration
      text: 她抿了抿嘴，把半張臉又埋回水氣裡。
    - kind: speech
      speaker: host
      text: 「她們說我整天泡著，其實水哪裡燙、哪裡不夠，我一試就知道。」
    - kind: speech
      speaker: host
      text: 「谷裡人看對眼就結伴，夜裡去誰那兒都不瞞。你問起誰，我多半認得。」
- topic_id: eolas_resident_yrenlin.topic_04
  keyword: 白氣
  label: 白氣
  fallback:
    scene_id: eolas_resident_yrenlin.topic_04_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「你總盯著水面上的白氣，是在看什麼？」
    - kind: speech
      speaker: host
      text: 「看它升起來，聚成一團，又散掉。像臨時長出來的身子。」
    - kind: speech
      speaker: host
      text: 「泡熱的人從水裡出來，身上也冒白氣，頭髮和肩膀都蒙著一層水色。」
    - kind: narration
      text: 她伸手在白氣裡撥了一下，霧從指縫分開又合攏。
    - kind: speech
      speaker: host
      text: 「我喜歡看人光著站在霧裡。你多看幾回，也會覺得好看。」
- topic_id: eolas_resident_yrenlin.topic_05
  keyword: 名字
  label: 名字
  fallback:
    scene_id: eolas_resident_yrenlin.topic_05_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 「『溫德松』這名字，你自己喜歡嗎？」
    - kind: speech
      speaker: host
      text: 「我喜歡這名字。風穿過松林，整片會哼。這家守著水，也分得到那點聲音。」
    - kind: narration
      text: 她閉上眼，頭往後靠著石壁。
    - kind: speech
      speaker: host
      text: 「那聲音得自己聽。旁人講得再像，也傳不過去。」
    - kind: speech
      speaker: host
      text: 「你聽懂了，就算把我們家認下了。」
- topic_id: eolas_resident_yrenlin.topic_06
  keyword: 私願
  label: 私願
  requires:
    kind: affinity_at_least
    stage_key: trusted
  unavailable: locked
  refusal:
    scene_id: eolas_resident_yrenlin.topic_06_refusal
    revision: r2
    lines:
    - kind: speech
      speaker: host
      text: 「這件事我還沒準備跟你講。你再多來泡幾回，等我開口。」
  fallback:
    scene_id: eolas_resident_yrenlin.topic_06_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「你有沒有什麼只留給自己的小願望？」
    - kind: speech
      speaker: host
      text: 「我想等一個下雪的夜裡，一個人泡在最燙的池子，讓水淹到下巴。」
    - kind: speech
      speaker: host
      text: 「雪落進霧裡就看不見了。我呼出來的氣也白，跟霧混在一起。」
    - kind: narration
      text: 她眼裡亮了一下，像那場雪已經落在頭上。
    - kind: speech
      speaker: host
      text: 「要是那夜你在，別出聲。坐著陪我就好。」
