schema_version: 1
greeting: 銀葉坡頂的窗子敞著，格威娜拉‧希爾維爾莉夫坐在工作檯後絞銀絲，耳上一排小環跟著她的動作閃。一聽見門口的動靜，她舉起兩朵剛絞好的銀絲小花湊過來：「欸，你來得正好！幫我挑一朵順眼的嘛。我新絞的東西，總要先貼著自己戴幾天，才肯掛到窗邊。做好的都在窗邊那根繩上，看中哪樣跟我說。要是你從前換走的小玩意鬆了線，也拿來給我瞧一眼。」
topics:
- topic_id: ciaran_gwenaera_home.topic_01
  keyword: 綴飾
  label: 綴飾
  fallback:
    scene_id: ciaran_gwenaera_home.topic_01_scene
    revision: r5
    lines:
    - kind: speech
      speaker: actor
      text: 「屋裡到處在閃銀光，桌上又擺了一排小鉗子。你平常都在做哪些飾品？」
    - kind: narration
      text: 格威娜拉笑得眉眼都彎起來，晃了晃手腕上那圈銀絲。
    - kind: speech
      speaker: host
      text: 「銀絲我自己絞，貝殼去溪邊石縫裡撿，晶砂要用石臼磨上一整晚才會發亮。做這些，純粹是我喜歡。」
    - kind: speech
      speaker: host
      text: 「做好的手串、墜子、耳環，全掛在窗邊那根繩上。飾品要貼著鎖骨、耳垂、手腕才好看，老掛在繩上不動，多寂寞。族人路過瞧著順眼就摘去戴，外頭的人來，也能換一件走。」
    - kind: speech
      speaker: actor
      text: 「窗邊那些確實細。山外來的旅人喜歡的話，也能拿一件嗎？」
    - kind: speech
      speaker: host
      text: 「能啊，看中哪件跟我開口。你帶外頭新奇的小玩意來，我樂意瞧。換飾品就照村裡的規矩給，我不耐煩殺價，你肯愛惜東西就好。」
- topic_id: ciaran_gwenaera_home.topic_02
  keyword: 晶符
  label: 晶符
  fallback:
    scene_id: ciaran_gwenaera_home.topic_02_scene
    revision: r5
    lines:
    - kind: speech
      speaker: actor
      text: 「窗前那枚透明晶石墜子，切面好多，迎著光一轉就折出彩光。那是什麼？」
    - kind: narration
      text: 她掂起那枚晶石，對著窗外的光轉了轉。
    - kind: speech
      speaker: host
      text: 「三稜晶符啊。用族裡傳下來的老法子磨，光透進去會分成三種顏色。好看吧？」
    - kind: speech
      speaker: host
      text: 「裡頭沒封什麼神物，也沒什麼儀式。就是聚光聚得穩。常施法的人把它掛在胸前，貼著皮膚，光順著身子走，導起魔力順手一些。村裡的孩子成年，常來跟我討一枚當紀念。」
    - kind: speech
      speaker: actor
      text: 「不封神物，卻能在施法時借它的光，還當得起成年禮。這東西不簡單。」
    - kind: speech
      speaker: host
      text: 「哪有那麼玄。就是個順手的東西。你瞧著喜歡，挑一枚繩結順眼的帶走，掛在頸上也亮。」
- topic_id: ciaran_gwenaera_home.topic_03
  keyword: 耳環
  label: 耳環
  fallback:
    scene_id: ciaran_gwenaera_home.topic_03_scene
    revision: r6
    lines:
    - kind: speech
      speaker: actor
      text: 「你耳上那對月牙小環，轉頭就閃。繩上也掛了好幾對，這是你最常做的樣式嗎？」
    - kind: narration
      text: 她側過臉，抬手捻了捻耳垂上的小環，眼睛發亮。
    - kind: speech
      speaker: host
      text: 「月牙耳環是我最順手的活兒。一副接一副絞下來，閉著眼，手指都認得那個彎。瓦爾溫耳上那對也出自我手，跟我這幾副出自同一批銀絲。」
    - kind: speech
      speaker: host
      text: 「耳垂這個地方最貪。冰涼的銀貼上去，先是一激靈，等被身子焐熱了，就再也摘不下來。我每對都先自己戴，貼著耳朵焐過，你說它招不招惹人？」
    - kind: speech
      speaker: actor
      text: 「月牙的弧度襯著銀葉的光，難怪村裡的人都愛戴。」
    - kind: speech
      speaker: host
      text: 「每副的彎角和垂墜長度都不一樣。晴天我把它們攤在銀葉樹下，讓它們沾點葉子的銀光。你瞧中哪一副，我摘下來，當場替你別上，貼著耳垂試。」
- topic_id: ciaran_gwenaera_home.topic_04
  keyword: 舊飾
  label: 舊飾
  fallback:
    scene_id: ciaran_gwenaera_home.topic_04_scene
    revision: r5
    lines:
    - kind: speech
      speaker: actor
      text: 「要是銀絲不小心扯斷，或是舊飾品不想戴了，該怎麼處理？」
    - kind: narration
      text: 她從桌角抽出一截銀絲，在指尖繞成一個小圈。
    - kind: speech
      speaker: host
      text: 「我做的三稜晶符、月牙耳環，戴久了耳勾折、絲結鬆，隨時拿回來。自己做的東西像自家孩子，破了就扔，多可惜。」
    - kind: speech
      speaker: host
      text: 「真不想戴了，也拿回來。我看銀絲和晶砂的成色，折些銅幣給你。拆下來的銀料熔了，還能絞成新的花飾。」
    - kind: speech
      speaker: actor
      text: 「那從山外城鎮買來的首飾壞了，也能拿來讓你重新絞嗎？」
    - kind: speech
      speaker: host
      text: 「外頭的金銀摻了什麼，我摸不準，硬絞會傷我的夾鉗。外來的東西我不碰，我只照看自己做出來的東西。」
