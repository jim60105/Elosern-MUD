schema_version: 1
greeting: 講堂的黑板還留著半面算式，奧德溫‧薩契把粉筆擱回槽裡，拍了拍袖口的白灰才轉過身：「歡迎。現在不是上課的鐘點，不過你想問學問，我一樣樂意。魔法等級、八種元素、親和差別，你挑一個。先說好，學院只教人把道理看懂，沒有聽一次就變強的辦法。我年輕時也找過那種門路，繞了一圈才知道白費。」
topics:
- topic_id: altoria_academy.topic_01
  keyword: 魔法等級
  label: 魔法等級
  variants:
  - variant_id: magic_scholar
    priority: 10
    when:
      kind: skill_owned
      skill_key: magic_circle_comprehension
      min_proficiency: 1
    scene:
      scene_id: altoria_academy.topic_01_scholar_scene
      revision: r5
      lines:
      - kind: speech
        speaker: actor
        text: 「我學過魔法陣的基礎，咒文擺在眼前還算看得懂。想請問院長，法術位階之間，一次施法要付的魔力到底差多少？」
      - kind: narration
        text: 奧德溫‧薩契推了推圓框眼鏡，鏡片後那雙眼亮了一下，像總算等到有人問到要緊的地方。
      - kind: speech
        speaker: host
        text: 「問得好。我教了四十年，最喜歡學生從這裡問起，因為這代表他真的翻過書，不是只聽人轉述。」
      - kind: speech
        speaker: host
        text: 「典籍按一次施法要付的魔力，把法術分作初級、中級、高級、超級、究極五階。越往深處走，同樣一招使出來，代價就越嚇人。」
      - kind: speech
        speaker: host
        text: 「初級階是火球、水箭、風刃、治癒術、身體強化這類入門的東西；中級階有火焰風暴、冰牆、飛行術；高級階有熔岩術、暴風雪、高級治癒、統御術；超級階是龍炎術、地震術、神聖光輝。」
      - kind: speech
        speaker: host
        text: 「究極階我只在書上見過名字。對人類來說，那幾乎是不可能付得出來的數目。書庫照這個次序藏書，你要翻哪一階都行，只是看懂跟使出來，中間還隔著好幾年的練習。」
  fallback:
    scene_id: altoria_academy.topic_01_scene
    revision: r5
    lines:
    - kind: speech
      speaker: actor
      text: 「我剛接觸魔法，書上常提法術位階，我還是分不太清楚。能不能請你從頭講一次，這些位階是怎麼分的？」
    - kind: narration
      text: 奧德溫‧薩契拿起板擦，在黑板邊緣敲了兩下，粉灰落下時他偏了偏頭，避開自己的袖口。
    - kind: speech
      speaker: host
      text: 「這個問題分兩層。先說位階，它按一次施法要付的魔力來分，由淺入深是初級、中級、高級、超級、究極。」
    - kind: speech
      speaker: host
      text: 「初級階養的是手感，火球、水箭、風刃、治癒術、身體強化都在這一層。中級階開始要你懂得分配魔力，火焰風暴、冰牆、飛行術是代表。」
    - kind: speech
      speaker: host
      text: 「高級階有熔岩術、暴風雪、高級治癒、統御術；超級階只剩龍炎術、地震術、神聖光輝這幾樣。究極階所需的魔力，人類幾乎付不出來，典籍只記其名。」
    - kind: speech
      speaker: host
      text: 「講到這裡我總要多嘴一句，背下這張表不難，難的是知道自己現在站在哪一階。書庫的門開著，你隨時可以進來翻。」
- topic_id: altoria_academy.topic_02
  keyword: 元素
  label: 元素
  fallback:
    scene_id: altoria_academy.topic_02_scene
    revision: r4
    lines:
    - kind: speech
      speaker: actor
      text: 「世上的元素到底有幾種？每一種在真的動起手來的時候，又是什麼樣子？」
    - kind: narration
      text: 奧德溫‧薩契走到示範桌前，攤開掌心，一團溫和的白光浮了上來，連他指節的紋路都照了出來。
    - kind: speech
      speaker: host
      text: 「元素有八種，是學院的入門第一課。我每回講這一堂都要喝掉一整壺水，講完喉嚨就乾了。」
    - kind: speech
      speaker: host
      text: 「火主爆發與灼燒，代價是把自己的力氣一起燒出去；水會奪走對手的魔力，再還給己方；風讓人跑得更快，也更難被打中；土能改變地形，也能護住身子。」
    - kind: speech
      speaker: host
      text: 「雷講究搶先出手，還能麻痺對手；冰讓敵人從遲緩一路凍到定在原地；光專司治療與淨化；暗則削弱對手、奪人氣力。」
    - kind: speech
      speaker: host
      text: 「八種各有偏向，也互相搭配。要把元素摸透，得親手引導過一次魔力，光背書沒有用。我不怕學生問笨問題，就怕他只在紙上點頭。」
- topic_id: altoria_academy.topic_03
  keyword: 親和
  label: 親和
  fallback:
    scene_id: altoria_academy.topic_03_scene
    revision: r4
    lines:
    - kind: speech
      speaker: actor
      text: 「常聽人說每個人的魔法親和不同。這差別是生下來就定死，還是後天也能改？」
    - kind: narration
      text: 奧德溫‧薩契把雙手收到身後，神情認真起來，像要把接下來每個字都擺到正確的位置。
    - kind: speech
      speaker: host
      text: 「問得好，這個問題分兩層。」
    - kind: speech
      speaker: host
      text: 「第一層是種族稟賦。精靈天生親近魔力，學各系法理的速度勝過其他種族；獸人體魄強健，親和卻淺，力氣都長在身子上了。」
    - kind: speech
      speaker: host
      text: 「第二層是你個人的屬性偏向。身子若與某種元素相合，施展對應的咒文就順手；相剋的元素，練起來加倍費勁，這點偷不了懶。」
    - kind: speech
      speaker: host
      text: 「天資生來就定，學院不能憑空給人親和，只能幫你認清自己的長處，把路走穩。教了四十年的書，我最不愛用天才兩個字，那兩個字最容易叫學生放棄自己。」
- topic_id: altoria_academy.topic_04
  keyword: 求學
  label: 求學
  fallback:
    scene_id: altoria_academy.topic_04_scene
    revision: r4
    lines:
    - kind: speech
      speaker: actor
      text: 「學院的課是怎麼上的？我能不能請一位導師單獨帶我，只教我一個人？」
    - kind: narration
      text: 奧德溫‧薩契整了整長袍，把眼鏡扶正，答得很慢，像是這個問題他已經答過很多次。
    - kind: speech
      speaker: host
      text: 「學院不把學生交到哪一位導師手裡，也沒有私下傳授的門路。課在講堂上開，誰走進來都能聽。」
    - kind: speech
      speaker: host
      text: 「咒文也好，劍術也好，都得自己一天一天讀、一天一天練。學院只把學識理清楚擺出來，那份苦功沒人能替你下。」
    - kind: speech
      speaker: host
      text: 「想驗證自己練到什麼程度，去中央廣場東側的冒險者公會應考。評定實力的權限在公會，不在學院。我教書教到這個歲數，最不願意講的就是這一句，講完總有人覺得我把他推出去。」
