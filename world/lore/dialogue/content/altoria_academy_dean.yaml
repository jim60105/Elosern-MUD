schema_version: 1
greeting: 學院的黑板前，奧德溫‧薩契院長擦去一行算式，放下粉筆回過身來：「歡迎。此刻不是授課時段，但學問隨時可以談。法術位階、八種元素、親和之別，你想從哪一項問起？學院只傳知識，不賣捷徑。」
topics:
- topic_id: altoria_academy.topic_01
  keyword: 魔法等級
  label: 魔法等級
  variants:
  - variant_id: magic_scholar
    priority: 10
    when:
      kind: skill_owned
      skill_key: magic_circle_comprehension
      min_proficiency: 1
    scene:
      scene_id: altoria_academy.topic_01_scholar_scene
      revision: r3
      lines:
      - kind: speech
        speaker: actor
        text: 「我學過魔法陣的基礎。想請問法術位階之間，魔力消耗究竟差了多少？」
      - kind: narration
        text: 奧德溫‧薩契推了推圓框眼鏡，眼底浮起一點讚許。
      - kind: speech
        speaker: host
        text: 「問得好。懂得解析法陣，就曉得每道咒文落在哪一位階，消耗的魔力也隨之遞增。」
      - kind: speech
        speaker: host
        text: 「典籍按消耗把法術分作學徒、術師、大師、賢者、主宰、神格六等。越往深處，一次施法要付出的魔力越是驚人。」
      - kind: speech
        speaker: host
        text: 「書庫深處的藏書就按這個次序陳列。學院只講法理，往更高深的系譜走，仍得靠一日一日的練習。」
  fallback:
    scene_id: altoria_academy.topic_01_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 「剛接觸魔法，想請問典籍裡常提的法術位階，到底是怎麼分的？」
    - kind: narration
      text: 奧德溫‧薩契拿起板擦，在黑板邊緣敲了兩下。
    - kind: speech
      speaker: host
      text: 「這個問題分兩層。先說位階，它按一次施法要消耗的魔力來分，由淺入深是學徒、術師、大師、賢者、主宰、神格。」
    - kind: speech
      speaker: host
      text: 「學徒階是火焰箭、水箭術、風刃術、治癒術這類入門法術。到了術師階，才輪到火焰風暴、冰牆術、飛行術。」
    - kind: speech
      speaker: host
      text: 「再往上，大師階有熔岩術、暴風雪、高級治癒；賢者階有龍炎術、地震術、神聖光輝。主宰與神格兩階，需要的魔力大到尋常法師一次也付不起，典籍只記其名，世上沒幾個人施展得出來。」
    - kind: speech
      speaker: host
      text: 「學院書庫依階序藏書，誰都可以進門翻閱。」
- topic_id: altoria_academy.topic_02
  keyword: 元素
  label: 元素
  fallback:
    scene_id: altoria_academy.topic_02_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 「世上流轉的元素有幾種？每一種施展起來又有什麼不同？」
    - kind: narration
      text: 奧德溫‧薩契走到示範桌前，攤開掌心，一團溫和的白光浮了上來。
    - kind: speech
      speaker: host
      text: 「元素有八種，是學院的入門第一課。」
    - kind: speech
      speaker: host
      text: 「火主爆發與灼燒；水會奪走對手的魔力，再還給己方；風讓人更快，也更難被擊中；土能改變地形，也能護住身子。」
    - kind: speech
      speaker: host
      text: 「雷講究搶先出手，麻痺對手；冰讓敵人遲緩，直到凍在原地；光專司治療與淨化；暗則削弱對手、奪人氣力。」
    - kind: speech
      speaker: host
      text: 「八種各有偏向，也互相搭配。要把元素摸透，得親手引導過一次魔力共鳴，光背書沒用。」
- topic_id: altoria_academy.topic_03
  keyword: 親和
  label: 親和
  fallback:
    scene_id: altoria_academy.topic_03_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 「常聽人說每個人的魔法親和不同，這差別是怎麼來的？」
    - kind: narration
      text: 奧德溫‧薩契雙手負在身後，神情認真起來。
    - kind: speech
      speaker: host
      text: 「問得好，這個問題分兩層。」
    - kind: speech
      speaker: host
      text: 「第一層是種族稟賦。精靈天生親近魔力，學各系法理的速度勝過其他種族；獸人體魄強健，親和卻淺。」
    - kind: speech
      speaker: host
      text: 「第二層是你個人的屬性偏向。若身子與某種元素相合，施展對應的咒文就順；相剋的元素，練起來加倍費勁。」
    - kind: speech
      speaker: host
      text: 「天資生來就定，學院不能憑空給人親和，只能幫你認清自己的長處，把路走穩。」
- topic_id: altoria_academy.topic_04
  keyword: 求學
  label: 求學
  fallback:
    scene_id: altoria_academy.topic_04_scene
    revision: r3
    lines:
    - kind: speech
      speaker: actor
      text: 「學院的課怎麼上？能不能請一位導師單獨帶我一個人學？」
    - kind: narration
      text: 奧德溫‧薩契整了整衣袍，扶正眼鏡，答得平靜。
    - kind: speech
      speaker: host
      text: 「學院不把學生交到哪一位導師手裡，也沒有私下傳授的門路。課在講堂上開，誰走進來都能聽。」
    - kind: speech
      speaker: host
      text: 「咒文也好，劍術也好，都得自己一天一天讀、一天一天練。學院只把學識理清楚擺出來，那苦功沒人能替你下。」
    - kind: speech
      speaker: host
      text: 「想驗證自己練到什麼程度，去中央廣場東側的冒險者公會應考。評定實力的權限在公會，不在學院。」
