schema_version: 1
greeting: 爐火旅店的老闆娘溫弗蕾德‧古林正站在櫃檯後整理記事簿，腰間那串黃銅鑰匙發出清脆的微響。她抬起頭溫和地笑道：「歡迎光臨，孩子。長途趕路累壞了吧？樓上房間都收拾妥帖了，床鋪乾淨整潔。大廳火塘邊也能坐著暖暖身子；若想安靜溫習咒文或練練劍術，客房裡清靜得很，不會有人打擾。」
topics:
- topic_id: altoria_lodging.topic_01
  keyword: 房間
  label: 房間
  fallback:
    scene_id: altoria_lodging.topic_01_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「老闆娘，樓上的客房布置與環境如何？」
    - kind: speech
      speaker: host
      text: 「每間房都備有軟木床鋪、乾淨臉盆和一張書桌，窗戶朝向安靜的巷弄內側，外頭喧鬧傳不進來。」
    - kind: narration
      text: 溫弗蕾德輕輕晃動手中擦拭鋥亮的黃銅鑰匙，眼神格外慈祥。
    - kind: speech
      speaker: host
      text: 「更要緊的是門栓厚實堅固。扣上門栓後就是你自個兒的天地，任誰也不能不請自來。」
    - kind: speech
      speaker: actor
      text: 「能在城裡找到這樣清靜的地方投宿，確實讓人安心。」
    - kind: speech
      speaker: host
      text: 「出門在外的人，最在意的就是夜裡能安枕無憂。我這旅店經營二十年，圖的就是客人住得踏實。」
- topic_id: altoria_lodging.topic_02
  keyword: 過夜
  label: 過夜
  fallback:
    scene_id: altoria_lodging.topic_02_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「在野外露營與進城投宿旅店，精神差別真的很大嗎？」
    - kind: speech
      speaker: host
      text: 「那可差遠啦，孩子。荒郊野地裡哪怕閉著眼，耳朵也得時刻提防魔獸嚎叫與林子動靜。」
    - kind: narration
      text: 老闆娘倒了一杯溫熱的薄荷茶遞過櫃檯。
    - kind: speech
      speaker: host
      text: 「緊繃了一整天，進了屋躺在乾燥柔軟的被褥上深睡一夜，次日醒來手腳才靈便。睡足了覺出城，路上才不容易出差錯。」
    - kind: speech
      speaker: actor
      text: 「聽老闆娘這麼一說，確實該上樓好好睡上一覺。」
    - kind: speech
      speaker: host
      text: 「先喝口熱茶順順氣，等會兒拿了鑰匙就上去歇息吧。」
- topic_id: altoria_lodging.topic_03
  keyword: 修煉
  label: 修煉
  fallback:
    scene_id: altoria_lodging.topic_03_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「房裡空間合適閉門溫習典籍或沉思冥想嗎？」
    - kind: speech
      speaker: host
      text: 「合適得很呢。不少投宿的年輕法師和劍士，入夜後都在屋裡靜心梳理所學，只要不動用烈火法術，屋裡隨你專心揣摩。」
    - kind: narration
      text: 她指了指厚實的隔牆與頂棚橫樑。
    - kind: speech
      speaker: host
      text: 「這棟老樓的石牆與板壁砌得極厚，隔絕動靜最好不過。靜下心來溫習一遍，比在人聲喧囂的地方琢磨管用得多。」
    - kind: speech
      speaker: actor
      text: 「我正打算趁夜深無人打擾時，好好收束心神。」
    - kind: speech
      speaker: host
      text: 「那敢情好，要是燈油不夠用隨時下樓添上，別熬傷了眼睛便是。」
- topic_id: altoria_lodging.topic_04
  keyword: 澡堂
  label: 澡堂
  fallback:
    scene_id: altoria_lodging.topic_04_scene
    revision: r2
    lines:
    - kind: speech
      speaker: actor
      text: 「趕了一整天路滿身風塵，這附近哪裡能痛快沐浴？」
    - kind: speech
      speaker: host
      text: 「出門順著巷弄往東走到底，就是伊莎貝爾姑娘經營的公共浴場，池水燒得滾熱透徹。」
    - kind: narration
      text: 溫弗蕾德笑瞇瞇地從身後櫥櫃取出一捲乾淨的粗亞麻布巾。
    - kind: speech
      speaker: host
      text: 「男女兩側浴堂分開，嚴守規矩。先去那裡洗去一路征塵，再回我這兒鑽進暖被窩，那滋味才叫舒坦呢。」
    - kind: speech
      speaker: actor
      text: 「太好了，我這就帶上衣物去浴場走一趟。」
