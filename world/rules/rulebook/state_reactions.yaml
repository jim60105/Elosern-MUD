# Declarative phase transition and outcome reactions (light-climax-empowerment / light-cleric-feedback / on-hit-counter-damage).
#
# Reactions dispatch once after a successful canonical _apply_climax_phase_set edge,
# including rulebook and direct-gain callers, or outcome events (hp_loss, mp_zero, negative_buff_added, physical_hit).
#
# Rules evaluate using the shared evaluate_condition condition engine.
# Allowed actions in then are apply_buff, remove_buff, pleasure_gain, counter_damage, and apply_buff_to_source.
# Source-targeted actions (counter_damage, apply_buff_to_source) consume the strike's attack source
# provided by the physical_hit outcome event. The counter's hp_loss dispatch carries the initiating strike's tier.

- id: climax_in_progress_empowerment
  when:
    field: climax_phase
    equals: 進行中
    skill_qualified: bliss_apotheosis
  then:
    apply_buff: climax_empowerment

- id: climax_neutral_remove_empowerment
  when:
    field: climax_phase
    equals: 未達
  then:
    remove_buff: climax_empowerment

- id: pain_to_pleasure_hp_loss
  when:
    event: hp_loss
    skill_qualified: pain_to_pleasure
  then:
    pleasure_gain:
      max_hp_coefficient: 140

- id: drowning_suffocation
  when:
    event: mp_zero
    event_source_skill: drowned_surging
  then:
    apply_buff: suffocated

- id: pain_to_pleasure_negative_buff_added
  when:
    event: negative_buff_added
    skill_qualified: pain_to_pleasure
  then:
    pleasure_gain:
      max_hp_coefficient: 140
      flat_max_hp_fraction: 0.05

# 荊棘反甲（earth-spell-catalog D2）：the first live rule on the shipped
# physical_hit event — holder-gated through buff_active on the empty-modifier
# earth_carapace mount; the counter lives and dies with the buff instance.
- id: thorned_carapace_counter
  when:
    event: physical_hit
    buff_active: earth_carapace
  then:
    counter_damage: 1.0

# 灼熱裝甲（fire-spell-catalog D1/D2）：受擊時攻擊者被點燃
- id: scorching_armor_ignite
  when:
    event: physical_hit
    buff_active: fire_scorching_armor
  then:
    apply_buff_to_source: fire_ignite

# 靜電護罩（lightning-spell-catalog D3）：近戰受擊時反擊麻痺微階
- id: static_ward_micro_mark
  when:
    event: physical_hit
    buff_active: lightning_static_ward
  then:
    mark_order_op: static_ward_stun

# 雷光連閃（lightning-spell-catalog D3）：近戰受擊時反擊提升版麻痺微階
- id: flicker_micro_mark
  when:
    event: physical_hit
    buff_active: lightning_flicker_ward
  then:
    mark_order_op: flicker_stun
