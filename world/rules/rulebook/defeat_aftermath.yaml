# Defeat aftermath rulebook (defeat-aftermath-core D-C8).
#
# Per-section registry: `pg_lines` and `weak_debuff` are the core change's own
# sections, `recovery` belongs to defeat-aftermath-recovery, and `violation`
# belongs to defeat-aftermath-violation-sequence (DA4). Each downstream adult
# change registers its own section validator at load, and unknown sections are
# ignored with one log_warn (forward-compatible single YAML file). A malformed
# owned section fails closed at load.
#
# `pg_lines` holds the PG wake prose. The DA1 writer renders the first line
# deterministically (index 0); the violation sequence rewrites the wake line
# only when at least one violation attempt landed (its own `violated_wake_line`).
pg_lines:
  - "你眼前一黑倒了下去——再次睜開眼時，世界仍在轉動，四肢沉重得不聽使喚。"
weak_debuff:
  buff_key: defeat_weak
# The defeat recovery tax (defeat-aftermath-recovery D-R2): the wake target is
# `ceil(max_hp * wake_fraction)`; the virtual solve runs the stored regen rate
# scaled down by `regen_scale` (0 < scale <= 1), while the real clock advance
# runs the ordinary un-scaled model. `max_recovery_seconds` bounds the
# pathological case and must stay within the clock's one-advance day bound.
recovery:
  regen_scale: 0.5
  max_recovery_seconds: 21600
  wake_fraction: 0.05
# The violation sequence registry (defeat-aftermath-violation-sequence D-V2).
#
# `violated_wake_line` replaces the PG wake prose in the defeat_settle entry
# only when at least one attempt landed; a zero-landed (fully resisted)
# sequence keeps the PG wake template.
#
# `archetypes` keys are monster species names from the lore bestiary
# (MONSTER_TIER_REGISTRY example_monsters_zh) — the durable identity a
# wilderness population monster carries as its key. Every row declares:
#   victory_pleasure_delta    pleasure points every living winner gains at
#                             settlement, on top of mid-fight accumulation
#                             (arousal is derived from pleasure)
#   threshold_ordinal         the arousal ordinal (0..4) the violator must
#                             reach before its sequence starts
#   attempt_cap               maximum attempts for one violator per victory
#   attempt_duration_seconds  world time each executed attempt spends
#   landed_deltas             pleasure points applied to victim/aggressor
#                             when the resist contest is beaten
#   resisted_deltas           shrunk pleasure points applied on a resisted
#                             attempt (no counter credits on resistance)
#   credited_counters         lifetime counters credited symmetrically to
#                             both bodies per landed attempt (DA3 convention)
# A monster whose key has no row never starts a sequence: the miss is logged
# and the PG variant proceeds (never raises, never blocks settlement).
violation:
  violated_wake_line: "意識回籠時，渾身酸軟、衣衫不整，身體深處殘留著陌生的餘溫——你狼狽地撐起身子，不太敢回想剛才發生了什麼事。"
