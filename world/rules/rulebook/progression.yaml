# These progression values are deliberately provisional balance constants.
# Recalibrate them after combat and guild-economy playtesting supplies live data.
skill_proficiency_xp_per_level: 50
skill_practice_xp_per_use: 1.0
# Element-affinity multipliers (element-affinity-progression D5).
affinity_element_multiplier: 1.1
non_affinity_element_multiplier: 0.9
# Closed freeform-casting scale set (element-mastery-freeform-casting D1):
# ascending, unique, finite and positive, exactly one 1.0 entry, non-empty
# labels. Every consumer reads this one table; no consumer hard-codes the set.
freeform_cast_scales:
  - { scale: 0.25, label: "1/4" }
  - { scale: 0.5, label: "1/2" }
  - { scale: 1.0, label: "1" }
  - { scale: 2.0, label: "2" }
  - { scale: 4.0, label: "4" }
# Derived tip cap for a skill nobody consumes in the prerequisite graph
# (use-driven-progression D6): practice saturates once
# skill_proficiency_level >= cap. Non-canopy caps derive from the registry's
# reverse-edge map, never from per-skill hand-tuned data.
proficiency_tip_cap: 10
# Freeform scale ladder (use-driven-progression D5): the mastery-entitled
# scale set a skill's OWN proficiency unlocks. Rungs are canonical scale
# values with ascending integer levels, the first rung exactly level 0.
freeform_scale_ladder:
  - { scale: 0.25, min_level: 0 }
  - { scale: 0.5, min_level: 1 }
  - { scale: 1.0, min_level: 3 }
  - { scale: 2.0, min_level: 6 }
  - { scale: 4.0, min_level: 10 }
