- id: poison_agility_penalty
  when: {buff_active: poisoned}
  then: {agility: "-10%"}
- id: paralysis_locks_actions
  when: {buff_active: paralysis}
  then: {actions_per_turn: 0}
- id: fear_agility_and_accuracy_penalty
  when: {buff_active: fear}
  then: {agility: "-15%", accuracy: -10}
- id: focus_accuracy_boost
  when: {buff_active: focus}
  then: {accuracy: 10}
- id: high_arousal_agility_accuracy_penalty
  when: {field: arousal, gte: 高度}
  then: {agility: "-20%", accuracy: -15}
- id: climax_in_progress_locks_actions
  when: {field: climax_phase, equals: 進行中}
  then: {actions_per_turn: 0}
- id: high_exposure_defense_penalty
  # 露出 (exposure) at the second-highest level — raised exposure is a felt
  # defense cost in combat; the flat integer matches every other `defense`
  # row (defense has no percentage-aware consumer in this codebase).
  when: {field: exposure, gte: 高}
  then: {defense: -15}
- id: defense_instinct_defense_bonus
  # 防禦直覺 (defense_instinct, passive_buff:defense_small) — "被動強化自身的
  # 防禦能力" reads as a small flat `defense` bonus; the value enters damage
  # mitigation as a flat addition to the defender's effective defense.
  when: {skill_owned: defense_instinct}
  then: {defense: 5}
- id: blade_art_mastery_accuracy_bonus
  # 劍術精通 (blade_art_mastery, passive_buff:blade_arts) — "被動提昇劍術相關
  # 技能的效果" reads as sword-family accuracy; there is no per-family damage
  # adjustment field, so the closest existing field is a flat `accuracy` bonus.
  when: {skill_owned: blade_art_mastery}
  then: {accuracy: 5}
- id: extreme_endurance_sp_cost_reduction
  # 極限耐力 (extreme_endurance, passive_buff:endurance_extreme) — "被動強化
  # 自身的耐力上限" reads as stamina preservation; the percentage `sp_cost`
  # value reduces the SP cost in both the resource check and the deduction.
  when: {skill_owned: extreme_endurance}
  then: {sp_cost: "-10%"}
- id: magic_circle_comprehension_accuracy_bonus
  # 魔法陣理解 (magic_circle_comprehension, passive_buff:magic_circle_comprehension)
  # — "被動提昇對魔法陣的理解與運用" reads as spell accuracy; the closest
  # existing field is the flat `accuracy` bonus.
  when: {skill_owned: magic_circle_comprehension}
  then: {accuracy: 5}
- id: precise_mana_control_mp_cost_reduction
  # 精準魔力控制 (precise_mana_control, passive_buff:mana_precision) — "被動
  # 強化對魔力的精準控制" reads as MP-cost reduction; the percentage `mp_cost`
  # value reduces the MP cost in both the resource check and the deduction,
  # distinct from magic_circle_comprehension's accuracy so the two adjustments
  # stay independently readable.
  when: {skill_owned: precise_mana_control}
  then: {mp_cost: "-10%"}
- id: retainer_martial_training_atk_phys_bonus
  # 隨從武藝訓練 (retainer_martial_training, passive_buff:retainer_training) —
  # "被動提昇隨從角色的武藝水準" reads as a flat `atk_phys` bonus; the value
  # enters physical damage magnitude as a flat addition to the attacker's
  # effective physical attack. Defense stays the guardian/instinct pair's field.
  when: {skill_owned: retainer_martial_training}
  then: {atk_phys: 5}
- id: guardian_instinct_defense_bonus
  # 守護直覺 (guardian_instinct, passive_buff:guardian_instinct) — "被動強化
  # 守護同伴的直覺" has no protect/cover mechanic to hook into, so it grants a
  # flat `defense` bonus consistent with guarding; the value enters damage
  # mitigation like defense_instinct's.
  when: {skill_owned: guardian_instinct}
  then: {defense: 5}
- id: reincarnation_boon_yuka_agility_bonus
  # 轉生祝福·悠花 (reincarnation_boon_yuka, combat_prediction:武感) — battle
  # prediction reads as initiative/evasion, both of which resolve through
  # agility in this engine, so the adjustment is a percentage `agility` bonus.
  when: {skill_owned: reincarnation_boon_yuka}
  then: {agility: "+5%"}
- id: dual_wield_style_atk_phys_bonus
  # 雙持劍術 (dual_wield_style, weapon_style:dual_wield) — "同時揮舞兩把武器進行
  # 戰鬥的架式" reads as raw two-weapon offense; the flat `atk_phys` bonus
  # enters physical damage magnitude (the same vocabulary as
  # retainer_martial_training_atk_phys_bonus), matching its magnitude.
  when: {skill_owned: dual_wield_style, dual_wielding: true}
  then: {atk_phys: 5}
- id: sister_vestment_grace
  # 光明教會恩典 (以坦露為聖、性之歡愉為至高恩賜): 修女聖袍 (sister_vestments)
  # 穿戴者於中等興奮 (敬拜的虔誠) 時獲得防禦 +4 — 獨立於護甲本身的數值,
  # 階級低於聖女聖袍的 +6。
  when: {equipment_worn: sister_vestments, field: arousal, gte: 中等}
  then: {defense: 4}
- id: saintess_vestment_grace
  # 聖女聖袍 (saintess_vestments) — 更高聖職, 中等興奮時防禦 +6。
  when: {equipment_worn: saintess_vestments, field: arousal, gte: 中等}
  then: {defense: 6}
- id: holy_emblem_grace
  # 光輝聖徽 (radiant_holy_emblem) — 女神回應敬拜, 高度興奮 (狂喜) 時
  # 治療 +10%, 由 P2 的 heal 漏斗 (heal_gain 百分比) 消費。
  when: {equipment_worn: radiant_holy_emblem, field: arousal, gte: 高度}
  then: {heal_gain: "+10%"}
- id: pilgrim_medallion_grace
  # 朝聖者銅符 (pilgrim_medallion) — 朝聖旅途的虔誠, 微興奮即得防禦 +2。
  when: {equipment_worn: pilgrim_medallion, field: arousal, gte: 微興奮}
  then: {defense: 2}