# Light Church rulebook slice (implement-church-foundation §1/§2; design doc
# 2026-09-22-church-system-design §4.3).
#
# A sectioned rule table: every row carries a unique `id` and a `section`
# discriminator; the remaining keys are the row's data mapping, interpreted
# by world/rules/church_rulebook.py (the loader family seam in
# world/rules/rulebook/schema.py::load_sectioned_rules). One-row-one-test
# correspondence applies exactly like combat_modifiers.yaml: every row id
# below has exactly one test_rule_<id> in
# world/rules/tests/test_church_rulebook.py (audited mechanically by
# world/rules/tests/test_rule_id_test_correspondence.py).
#
# Tuning finals (decide-and-record tasks 1.1/1.2 — every downstream church
# change prices against these; the 16-key redemption price-band final is
# owned by implement-church-redemption):
#   - acceptance curve: owner-pinned ordinal 0 = 50%, strictly monotonic to
#     100% at the top ordinal (高度/極限, ordinal 4); intermediates are the
#     proposal's 65 / 80 / 90. The loader monotonicity gate rejects any
#     retune that breaks the invariant.
#   - pray: 600 s duration, +40 merit, daily cap 3/day. The +1 daily-cap
#     from the order-catalogue change's rite_morning_devotion is NOT
#     shipped here.
#   - accrual: pray_completed +40 (cap 3/day), offering_accepted per-row
#     merit (values ride the OFFERING_CATALOG rows), climax_while_enrolled
#     +10 (small).
#   - offering copper payout: integer band 20..80, per-row overrides keyed
#     by offering row key (empty at this stage — the seed offering rows stay
#     inert until implement-church-accrual wires the offering rail);
#     enrollment required.
#   - passive_effects: the rulebook home of PASSIVE redemption-catalogue
#     effects. Series A ships here with implement-church-redemption (the
#     three legacy clergy passives declare identity classifiers — their
#     mechanics ride the pre-existing state-reaction rails
#     (state_reactions.yaml / combat_modifiers.yaml), so their category row
#     is the pure-positive identity multiplier the polarity gate requires;
#     vow_of_service owns the offering copper +25% and offering/climax
#     merit +10% ledger multipliers, consumed by world/rules/church.py).
#     Series C rows (order-catalogue change) append after this change.
#     The loader's polarity gate and its one-to-one PASSIVE-row association
#     bind every row added here.

# 5 acceptance rows — NPC arousal ordinal 0..4 -> accept percent.
- id: accept_ordinal_0
  section: acceptance
  ordinal: 0
  accept_percent: 50
- id: accept_ordinal_1
  section: acceptance
  ordinal: 1
  accept_percent: 65
- id: accept_ordinal_2
  section: acceptance
  ordinal: 2
  accept_percent: 80
- id: accept_ordinal_3
  section: acceptance
  ordinal: 3
  accept_percent: 90
- id: accept_ordinal_4
  section: acceptance
  ordinal: 4
  accept_percent: 100

# 1 pray row — duration seconds, merit per pray, daily cap.
- id: pray
  section: pray
  duration_seconds: 600
  merit_per_pray: 40
  daily_cap: 3

# 3 accrual rows — rulebook merit accrual values.
- id: accrual_pray_completed
  section: accrual
  merit: 40
  daily_cap: 3
- id: accrual_offering_accepted
  section: accrual
  per_row: true
- id: accrual_climax_while_enrolled
  section: accrual
  merit: 10
# 3 utility rites rows (Series E)
- id: rite_morning_devotion
  section: accrual
  skill_key: rite_morning_devotion
  daily_cap: 1
- id: rite_shelter
  section: accrual
  skill_key: rite_shelter
  rest_bonus: 25
- id: rite_martial_blessing
  section: accrual
  skill_key: rite_martial_blessing
  stat: defense
  magnitude: 10
  cooldown_seconds: 1800

# 2 offering rows — copper payout band (int copper) and the enrollment gate.
- id: offering_payout_band
  section: offering
  copper_lo: 20
  copper_hi: 80
  overrides: {}
- id: offering_enrollment_required
  section: offering
  enrollment_required: true

# 4 passive_effects rows — one keyed effect row per PASSIVE redemption-
# catalogue row (Series A; the polarity gate requires the one-to-one
# association). The three legacy passives carry the identity multiplier:
# their mechanics are the pre-existing pain/recovery/climax rails declared
# in state_reactions.yaml and combat_modifiers.yaml, and they add no
# church-economy numbers — a 1.0 identity is the honest pure-positive
# classification (no invented tuning).
- id: passive_pain_to_pleasure
  section: passive_effects
  skill_key: pain_to_pleasure
  effects:
    multiplier: 1.0
- id: passive_priestly_grace
  section: passive_effects
  skill_key: priestly_grace
  effects:
    multiplier: 1.0
- id: passive_rapture_renewal
  section: passive_effects
  skill_key: rapture_renewal
  effects:
    multiplier: 1.0
# vow_of_service (侍奉之誓): offering copper +25% and offering/climax
# merit +10% — pure ledger multipliers, applied to the offering/climax
# channels only (pray is untouched) by world/rules/church.py.
- id: passive_vow_of_service
  section: passive_effects
  skill_key: vow_of_service
  effects:
    copper_percent: 25
    merit_percent: 10
# 5 Series C discipline passives (pure-positive only)
# poverty_vow (清貧之誓): offering copper +25% and pray merit +25% —
# pure ledger multipliers, pure-positive per the iron rule.
- id: passive_poverty_vow
  section: passive_effects
  skill_key: poverty_vow
  effects:
    copper_percent: 25
    pray_merit_percent: 25
# obedience (順從戒律): merit doubled (x2) while under a domination/submission status.
- id: passive_obedience
  section: passive_effects
  skill_key: obedience
  effects:
    multiplier: 2.0
# chastity_discipline (貞潔戒律): pray merit +50%.
- id: passive_chastity_discipline
  section: passive_effects
  skill_key: chastity_discipline
  effects:
    pray_merit_percent: 50
# temple_endurance (神殿之忍): mitigates the existing high-arousal defense
# penalty (high_exposure_defense_penalty) by 25% (0.75 penalty-mitigation scale).
- id: passive_temple_endurance
  section: passive_effects
  skill_key: temple_endurance
  effects:
    mitigation:
      high_exposure_defense_penalty: 25%
# public_devotion (公開奉獻): merit from acts in public venues +30%.
- id: passive_public_devotion
  section: passive_effects
  skill_key: public_devotion
  effects:
    merit_percent: 30
