# Tunable guild-economy balance data (guild-economy D-1/D-8).
# All money values are integer copper. Strictly increasing E-through-S merit
# thresholds, exam opponent profiles and quest rewards are joined to immutable
# lore identities by the catalog loader in world/rules/guild_config.py. The
# service-host roster is DERIVED from the place registry
# (world/lore/settlements/places.py) — a host is declared exactly once, never
# here. Commerce balance (assortment offers and shop hours) lives in the
# sibling rulebook directory commerce/ (settlement-shops design §3.1).
#
# Cumulative true `guild_merit` required to be eligible for each rank's exam.
merit_thresholds:
  E: 50
  D: 150
  C: 400
  B: 900
  A: 2000
  S: 5000

# Hand-written quest rewards, joined to quest definitions by definition_key.
# The six regional species hunts below are the approved published commissions of
# `monster-regional-species-hunts`; their copper sits inside the rank's own band
# (F 10-100, E 100-500, D 500-5000) and their merit is authored per rank, inside
# the span to the next rank's examination threshold. The three bound site
# clear-outs of `monster-site-clear-out-hunts` follow the same rules and carry no
# item: monster loot is the monster side's business, not a commission's.
quest_rewards:
  - definition_key: introductory_hunt
    reward:
      copper: 50
      items:
        - item_key: healing_potion
          quantity: 2
      merit: 25
  - definition_key: eastern_plains_sway_whistle_sparrow
    reward:
      copper: 40
      items: []
      merit: 20
  - definition_key: eastern_plains_ridge_burrow_hare
