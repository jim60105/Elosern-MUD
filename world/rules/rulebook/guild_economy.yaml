# Tunable guild-economy balance data (guild-economy D-1/D-8).
# All money values are integer copper. Strictly increasing E-through-S merit
# thresholds, exam opponent profiles, and per-shop price/hour/stock values are
# joined to immutable lore identities by the catalog loader in
# world/rules/guild_config.py.

# Cumulative true `guild_merit` required to be eligible for each rank's exam.
merit_thresholds:
  E: 50
  D: 150
  C: 400
  B: 900
  A: 2000
  S: 5000

# Hand-written quest rewards, joined to quest definitions by definition_key.
quest_rewards:
  - definition_key: introductory_hunt
    reward:
      copper: 50
      items:
        - item_key: healing_potion
          quantity: 2
      merit: 25

# Guild examination opponent profiles, keyed by the target rank. Physical stats
# must lie inside the required StaticTier band and every skill key must exist.
exam_profiles:
  E:
    static_tier: human_adventurer
    hp: 100
    mp: 100
    sp: 100
    atk_phys: 8
    agility: 8
    defense: 7
    magic_power: 10
    skills:
      - basic_attack
  D:
    static_tier: human_adventurer
    hp: 110
    mp: 100
    sp: 100
    atk_phys: 9
    agility: 9
    defense: 8
    magic_power: 12
    skills:
      - basic_attack
  C:
    static_tier: human_elite
    hp: 130
    mp: 110
    sp: 110
    atk_phys: 12
    agility: 12
    defense: 11
    magic_power: 20
    skills:
      - basic_attack
  B:
    static_tier: human_elite
    hp: 145
    mp: 110
    sp: 110
    atk_phys: 14
    agility: 14
    defense: 13
    magic_power: 25
    skills:
      - basic_attack
  A:
    static_tier: human_veteran
    hp: 170
    mp: 120
    sp: 120
    atk_phys: 17
    agility: 17
    defense: 16
    magic_power: 30
    skills:
      - basic_attack
  S:
    static_tier: human_swordmaster
    hp: 200
    mp: 120
    sp: 120
    atk_phys: 20
    agility: 20
    defense: 19
    magic_power: 35
    skills:
      - basic_attack

