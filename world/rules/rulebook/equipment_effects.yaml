# Equipment-effect rulebook (add-equipment-effect-rulebook).
#
# One entry per registered equipment item, keyed by the item key (identical to
# its EquipmentModifierKey value). Magnitudes live ONLY here; the lore
# registry carries identity. `budgets` caps every authored value per column by
# the item's registered rarity, checked by world/rules/equipment_effects.py at
# load time (rarity is never read at runtime). Percent fields use an explicit
# signed `+N%` / `-N%` string; flat fields are signed integers.
#
# `weapon_damage_multiplier` is authored data, never inferred from rarity or
# progression: the equipment-growth-runtime-calibration change selected the
# physical weapon factors below (1.0-1.28) together with the `weapon_multiplier`
# ceilings, and published the initial/selected values, the neutral exceptions
# and the measured growth in docs/development/human-combat-calibration-evidence.md.
# Weapon-slot entries without a physical attack bonus carry an explicit neutral
# 1.0 declaring no physical bonus; encounter tuning remains owned elsewhere.
budgets:
  common: {flat: 4, percent: 5, soft_percent: 10, bias: 0, gauge: 5, weapon_multiplier: 1.10}
  uncommon: {flat: 6, percent: 8, soft_percent: 15, bias: 1, gauge: 10, weapon_multiplier: 1.15}
  rare: {flat: 8, percent: 10, soft_percent: 20, bias: 1, gauge: 15, weapon_multiplier: 1.25}
  epic: {flat: 10, percent: 12, soft_percent: 25, bias: 2, gauge: 20, weapon_multiplier: 1.30}
  legendary: {flat: 12, percent: 15, soft_percent: 30, bias: 2, gauge: 25, weapon_multiplier: 1.35}
