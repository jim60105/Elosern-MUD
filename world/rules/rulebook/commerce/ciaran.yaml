# 暗影谷村 commerce slice (commerce-rulebook-slices).
# Assortment offer rules bind exact integer buy/sell copper, max/initial stock and
# restock quantity to the immutable item sets in world/lore/settlements/assortments.py;
# the shops section carries the village homes' opening/restock hours. Joined by the
# catalog loader in world/rules/guild_config.py with every other rulebook/commerce/*.yaml.
assortments:
  - key: elven_crafted_arms
    offers:
      - item_key: shadow_blade
        buy_copper: 100
        sell_copper: 50
        max_stock: 3
        initial_stock: 1
        restock_quantity: 1
      - item_key: shadow_blade_echo
        buy_copper: 100
        sell_copper: 50
        max_stock: 3
        initial_stock: 1
        restock_quantity: 1
  - key: elven_attire
    offers:
      - item_key: dark_elf_kimono
        buy_copper: 100
        sell_copper: 50
        max_stock: 3
        initial_stock: 1
        restock_quantity: 1
      - item_key: dark_elf_ninja_garb
        buy_copper: 100
        sell_copper: 50
        max_stock: 3
        initial_stock: 1
        restock_quantity: 1
      - item_key: elven_traditional_robe
        buy_copper: 120
        sell_copper: 60
        max_stock: 3
        initial_stock: 1
        restock_quantity: 1
      - item_key: elven_forest_veil
        buy_copper: 150
        sell_copper: 75
        max_stock: 3
        initial_stock: 1
        restock_quantity: 1
  - key: elven_fare
    offers:
      - item_key: elven_candied_blossom
        buy_copper: 20
        sell_copper: 10
        max_stock: 20
        initial_stock: 10
        restock_quantity: 5
  - key: elven_sundries
    offers:
      - item_key: elven_spider_silk
        buy_copper: 60
        sell_copper: 30
        max_stock: 20
        initial_stock: 10
        restock_quantity: 5
      - item_key: crescent_earring
        buy_copper: 120
        sell_copper: 60
        max_stock: 3
        initial_stock: 1
        restock_quantity: 1

# Per-shop opening/closing/restock hours. Hours are in CLOCK_YAML["seconds_per_hour"]
# units relative to the world-day boundary.
shops:
