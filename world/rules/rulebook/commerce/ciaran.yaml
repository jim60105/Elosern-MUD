# 暗影谷村 commerce slice (commerce-rulebook-slices).
# Assortment offer rules bind exact integer buy/sell copper, max/initial stock and
# restock quantity to the immutable item sets in world/lore/settlements/assortments.py;
# the shops section carries the village homes' opening/restock hours. Joined by the
# catalog loader in world/rules/guild_config.py with every other rulebook/commerce/*.yaml.
assortments:
  - key: elven_crafted_arms
    offers:
      - item_key: shadow_blade
        buy_copper: 100
        sell_copper: 50
        max_stock: 3
        initial_stock: 1
        restock_quantity: 1
      - item_key: shadow_blade_echo
        buy_copper: 100
        sell_copper: 50
        max_stock: 3
        initial_stock: 1
        restock_quantity: 1
  - key: elven_attire
    offers:
      - item_key: dark_elf_kimono
        buy_copper: 100
        sell_copper: 50
        max_stock: 3
        initial_stock: 1
        restock_quantity: 1
      - item_key: dark_elf_ninja_garb
        buy_copper: 100
        sell_copper: 50
        max_stock: 3
        initial_stock: 1
        restock_quantity: 1
      - item_key: elven_traditional_robe
        buy_copper: 120
        sell_copper: 60
        max_stock: 3
        initial_stock: 1
        restock_quantity: 1
      - item_key: elven_forest_veil
        buy_copper: 150
        sell_copper: 75
        max_stock: 3
        initial_stock: 1
        restock_quantity: 1
  - key: elven_fare
    offers:
      - item_key: elven_candied_blossom
        buy_copper: 20
        sell_copper: 10
        max_stock: 20
        initial_stock: 10
        restock_quantity: 5
  - key: elven_sundries
    offers:
      - item_key: elven_spider_silk
        buy_copper: 60
        sell_copper: 30
        max_stock: 20
        initial_stock: 10
        restock_quantity: 5
  # ciaran-village-crafts: the adornment maker's shelf. 月牙耳環 moves here
  # verbatim from elven_sundries — same buyer, same numbers, one home is just
  # tidier than the next. 三稜晶符 is an enchanted accessory: the price band
  # floor (magic_accessory opens at 100 gold) is the cheapest the rulebook
  # can say, so the village prices it at the floor; it is still cheaper here
  # than a capital jeweller would ask for the same work.
  - key: elven_adornments
    offers:
      - item_key: prism_charm
        buy_copper: 10000
        sell_copper: 5000
        max_stock: 3
        initial_stock: 1
        restock_quantity: 1
      - item_key: crescent_earring
        buy_copper: 120
        sell_copper: 60
        max_stock: 3
        initial_stock: 1
        restock_quantity: 1
  # The hedge healer's remedies. Both are also capital goods; the village
  # sells them at everyday scale, cheaper than 王都雜貨 per the two-price
  # rule (potion band 50..500).
  - key: elven_remedies
    offers:
      - item_key: greater_healing_potion
        buy_copper: 150
        sell_copper: 75
        max_stock: 5
        initial_stock: 2
        restock_quantity: 2
      - item_key: mana_potion
        buy_copper: 80
        sell_copper: 40
        max_stock: 10
        initial_stock: 5
        restock_quantity: 5

