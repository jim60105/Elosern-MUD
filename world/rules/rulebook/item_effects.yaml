# Declarative item-effect rulebook (add-declarative-item-effects).
# Item mechanics identity (can it be used, is it consumable, may it be used
# in combat) lives in the immutable lore registry; what a use DOES — the
# ordered, typed effect entries — lives here keyed by the ITEM key and is
# read only through the validated loader in world/rules/item_effects.py
# (item-effect-model design §3). The loader aligns this file's item key set
# bi-directionally with the registry's usable items at startup.
# Stat amounts are signed non-zero integers bounded by the loader; every
# entry accepts an optional target scope, and only `self` is accepted until
# add-item-effect-targeting lands.

item_use_seconds: 6

items:
  healing_potion:
    effects:
      - stat: hp
        amount: 40
  greater_healing_potion:
    effects:
      - stat: hp
        amount: 120
  mana_potion:
    effects:
      - stat: mp
        amount: 40
  # Cleansing (add-equipment-immunity-and-attached-buffs D3): the negative
  # removal selector clears every active debuff-polarity instance; a status
  # removal carries no amount by construction.
  baptismal_holy_water:
    effects:
      - remove_status: negative
  # Usable intimacy devices (land-usable-intimacy-items)
  aphrodisiac_bath_salts:
    effects:
      - stat: pleasure
        amount: 8
  slime_lube_gel:
    effects:
      - stat: pleasure
        amount: 8
  hot_kiss_potion:
    effects:
      - stat: pleasure
        amount: 8
  spark_candy:
    effects:
      - stat: pleasure
        amount: 11
  kiss_of_goddess_mist:
    effects:
      - stat: pleasure
        amount: 14
  censer_of_desire:
    effects:
      - stat: pleasure
        amount: 14
  embracing_vine:
    effects:
      - stat: pleasure
        amount: 11
