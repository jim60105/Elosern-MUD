# Shared item-use settings (add-declarative-item-effects).
# What a use DOES — the ordered, typed effect entries — is authored on each
# usable item's own row in content/items/ and read only through the validated
# loader in world/rules/item_effects.py (consolidate-item-authoring D2). The
# loader aligns the authored rows bi-directionally with the registry's usable
# items at startup.
#
# One use charges this canonical out-of-combat time cost through the same
# command-source advance path as casts; the amount is shared by every item and
# is never authored per row.

item_use_seconds: 6
