version: 1
kind: settlement
id: town_steed_plain
location_ref: town_steed_plain
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  central_plaza:
    x_m: 595
    y_m: 595
    prototype_parent: anchor_room
    key: 中央廣場
    desc: 駿原鎮的中央廣場，練馬場就在廣場北邊的草地上。馬蹄聲從早到晚沒有停過，連夜裡都有人在遛馬。
    anchor_key: town_steed_plain
    typeclass:
    scene_archetype: city_street
  northeast_gate:
    x_m: 1090
    y_m: 1090
    prototype_parent: grid_room
    key: 東北門
    desc: 東北門外的路通往翠湖鎮，趕馬的人沿著草原走。路邊每隔一段就有水槽，槽沿被馬啃得坑坑窪窪。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  southwest_gate:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 西南門
    desc: 西南門朝著銀嶺鎮與山口的方向，運草料的車由此進來。草料堆在門外晒，風一吹就捲過半個廣場。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  northeast_gate_road_1:
    x_m: 758
    y_m: 915
    prototype_parent: grid_room
    key: 東北街
    desc: 東北街兩側是馬廄與草料棚，氣味從街頭飄到街尾。拴在簷下的馬見人走近就伸長脖子，等著被摸上一把。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  market_street:
    x_m: 608
    y_m: 757
    prototype_parent: grid_room
    key: 市場街
    desc: 市場街在廣場北側，馬匹與鞍具在此交易。買主會牽著馬繞場走上兩圈，看的是蹄形與肩胛。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  guild_forecourt:
    x_m: 756
    y_m: 535
    prototype_parent: grid_room
    key: 公會前
    desc: 公會前在廣場東側，分會接的多是護送馬隊的委託。出任務的人先在這裡領號，再跟著馬隊出發。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  temple_forecourt:
    x_m: 246
    y_m: 930
    prototype_parent: grid_room
    key: 神殿前
    desc: 神殿前在西北，軍馬出欄前會在此祈福。祭禮簡單，只有一把青草與一瓢清水擺在石階前。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  inn_lane:
    x_m: 380
    y_m: 533
    prototype_parent: grid_room
    key: 客棧巷
    desc: 客棧巷在鎮西，買馬的軍需官在此落腳。院子裡拴著樣馬，半夜還有人提著油燈去看牙口。
    anchor_key:
    typeclass:
    scene_archetype: city_street
