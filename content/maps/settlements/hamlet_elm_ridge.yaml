version: 1
kind: settlement
id: hamlet_elm_ridge
location_ref: hamlet_elm_ridge
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  crossing:
    x_m: 100
    y_m: 182
    prototype_parent: anchor_room
    key: 路口
    desc: 路口往南是駿原鎮的草原路，往北接楓麓鎮的舊道。路旁的榆樹排成一列，樹蔭把路面遮去一半。
    anchor_key: hamlet_elm_ridge
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 農舍前
    desc: 農舍前的空地朝北，屋後的山脊一路緩下去。風從草原那頭吹來，帶著牲畜與乾草的味道。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
  direction: s
- source: homestead_front
  destination: crossing
  direction: n
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: s
    destination_node: crossing
  - return_direction: n
    destination_node: homestead_front
