version: 1
kind: settlement
id: hamlet_flat_plain
location_ref: hamlet_flat_plain
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  crossing:
    x_m: 165
    y_m: 100
    prototype_parent: anchor_room
    key: 岔路口
    desc: 岔路口往東南通往橙花鎮，路旁的果園一直延伸到天邊。春天花開時，整條路都浸在淡淡的花香裡。
    anchor_key: hamlet_flat_plain
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 165
    prototype_parent: grid_room
    key: 農舍前
    desc: 農舍前的西北小路通向銀嶺鎮，屋後是平坦的麥田。院裡曬著一層穀子，雞群在穀堆邊啄食。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
  direction: nw
- source: homestead_front
  destination: crossing
  direction: se
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: nw
    destination_node: crossing
  - return_direction: se
    destination_node: homestead_front
