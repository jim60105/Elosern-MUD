version: 1
kind: settlement
id: hamlet_pool_tail
location_ref: hamlet_pool_tail
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  crossing:
    x_m: 100
    y_m: 192
    prototype_parent: anchor_room
    key: 潭尾岔路
    desc: 岔路在河潭的尾端，水面平靜得像一塊石頭。往西的路通往鹽道城，路口常停著剛洗淨的貨車。
    anchor_key: hamlet_pool_tail
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 屋前碼頭
    desc: 屋前搭了一個簡陋的碼頭，幾隻小舟繫在木樁上。屋主說潭尾水深，冬天也不結冰，魚都聚在這裡。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
  direction: s
- source: homestead_front
  destination: crossing
  direction: n
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: s
    destination_node: crossing
