version: 1
kind: settlement
id: hamlet_reed_bar
location_ref: hamlet_reed_bar
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  crossing:
    x_m: 158
    y_m: 158
    prototype_parent: anchor_room
    key: 路口
    desc: 路口往西南通往東牧鎮，往東北接潮風鎮的海岸路。路旁的荻草長得密實，穗子比人還高。
    anchor_key: hamlet_reed_bar
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 農舍前
    desc: 農舍前的空地朝東北，屋後是河道沖積的沙洲。秋天荻花開時，整片洲子覆著一層白絮。白絮被風捲起，落在水面又慢慢漂走。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
  direction: sw
- source: homestead_front
  destination: crossing
  direction: ne
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: sw
    destination_node: crossing
  - return_direction: ne
    destination_node: homestead_front
