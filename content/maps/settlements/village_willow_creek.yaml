version: 1
kind: settlement
id: village_willow_creek
location_ref: village_willow_creek
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  village_green:
    x_m: 250
    y_m: 250
    prototype_parent: anchor_room
    key: 柳溪井台
    desc: 村中的石井靠著河岸，井水與溪水混著同樣的涼意，柳枝垂到井欄邊掃過水面。
    anchor_key: village_willow_creek
    typeclass:
    scene_archetype: city_street
  village_end_north:
    x_m: 250
    y_m: 462
    prototype_parent: grid_room
    key: 北村口
    desc: 北村口的路往灰岩城方向爬上山坡，路面壓著碎石，兩旁的柳樹把影子投在車轍裡。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  village_end_southwest:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 西南村口
    desc: 西南村口的道路沿著河岸通往西礦港，河面在此變寬，木橋的欄杆被水氣浸成深色。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  shrine_front:
    x_m: 356
    y_m: 250
    prototype_parent: grid_room
    key: 教堂前庭
    desc: 小教堂前的庭地舖著河邊撿來的圓石，東邊的溪面映著柳蔭，禮拜後孩子在水邊戲水。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: village_green
  destination: village_end_north
  direction: n
- source: village_end_north
  destination: village_green
  direction: s
- source: village_green
  destination: village_end_southwest
  direction: sw
- source: village_end_southwest
  destination: village_green
  direction: ne
- source: village_green
  destination: shrine_front
  direction: e
- source: shrine_front
  destination: village_green
  direction: w
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: s
    destination_node: village_end_north
  - return_direction: ne
    destination_node: village_end_southwest
