version: 1
kind: settlement
id: city_salt_ferry
location_ref: city_salt_ferry
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  central_plaza:
    x_m: 1550
    y_m: 595
    prototype_parent: anchor_room
    key: 中央廣場
    desc: 廣場位於鹽津的街心，北面不遠是渡口，空氣裡帶著鹽水與濕麻繩的氣味，鹽車在石階旁排成長列。
    anchor_key: city_salt_ferry
    typeclass:
    scene_archetype: city_street
  northeast_gate:
    x_m: 2045
    y_m: 1090
    prototype_parent: grid_room
    key: 東北門
    desc: 東北門通往合流城，門外大道沿河堤上坡，鹽車在門洞前排成長列，守衛替車伕核對鹽票。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  southwest_gate:
    x_m: 1055
    y_m: 100
    prototype_parent: grid_room
    key: 西南門
    desc: 西南門朝白帆港的方向敞開，門邊的鹽倉終日開著門，夥計忙著過秤，牆面被滷水浸出白痕。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  northeast_gate_road_1:
    x_m: 1744
    y_m: 827
    prototype_parent: grid_room
    key: 鹽道大街
    desc: 鹽道大街從東北門通到廣場，兩旁是鹽行的倉庫，牆面被滷水浸出白痕，挑夫沿著牆根歇肩。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  southwest_gate_road_1:
    x_m: 1377
    y_m: 379
    prototype_parent: grid_room
    key: 渡口大街
    desc: 渡口大街往西南直下河岸，挑夫喊著號子把鹽包從船上搬到車上，木跳板被滷水泡得發黑。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  market_street:
    x_m: 1750
    y_m: 635
    prototype_parent: grid_room
    key: 市場街
    desc: 市場街往東伸展，攤上擺著粗鹽、鹹魚與陶罐，買賣雙方的嗓門都很大，秤砣落下的聲音此起彼落。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  guild_forecourt:
    x_m: 1353
    y_m: 675
    prototype_parent: grid_room
    key: 公會前
    desc: 公會前朝西，簷下坐著等候渡船的冒險者，牆上貼著護鹽的委託，門邊靠著一面舊盾，簷角掛著風乾的魚。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  river_quay:
    x_m: 100
    y_m: 1045
    prototype_parent: grid_room
    key: 河港碼頭
    desc: 河港碼頭在城西的緩流邊，鹽船一艘接一艘靠岸，木跳板被滷水泡得發黑，船伕用長篙撐開水草。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  temple_forecourt:
    x_m: 1947
    y_m: 359
    prototype_parent: grid_room
    key: 神殿前
    desc: 神殿前朝東南，鐘聲越過鹽倉的屋頂，船家在階前把第一撮鹽撒在地上，牆邊堆著還願的陶片。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  inn_lane:
    x_m: 1602
    y_m: 385
    prototype_parent: grid_room
    key: 客棧巷
    desc: 客棧巷朝南，屋裡燒著驅潮的炭火，旅人的斗篷在門後滴著水，樓上傳來翻身的聲響，牆上留著鹽漬的白痕。
    anchor_key:
    typeclass:
    scene_archetype: city_street
