version: 1
kind: settlement
id: hamlet_south_river
location_ref: hamlet_south_river
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  crossing:
    x_m: 100
    y_m: 205
    prototype_parent: anchor_room
    key: 岔路口
    desc: 岔路口往北接往香道城的官道，路面鋪著碎石子。路旁是低窪的草地，雨季時常積起一汪汪淺水。
    anchor_key: hamlet_south_river
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 農舍前
    desc: 農舍前的南邊小路通往金穗港，路邊長著一叢叢耐旱的芒草。屋前立著一根晾衣繩，繩上掛著粗布衣裳。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
  direction: s
- source: homestead_front
  destination: crossing
  direction: n
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: s
    destination_node: crossing
  - return_direction: n
    destination_node: homestead_front
