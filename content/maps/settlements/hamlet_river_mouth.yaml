version: 1
kind: settlement
id: hamlet_river_mouth
location_ref: hamlet_river_mouth
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  crossing:
    x_m: 100
    y_m: 205
    prototype_parent: anchor_room
    key: 岔路口
    desc: 村口的岔路朝北，一條踩出來的土路繞過蘆葦灘。往東南走去，半日便能望見金穗港的桅杆。
    anchor_key: hamlet_river_mouth
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 農舍前
    desc: 農舍前堆著割下的蘆葦，屋簷低得幾乎碰到草叢。院子裡晾著葦簾，簾後不時傳來水鳥拍翅的聲響。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
  direction: s
- source: homestead_front
  destination: crossing
  direction: n
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: s
    destination_node: crossing
