version: 1
kind: settlement
id: hamlet_city_foot
location_ref: hamlet_city_foot
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  crossing:
    x_m: 100
    y_m: 218
    prototype_parent: anchor_room
    key: 城下路口
    desc: 路口就在鹽津城的城牆底下，往來的車隊在此等城門開。城裡飄出的鹽味混著炊煙，一早就漫到路口。
    anchor_key: hamlet_city_foot
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 農舍前
    desc: 農舍前堆著準備送進城裡的柴薪與菜籃，屋後就是沿著城牆走的官道。屋主說城裡的伙房每天都要來收一趟。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
  direction: s
- source: homestead_front
  destination: crossing
  direction: n
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: s
    destination_node: crossing
  - return_direction: n
    destination_node: homestead_front
city_gate:
