version: 1
kind: settlement
id: village_orange_grove
location_ref: village_orange_grove
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  village_green:
    x_m: 243
    y_m: 243
    prototype_parent: anchor_room
    key: 橙蔭綠地
    desc: 綠地被橙樹圍著，井水微甜。村人都說用這口井的水泡茶最好，井邊因此常擺著幾只粗陶茶壺。
    anchor_key: village_orange_grove
    typeclass:
    scene_archetype: city_street
  village_end_southeast:
    x_m: 386
    y_m: 100
    prototype_parent: grid_room
    key: 東南村口
    desc: 東南村口往橙花鎮，路上滿是運橙的推車。果皮落在路面，踩上去一片清香，連鞋底都染上橘色。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  village_end_northwest:
    x_m: 100
    y_m: 386
    prototype_parent: grid_room
    key: 西北村口
    desc: 西北村口接往香道城的商路，樹蔭下歇著挑擔的果販。擔子兩頭還剩幾筐青橙，葉子沒摘，看著格外新鮮。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  shrine_front:
    x_m: 172
    y_m: 172
    prototype_parent: grid_room
    key: 教堂前
    desc: 教堂前朝西南，階旁種著兩株老橙樹。花開時整座教堂都浸在甜香裡，落花鋪滿階前的石板。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: village_green
  destination: village_end_southeast
  direction: se
- source: village_end_southeast
  destination: village_green
  direction: nw
- source: village_green
  destination: village_end_northwest
  direction: nw
- source: village_end_northwest
  destination: village_green
  direction: se
- source: village_green
  destination: shrine_front
  direction: sw
- source: shrine_front
  destination: village_green
  direction: ne
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: nw
    destination_node: village_end_southeast
  - return_direction: se
    destination_node: village_end_northwest
