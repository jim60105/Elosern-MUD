version: 1
kind: settlement
id: hamlet_hemp_slope
location_ref: hamlet_hemp_slope
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  crossing:
    x_m: 174
    y_m: 174
    prototype_parent: anchor_room
    key: 麻坡路口
    desc: 路口的坡面種滿麻，路面落著麻葉，車輪壓過時發出細碎的聲響，坡下的田埂一層疊著一層。
    anchor_key: hamlet_hemp_slope
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 浸麻農舍
    desc: 農舍前的空地攤著浸麻的淺池，往西南的路通往合流城，屋後坡上的麻田順著地勢排開。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
