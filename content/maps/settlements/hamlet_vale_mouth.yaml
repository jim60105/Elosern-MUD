version: 1
kind: settlement
id: hamlet_vale_mouth
location_ref: hamlet_vale_mouth
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  crossing:
    x_m: 205
    y_m: 100
    prototype_parent: anchor_room
    key: 岔路口
    desc: 谷口的岔路口向東通往斷崖鎮，路面在谷地收窄處轉了個彎，兩側是低矮的石砌田埂，彎道上落著一層細土。
    anchor_key: hamlet_vale_mouth
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 農舍前
    desc: 農舍背著谷地西側的緩坡，屋前空地上架著曬穀的木架，往西的車輛會在門口的水槽邊飲馬，槽邊的水痕從沒乾過。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
  direction: w
- source: homestead_front
  destination: crossing
  direction: e
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: w
    destination_node: crossing
  - return_direction: e
    destination_node: homestead_front
