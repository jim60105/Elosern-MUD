version: 1
kind: settlement
id: hamlet_buckwheat_ridge
location_ref: hamlet_buckwheat_ridge
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  crossing:
    x_m: 182
    y_m: 100
    prototype_parent: anchor_room
    key: 路口
    desc: 路口往西接楓麓鎮的舊道，往東通往帝都。路旁的蕎麥剛開花，白得把路面映亮。蜂群在花間盤旋，路上都聽得見嗡嗡聲。
    anchor_key: hamlet_buckwheat_ridge
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 農舍前
    desc: 農舍前的空地朝東，屋後堆著去年留下的蕎麥稈。風一吹，稈堆裡就傳出細碎的響聲，草稈被吹得東倒西歪，孩子在上頭打滾。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
  direction: w
- source: homestead_front
  destination: crossing
  direction: e
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: w
    destination_node: crossing
  - return_direction: e
    destination_node: homestead_front
