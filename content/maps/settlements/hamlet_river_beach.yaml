  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  crossing:
    x_m: 167
    y_m: 100
    prototype_parent: anchor_room
    key: 路口
    desc: 路口往北接帝河津的河岸路，往南通往星輝城。路旁的河灘上散著漂來的木頭，水鳥在淺水裡踱步。
    anchor_key: hamlet_river_beach
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 167
    prototype_parent: grid_room
    key: 農舍前
    desc: 農舍前的空地朝東南，屋後就是河灘。漲水時水面幾乎貼到籬腳，村人把網架高在木樁上。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
  direction: nw
- source: homestead_front
  destination: crossing
  direction: se
