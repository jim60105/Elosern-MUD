version: 1
kind: settlement
id: hamlet_stone_hollow
location_ref: hamlet_stone_hollow
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  crossing:
    x_m: 100
    y_m: 186
    prototype_parent: anchor_room
    key: 石坳路口
    desc: 路口落在石礫環繞的凹地，路面被沖刷出淺溝，雨後積水好幾天不退，往來的人得踩著石塊過。
    anchor_key: hamlet_stone_hollow
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 石坳農舍
    desc: 農舍前的空地以碎石鋪平，往南的路通往遺跡鎮，屋旁堆著從田裡撿出的石塊與斷鋤。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
  direction: s
- source: homestead_front
  destination: crossing
  direction: n
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: s
    destination_node: crossing
  - return_direction: n
    destination_node: homestead_front
