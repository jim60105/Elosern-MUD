version: 1
kind: settlement
id: town_frost_wind
location_ref: town_frost_wind
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  central_plaza:
    x_m: 100
    y_m: 600
    prototype_parent: anchor_room
    key: 霜石坪
    desc: 石坪表面結著一層薄霜，正午才化得開，傍晚又凝回去。往西一里便是海岸，風從水面吹來，帶著鹽與冷意。
    anchor_key: town_frost_wind
    typeclass:
    scene_archetype: city_street
  east_gate:
    x_m: 725
    y_m: 600
    prototype_parent: grid_room
    key: 東面柵門
    desc: 東門外通往鹿鳴渡與月嚎城，門軸上綁著防凍的油布。守門人裹著厚皮裘，仍不時跺腳取暖。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  south_gate:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 南面關門
    desc: 南門朝影林城的方向，門外的小徑沿著海岸的背風側走。往來的人多半低著頭趕路，很少有人停下交談。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  east_gate_road_1:
    x_m: 447
    y_m: 580
    prototype_parent: grid_room
    key: 東門大街
    desc: 大街往東鋪出去，兩旁是石砌的低屋，窗子開得極小。屋簷壓著厚厚的草束，是為了擋住從海上灌來的風。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  market_street:
    x_m: 250
    y_m: 558
    prototype_parent: grid_room
    key: 凍魚市街
    desc: 市街東側擺著凍硬的魚與燻肉，攤主得用短斧把魚敲開分售。貨色不多，價錢卻公道，鎮上的規矩一向如此。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  tribal_hall:
    x_m: 321
    y_m: 344
    prototype_parent: grid_room
    key: 議事廳前庭
    desc: 前庭東南側堆著過冬用的柴薪，牆角掛著幾件補過的皮裘。族人議事時圍著火塘坐，誰也不願離火太遠。
    anchor_key:
    typeclass:
    scene_archetype: city_street
