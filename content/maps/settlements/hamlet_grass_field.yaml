version: 1
kind: settlement
id: hamlet_grass_field
location_ref: hamlet_grass_field
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  crossing:
    x_m: 161
    y_m: 161
    prototype_parent: anchor_room
    key: 岔路口
    desc: 岔路口往東北接上牧道，通往駿原鎮的草場。路旁的草被風壓得貼地，偶爾露出藏在草裡的石塊。
    anchor_key: hamlet_grass_field
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 農舍前
    desc: 農舍前的西南小路通往銀嶺鎮，屋後是一片齊膝的野草。院裡拴著一匹矮馬，馬尾不時掃過籬笆。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
  direction: sw
- source: homestead_front
  destination: crossing
  direction: ne
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: sw
    destination_node: crossing
  - return_direction: ne
    destination_node: homestead_front
city_gate:
