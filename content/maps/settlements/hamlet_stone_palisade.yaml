version: 1
kind: settlement
id: hamlet_stone_palisade
location_ref: hamlet_stone_palisade
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  crossing:
    x_m: 100
    y_m: 198
    prototype_parent: anchor_room
    key: 寨門路口
    desc: 路口的寨門以石塊與木樁疊成，門內的院子窄小，守望的人坐在門邊，把長矛靠在牆上。
    anchor_key: hamlet_stone_palisade
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 寨內農舍
    desc: 農舍前的空地曬著麥束與羊毛，往南的路通往遺跡鎮，寨牆外的坡地空曠無遮。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
  direction: s
- source: homestead_front
  destination: crossing
  direction: n
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: s
    destination_node: crossing
  - return_direction: n
    destination_node: homestead_front
