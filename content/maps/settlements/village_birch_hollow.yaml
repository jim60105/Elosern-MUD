version: 1
kind: settlement
id: village_birch_hollow
location_ref: village_birch_hollow
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  village_green:
    x_m: 278
    y_m: 163
    prototype_parent: anchor_room
    key: 樺林綠地
    desc: 綠地藏在樺樹林邊，井水帶著樹根的清苦味。夏天樹蔭濃得發暗，村人把午睡的草蓆鋪在井旁。
    anchor_key: village_birch_hollow
    typeclass:
    scene_archetype: city_street
  village_end_northeast:
    x_m: 404
    y_m: 289
    prototype_parent: grid_room
    key: 東北村口
    desc: 東北村口沿著往帝都的大路穿出坳口，樺樹在路邊排成長列。樹皮剝落的地方露出白木，遠看像一排旗幟。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  village_end_west:
    x_m: 100
    y_m: 163
    prototype_parent: grid_room
    key: 西村口
    desc: 西村口往楓麓鎮，路穿過一片低矮的樺林。秋天落葉鋪滿路面，走過去腳下作響，車輪壓過時聲音更沉。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  shrine_front:
    x_m: 341
    y_m: 100
    prototype_parent: grid_room
    key: 教堂前
    desc: 教堂前的空地面向東南，晨霧散得比坳外晚。石牆上爬著藤蔓，雨後總掛著水珠。晴天時，藤葉的影子落在石階上。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: village_green
  destination: village_end_northeast
  direction: ne
- source: village_end_northeast
  destination: village_green
  direction: sw
- source: village_green
  destination: village_end_west
  direction: w
- source: village_end_west
  destination: village_green
  direction: e
- source: village_green
  destination: shrine_front
  direction: se
- source: shrine_front
  destination: village_green
  direction: nw
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: sw
    destination_node: village_end_northeast
  - return_direction: e
    destination_node: village_end_west
