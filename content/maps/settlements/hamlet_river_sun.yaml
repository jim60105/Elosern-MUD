  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  crossing:
    x_m: 174
    y_m: 174
    prototype_parent: anchor_room
    key: 河陽岔路
    desc: 岔路在大河的北岸，腳下的路比河面高出許多。往東北的路通往鹽津城，河風把路旁的旗子吹得直響。
    anchor_key: hamlet_river_sun
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 農舍前
    desc: 農舍前朝東北，屋後就是河岸的斜坡。屋主在坡上種了一排柳樹，根抓著土，免得岸邊繼續崩落。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
  direction: sw
- source: homestead_front
  destination: crossing
  direction: ne
