version: 1
kind: settlement
id: village_cattle_ridge
location_ref: village_cattle_ridge
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  village_green:
    x_m: 217
    y_m: 217
    prototype_parent: anchor_room
    key: 井邊空地
    desc: 村中央的空地圍著一口石井，井欄被牛繩磨出深痕，清晨的牛群在井邊排成一列等著飲水。
    anchor_key: village_cattle_ridge
    typeclass:
    scene_archetype: city_street
  village_end_northeast:
    x_m: 334
    y_m: 334
    prototype_parent: grid_room
    key: 東北村口
    desc: 東北村口的土路順著稜線爬向葡萄鎮，路旁晾著餵牛的乾草，風一吹就有草屑飛過坡面。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  village_end_southwest:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 西南村口
    desc: 西南村口朝著聖潔王都的方向開，路緣的界石被牛角頂得歪斜，遠望是層層疊起的丘陵。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  shrine_front:
    x_m: 275
    y_m: 159
    prototype_parent: grid_room
    key: 教堂前庭
    desc: 小教堂前的庭地壓著碎石，禮拜散場後牧人靠在矮牆邊閒談，東南方的谷地總積著一層薄霧。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: village_green
  destination: village_end_northeast
  direction: ne
- source: village_end_northeast
  destination: village_green
  direction: sw
- source: village_green
  destination: village_end_southwest
  direction: sw
- source: village_end_southwest
  destination: village_green
  direction: ne
- source: village_green
  destination: shrine_front
  direction: se
- source: shrine_front
  destination: village_green
  direction: nw
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: sw
    destination_node: village_end_northeast
  - return_direction: ne
    destination_node: village_end_southwest
