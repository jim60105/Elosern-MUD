version: 1
kind: settlement
id: village_linden_ridge
location_ref: village_linden_ridge
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  village_green:
    x_m: 295
    y_m: 169
    prototype_parent: anchor_room
    key: 椴嶺綠地
    desc: 綠地位在嶺脊的平處，井口比一路的田都高。打水要走上幾步石階，桶裡的水卻比坡下的甜。
    anchor_key: village_linden_ridge
    typeclass:
    scene_archetype: city_street
  village_end_northeast:
    x_m: 433
    y_m: 307
    prototype_parent: grid_room
    key: 東北村口
    desc: 東北村口順著嶺線往魔晶鎮，路邊的椴樹遮出一段陰涼。夏天趕路的人都在這裡卸下擔子歇一陣。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  village_end_west:
    x_m: 100
    y_m: 169
    prototype_parent: grid_room
    key: 西村口
    desc: 西村口朝黑土鎮的方向下嶺，坡道陡得車輪要加楔木。路旁堆著備用的石塊，供人填補被雨水沖出的坑。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  shrine_front:
    x_m: 364
    y_m: 100
    prototype_parent: grid_room
    key: 教堂前
    desc: 教堂前的小廣場朝東南，嶺上的風把旗繩吹得筆直。石階下擺著幾盆耐旱的花草。花盆排成一列，擋住嶺上吹來的風。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: village_green
  destination: village_end_northeast
  direction: ne
- source: village_end_northeast
  destination: village_green
  direction: sw
- source: village_green
  destination: village_end_west
  direction: w
- source: village_end_west
  destination: village_green
  direction: e
- source: village_green
  destination: shrine_front
  direction: se
- source: shrine_front
  destination: village_green
  direction: nw
