version: 1
kind: settlement
id: hamlet_mulberry_garden
location_ref: hamlet_mulberry_garden
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  crossing:
    x_m: 192
    y_m: 100
    prototype_parent: anchor_room
    key: 路口
    desc: 兩條路在此交會：一條往西去麥浪城，一條往東去日出鎮。路邊的桑園連成一片，葉子被採得只剩枝梢。
    anchor_key: hamlet_mulberry_garden
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 農舍前
    desc: 農舍前的空地朝東，屋簷下擺著幾隻養蠶的竹匾。春天蠶食桑葉的聲音，整夜都不停。竹匾裡的蠶已經三眠，吃葉的聲音更密。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
  direction: w
- source: homestead_front
  destination: crossing
  direction: e
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: w
    destination_node: crossing
  - return_direction: e
    destination_node: homestead_front
