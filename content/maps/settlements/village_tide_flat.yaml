version: 1
kind: settlement
id: village_tide_flat
location_ref: village_tide_flat
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  village_green:
    x_m: 100
    y_m: 307
    prototype_parent: anchor_room
    key: 潮埔綠地
    desc: 綠地位在一片平坦的灘地上，井挖得不深就能見水。地面還留著潮水退去後的細紋，井台上晾著洗淨的漁線。
    anchor_key: village_tide_flat
    typeclass:
    scene_archetype: city_street
  village_end_north:
    x_m: 100
    y_m: 514
    prototype_parent: grid_room
    key: 北村口
    desc: 北村口朝向鹽津城，路兩旁是成塊圍起來的鹽田。曬鹽的人把木耙擱在田埂上，白鹽在日光下晃眼。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  village_end_south:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 南村口
    desc: 南村口順著灘地伸向漁灣鎮，路面在雨季會積一層薄水。路口立著一根潮位木樁，刻痕記著歷年來的大潮。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  shrine_front:
    x_m: 204
    y_m: 307
    prototype_parent: grid_room
    key: 教堂前灘
    desc: 教堂前的空地朝東，灘地在此漸次升高。退潮時孩子會到階下的淺水裡撿貝，鐘聲一響便各自散去。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: village_green
  destination: village_end_north
  direction: n
- source: village_end_north
  destination: village_green
  direction: s
- source: village_green
  destination: village_end_south
  direction: s
- source: village_end_south
  destination: village_green
  direction: n
- source: village_green
  destination: shrine_front
  direction: e
- source: shrine_front
  destination: village_green
  direction: w
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: s
    destination_node: village_end_north
  - return_direction: n
    destination_node: village_end_south
