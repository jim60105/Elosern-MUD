version: 1
kind: settlement
id: hamlet_fallow_knoll
location_ref: hamlet_fallow_knoll
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  crossing:
    x_m: 186
    y_m: 100
    prototype_parent: anchor_room
    key: 路口
    desc: 路口往西通往麥浪城，往東是日出鎮的方向。路旁的田荒了幾季，草叢裡藏著野兔的窩。田埂上長滿野草，走過去驚起成群的麻雀。
    anchor_key: hamlet_fallow_knoll
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 農舍前
    desc: 農舍前的空地朝東，屋後的地界上立著一塊舊石。村人說等雨水足了，這片地還要再種一輪。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
  direction: w
- source: homestead_front
  destination: crossing
  direction: e
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: w
    destination_node: crossing
  - return_direction: e
    destination_node: homestead_front
