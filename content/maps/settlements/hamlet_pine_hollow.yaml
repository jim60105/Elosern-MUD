version: 1
kind: settlement
id: hamlet_pine_hollow
location_ref: hamlet_pine_hollow
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  crossing:
    x_m: 195
    y_m: 100
    prototype_parent: anchor_room
    key: 松林路口
    desc: 路口藏在松林凹處，路面積著厚厚的松針，腳步聲被吸得幾乎聽不見，只有風穿過樹梢的低鳴。
    anchor_key: hamlet_pine_hollow
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 松屋農舍
    desc: 農舍前的空地堆著劈好的松柴，西邊的路往蜜谷方向，屋後的松林在黃昏時分顯得格外深。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
  direction: w
- source: homestead_front
  destination: crossing
  direction: e
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: w
    destination_node: crossing
  - return_direction: e
    destination_node: homestead_front
