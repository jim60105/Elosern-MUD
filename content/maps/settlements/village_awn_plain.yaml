version: 1
kind: settlement
id: village_awn_plain
location_ref: village_awn_plain
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  village_green:
    x_m: 243
    y_m: 243
    prototype_parent: anchor_room
    key: 芒原綠地
    desc: 綠地中間的井臺用青石砌成，井邊長著一圈芒草。風起時芒花掃過井欄，像一層薄薄的白霧。
    anchor_key: village_awn_plain
    typeclass:
    scene_archetype: city_street
  village_end_north:
    x_m: 243
    y_m: 445
    prototype_parent: grid_room
    key: 北村口
    desc: 北村口往麥浪城，路筆直穿過大片芒草原。秋後芒花全開，路兩旁白成一片，遠處的城牆都看不清。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  village_end_southwest:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 西南巷尾
    desc: 村子西南的巷尾通向帝都的官道，路邊立著一座指路的石堆。往來的人在此添一塊石頭，堆得比人還高。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  shrine_front:
    x_m: 344
    y_m: 243
    prototype_parent: grid_room
    key: 教堂前
    desc: 教堂前的空地朝東，最早接到日頭。階下種著一排芒草，秋天時穗子垂到石面上。草葉被風壓低，像是向階上的人行禮。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: village_green
  destination: village_end_north
  direction: n
- source: village_end_north
  destination: village_green
  direction: s
- source: village_green
  destination: village_end_southwest
  direction: sw
- source: village_end_southwest
  destination: village_green
  direction: ne
- source: village_green
  destination: shrine_front
  direction: e
- source: shrine_front
  destination: village_green
  direction: w
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: s
    destination_node: village_end_north
  - return_direction: ne
    destination_node: village_end_southwest
