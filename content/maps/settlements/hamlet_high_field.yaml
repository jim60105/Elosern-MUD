version: 1
kind: settlement
id: hamlet_high_field
location_ref: hamlet_high_field
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  crossing:
    x_m: 186
    y_m: 100
    prototype_parent: anchor_room
    key: 岔路口
    desc: 岔路口往東接上官道，東邊是空曠的高地。站在路口能望見東南方向的東灣港，天氣好時連海色都看得分明。
    anchor_key: hamlet_high_field
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 農舍前
    desc: 農舍前的西邊小路接上香道城方向的商道，路邊的草長得齊膝。屋前有一方小菜圃，圃邊圍著歪斜的木欄。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
  direction: w
- source: homestead_front
  destination: crossing
  direction: e
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: w
    destination_node: crossing
  - return_direction: e
    destination_node: homestead_front
city_gate:
