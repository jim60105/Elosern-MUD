version: 1
kind: settlement
id: hamlet_grass_ridge
location_ref: hamlet_grass_ridge
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  crossing:
    x_m: 176
    y_m: 176
    prototype_parent: anchor_room
    key: 嶺上岔路
    desc: 岔路順著草嶺的稜線分開，往西南的路沿坡緩下。路旁的草長到膝蓋高，風一來就整片低頭。
    anchor_key: hamlet_grass_ridge
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 屋前棚下
    desc: 屋簷下掛著成串的乾草藥，棚裡堆著羊毛與麻繩。屋主說北邊的坡地草質最好，羊群整個夏天都在那裡。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
  direction: sw
- source: homestead_front
  destination: crossing
  direction: ne
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: sw
    destination_node: crossing
  - return_direction: ne
    destination_node: homestead_front
city_gate:
