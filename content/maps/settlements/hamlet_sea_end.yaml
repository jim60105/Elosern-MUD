version: 1
kind: settlement
id: hamlet_sea_end
location_ref: hamlet_sea_end
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  crossing:
    x_m: 100
    y_m: 174
    prototype_parent: anchor_room
    key: 海尾路口
    desc: 路口在海岸路的盡頭，路邊堆著曬鹽的木盤，海風把細沙吹上路面，走起來腳下不斷打滑。
    anchor_key: hamlet_sea_end
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 灘邊農舍
    desc: 農舍前的空地晾著漁獲與繩索，往南的路通往西礦港，屋後就是潮水退去的灘地。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
  direction: s
- source: homestead_front
  destination: crossing
  direction: n
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: s
    destination_node: crossing
  - return_direction: n
    destination_node: homestead_front
