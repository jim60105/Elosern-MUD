    prototype_parent: anchor_room
    key: 原上岔路
    desc: 岔路在一片乾旱的平原上，四周只有矮草與碎石。往西南的路直通南潮港，路上幾乎沒有遮蔭。
    anchor_key: hamlet_dry_plain
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 農舍前
    desc: 農舍前豎著一根高高的木桿，掛布條給遠處的車隊指路。屋後有一個雨窖，存著得來不易的雨水。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
