version: 1
kind: settlement
id: hamlet_bulrush_dike
location_ref: hamlet_bulrush_dike
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  crossing:
    x_m: 100
    y_m: 182
    prototype_parent: anchor_room
    key: 小徑口
    desc: 路口往南的小徑接上河堤，堤外的水面長著成片的蒲草。蒲穗在風裡搖，驚起藏在叢裡的水鳥。
    anchor_key: hamlet_bulrush_dike
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 農舍前
    desc: 農舍前的空地朝北，屋後是堤內的一小片菜園。菜畦邊堆著晒乾的蒲葉，準備編成席子。編好的席子捲成一捆，靠在門邊等商隊。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
  direction: s
- source: homestead_front
  destination: crossing
  direction: n
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: s
    destination_node: crossing
