version: 1
kind: settlement
id: hamlet_hemp_hollow
location_ref: hamlet_hemp_hollow
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  crossing:
    x_m: 195
    y_m: 100
    prototype_parent: anchor_room
    key: 麻田路口
    desc: 路口旁是一片麻田，割下的麻稈靠在路邊晾乾，纖維的氣味混著土腥，走過的人都會揉一揉鼻子。
    anchor_key: hamlet_hemp_hollow
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 紡麻農舍
    desc: 農舍前架著紡麻的木輪，往西的路通往合流城，屋簷下掛著成束的麻線，隨風擺動。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
  direction: w
- source: homestead_front
  destination: crossing
  direction: e
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: w
    destination_node: crossing
  - return_direction: e
    destination_node: homestead_front
