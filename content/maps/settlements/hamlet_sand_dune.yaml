version: 1
kind: settlement
id: hamlet_sand_dune
location_ref: hamlet_sand_dune
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  crossing:
    x_m: 163
    y_m: 163
    prototype_parent: anchor_room
    key: 沙崙岔路
    desc: 岔路開在沙崙的背風面，路兩側是半人高的沙丘。往西南的路通往漁灣鎮，沙上留著清楚的車轍印。
    anchor_key: hamlet_sand_dune
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 農舍前
    desc: 農舍前鋪了一層壓實的貝殼，走路不會陷進沙裡。屋主每晚把門口的沙掃平，隔天又積起一層。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
  direction: sw
- source: homestead_front
  destination: crossing
  direction: ne
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: sw
    destination_node: crossing
  - return_direction: ne
    destination_node: homestead_front
