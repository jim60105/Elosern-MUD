version: 1
kind: settlement
id: village_big_flat
location_ref: village_big_flat
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  village_green:
    x_m: 226
    y_m: 226
    prototype_parent: anchor_room
    key: 大坪綠地
    desc: 綠地是平原上難得平整的一塊空地，井旁立著一株老樹。北邊的橄欖津只有一日路程，趕集的人清晨由此出發。
    anchor_key: village_big_flat
    typeclass:
    scene_archetype: city_street
  village_end_northeast:
    x_m: 352
    y_m: 352
    prototype_parent: grid_room
    key: 東北村口
    desc: 東北村口朝向橄欖津的方向，路筆直穿過麥田。田埂上每隔一段就有一堆石頭，標出官道的界線。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  village_end_southwest:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 西南村口
    desc: 西南村口接著往南潮港的路，風從海邊一路吹上來。口邊的草棚給過路人遮雨，牆上掛著別人留下的斗笠。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  shrine_front:
    x_m: 289
    y_m: 163
    prototype_parent: grid_room
    key: 教堂前坪
    desc: 教堂前的坪地朝東南，曬著整片剛收的新麥。鐘樓的影子每天準時掃過坪面，村人便知道該收麥了。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: village_green
  destination: village_end_northeast
  direction: ne
- source: village_end_northeast
  destination: village_green
  direction: sw
- source: village_green
  destination: village_end_southwest
  direction: sw
- source: village_end_southwest
  destination: village_green
  direction: ne
- source: village_green
  destination: shrine_front
  direction: se
- source: shrine_front
  destination: village_green
  direction: nw
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: sw
    destination_node: village_end_northeast
  - return_direction: ne
    destination_node: village_end_southwest
