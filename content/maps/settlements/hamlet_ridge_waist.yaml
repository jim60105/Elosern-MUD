nodes:
  crossing:
    x_m: 173
    y_m: 100
    prototype_parent: anchor_room
    key: 嶺腰岔路
    desc: 岔路開在嶺腰的緩坡上，來往鹽津城與西礦港的貨車都在此換氣。坡下的谷地被林梢遮住，只看得到幾條山徑。
    anchor_key: hamlet_ridge_waist
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 173
    prototype_parent: grid_room
    key: 農舍前
    desc: 農舍前堆著劈好的柴薪，屋後是一片向陽的坡地。屋主說嶺腰風大，柴火乾得快，過路的車伕常來討一束。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
  direction: nw
- source: homestead_front
  destination: crossing
  direction: se
