version: 1
kind: settlement
id: village_ridge_top
location_ref: village_ridge_top
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  village_green:
    x_m: 100
    y_m: 271
    prototype_parent: anchor_room
    key: 嶺頂綠地
    desc: 綠地開在嶺背上，井鑿進岩層，打水要用長繩。站在井邊能同時望見東北的鹽津城與西南的白帆港。
    anchor_key: village_ridge_top
    typeclass:
    scene_archetype: city_street
  village_end_north:
    x_m: 100
    y_m: 442
    prototype_parent: grid_room
    key: 北村口
    desc: 北村口順著嶺線往下，是通往鹽津城的陡坡。坡道上鋪了碎石防滑，趕車的人在口邊先緊一次車軸。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  village_end_south:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 南村口
    desc: 南村口接著往白帆港的長路，路沿著稜線一路向南。口外風大，村人在此立了一面擋風的石牆。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  shrine_front:
    x_m: 186
    y_m: 271
    prototype_parent: grid_room
    key: 教堂前崗
    desc: 教堂前的小崗朝東，可以看見雲從谷裡升上來。鐘聲在嶺上傳得遠，山下的人說那是嶺頂在報時。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: village_green
  destination: village_end_north
  direction: n
- source: village_end_north
  destination: village_green
  direction: s
- source: village_green
  destination: village_end_south
  direction: s
- source: village_end_south
  destination: village_green
  direction: n
- source: village_green
  destination: shrine_front
  direction: e
- source: shrine_front
  destination: village_green
  direction: w
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: s
    destination_node: village_end_north
city_gate:
