version: 1
kind: settlement
id: hamlet_river_side
location_ref: hamlet_river_side
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  crossing:
    x_m: 192
    y_m: 100
    prototype_parent: anchor_room
    key: 河岸岔路
    desc: 岔路就在河岸邊，河水的涼氣一直漫到路口。往西通往鹽道城的路沿著河走，路基年年都要補一次。
    anchor_key: hamlet_river_side
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 農舍前
    desc: 農舍前架著曬魚的木架，屋側繫著一條小舟。主人每天清晨解纜往上游去，中午前就把船拖回屋前。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
  direction: w
- source: homestead_front
  destination: crossing
  direction: e
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: w
    destination_node: crossing
  - return_direction: e
    destination_node: homestead_front
