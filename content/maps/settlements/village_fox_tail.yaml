version: 1
kind: settlement
id: village_fox_tail
location_ref: village_fox_tail
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  village_green:
    x_m: 230
    y_m: 230
    prototype_parent: anchor_room
    key: 尾毛圖騰
    desc: 寨心立著狐尾圖騰，柱頂綁著一束染紅的尾毛。廣場邊緣圍著低矮的石欄，攔住坡上滑下來的碎石。
    anchor_key: village_fox_tail
    typeclass:
    scene_archetype: city_street
  village_end_southeast:
    x_m: 360
    y_m: 100
    prototype_parent: grid_room
    key: 東南寨門
    desc: 東南寨門順坡而下通往疾風城，門外的路邊開著一帶野花。野花的花期很短，過了盛夏就只剩灰綠的草葉。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  village_end_northwest:
    x_m: 100
    y_m: 360
    prototype_parent: grid_room
    key: 西北寨門
    desc: 西北寨門面向角原城的方向，門內是族中存放獵具的棚屋。棚屋的木架上掛著換下來的舊弓與斷箭。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  shrine_front:
    x_m: 165
    y_m: 165
    prototype_parent: grid_room
    key: 祖靈祭壇
    desc: 祖靈祭壇在寨子西南的背風處，壇上供著今年的第一束新草。守壇的族人每天清晨換一次清水。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: village_green
  destination: village_end_southeast
  direction: se
- source: village_end_southeast
  destination: village_green
  direction: nw
- source: village_green
  destination: village_end_northwest
  direction: nw
- source: village_end_northwest
  destination: village_green
  direction: se
- source: village_green
  destination: shrine_front
  direction: sw
- source: shrine_front
  destination: village_green
  direction: ne
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: nw
    destination_node: village_end_southeast
  - return_direction: se
    destination_node: village_end_northwest
