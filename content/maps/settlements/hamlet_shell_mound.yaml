    desc: 岔路旁邊是一座長年堆積的貝塚，白花花的一片。往西北的路通往白帆港，路肩盡是碎貝與細沙。
    anchor_key: hamlet_shell_mound
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 161
    prototype_parent: grid_room
    key: 農舍前
    desc: 農舍前以貝殼混沙鋪成，踩上去有細碎的聲響。屋主說貝塚是祖先留下的，取土時從不往深處挖。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
