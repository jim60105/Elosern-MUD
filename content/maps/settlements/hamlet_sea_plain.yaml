version: 1
kind: settlement
id: hamlet_sea_plain
location_ref: hamlet_sea_plain
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  crossing:
    x_m: 100
    y_m: 192
    prototype_parent: anchor_room
    key: 鹽田路口
    desc: 路口旁的鹽田泛著白光，路面結著薄薄的鹽霜，踩過會留下清楚的腳印，海鳥在田埂上歇腳。
    anchor_key: hamlet_sea_plain
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 鹽工農舍
    desc: 農舍前的空地擺著收鹽的耙具，往南的路通往西礦港，屋後的平原一路平坦直到海邊。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
  direction: s
- source: homestead_front
  destination: crossing
  direction: n
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: s
    destination_node: crossing
  - return_direction: n
    destination_node: homestead_front
