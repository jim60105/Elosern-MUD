version: 1
kind: settlement
id: hamlet_willow_pond
location_ref: hamlet_willow_pond
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  crossing:
    x_m: 200
    y_m: 100
    prototype_parent: anchor_room
    key: 柳塘路口
    desc: 路口旁是一口柳樹環繞的池塘，水面浮著落葉，路面常年帶著濕氣，蜻蜓在岸邊的蘆葦間停駐。
    anchor_key: hamlet_willow_pond
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 塘邊農舍
    desc: 農舍前的空地晾著漁網與柳條籃，往西的路通往聖潔王都，屋後的塘邊繫著小舟。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
  direction: w
- source: homestead_front
  destination: crossing
  direction: e
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: w
    destination_node: crossing
  - return_direction: e
    destination_node: homestead_front
