version: 1
kind: settlement
id: town_orange_blossom
location_ref: town_orange_blossom
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  central_plaza:
    x_m: 499
    y_m: 129
    prototype_parent: anchor_room
    key: 中央廣場
    desc: 橙花鎮的中央廣場，四周都是果園，春天滿鎮都是花香。西邊地勢略高，老宅都蓋在那頭，屋瓦上落著花瓣。
    anchor_key: town_orange_blossom
    typeclass:
    scene_archetype: city_street
  north_gate:
    x_m: 499
    y_m: 604
    prototype_parent: grid_room
    key: 北門
    desc: 北門通往駿原鎮與銀嶺鎮的方向，果乾與蜜餞由此北上。擔子一開蓋，蜜蜂就跟著走了一段。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  east_gate:
    x_m: 1224
    y_m: 129
    prototype_parent: grid_room
    key: 東門
    desc: 東門外的大路直往香道城，商隊在門外交會。兩邊的領隊照例要交換一次水囊，才各自上路。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  east_gate_road_1:
    x_m: 897
    y_m: 155
    prototype_parent: grid_room
    key: 東門大街
    desc: 東門大街是鎮上最寬的一段，果販的棚子搭到路邊。棚下擺著試吃的籃子，路過的人都能拿一個。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  market_street:
    x_m: 647
    y_m: 107
    prototype_parent: grid_room
    key: 市場街
    desc: 市場街在廣場東側，橙與蜜在此論簍賣。驗貨的人隨手剝開一顆，果皮的油濺在袖口上，一整天都香。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  guild_forecourt:
    x_m: 345
    y_m: 100
    prototype_parent: grid_room
    key: 公會前
    desc: 公會前在廣場西側，分會接的多是果園的守夜委託。收成季節，板子上的委託一夜就被人撕走。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  temple_forecourt:
    x_m: 100
    y_m: 241
    prototype_parent: grid_room
    key: 神殿前
    desc: 神殿前在鎮西高處，花季的祭禮在此舉行。階前的石槽裡浮著一層花瓣，是來客隨手放進去的。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  inn_lane:
    x_m: 471
    y_m: 348
    prototype_parent: grid_room
    key: 客棧巷
    desc: 客棧巷在鎮北，收購果貨的商人在此落腳。院裡停著空車，第二天一早就要裝滿果筐上路。
    anchor_key:
    typeclass:
    scene_archetype: city_street
