version: 1
kind: settlement
id: hamlet_wild_slope
location_ref: hamlet_wild_slope
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  crossing:
    x_m: 100
    y_m: 189
    prototype_parent: anchor_room
    key: 岔路口
    desc: 岔路口往北接上牧道，通往東牧鎮。坡上的草被牲口啃得很短，路旁立著幾根磨亮的拴馬樁。
    anchor_key: hamlet_wild_slope
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 農舍前
    desc: 農舍前的南邊小路順坡下到東灣港，路邊長滿帶刺的野草。屋後有一道石砌的擋牆，牆縫裡塞著乾草。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
  direction: s
- source: homestead_front
  destination: crossing
  direction: n
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: s
    destination_node: crossing
  - return_direction: n
    destination_node: homestead_front
