    key: 岔路口
    desc: 岔路口往北通往東河城的方向，路口外圍著一圈削尖的木柵，夜裡有人輪值守著，柵門天黑就關。
    anchor_key: hamlet_wooden_fence
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 農舍前
    desc: 農舍的院子用木柵隔成兩半，一半關牲口，一半曬乾草，往南的路通往斷崖鎮，屋簷下掛著幾串風乾的辣椒。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
