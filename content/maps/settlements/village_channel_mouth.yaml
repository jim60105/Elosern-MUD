version: 1
kind: settlement
id: village_channel_mouth
location_ref: village_channel_mouth
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  village_green:
    x_m: 265
    y_m: 265
    prototype_parent: anchor_room
    key: 河汊綠地
    desc: 綠地夾在兩道水之間，井打在河汊匯流的高地上。水聲從早到晚不斷，井水卻意外地靜。岸邊的蘆葦把水面擋去一半。
    anchor_key: village_channel_mouth
    typeclass:
    scene_archetype: city_street
  village_end_southeast:
    x_m: 430
    y_m: 100
    prototype_parent: grid_room
    key: 東南村口
    desc: 東南村口接著往帝河津的河岸路，路順著汊口繞出去。路邊拴著幾條小船，漲水時船身幾乎擱在路面。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  village_end_northwest:
    x_m: 100
    y_m: 430
    prototype_parent: grid_room
    key: 西北巷尾
    desc: 西北的巷尾朝著帝都方向的官道，路從河堤上穿過。堤邊的柳樹被水沖歪了幾株，村人拿石頭壓住樹根。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  shrine_front:
    x_m: 182
    y_m: 182
    prototype_parent: grid_room
    key: 教堂前
    desc: 教堂前的石階朝西南，正對著西汊的水面。晚禱時鐘聲越過水去，驚起灘上的水鳥。鐘聲傳得很遠，對岸也聽得見。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: village_green
  destination: village_end_southeast
  direction: se
- source: village_end_southeast
  destination: village_green
  direction: nw
- source: village_green
  destination: village_end_northwest
  direction: nw
- source: village_end_northwest
  destination: village_green
  direction: se
- source: village_green
  destination: shrine_front
  direction: sw
- source: shrine_front
  destination: village_green
  direction: ne
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: nw
    destination_node: village_end_southeast
city_gate:
