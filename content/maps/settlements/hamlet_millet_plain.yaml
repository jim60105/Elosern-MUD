    desc: 農舍前的空地朝東，屋前曬著新打的黍米。場邊的雞群趁人不注意，啄走幾粒又散開。場上鋪著竹席，米粒在日頭下泛著白光。
    anchor_key:
    typeclass:
    scene_archetype: city_street
