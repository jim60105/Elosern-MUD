    desc: 路口往西通往魔晶鎮，往東則是穀坳村外的小路。路旁的黍田已經收了兩輪，田埂上堆著紮好的稈束。
    anchor_key: hamlet_millet_plain
    typeclass:
    scene_archetype: city_street
  homestead_front:
