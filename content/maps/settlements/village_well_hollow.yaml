version: 1
kind: settlement
id: village_well_hollow
location_ref: village_well_hollow
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  village_green:
    x_m: 225
    y_m: 225
    prototype_parent: anchor_room
    key: 坳井空地
    desc: 村中的空地中央是一口深井，井口加蓋並上了鎖，婦人在井邊排隊打水並閒話家常。
    anchor_key: village_well_hollow
    typeclass:
    scene_archetype: city_street
  village_end_northeast:
    x_m: 350
    y_m: 350
    prototype_parent: grid_room
    key: 東北村口
    desc: 東北村口的路往葡萄鎮去，路旁的水槽餵著經過的牲畜，坡上是成排的葡萄棚架。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  village_end_southwest:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 西南村口
    desc: 西南村口朝著聖潔王都的方向爬升，路面乾燥多石，井水是這段路上唯一的水源。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  shrine_front:
    x_m: 288
    y_m: 162
    prototype_parent: grid_room
    key: 教堂前庭
    desc: 小教堂前的庭地舖著碎石，東南方是一片低緩的旱坳，神職者在門前安置給旅人的水桶。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: village_green
  destination: village_end_northeast
  direction: ne
- source: village_end_northeast
  destination: village_green
  direction: sw
- source: village_green
  destination: village_end_southwest
  direction: sw
- source: village_end_southwest
  destination: village_green
  direction: ne
- source: village_green
  destination: shrine_front
  direction: se
- source: shrine_front
  destination: village_green
  direction: nw
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: sw
    destination_node: village_end_northeast
  - return_direction: ne
    destination_node: village_end_southwest
