    desc: 農舍前的空地朝北，屋後是一片水塘。塘邊的蘆葦長得很密，秋天時絮子飄進院子。塘水映著天色，清晨時浮著一層薄霧。
    anchor_key:
    typeclass:
    scene_archetype: city_street
