version: 1
kind: settlement
id: hamlet_panther_knoll
location_ref: hamlet_panther_knoll
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  crossing:
    x_m: 195
    y_m: 100
    prototype_parent: anchor_room
    key: 豹斑圖騰
    desc: 圖騰柱上刻滿豹斑狀的淺坑，坑裡積著雨水。岡下的官道東西向穿過。淺坑裡的雨水要等到日頭曬足才會乾。
    anchor_key: hamlet_panther_knoll
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 火塘棚
    desc: 火塘棚的頂上壓著石塊，免得被風掀掉。往西南的路通往鐵爪城，往東北通往狐火城。石塊壓住棚頂的四角，風再大也掀不開。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
  direction: w
- source: homestead_front
  destination: crossing
  direction: e
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: w
    destination_node: crossing
  - return_direction: e
    destination_node: homestead_front
