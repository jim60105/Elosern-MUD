location_ref: village_wolf_fang
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  village_green:
    x_m: 319
    y_m: 210
    prototype_parent: anchor_room
    key: 寨心圖騰
    desc: 三條官道在此交會，寨心立著一根刻滿狼牙的圖騰柱。黃土路面被獸群踩得發亮，雨天積著淺淺的泥水。
    anchor_key: village_wolf_fang
    typeclass:
    scene_archetype: city_street
  village_end_east:
    x_m: 538
    y_m: 210
    prototype_parent: grid_room
    key: 東寨門
    desc: 東寨門朝角原城的方向敞開，門柱上釘著旅人留下的獸骨。門外官道穿過低矮的林地，一路往東。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  village_end_west:
    x_m: 100
    y_m: 210
    prototype_parent: grid_room
    key: 西寨門
    desc: 西寨門面向影林城，門邊堆著準備運出去的獸皮。傍晚守門的族人會在門柱旁升起小火堆。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  shrine_front:
    x_m: 319
    y_m: 100
    prototype_parent: grid_room
    key: 祖靈祭壇
    desc: 祖靈祭壇在寨子南側，壇前鋪著磨平的河石。族人出發狩獵前會在這裡留下一撮毛髮，求祖靈看顧。
    anchor_key:
    typeclass:
    scene_archetype: city_street
