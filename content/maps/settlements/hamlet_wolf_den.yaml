version: 1
kind: settlement
id: hamlet_wolf_den
location_ref: hamlet_wolf_den
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  crossing:
    x_m: 100
    y_m: 205
    prototype_parent: anchor_room
    key: 狼穴圖騰
    desc: 圖騰柱埋在一處土穴旁，柱身的下半段幾乎被土遮住。穴口掛著防風的皮簾。皮簾內側縫著幾層舊布，擋得住穿堂風。
    anchor_key: hamlet_wolf_den
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 公共火塘
    desc: 公共火塘的火光在土穴裡映出很長的影子。往南的官道通往祖靈聖地，往北通往咆哮王城。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
  direction: s
- source: homestead_front
  destination: crossing
  direction: n
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: s
    destination_node: crossing
  - return_direction: n
    destination_node: homestead_front
city_gate:
