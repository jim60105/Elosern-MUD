version: 1
kind: settlement
id: hamlet_shoal_head
location_ref: hamlet_shoal_head
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  crossing:
    x_m: 195
    y_m: 100
    prototype_parent: anchor_room
    key: 灘頭岔路
    desc: 岔路就開在淺灘上方，路面鋪著河水沖來的圓石。往西南通往鹽道城的路在此分開，車隊慣先在此讓行。
    anchor_key: hamlet_shoal_head
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 農舍前
    desc: 農舍前曬著剛撈起的河魚，屋後的小徑直通鹽道。主人把多餘的柴堆在路口，讓過路人自行取用。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
  direction: w
- source: homestead_front
  destination: crossing
  direction: e
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: w
    destination_node: crossing
  - return_direction: e
    destination_node: homestead_front
