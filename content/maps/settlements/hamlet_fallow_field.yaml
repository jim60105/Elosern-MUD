version: 1
kind: settlement
id: hamlet_fallow_field
location_ref: hamlet_fallow_field
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  crossing:
    x_m: 182
    y_m: 100
    prototype_parent: anchor_room
    key: 路口
    desc: 路口往西是帝河津的舊道，往東通往東牧鎮。路兩旁的地歇了幾年，野草長到膝頭。車轍時有時無，看得出很久沒有車經過。
    anchor_key: hamlet_fallow_field
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 農舍前
    desc: 農舍前的空地朝東，屋後的田裡立著幾根朽掉的木樁。村人打算明年把這片地重新翻起來。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
  direction: w
- source: homestead_front
  destination: crossing
  direction: e
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: w
    destination_node: crossing
  - return_direction: e
    destination_node: homestead_front
