version: 1
kind: settlement
id: village_wheat_slope
location_ref: village_wheat_slope
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  village_green:
    x_m: 253
    y_m: 253
    prototype_parent: anchor_room
    key: 麥坡綠地
    desc: 綠地開在長坡中段，井邊立著一架汲水的木架。坡上的風不停，晾在繩上的麥穗整日晃動。
    anchor_key: village_wheat_slope
    typeclass:
    scene_archetype: city_street
  village_end_northeast:
    x_m: 406
    y_m: 406
    prototype_parent: grid_room
    key: 東北村口
    desc: 東北村口往麥浪城去，路順著坡勢緩緩爬升。兩旁的麥田一直鋪到坡頂，麥熟時整條路都是金色。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  village_end_southwest:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 西南村口
    desc: 西南村口朝著帝都的方向下坡，路面被車輪碾出兩道深溝。下坡的車夫總要拉緊韁繩，讓車慢慢滑下去。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  shrine_front:
    x_m: 329
    y_m: 177
    prototype_parent: grid_room
    key: 教堂前
    desc: 教堂前的臺地朝東南，能望見坡下的平原。石階邊種著一排小麥，成熟時穗子垂到階面上。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: village_green
  destination: village_end_northeast
  direction: ne
- source: village_end_northeast
  destination: village_green
  direction: sw
- source: village_green
  destination: village_end_southwest
  direction: sw
- source: village_end_southwest
  destination: village_green
  direction: ne
- source: village_green
  destination: shrine_front
  direction: se
- source: shrine_front
  destination: village_green
  direction: nw
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: sw
    destination_node: village_end_northeast
  - return_direction: ne
    destination_node: village_end_southwest
