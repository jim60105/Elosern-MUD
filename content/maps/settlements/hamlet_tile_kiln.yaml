version: 1
kind: settlement
id: hamlet_tile_kiln
location_ref: hamlet_tile_kiln
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  crossing:
    x_m: 100
    y_m: 218
    prototype_parent: anchor_room
    key: 岔路口
    desc: 岔路口往北通往蜜谷鎮，路面鋪著碎瓦與窯渣，兩旁的土堆上晾著剛出窯的瓦片，走過去腳下會發出細碎的聲響。
    anchor_key: hamlet_tile_kiln
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 農舍前
    desc: 農舍緊挨著瓦窯的工棚，屋後冒著細煙，往南的旅人經過時總要掩著口鼻快走幾步，煙裡帶著燒土的氣味。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
  direction: s
- source: homestead_front
  destination: crossing
  direction: n
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: s
    destination_node: crossing
  - return_direction: n
    destination_node: homestead_front
