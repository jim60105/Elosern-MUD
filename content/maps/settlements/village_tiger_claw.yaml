version: 1
kind: settlement
id: village_tiger_claw
location_ref: village_tiger_claw
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  village_green:
    x_m: 236
    y_m: 236
    prototype_parent: anchor_room
    key: 虎爪大石
    desc: 寨心刻著虎爪印的大石立在中央，爪痕深得能積雨水。四周是族中集會時的站位，地上踩出一圈淺坑。
    anchor_key: village_tiger_claw
    typeclass:
    scene_archetype: city_street
  village_end_southeast:
    x_m: 372
    y_m: 100
    prototype_parent: grid_room
    key: 東南寨門
    desc: 東南寨門朝鐵爪城的方向敞開，門外的官道順著丘陵東行。門柱上掛著新換的虎骨串。虎骨串隨風碰撞，聲音在丘陵間傳得很遠。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  village_end_northwest:
    x_m: 100
    y_m: 372
    prototype_parent: grid_room
    key: 西北寨門
    desc: 西北寨門通往松濤渡，門前那條路兩旁都是高過人頭的茅草。茅草開花時，整條路都覆著一層白絮。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  shrine_front:
    x_m: 168
    y_m: 168
    prototype_parent: grid_room
    key: 祖靈祭壇
    desc: 祖靈祭壇築在寨子西南的緩坡上，壇面朝著北方的山脊。祭壇旁的石堆是歷代族長留下的記號。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: village_green
  destination: village_end_southeast
  direction: se
- source: village_end_southeast
  destination: village_green
  direction: nw
- source: village_green
  destination: village_end_northwest
  direction: nw
- source: village_end_northwest
  destination: village_green
  direction: se
- source: village_green
  destination: shrine_front
  direction: sw
- source: shrine_front
  destination: village_green
  direction: ne
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: nw
    destination_node: village_end_southeast
  - return_direction: se
    destination_node: village_end_northwest
city_gate:
