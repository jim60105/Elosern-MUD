version: 1
kind: settlement
id: hamlet_grass_flat
location_ref: hamlet_grass_flat
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  crossing:
    x_m: 218
    y_m: 100
    prototype_parent: anchor_room
    key: 草埔岔路
    desc: 岔路開在一片草埔上，路邊的水溝積著雨水。往西南的路通往漁灣鎮，草埔裡散著幾頭低頭吃草的牛。
    anchor_key: hamlet_grass_flat
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 農舍前
    desc: 農舍前的棚下堆著曬乾的草料，屋旁圍出一塊牧地。屋主說草埔的草長得快，割過一輪又會冒出來。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
  direction: w
- source: homestead_front
  destination: crossing
  direction: e
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: w
    destination_node: crossing
  - return_direction: e
    destination_node: homestead_front
city_gate:
