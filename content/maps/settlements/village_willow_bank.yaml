version: 1
kind: settlement
id: village_willow_bank
location_ref: village_willow_bank
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  village_green:
    x_m: 179
    y_m: 258
    prototype_parent: anchor_room
    key: 井邊綠地
    desc: 綠地中央的石井邊種著一排柳樹，風從河面吹來時柳枝掃過井欄，村人說那是河在報天氣，便把晒衣的繩索綁在樹幹上。
    anchor_key: village_willow_bank
    typeclass:
    scene_archetype: city_street
  village_end_south:
    x_m: 179
    y_m: 100
    prototype_parent: grid_room
    key: 南村口
    desc: 南村口接上通往麥埔村與蜜谷鎮的岔路，柳蔭下停著幾輛載柳條的板車，趕車的人會在樹下分食帶來的乾糧。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  village_end_north:
    x_m: 179
    y_m: 416
    prototype_parent: grid_room
    key: 北村口
    desc: 北村口是一條通往河灘的小徑，雨季水位上來時，村人會在這裡看河面，再決定要不要下網。岸邊的蘆葦在風裡彎成一片。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  shrine_front:
    x_m: 100
    y_m: 258
    prototype_parent: grid_room
    key: 教堂前
    desc: 教堂在綠地西側，屋瓦上積著一層柳絮，鐘聲響起時對面的田裡總有人抬頭望一眼，屋後的菜圃圍著低矮的木籬。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: village_green
  destination: village_end_south
  direction: s
- source: village_end_south
  destination: village_green
  direction: n
- source: village_green
  destination: village_end_north
  direction: n
- source: village_end_north
  destination: village_green
  direction: s
- source: village_green
  destination: shrine_front
  direction: w
- source: shrine_front
  destination: village_green
  direction: e
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: n
    destination_node: village_end_south
