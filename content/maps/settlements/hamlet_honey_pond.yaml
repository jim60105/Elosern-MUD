version: 1
kind: settlement
id: hamlet_honey_pond
location_ref: hamlet_honey_pond
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  crossing:
    x_m: 182
    y_m: 100
    prototype_parent: anchor_room
    key: 蜂塘路口
    desc: 路口旁是一口靜水塘，蜂箱沿著塘邊排開，路面黏著蜂蠟的痕跡，正午時蜂群在頭頂盤旋。
    anchor_key: hamlet_honey_pond
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 養蜂農舍
    desc: 農舍前的空地擺著取蜜的木桶，西邊的坡下就是蜜谷的渡口，屋簷掛著草編的蜂罩。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
  direction: w
- source: homestead_front
  destination: crossing
  direction: e
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: w
    destination_node: crossing
  - return_direction: e
    destination_node: homestead_front
