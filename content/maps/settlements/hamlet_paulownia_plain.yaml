  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  crossing:
    x_m: 161
    y_m: 100
    prototype_parent: anchor_room
    key: 路口
    desc: 路口往西北通往日出鎮，往東南則下到潮風鎮的海岸。路旁的桐樹散在原上，葉子大得能遮住半個屋頂。
    anchor_key: hamlet_paulownia_plain
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 161
    prototype_parent: grid_room
    key: 農舍前
    desc: 農舍前的空地朝東南，屋後是一片望不到邊的荒原。風大時，桐葉翻動的聲音像有人在遠處拍手。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
  direction: nw
- source: homestead_front
  destination: crossing
  direction: se
