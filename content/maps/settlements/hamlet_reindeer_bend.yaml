    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 共火塘
    desc: 共火塘邊曬著切好的草料，草料曬乾後捆成小束收進棚裡。棚裡還留著去年過冬剩下的乾草。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
