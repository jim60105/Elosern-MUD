version: 1
kind: settlement
id: hamlet_serpent_ridge
location_ref: hamlet_serpent_ridge
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  crossing:
    x_m: 169
    y_m: 169
    prototype_parent: anchor_room
    key: 蛇紋圖騰
    desc: 圖騰柱上刻著盤繞的蛇紋，紋路順著木頭原來的裂縫走。嶺上的風從兩側的樹林間穿過。裂縫裡有時會鑽出細小的蜥蜴。
    anchor_key: hamlet_serpent_ridge
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 共用火塘
    desc: 火塘旁的木樁上掛著幾張待修的弓。往東北的路通往鐵爪城，往西南通往獵鷹鎮。待修的弓上都綁著標記繩。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
  direction: sw
- source: homestead_front
  destination: crossing
  direction: ne
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: sw
    destination_node: crossing
  - return_direction: ne
    destination_node: homestead_front
