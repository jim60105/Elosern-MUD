version: 1
kind: settlement
id: hamlet_willow_bend
location_ref: hamlet_willow_bend
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  crossing:
    x_m: 200
    y_m: 100
    prototype_parent: anchor_room
    key: 路口
    desc: 路口往西幾步就是帝河的河灣，往東南則是帝都的官道。河邊的柳樹垂到水面，擺渡的人在此歇腳。
    anchor_key: hamlet_willow_bend
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 農舍前
    desc: 農舍前的空地朝東，屋後是通往帝都的官道。春天柳絮飛滿院子，掃起來能裝滿好幾筐，曬乾了當引火。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
  direction: w
- source: homestead_front
  destination: crossing
  direction: e
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: w
    destination_node: crossing
  - return_direction: e
    destination_node: homestead_front
