version: 1
kind: settlement
id: hamlet_saddle_hollow
location_ref: hamlet_saddle_hollow
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  crossing:
    x_m: 155
    y_m: 100
    prototype_parent: anchor_room
    key: 路口
    desc: 鞍坳是帝河津與汊口村之間唯一的歇腳處，路口往兩頭各接上一段舊道。鞍部的風從兩邊對流，路面的土總是很乾。
    anchor_key: hamlet_saddle_hollow
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 155
    prototype_parent: grid_room
    key: 農舍前
    desc: 農舍前的空地朝東南，屋後是兩道水之間的鞍地。兩邊的水聲都聽得見，卻都不算近。鞍地的草長得密，牛群整日散在兩側。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
  direction: nw
- source: homestead_front
  destination: crossing
  direction: se
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: w
    destination_node: crossing
  - return_direction: se
    destination_node: homestead_front
