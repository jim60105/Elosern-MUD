version: 1
kind: settlement
id: hamlet_badger_knoll
location_ref: hamlet_badger_knoll
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  crossing:
    x_m: 203
    y_m: 100
    prototype_parent: anchor_room
    key: 獾形圖騰
    desc: 獾形圖騰柱短而粗，柱頂挖出一個小凹槽用來放鹽塊。岡上的風把地面的砂吹得沙沙作響。
    anchor_key: hamlet_badger_knoll
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 火塘石圈
    desc: 火塘四周圍著一圈石頭，石頭被煙熏得漆黑。往東的路通往獵鷹鎮，往西北則是灰熊鎮。石圈外的地面被踩出一條通往官道的小徑。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
  direction: w
- source: homestead_front
  destination: crossing
  direction: e
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: w
    destination_node: crossing
  - return_direction: e
    destination_node: homestead_front
