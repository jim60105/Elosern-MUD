version: 1
kind: settlement
id: hamlet_open_wild
location_ref: hamlet_open_wild
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  crossing:
    x_m: 186
    y_m: 100
    prototype_parent: anchor_room
    key: 岔路口
    desc: 岔路口往東接上長路，四周是望不到邊的荒原。風從草原上捲過，把路心的細土吹得四散。
    anchor_key: hamlet_open_wild
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 農舍前
    desc: 農舍前的西邊小路往雙流城方向，屋簷下掛著擋風的草簾。院裡堆著過冬的柴薪，柴堆邊拴著一頭瘦驢。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
  direction: w
- source: homestead_front
  destination: crossing
  direction: e
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: w
    destination_node: crossing
  - return_direction: e
    destination_node: homestead_front
