version: 1
kind: settlement
id: hamlet_tide_bay
location_ref: hamlet_tide_bay
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  crossing:
    x_m: 100
    y_m: 192
    prototype_parent: anchor_room
    key: 岔路口
    desc: 岔路口往北接上海岸官道，海風從北面直灌進村裡。路心的砂土被吹得打旋，路旁散落著被潮水推上來的貝殼。
    anchor_key: hamlet_tide_bay
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 農舍前
    desc: 農舍前的南邊小路通往東灣港，路旁是鹽蒿與成堆的貝殼。屋簷壓得很低，牆根總帶著一股曬不乾的潮氣。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
  direction: s
- source: homestead_front
  destination: crossing
  direction: n
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: s
    destination_node: crossing
  - return_direction: n
    destination_node: homestead_front
