version: 1
kind: settlement
id: village_sand_bank
location_ref: village_sand_bank
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  village_green:
    x_m: 178
    y_m: 256
    prototype_parent: anchor_room
    key: 沙岸井台
    desc: 村中的井台砌在沙岸高處，井水清得見底，岸邊的蘆葦被風壓成一片低伏的浪。
    anchor_key: village_sand_bank
    typeclass:
    scene_archetype: city_street
  village_end_south:
    x_m: 178
    y_m: 100
    prototype_parent: grid_room
    key: 南村口
    desc: 南村口朝著內陸的旱坡敞開，路旁堆著修堤用的石塊，遠處是成片的枯草與礫石地。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  village_end_north:
    x_m: 178
    y_m: 412
    prototype_parent: grid_room
    key: 北村口
    desc: 北村口的道路通向獵鷹鎮，岸邊的沙地被車馬踩出硬道，渡船在河心缓缓擺渡。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  shrine_front:
    x_m: 100
    y_m: 256
    prototype_parent: grid_room
    key: 教堂前庭
    desc: 小教堂前的庭地壓著細沙，西邊的河面泛著白光，神職人員常在門邊替旅人指路。
    anchor_key:
    typeclass:
    scene_archetype: city_street
