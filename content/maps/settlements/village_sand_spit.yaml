version: 1
kind: settlement
id: village_sand_spit
location_ref: village_sand_spit
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  village_green:
    x_m: 236
    y_m: 236
    prototype_parent: anchor_room
    key: 沙嘴綠地
    desc: 綠地邊緣就是沙地，井水帶著一點鹹味。村人用貝殼鋪出小徑，風一大，細沙便順著小徑流進綠地。
    anchor_key: village_sand_spit
    typeclass:
    scene_archetype: city_street
  village_end_southeast:
    x_m: 372
    y_m: 100
    prototype_parent: grid_room
    key: 東南村口
    desc: 東南村口沿著沙嘴往內陸走，是通往漁灣鎮的路。路口堆著晒乾的漁網與木浮子，空氣裡滿是腥味。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  village_end_northwest:
    x_m: 100
    y_m: 372
    prototype_parent: grid_room
    key: 西北村口
    desc: 西北村口面向開闊的海面，沙嘴在此收窄成一道白線。漲潮時浪會打到口邊的石堆，船家習慣把船拉上沙脊。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  shrine_front:
    x_m: 168
    y_m: 168
    prototype_parent: grid_room
    key: 教堂望海
    desc: 教堂前的空地朝西南正對海面，鐘樓的影子在沙上拉得很長。漁季開始前，村人會在這裡點燈祈求順風。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: village_green
  destination: village_end_southeast
  direction: se
- source: village_end_southeast
  destination: village_green
  direction: nw
- source: village_green
  destination: village_end_northwest
  direction: nw
- source: village_end_northwest
  destination: village_green
  direction: se
- source: village_green
  destination: shrine_front
  direction: sw
- source: shrine_front
  destination: village_green
  direction: ne
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: nw
    destination_node: village_end_southeast
  - return_direction: se
    destination_node: village_end_northwest
city_gate:
