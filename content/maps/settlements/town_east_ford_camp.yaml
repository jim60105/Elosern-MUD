- source: central_plaza
  destination: northwest_gate_road_1
  direction: nw
- source: central_plaza
  destination: market_street
  direction: e
- source: central_plaza
  destination: tribal_hall
  direction: se
- source: northwest_gate
  destination: northwest_gate_road_1
  direction: se
- source: south_gate
  destination: central_plaza
  direction: n
- source: northwest_gate_road_1
  destination: central_plaza
  direction: se
- source: northwest_gate_road_1
  destination: northwest_gate
  direction: nw
- source: market_street
  destination: central_plaza
  direction: w
- source: market_street
  destination: tribal_hall
  direction: sw
- source: tribal_hall
  destination: central_plaza
  direction: n
- source: tribal_hall
  destination: market_street
  direction: ne
wilderness_entry:
