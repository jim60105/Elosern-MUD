version: 1
kind: settlement
id: hamlet_weasel_knoll
location_ref: hamlet_weasel_knoll
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  crossing:
    x_m: 203
    y_m: 100
    prototype_parent: anchor_room
    key: 鼬形圖騰
    desc: 圖騰柱的鼬形雕得極瘦，柱上還留著幾道爪痕。站在柱旁能望見南邊鎮上的屋頂。屋頂的煙囪在無風的早晨升起一道筆直的白煙。
    anchor_key: hamlet_weasel_knoll
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 火塘地
    desc: 火塘地邊埋著一塊平石，是族人分肉的地方。往東的路通往獵鷹鎮。平石旁的土裡埋著分肉用的木砧。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
  direction: w
- source: homestead_front
  destination: crossing
  direction: e
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: w
    destination_node: crossing
  - return_direction: e
    destination_node: homestead_front
