  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  crossing:
    x_m: 167
    y_m: 167
    prototype_parent: anchor_room
    key: 熊面圖騰
    desc: 熊面圖騰刻在一段粗木上，木頭表面被獸爪抓出許多淺痕。這裡是獵隊分頭入林的地方。獵隊回來時會把獵物擱在粗木下。
    anchor_key: hamlet_bear_bend
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 共火塘
    desc: 共火塘旁的石板上擺著分肉的木盤。往西南的路順著林緣，直通虎嘯城的官道。木盤邊緣被刀切出許多細口。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
  direction: sw
- source: homestead_front
  destination: crossing
  direction: ne
