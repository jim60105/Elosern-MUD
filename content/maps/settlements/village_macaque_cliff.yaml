version: 1
kind: settlement
id: village_macaque_cliff
location_ref: village_macaque_cliff
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  village_green:
    x_m: 229
    y_m: 229
    prototype_parent: anchor_room
    key: 攀岩圖騰
    desc: 寨心貼著崖壁築起，獼猴圖騰攀在突出的大石上。石面被雨水沖出幾道深溝，圖騰的爪痕卻還清楚。
    anchor_key: village_macaque_cliff
    typeclass:
    scene_archetype: city_street
  village_end_northeast:
    x_m: 358
    y_m: 358
    prototype_parent: grid_room
    key: 東北寨門
    desc: 東北寨門通往疾風城，門外石階沿崖面折了七次。階旁的鐵鏈是給老人和小獸扶著走的。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  village_end_southwest:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 西南寨門
    desc: 西南寨門朝西渡營的方向，門前是一段黃土坡。雨季時坡上的水會匯成小溝流進寨裡。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  shrine_front:
    x_m: 293
    y_m: 165
    prototype_parent: grid_room
    key: 祖靈祭壇
    desc: 祖靈祭壇在寨子東南的岩簷下，壇前的香灰積得很厚。岩簷滴水，正好落在壇前三步的地方。
    anchor_key:
    typeclass:
    scene_archetype: city_street
