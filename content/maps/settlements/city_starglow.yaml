version: 1
kind: settlement
id: city_starglow
location_ref: city_starglow
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  central_plaza:
    x_m: 600
    y_m: 598
    prototype_parent: anchor_room
    key: 中央廣場
    desc: 星輝城的中央廣場，製符與磨晶的作坊從這裡往東鋪開。西邊地勢略高，舊塔的影子每天傍晚都會落在廣場邊緣。
    anchor_key: city_starglow
    typeclass:
    scene_archetype: city_street
  north_gate:
    x_m: 600
    y_m: 1073
    prototype_parent: grid_room
    key: 北門
    desc: 北門外的路通向帝河津，成箱的魔晶由車隊送來。車上蓋著厚布，押運的人手從不離開箱角。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  west_gate:
    x_m: 100
    y_m: 598
    prototype_parent: grid_room
    key: 西門
    desc: 西門朝著翠湖鎮，湖邊的蘆葦與魚乾由此進城。蘆蓆捆成一束束斜靠在門洞牆邊等驗，風一過就沙沙作響。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  market_street:
    x_m: 815
    y_m: 616
    prototype_parent: grid_room
    key: 市場街
    desc: 市場街在廣場東側，法術材料與成品混在同一條街上賣。磨亮的晶石擺在絨布上，旁邊就是成袋的粗砂。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  guild_forecourt:
    x_m: 404
    y_m: 470
    prototype_parent: grid_room
    key: 公會前
    desc: 公會前在廣場西南，分會接的多是護送材料的委託。護衛出發前會在這裡核對封條與收貨人的名字。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  river_quay:
    x_m: 2050
    y_m: 2048
    prototype_parent: grid_room
    key: 河港碼頭
    desc: 河港碼頭在城東北的帝河岸邊，載晶砂的船在此靠岸。卸貨的滑板一直伸到水裡，砂粒沿著板面滑進斗車。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  temple_forecourt:
    x_m: 266
    y_m: 929
    prototype_parent: grid_room
    key: 神殿前
    desc: 神殿前在西北，鐘聲與作坊的敲擊聲常常撞在一起。祭司習慣在敲鐘時停一停，等回音散盡再落第二下。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  inn_lane:
    x_m: 385
    y_m: 721
    prototype_parent: grid_room
    key: 客棧巷
    desc: 客棧巷在西北角，來採買材料的行商在此落腳。房裡的桌上擺著樣品匣，掌燈後還要談上半宿價錢。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  exchange_forecourt:
    x_m: 777
    y_m: 413
    prototype_parent: grid_room
    key: 商會前
    desc: 商會前在東南，魔晶的價格在此一日三變。黑板上的數字擦了又寫，抄價的人守了一整天。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  manor_gate:
    x_m: 442
    y_m: 245
    prototype_parent: grid_room
    key: 領主宅邸前
    desc: 領主宅邸前在西南，城主的書記在此收發文書。門廊下候著幾位作坊主，手裡都抱著要蓋印的申請。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  training_ground:
    x_m: 790
    y_m: 100
    prototype_parent: grid_room
    key: 校場外
    desc: 校場外在城南，城衛與學徒都在這裡練手。木劍相擊的聲音比鐵器輕，聽起來像一陣密集的雨。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  bath_forecourt:
    x_m: 794
    y_m: 985
    prototype_parent: grid_room
    key: 浴場前
    desc: 浴場前在東北近河處，池水從帝河引進來。燒水的鍋爐整天冒著白煙，冬天的街上因此比別處暖。
    anchor_key:
    typeclass:
    scene_archetype: city_street
