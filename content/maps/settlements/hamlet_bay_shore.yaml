location_ref: hamlet_bay_shore
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  crossing:
    x_m: 158
    y_m: 158
    prototype_parent: anchor_room
    key: 路口
    desc: 路口往西南通往日出鎮，往東北接朝陽港的海岸路。路旁的灣岸鋪著細沙，潮水退去後留下一圈水痕。
    anchor_key: hamlet_bay_shore
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 農舍前
    desc: 農舍前的空地朝東北，屋後就是海灣的淺灘。傍晚時分，港裡的船隻點起燈，光一直映到灘上。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
  direction: sw
- source: homestead_front
  destination: crossing
  direction: ne
