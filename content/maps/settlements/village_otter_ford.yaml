version: 1
kind: settlement
id: village_otter_ford
location_ref: village_otter_ford
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  village_green:
    x_m: 307
    y_m: 204
    prototype_parent: anchor_room
    key: 渡口圖騰
    desc: 寨心在渡口的高地上，水獺圖騰柱底下鋪著一層卵石。往南兩里就是高地區河的渡口，水聲日夜不斷。
    anchor_key: village_otter_ford
    typeclass:
    scene_archetype: city_street
  village_end_east:
    x_m: 514
    y_m: 204
    prototype_parent: grid_room
    key: 東寨門
    desc: 東寨門順著河岸往東，通往鹿鳴渡的官道。門外晾著成排的漁網，風一吹便鼓起來。漁網上掛著的浮木是河裡撈來的舊料。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  village_end_west:
    x_m: 100
    y_m: 204
    prototype_parent: grid_room
    key: 西寨門
    desc: 西寨門通往霜風鎮那一側，門前拴著幾條運貨的木筏。渡口的船伕在門邊等客人。木筏上堆著要送到下游的糧袋，艄公坐在筏尾打盹。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  shrine_front:
    x_m: 307
    y_m: 100
    prototype_parent: grid_room
    key: 祖靈祭壇
    desc: 祖靈祭壇在寨子南側、看得見河面的地方，壇上擺著渡河人留下的石頭。每塊石頭都是一次平安渡過的紀錄。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: village_green
  destination: village_end_east
  direction: e
- source: village_end_east
  destination: village_green
  direction: w
- source: village_green
  destination: village_end_west
  direction: w
- source: village_end_west
  destination: village_green
  direction: e
- source: village_green
  destination: shrine_front
  direction: s
- source: shrine_front
  destination: village_green
  direction: n
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: w
    destination_node: village_end_east
  - return_direction: e
    destination_node: village_end_west
