version: 1
kind: settlement
id: hamlet_level_plain
location_ref: hamlet_level_plain
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  crossing:
    x_m: 195
    y_m: 100
    prototype_parent: anchor_room
    key: 岔路口
    desc: 岔路口往東通往翠湖鎮，路旁的水溝裡流著清水。溝邊長著蘆草，水面映著天上的雲影，偶有蜻蜓點過。
    anchor_key: hamlet_level_plain
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 農舍前
    desc: 農舍前的西邊小路通往駿原鎮，屋前是一片平整的旱田。院角堆著農具，鋤頭的木柄被手掌磨得光滑。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
  direction: w
- source: homestead_front
  destination: crossing
  direction: e
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: w
    destination_node: crossing
  - return_direction: e
    destination_node: homestead_front
