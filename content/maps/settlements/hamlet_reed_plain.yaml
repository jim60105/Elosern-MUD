version: 1
kind: settlement
id: hamlet_reed_plain
location_ref: hamlet_reed_plain
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  crossing:
    x_m: 195
    y_m: 100
    prototype_parent: anchor_room
    key: 岔路口
    desc: 岔路口往東通往東灣港，路兩旁的蘆葦高過車頂。葦穗在風裡一齊倒向海邊，路心只露出一線灰白的土。
    anchor_key: hamlet_reed_plain
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 農舍前
    desc: 農舍前堆著曬乾的蘆葦，屋後的小路往西北通向雙流城。院牆以葦捆疊成，牆頭壓著幾塊防風的石頭。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
  direction: w
- source: homestead_front
  destination: crossing
  direction: e
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: w
    destination_node: crossing
  - return_direction: e
    destination_node: homestead_front
