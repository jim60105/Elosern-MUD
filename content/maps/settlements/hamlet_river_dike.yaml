version: 1
kind: settlement
id: hamlet_river_dike
location_ref: hamlet_river_dike
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  crossing:
    x_m: 171
    y_m: 171
    prototype_parent: anchor_room
    key: 堤頂岔路
    desc: 岔路就開在堤頂上，兩側是築高的土堤。往西南的路沿堤而行，堤外是一片低窪的河灘地。
    anchor_key: hamlet_river_dike
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 農舍前
    desc: 農舍前朝東北，屋基墊得比堤面還高。屋後堆著一列備用的石塊，水大時就拿去補堤，平時疊成矮牆擋風。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
  direction: sw
- source: homestead_front
  destination: crossing
  direction: ne
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: sw
    destination_node: crossing
  - return_direction: ne
    destination_node: homestead_front
