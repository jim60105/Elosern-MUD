version: 1
kind: settlement
id: hamlet_deer_trail
location_ref: hamlet_deer_trail
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  crossing:
    x_m: 163
    y_m: 163
    prototype_parent: anchor_room
    key: 鹿徑圖騰
    desc: 圖騰柱上刻著鹿蹄的印子，柱旁是鹿群踩了多年的舊徑。草地被兩側的坡夾成長條。舊徑上的蹄印一層疊著一層。
    anchor_key: hamlet_deer_trail
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 共火塘
    desc: 共火塘的火不大，剛好夠烘乾獵物的毛皮。往西南的路通往鹿鳴渡，往西北通往月嚎城。毛皮掛在火塘上風處，煙會逐漸滲進去。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
  direction: sw
- source: homestead_front
  destination: crossing
  direction: ne
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: sw
    destination_node: crossing
  - return_direction: ne
    destination_node: homestead_front
