version: 1
kind: settlement
id: hamlet_salt_field
location_ref: hamlet_salt_field
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  crossing:
    x_m: 100
    y_m: 212
    prototype_parent: anchor_room
    key: 岔路口
    desc: 岔路口往北接上河岸的官道，北邊是曬鹽的淺池。池水在日頭下泛著白光，池邊堆著刮鹽的木耙。
    anchor_key: hamlet_salt_field
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 農舍前
    desc: 農舍前的南邊小路通往金穗港，路旁堆著蓋蓆的鹽袋。屋後的鹽池邊立著幾根測水深的木尺。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
