version: 1
kind: settlement
id: town_honey_vale
location_ref: town_honey_vale
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  central_plaza:
    x_m: 550
    y_m: 600
    prototype_parent: anchor_room
    key: 中央廣場
    desc: 廣場西邊是蜜谷的果園，北面不遠是渡口，空氣裡飄著蜂蜜與河水的甜味，蜂農在樹蔭下整理蜂箱。
    anchor_key: town_honey_vale
    typeclass:
    scene_archetype: city_street
  ford_crossing:
    x_m: 550
    y_m: 2600
    prototype_parent: grid_room
    key: 渡口
    desc: 渡口在北面的淺灘，木橋只剩半邊，行人踩著墊腳石過河，蜂農挑著蜂箱排隊，蜂鳴聲蓋過水聲。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  east_gate:
    x_m: 1025
    y_m: 600
    prototype_parent: grid_room
    key: 東門
    desc: 東門朝斷崖鎮敞開，門外坡地種著果樹，採蜜人戴著罩帽進出，守衛在門邊檢查燃煙的草把。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  south_gate:
    x_m: 550
    y_m: 100
    prototype_parent: grid_room
    key: 南門
    desc: 南門通往鹽道城，門洞裡堆著裝滿蜜的陶罐，車伕用稻草把罐口塞緊，甜味引來成群的蜜蜂。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  market_street:
    x_m: 451
    y_m: 471
    prototype_parent: grid_room
    key: 市場街
    desc: 市場街往西南延伸，攤上擺著蜂蜜、蜂蠟與曬乾的果乾，甜味引來成群的蜜蜂，攤主忙著揮手驅趕。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  guild_forecourt:
    x_m: 636
    y_m: 453
    prototype_parent: grid_room
    key: 公會前
    desc: 公會前朝東南，牆上貼著驅趕野獸、護送蜜車的委託，冒險者在樹蔭下休息，腳邊擺著防蜂的網罩。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  river_quay:
    x_m: 100
    y_m: 2050
    prototype_parent: grid_room
    key: 河港碼頭
    desc: 河港碼頭在北岸的緩流邊，載蜜的小船繫在柳樹下，船伕用木勺舀起河水試溫，蜂箱蓋著濕布。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  temple_forecourt:
    x_m: 1024
    y_m: 828
    prototype_parent: grid_room
    key: 神殿前
    desc: 神殿前在東北的高地，鐘聲掠過果園，蜂農在階前留下一小罐新蜜，石階上擺著沾露的野花。
    anchor_key:
    typeclass:
    scene_archetype: city_street
