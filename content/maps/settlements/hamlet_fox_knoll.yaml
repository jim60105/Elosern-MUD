version: 1
kind: settlement
id: hamlet_fox_knoll
location_ref: hamlet_fox_knoll
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  crossing:
    x_m: 203
    y_m: 100
    prototype_parent: anchor_room
    key: 狐首圖騰
    desc: 圖騰柱刻著側首的狐形，柱上繫著一串小骨鈴。岡下的官道從東西兩側環過。骨鈴的聲音很輕，風大時幾乎聽不見。
    anchor_key: hamlet_fox_knoll
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 公用火塘
    desc: 火塘邊的老樹被煙熏出一個黑圈，樹下的石凳磨得發亮。往東通往獵鷹鎮，往西通往灰熊鎮。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
  direction: w
- source: homestead_front
  destination: crossing
  direction: e
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: w
    destination_node: crossing
  - return_direction: e
    destination_node: homestead_front
