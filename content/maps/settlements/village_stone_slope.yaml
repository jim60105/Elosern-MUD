version: 1
kind: settlement
id: village_stone_slope
location_ref: village_stone_slope
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  village_green:
    x_m: 100
    y_m: 285
    prototype_parent: anchor_room
    key: 坡上井台
    desc: 村中的石井鑿在河階的硬岩上，井欄用整塊條石砌成，汲水時繩索會磨出低沉的聲響。
    anchor_key: village_stone_slope
    typeclass:
    scene_archetype: city_street
  village_end_north:
    x_m: 100
    y_m: 470
    prototype_parent: grid_room
    key: 北村口
    desc: 北村口的路往合流城方向爬升，坡面露出灰色的岩層，石階一階階嵌進山徑。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  village_end_south:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 南村口
    desc: 南村口的道路順著河階下到谷底，路旁堆著修田埂的石塊，河谷的風從低處吹上來。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  shrine_front:
    x_m: 192
    y_m: 285
    prototype_parent: grid_room
    key: 教堂前庭
    desc: 小教堂前的庭地舖著石板，東邊的坡面在清晨投下長影，禮拜後村民在庭前分送麵餅。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: village_green
  destination: village_end_north
  direction: n
- source: village_end_north
  destination: village_green
  direction: s
- source: village_green
  destination: village_end_south
  direction: s
- source: village_end_south
  destination: village_green
  direction: n
- source: village_green
  destination: shrine_front
  direction: e
- source: shrine_front
  destination: village_green
  direction: w
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: s
    destination_node: village_end_north
  - return_direction: n
    destination_node: village_end_south
