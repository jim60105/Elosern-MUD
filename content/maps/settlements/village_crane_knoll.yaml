version: 1
kind: settlement
id: village_crane_knoll
location_ref: village_crane_knoll
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  village_green:
    x_m: 224
    y_m: 224
    prototype_parent: anchor_room
    key: 鶴頸圖騰
    desc: 寨心立在崗頂，鶴形圖騰的長頸指向天空。崗下的官道看得一清二楚，連遠處的車隊都能數出來。
    anchor_key: village_crane_knoll
    typeclass:
    scene_archetype: city_street
  village_end_northeast:
    x_m: 348
    y_m: 348
    prototype_parent: grid_room
    key: 東北寨門
    desc: 東北寨門通往祖靈聖地，門外是一段徐徐上升的崗道。崗道兩側長著成排的矮松，松針積在路邊。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  village_end_southwest:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 西南寨門
    desc: 西南寨門朝疾風城的方向，門邊的草叢裡常停著幾隻真正的白鶴。白鶴不怕人，守門的孩子會蹲在草邊看牠們覓食。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  shrine_front:
    x_m: 286
    y_m: 162
    prototype_parent: grid_room
    key: 祖靈祭壇
    desc: 祖靈祭壇在寨子東南的坡緣上，壇前立著鶴羽綁成的幡。風一來，幡上的羽毛便全部張開。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: village_green
  destination: village_end_northeast
  direction: ne
- source: village_end_northeast
  destination: village_green
  direction: sw
- source: village_green
  destination: village_end_southwest
  direction: sw
- source: village_end_southwest
  destination: village_green
  direction: ne
- source: village_green
  destination: shrine_front
  direction: se
- source: shrine_front
  destination: village_green
  direction: nw
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: sw
    destination_node: village_end_northeast
  - return_direction: ne
    destination_node: village_end_southwest
