version: 1
kind: settlement
id: village_east_junction
location_ref: village_east_junction
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  village_green:
    x_m: 277
    y_m: 277
    prototype_parent: anchor_room
    key: 三路綠地
    desc: 綠地就在三條大道的交會處，井邊立著給車夫指路的木牌。牌上的字被日頭曬得發白，過路的人仍要停下來看上一眼。
    anchor_key: village_east_junction
    typeclass:
    scene_archetype: city_street
  village_end_southeast:
    x_m: 454
    y_m: 100
    prototype_parent: grid_room
    key: 東南村口
    desc: 東南村口順著海岸官道下去，直抵東灣港的碼頭。路上總有運魚的車隊經過，車轅上掛的魚簍一路滴著鹽水。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  village_end_northwest:
    x_m: 100
    y_m: 454
    prototype_parent: grid_room
    key: 西北村口
    desc: 西北村口接著往雙流城的商道，路口常停著等候結伴的貨車。車夫們坐在車轅上啃乾糧，順便打聽前面的路況。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  shrine_front:
    x_m: 189
    y_m: 189
    prototype_parent: grid_room
    key: 教堂前
    desc: 教堂前朝西南，望得見平原盡頭的海色。階上的石縫裡長著耐鹽的細草，風大的日子連鐘聲都被吹散。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: village_green
  destination: village_end_southeast
  direction: se
- source: village_end_southeast
  destination: village_green
  direction: nw
- source: village_green
  destination: village_end_northwest
  direction: nw
- source: village_end_northwest
  destination: village_green
  direction: se
- source: village_green
  destination: shrine_front
  direction: sw
- source: shrine_front
  destination: village_green
  direction: ne
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: nw
    destination_node: village_end_southeast
  - return_direction: se
    destination_node: village_end_northwest
city_gate:
