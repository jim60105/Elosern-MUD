version: 1
kind: settlement
id: village_west_bend
location_ref: village_west_bend
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  village_green:
    x_m: 309
    y_m: 204
    prototype_parent: anchor_room
    key: 河灣綠地
    desc: 綠地貼著河灣，井水與河水只隔一道石堤。堤縫裡總是滲出濕潤的水痕，夏天摸上去冰涼。
    anchor_key: village_west_bend
    typeclass:
    scene_archetype: city_street
  village_end_east:
    x_m: 518
    y_m: 204
    prototype_parent: grid_room
    key: 東村口
    desc: 東村口接上往東牧鎮的長路，路口蘆葦高過人頭。葦叢裡常藏著水鳥的巢，走過時驚起一片拍翅聲。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  village_end_west:
    x_m: 100
    y_m: 204
    prototype_parent: grid_room
    key: 西村口
    desc: 西村口是村裡最安靜的一頭，門外的小徑一直下到河邊的菜地。欄邊掛著斗笠，風一來便撞著木樁。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  shrine_front:
    x_m: 309
    y_m: 100
    prototype_parent: grid_room
    key: 教堂前
    desc: 教堂前朝南，河上的霧時常漫過階前的矮牆。石階被打濕得發亮，清早走上去得扶著牆才不會滑倒。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: village_green
  destination: village_end_east
  direction: e
- source: village_end_east
  destination: village_green
  direction: w
- source: village_green
  destination: village_end_west
  direction: w
- source: village_end_west
  destination: village_green
  direction: e
- source: village_green
  destination: shrine_front
  direction: s
- source: shrine_front
  destination: village_green
  direction: n
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: w
    destination_node: village_end_east
