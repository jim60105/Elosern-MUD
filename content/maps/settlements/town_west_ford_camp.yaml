version: 1
kind: settlement
id: town_west_ford_camp
location_ref: town_west_ford_camp
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  central_plaza:
    x_m: 287
    y_m: 600
    prototype_parent: anchor_room
    key: 西渡石坪
    desc: 石坪東側較高，站在那裡能望見南面邊界河的水光。渡口的木樁與繩索就架在坡下，來往的人都在此換氣再上路。
    anchor_key: town_west_ford_camp
    typeclass:
    scene_archetype: city_street
  northeast_gate:
    x_m: 764
    y_m: 1077
    prototype_parent: grid_room
    key: 東北柵門
    desc: 東北門朝向疾風城的方向，門外的草原一路鋪到天邊。守門人會替過路的人指認那條避風的車道。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  south_gate:
    x_m: 287
    y_m: 100
    prototype_parent: grid_room
    key: 南面關門
    desc: 南門朝著渡口的方向，出門是沿坡而下的土路，走上一段才見河灘。載貨的人在半途的石台換肩，順便看一眼水勢。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  northeast_gate_road_1:
    x_m: 480
    y_m: 879
    prototype_parent: grid_room
    key: 東北大街
    desc: 大街往東北延伸，兩旁是替渡口備貨的棚屋，堆著繩索與木桶。車伕在此裝載，繩結打的是河邊通用的樣式。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  market_street:
    x_m: 228
    y_m: 761
    prototype_parent: grid_room
    key: 渡頭市街
    desc: 市街北側的攤子擺著渡資換來的雜貨，鹽與布料最受歡迎。攤主認得每一戶人家，賒帳只記在心裡。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  tribal_hall:
    x_m: 100
    y_m: 823
    prototype_parent: grid_room
    key: 議事廳前庭
    desc: 前庭西北角掛著渡口的排班木牌，誰守夜、誰出船寫得清清楚楚。族人議事時，最先談的總是如何看住這一段河面。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  assembly_ground:
    x_m: 354
    y_m: 436
    prototype_parent: grid_room
    key: 集會石場
    desc: 南側的石場是集會與分派工作的空地，場邊擱著幾條待修的繩具。鼓聲一起，坡下的渡口也聽得見。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  training_ground:
    x_m: 477
    y_m: 334
    prototype_parent: grid_room
    key: 成年獵場
    desc: 東南的空場靠近坡緣，地面被踩得堅硬。年輕人背著沙袋在場邊來回練腳力，為成年禮的追獵先把身子練實。
    anchor_key:
    typeclass:
    scene_archetype: city_street
