version: 1
kind: settlement
id: village_salt_pan
location_ref: village_salt_pan
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  village_green:
    x_m: 238
    y_m: 238
    prototype_parent: anchor_room
    key: 鹽池綠地
    desc: 綠地旁攤著曬鹽的淺池，井水帶著一點鹹味。村人只用它洗滌與澆菜，飲水仍要走遠路去挑河泉。
    anchor_key: village_salt_pan
    typeclass:
    scene_archetype: city_street
  village_end_northeast:
    x_m: 376
    y_m: 376
    prototype_parent: grid_room
    key: 東北村口
    desc: 東北村口往雙流城的路，鹽車一輛接一輛，把路面磨得發白。車輪碾過碎鹽，晴天裡閃著細碎的光。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  village_end_southwest:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 西南村口
    desc: 西南村口順著海岸南下，直通金穗港的鹽倉。路邊堆著蓋草蓆的鹽袋，海風掀動蓆角，露出底下的白鹽。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  shrine_front:
    x_m: 307
    y_m: 169
    prototype_parent: grid_room
    key: 教堂前
    desc: 教堂前朝東南，階上總鋪著一層細白的鹽霜。海風一來便打著旋飛散，落在牆根的草葉上。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: village_green
  destination: village_end_northeast
  direction: ne
- source: village_end_northeast
  destination: village_green
  direction: sw
- source: village_green
  destination: village_end_southwest
  direction: sw
- source: village_end_southwest
  destination: village_green
  direction: ne
- source: village_green
  destination: shrine_front
  direction: se
- source: shrine_front
  destination: village_green
  direction: nw
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: sw
    destination_node: village_end_northeast
  - return_direction: ne
    destination_node: village_end_southwest
