    desc: 岔路開在山腰的平台上，往南是下坡回到鹽道城，往北則是通往蜜谷鎮的長坡。路旁的石堆標出冬季的界線。
    anchor_key: hamlet_hillside
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 農舍前
    desc: 農舍前砌了一座小石窯，屋主燒炭貼補家用。屋後的坡上留著一片薪炭林，每隔幾年才輪伐一次。
    anchor_key:
    typeclass:
    scene_archetype: city_street
