version: 1
kind: settlement
id: village_reed_ford
location_ref: village_reed_ford
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  village_green:
    x_m: 322
    y_m: 211
    prototype_parent: anchor_room
    key: 蘆灘綠地
    desc: 綠地就鋪在蘆葦灘邊，井欄是用河灘上的圓石砌成的。清晨打水的人總要撥開垂到井口的葦葉，桶裡的水帶著一股淡淡的草腥味。
    anchor_key: village_reed_ford
    typeclass:
    scene_archetype: city_street
  village_end_east:
    x_m: 544
    y_m: 211
    prototype_parent: grid_room
    key: 東村口
    desc: 東村口接上往東南的東灣港官道，路面鋪著壓實的河沙。車轍裡常積著淺淺的水，雨天車夫得下車推著走。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  village_end_west:
    x_m: 100
    y_m: 211
    prototype_parent: grid_room
    key: 西村口
    desc: 西村口往西北是通往雙流城的長路，路邊晾著成排的葦席。風一吹，葦席便沙沙作響，像有人沿路翻著書頁。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  shrine_front:
    x_m: 322
    y_m: 100
    prototype_parent: grid_room
    key: 教堂前
    desc: 教堂前的石階朝南，階下是一小片菜圃。南風送來河上的水氣與蘆花的氣味，階面總比別處涼上幾分。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: village_green
  destination: village_end_east
  direction: e
- source: village_end_east
  destination: village_green
  direction: w
- source: village_green
  destination: village_end_west
  direction: w
- source: village_end_west
  destination: village_green
  direction: e
- source: village_green
  destination: shrine_front
  direction: s
- source: shrine_front
  destination: village_green
  direction: n
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: w
    destination_node: village_end_east
  - return_direction: e
    destination_node: village_end_west
