  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  crossing:
    x_m: 198
    y_m: 100
    prototype_parent: anchor_room
    key: 溪尾岔路
    desc: 岔路在溪水流盡的地方，路邊只剩一片濕泥。往西的路通往鹽道城，夏天的泥地會陷住車輪。
    anchor_key: hamlet_stream_tail
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 屋前小橋
    desc: 屋前架著一座木橋，跨過已經很淺的溪尾。屋主在橋下養了幾隻鴨，鴨群整天在泥裡翻找。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
  direction: w
- source: homestead_front
  destination: crossing
  direction: e
