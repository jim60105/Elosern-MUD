version: 1
kind: settlement
id: hamlet_west_road
location_ref: hamlet_west_road
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  crossing:
    x_m: 178
    y_m: 100
    prototype_parent: anchor_room
    key: 岔路口
    desc: 岔路口往東接上草原長路，往西可折向雙流城。路旁立著一根舊路標，木頭被風吹得歪向一邊。
    anchor_key: hamlet_west_road
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 農舍前
    desc: 農舍前的西邊小路通往雙流城，屋前立著一根拴馬樁。院裡曬著草料，幾個孩子蹲在地上撿穀粒。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
  direction: w
- source: homestead_front
  destination: crossing
  direction: e
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: w
    destination_node: crossing
  - return_direction: e
    destination_node: homestead_front
city_gate:
