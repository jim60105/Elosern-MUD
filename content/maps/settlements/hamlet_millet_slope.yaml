version: 1
kind: settlement
id: hamlet_millet_slope
location_ref: hamlet_millet_slope
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  crossing:
    x_m: 161
    y_m: 161
    prototype_parent: anchor_room
    key: 路口
    desc: 兩條路在此交會，一條往西南去麥浪城，一條往東北去沉鐘鎮。路旁的黍田順著坡勢往上排開，穗子在風裡低頭。
    anchor_key: hamlet_millet_slope
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 農舍前
    desc: 農舍前的空地朝東北，屋前曬著一層新打的黍米。日頭偏西時，場上的影子拉得很長。場邊的竹耙靠在牆角，齒上還卡著穀粒。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
  direction: sw
- source: homestead_front
  destination: crossing
  direction: ne
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: sw
    destination_node: crossing
  - return_direction: ne
    destination_node: homestead_front
