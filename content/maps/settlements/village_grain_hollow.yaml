version: 1
kind: settlement
id: village_grain_hollow
location_ref: village_grain_hollow
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  village_green:
    x_m: 232
    y_m: 232
    prototype_parent: anchor_room
    key: 穀坳綠地
    desc: 綠地圍著坳底的一口老井，井欄上刻著模糊的年號。坳裡少風，曬穀的竹席從綠地一路鋪到屋簷下。
    anchor_key: village_grain_hollow
    typeclass:
    scene_archetype: city_street
  village_end_southeast:
    x_m: 364
    y_m: 100
    prototype_parent: grid_room
    key: 東南村口
    desc: 東南村口通往麥浪城，路從坳口緩緩下到平原。運穀的車隊常在這裡整隊，車轍把路面壓得很實。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  village_end_northwest:
    x_m: 100
    y_m: 364
    prototype_parent: grid_room
    key: 西北村口
    desc: 西北村口朝魔晶鎮，路沿著坳邊的矮坡走。坡上種著耐寒的穀子，風過時穗子一層層倒下去。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  shrine_front:
    x_m: 166
    y_m: 166
    prototype_parent: grid_room
    key: 教堂前
    desc: 教堂前的石地朝西南，曬不到正午的日頭。階邊堆著幾捆新割的穀子，香味混著線香。線香的味道從門縫裡飄出來。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: village_green
  destination: village_end_southeast
  direction: se
- source: village_end_southeast
  destination: village_green
  direction: nw
- source: village_green
  destination: village_end_northwest
  direction: nw
- source: village_end_northwest
  destination: village_green
  direction: se
- source: village_green
  destination: shrine_front
  direction: sw
- source: shrine_front
  destination: village_green
  direction: ne
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: nw
    destination_node: village_end_southeast
  - return_direction: se
    destination_node: village_end_northwest
city_gate:
