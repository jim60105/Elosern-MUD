version: 1
kind: settlement
id: village_mastiff_ridge
location_ref: village_mastiff_ridge
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  village_green:
    x_m: 284
    y_m: 192
    prototype_parent: anchor_room
    key: 獒犬圖騰
    desc: 寨心的獒犬圖騰朝南蹲坐，石雕的鼻頭被摸得光滑。嶺上的風把旗繩打得啪啪作響。旗繩上的布條已經被風撕成細條。
    anchor_key: village_mastiff_ridge
    typeclass:
    scene_archetype: city_street
  village_end_east:
    x_m: 468
    y_m: 192
    prototype_parent: grid_room
    key: 東寨門
    desc: 東寨門通往疾風城的方向，門外沿嶺脊而行的路窄得只能過一列人。兩側是陡落的草坡，走慣的人也不敢並行。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  village_end_west:
    x_m: 100
    y_m: 192
    prototype_parent: grid_room
    key: 西寨門
    desc: 西寨門朝西渡營，門前是一片可以望遠的草嶺。巡嶺的族人每天從這裡出發。草嶺上的獸徑交錯，走遠了得靠風向認路。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  shrine_front:
    x_m: 284
    y_m: 100
    prototype_parent: grid_room
    key: 祖靈祭壇
    desc: 祖靈祭壇在寨子東南的石壁前，壇上擺著歷年守嶺犬的骨飾。族人說牠們的魂還在山脊上跑。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: village_green
  destination: village_end_east
  direction: e
- source: village_end_east
  destination: village_green
  direction: w
- source: village_green
  destination: village_end_west
  direction: w
- source: village_end_west
  destination: village_green
  direction: e
- source: village_green
  destination: shrine_front
  direction: s
- source: shrine_front
  destination: village_green
  direction: n
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: w
    destination_node: village_end_east
  - return_direction: e
    destination_node: village_end_west
city_gate:
