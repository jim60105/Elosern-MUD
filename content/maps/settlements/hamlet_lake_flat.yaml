  homestead_front:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 農舍前
    desc: 農舍前的院子曬著剛割的草，屋後有一小片菜圃。圃邊立著幾根竹竿，竿上晾著濕衣裳，風一吹便貼在竿上。
    anchor_key:
    typeclass:
    scene_archetype: city_street
