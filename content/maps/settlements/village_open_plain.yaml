version: 1
kind: settlement
id: village_open_plain
location_ref: village_open_plain
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  village_green:
    x_m: 226
    y_m: 226
    prototype_parent: anchor_room
    key: 平原綠地
    desc: 綠地孤零零地立在空曠的原野上，井是這片平原少見的水源。井邊鋪著防風的草墊，坐上去還能聞到曬乾的草味。
    anchor_key: village_open_plain
    typeclass:
    scene_archetype: city_street
  village_end_southeast:
    x_m: 352
    y_m: 100
    prototype_parent: grid_room
    key: 東南村口
    desc: 東南村口往橙花鎮，長路筆直得看不見盡頭。路旁只有低矮的野草隨風擺動，偶爾有隻鷹停在路樁上。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  village_end_northwest:
    x_m: 100
    y_m: 352
    prototype_parent: grid_room
    key: 西北村口
    desc: 西北村口通往銀嶺鎮，路邊偶有放牧的帳篷。炊煙在遠處裊裊升起，走近了才聽得見羊叫。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  shrine_front:
    x_m: 163
    y_m: 163
    prototype_parent: grid_room
    key: 教堂前
    desc: 教堂前朝西南，風從空曠的草原上直吹過來。階前的旗繩整日響個不停，曬在階上的穀物得用石頭壓住。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: village_green
  destination: village_end_southeast
  direction: se
- source: village_end_southeast
  destination: village_green
  direction: nw
- source: village_green
  destination: village_end_northwest
  direction: nw
- source: village_end_northwest
  destination: village_green
  direction: se
- source: village_green
  destination: shrine_front
  direction: sw
- source: shrine_front
  destination: village_green
  direction: ne
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: nw
    destination_node: village_end_southeast
  - return_direction: se
    destination_node: village_end_northwest
