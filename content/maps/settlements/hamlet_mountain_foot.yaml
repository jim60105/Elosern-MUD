version: 1
kind: settlement
id: hamlet_mountain_foot
location_ref: hamlet_mountain_foot
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  crossing:
    x_m: 161
    y_m: 161
    prototype_parent: anchor_room
    key: 山腳岔路
    desc: 岔路貼著東側山壁的下緣，路面一半是土一半是落石。往北的山路通往斷崖鎮，路口總堆著新掃下的碎石。
    anchor_key: hamlet_mountain_foot
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 農舍前
    desc: 農舍前朝東北敞開，屋後緊貼著坡腳。冬天的風從山上灌下來，門前那道石牆就是為了擋風才壘的。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
  direction: sw
- source: homestead_front
  destination: crossing
  direction: ne
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: sw
    destination_node: crossing
  - return_direction: ne
    destination_node: homestead_front
