    desc: 圖騰柱上的獾首朝著轉彎的方向，柱身被往來的馱獸蹭得光滑。彎道內側留著卸貨的空地。
    anchor_key: hamlet_badger_bend
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 178
    prototype_parent: grid_room
    key: 火塘石臺
    desc: 火塘砌在石臺上，臺下是排水的淺溝。往東南的官道通往角原城，往北通往鹿鳴渡。淺溝在雨季能把積水引到坡下。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
  direction: nw
- source: homestead_front
  destination: crossing
  direction: se
