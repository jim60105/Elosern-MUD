version: 1
kind: settlement
id: hamlet_spring_flat
location_ref: hamlet_spring_flat
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  crossing:
    x_m: 100
    y_m: 100
    prototype_parent: anchor_room
    key: 岔路口
    desc: 村口的岔路朝南，一條小徑直下星輝城的平原。路邊的草叢裡有泉水滲出，走過去鞋底會沾上濕泥。
    anchor_key: hamlet_spring_flat
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 195
    prototype_parent: grid_room
    key: 農舍前
    desc: 農舍前有一圈石砌的井欄，泉水從屋後的小渠流過。院裡擺著洗衣的石板，板面被水沖得光滑。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
  direction: n
- source: homestead_front
  destination: crossing
  direction: s
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: n
