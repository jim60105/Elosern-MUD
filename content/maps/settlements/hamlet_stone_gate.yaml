version: 1
kind: settlement
id: hamlet_stone_gate
location_ref: hamlet_stone_gate
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  crossing:
    x_m: 167
    y_m: 167
    prototype_parent: anchor_room
    key: 石門路口
    desc: 路口兩側是一對突出的岩壁，路面從岩縫間穿過，風在石壁間發出回聲，夜裡聽來像有人在低語。
    anchor_key: hamlet_stone_gate
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 岩下農舍
    desc: 農舍前的空地灑著細碎的岩屑，往西南的路通往灰岩城，屋後的岩壁擋住大半風勢。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
  direction: sw
- source: homestead_front
  destination: crossing
  direction: ne
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: sw
    destination_node: crossing
  - return_direction: ne
    destination_node: homestead_front
city_gate:
