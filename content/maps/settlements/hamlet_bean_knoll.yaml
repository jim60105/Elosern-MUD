version: 1
kind: settlement
id: hamlet_bean_knoll
location_ref: hamlet_bean_knoll
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  crossing:
    x_m: 161
    y_m: 100
    prototype_parent: anchor_room
    key: 路口
    desc: 路口往西北是帝河津的舊道，往東南通往東牧鎮。路旁的豆田沿著緩坡排開，藤蔓爬滿了竹架。
    anchor_key: hamlet_bean_knoll
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 161
    prototype_parent: grid_room
    key: 農舍前
    desc: 農舍前的空地朝東南，屋前曬著一層新剝的豆子。孩子拿著竹竿在場邊趕雀，喊聲傳得很遠。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
  direction: nw
- source: homestead_front
  destination: crossing
  direction: se
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: nw
    destination_node: crossing
  - return_direction: se
    destination_node: homestead_front
