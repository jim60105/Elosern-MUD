version: 1
kind: settlement
id: hamlet_deer_islet
location_ref: hamlet_deer_islet
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  crossing:
    x_m: 205
    y_m: 100
    prototype_parent: anchor_room
    key: 祖靈柱
    desc: 祖靈柱立在河洲的高處，柱身被河水泡得發黑。洲上草叢裡有鹿群踏出來的細徑。洲上的草被鹿群啃得短而整齊。
    anchor_key: hamlet_deer_islet
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 火塘棚
    desc: 火塘上搭著遮雨的棚子，棚柱是從河洲砍來的柳木。往東南的官道通往咆哮王城。棚柱上綁著用柳皮搓成的繩子。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
  direction: w
- source: homestead_front
  destination: crossing
  direction: e
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: w
    destination_node: crossing
  - return_direction: e
    destination_node: homestead_front
