version: 1
kind: settlement
id: village_wheat_hollow
location_ref: village_wheat_hollow
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  village_green:
    x_m: 299
    y_m: 200
    prototype_parent: anchor_room
    key: 麥坳井台
    desc: 村中的井台旁是壓麥的石碾，井水拌著磨坊的粉塵，麥稈在空地邊堆成高垛。
    anchor_key: village_wheat_hollow
    typeclass:
    scene_archetype: city_street
  village_end_east:
    x_m: 498
    y_m: 200
    prototype_parent: grid_room
    key: 東村口
    desc: 東村口的路往葡萄鎮方向開，路旁是成塊的麥田，收割後的田裡留著整齊的麥茬。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  village_end_west:
    x_m: 100
    y_m: 200
    prototype_parent: grid_room
    key: 西村口
    desc: 西村口朝著遺跡鎮的坡道上去，車斗裡滿是待磨的麥粒，路邊的磨盤堆在樹蔭下。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  shrine_front:
    x_m: 299
    y_m: 100
    prototype_parent: grid_room
    key: 教堂前庭
    desc: 小教堂前的庭地舖著麥稈與碎石，南邊的坳地一望無際，收成時庭前會擺出秤與斗。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: village_green
  destination: village_end_east
  direction: e
- source: village_end_east
  destination: village_green
  direction: w
- source: village_green
  destination: village_end_west
  direction: w
- source: village_end_west
  destination: village_green
  direction: e
- source: village_green
  destination: shrine_front
  direction: s
- source: shrine_front
  destination: village_green
  direction: n
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: w
    destination_node: village_end_east
  - return_direction: e
    destination_node: village_end_west
