version: 1
kind: settlement
id: hamlet_mid_vale
location_ref: hamlet_mid_vale
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  crossing:
    x_m: 169
    y_m: 100
    prototype_parent: anchor_room
    key: 谷中岔路
    desc: 岔路落在谷地最平的一段，兩側的山壁把風擋在外面。往西的路通往西礦港，路面鋪著運礦石留下的碎石。
    anchor_key: hamlet_mid_vale
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 169
    prototype_parent: grid_room
    key: 農舍前
    desc: 農舍前引了一條山澗的水，用剖開的竹管接到水缸。屋主在谷裡種了些耐蔭的蔬菜，收成不多但夠一家人吃。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
  direction: nw
- source: homestead_front
  destination: crossing
  direction: se
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: nw
    destination_node: crossing
  - return_direction: se
    destination_node: homestead_front
