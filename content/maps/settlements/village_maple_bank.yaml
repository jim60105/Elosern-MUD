version: 1
kind: settlement
id: village_maple_bank
location_ref: village_maple_bank
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  village_green:
    x_m: 262
    y_m: 100
    prototype_parent: anchor_room
    key: 井畔空地
    desc: 村心空地上是一口鑿在河階上的井，井水清冽，楓樹的影子在井欄上來回移動。
    anchor_key: village_maple_bank
    typeclass:
    scene_archetype: city_street
  village_end_west:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 西村口
    desc: 西村口的道路沿著河岸通往聖潔王都，岸邊楓葉落滿石階，河水在橋墩間翻出白沫。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  village_end_east:
    x_m: 424
    y_m: 100
    prototype_parent: grid_room
    key: 東村口
    desc: 東村口往上游的方向開，路旁晾著染布與漁具，河面在此轉寬，倒映著整排楓樹。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  shrine_front:
    x_m: 262
    y_m: 181
    prototype_parent: grid_room
    key: 教堂前庭
    desc: 小教堂前的庭地舖著河石，北邊的路通往東渡鎮，禮拜堂的窗正對著上游的河灣。
    anchor_key:
    typeclass:
    scene_archetype: city_street
