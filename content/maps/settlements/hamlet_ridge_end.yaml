version: 1
kind: settlement
id: hamlet_ridge_end
location_ref: hamlet_ridge_end
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  crossing:
    x_m: 161
    y_m: 100
    prototype_parent: anchor_room
    key: 稜尾路口
    desc: 路口落在稜線的尾端，路面狹窄只容一車，兩側是向下滑落的碎石坡，風從谷底一路刮上來。
    anchor_key: hamlet_ridge_end
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 161
    prototype_parent: grid_room
    key: 稜尾農舍
    desc: 農舍前的空地只夠拴幾匹騾子，西北方的邊界河在谷底發亮，屋後的稜線到此便斷了。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
  direction: nw
- source: homestead_front
  destination: crossing
  direction: se
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: nw
    destination_node: crossing
  - return_direction: se
    destination_node: homestead_front
