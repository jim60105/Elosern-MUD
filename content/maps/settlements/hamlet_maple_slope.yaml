version: 1
kind: settlement
id: hamlet_maple_slope
location_ref: hamlet_maple_slope
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  crossing:
    x_m: 192
    y_m: 100
    prototype_parent: anchor_room
    key: 楓林路口
    desc: 路口被楓樹夾住，落葉鋪滿路面，車轍在葉層下若隱若現，秋天時整條路像燒起來一樣紅。
    anchor_key: hamlet_maple_slope
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 楓木農舍
    desc: 農舍前的空地堆著楓木柴，往西的路通往合流城，屋後坡上的楓葉在風裡翻出淺色的背面。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
  direction: w
- source: homestead_front
  destination: crossing
  direction: e
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: w
    destination_node: crossing
  - return_direction: e
    destination_node: homestead_front
