version: 1
kind: settlement
id: town_stag_ferry
location_ref: town_stag_ferry
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  central_plaza:
    x_m: 193
    y_m: 825
    prototype_parent: anchor_room
    key: 鹿鳴石坪
    desc: 石坪中央立著一根刻滿鹿角的木柱，是這座渡口聚落最早的地標。往南兩里多便是高地河的渡口，水聲在夜裡格外清楚。
    anchor_key: town_stag_ferry
    typeclass:
    scene_archetype: city_street
  east_gate:
    x_m: 668
    y_m: 825
    prototype_parent: grid_room
    key: 東面柵門
    desc: 東門外通往角原城的草坡，來往的牧隊常在門邊歇腳。守門人會替他們看住牲口，順便打聽北邊草場的消息。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  south_gate:
    x_m: 193
    y_m: 100
    prototype_parent: grid_room
    key: 南面關門
    desc: 南門正對著高地河的渡口，出門就是往下的石階。渡船靠岸時，繩索摩擦木樁的聲音會一路傳上坡來。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  south_gate_road_1:
    x_m: 177
    y_m: 458
    prototype_parent: grid_room
    key: 南門大街
    desc: 大街往南斜下，路面鋪著防滑的河石，雨天也不泥濘。兩旁堆著待運的貨物，繩結打得比別處整齊。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  market_street:
    x_m: 100
    y_m: 679
    prototype_parent: grid_room
    key: 渡市石街
    desc: 市街西南側離渡口最近，擺的多是繩具、木桶與渡資換來的雜貨。船伕與商販講價時，總會抬頭看一眼水位。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  tribal_hall:
    x_m: 160
    y_m: 1069
    prototype_parent: grid_room
    key: 議事廳前庭
    desc: 前庭北側的牆上釘著渡口的排班木牌，誰家出船、誰家守夜都寫得明白。族人議事時，坐得最近的多半是船伕的家人。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  assembly_ground:
    x_m: 343
    y_m: 913
    prototype_parent: grid_room
    key: 集會石場
    desc: 東北角的石場邊緣擺著幾條翻修過的舊船板，當成長凳使用。集會的日子，鼓聲與水聲會混在一起，聽久了分不清。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  training_ground:
    x_m: 333
    y_m: 528
    prototype_parent: grid_room
    key: 成年獵場
    desc: 東南的空場靠近河岸高處，地面被踩得結實。年輕人得在急流邊緣撐筏往返一趟，才算通過這裡的成年試煉。
    anchor_key:
    typeclass:
    scene_archetype: city_street
