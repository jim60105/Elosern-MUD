version: 1
kind: settlement
id: hamlet_star_field
location_ref: hamlet_star_field
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  crossing:
    x_m: 200
    y_m: 100
    prototype_parent: anchor_room
    key: 岔路口
    desc: 岔路口往東通往星輝城，夜裡能望見城樓上稀疏的燈火。路旁立著幾根路樁，樁面被風沙磨得發白。
    anchor_key: hamlet_star_field
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 農舍前
    desc: 農舍前的西邊小路往翠湖鎮方向，屋前曬著一層穀子。屋簷下掛著一盞舊燈籠，天黑後便點起來。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
  direction: w
- source: homestead_front
  destination: crossing
  direction: e
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: w
    destination_node: crossing
  - return_direction: e
    destination_node: homestead_front
