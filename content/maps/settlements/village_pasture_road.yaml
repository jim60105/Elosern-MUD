version: 1
kind: settlement
id: village_pasture_road
location_ref: village_pasture_road
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  village_green:
    x_m: 100
    y_m: 287
    prototype_parent: anchor_room
    key: 牧欄綠地
    desc: 綠地邊圍著矮木欄，井旁拴著幾匹剛飲過水的牧馬。馬尾不時掃過井臺，把拴馬樁上的蒼蠅趕得亂轉。
    anchor_key: village_pasture_road
    typeclass:
    scene_archetype: city_street
  village_end_north:
    x_m: 100
    y_m: 474
    prototype_parent: grid_room
    key: 北村口
    desc: 北村口往東牧鎮，路上常有趕著牛群的牧人。蹄印深淺不一地印在土裡，牛鈴聲隔著老遠就聽得見。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  village_end_south:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 南村口
    desc: 南村口順著官道下東灣港，海風把草香一路帶到海邊。路旁的草叢伏得很低，像被誰用手撫過。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  shrine_front:
    x_m: 194
    y_m: 287
    prototype_parent: grid_room
    key: 教堂前
    desc: 教堂前朝東，牆外是一片被牲口踏平的草地。階上留著幾枚乾掉的泥蹄印，雨後又會被新蹄印覆蓋。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: village_green
  destination: village_end_north
  direction: n
- source: village_end_north
  destination: village_green
  direction: s
- source: village_green
  destination: village_end_south
  direction: s
- source: village_end_south
  destination: village_green
  direction: n
- source: village_green
  destination: shrine_front
  direction: e
- source: shrine_front
  destination: village_green
  direction: w
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: s
    destination_node: village_end_north
  - return_direction: n
    destination_node: village_end_south
