version: 1
kind: settlement
id: hamlet_bean_plain
location_ref: hamlet_bean_plain
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  crossing:
    x_m: 161
    y_m: 100
    prototype_parent: anchor_room
    key: 路口
    desc: 路口往西北接帝河津的來路，往東南則通往東牧鎮。兩旁的豆田整片鋪開，豆莢在日頭下裂開細縫。
    anchor_key: hamlet_bean_plain
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 161
    prototype_parent: grid_room
    key: 農舍前
    desc: 農舍前的空地朝東南，屋後晾著一排在田裡揀回的豆稈。夜裡風大，豆莢碰在一起發出細碎的聲響。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
  direction: nw
- source: homestead_front
  destination: crossing
  direction: se
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: nw
    destination_node: crossing
  - return_direction: se
    destination_node: homestead_front
