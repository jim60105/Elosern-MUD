version: 1
kind: settlement
id: village_bulrush_bend
location_ref: village_bulrush_bend
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  village_green:
    x_m: 100
    y_m: 328
    prototype_parent: anchor_room
    key: 蒲灣綠地
    desc: 綠地靠著河灣，井挖在離水幾步的高處。灣裡的蒲草長得比人高，風一吹就露出水面上的野鴨。
    anchor_key: village_bulrush_bend
    typeclass:
    scene_archetype: city_street
  village_end_north:
    x_m: 100
    y_m: 556
    prototype_parent: grid_room
    key: 北村口
    desc: 北村口往楓麓鎮，路從河灣邊爬上一道土坡。坡上看得到整片灣地，蒲穗在日頭下泛著黃光。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  village_end_south:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 南岸巷口
    desc: 村子南端的巷口接著河邊的渡口小路，路窄得只容一輛車。往南是蒲灣的水面，雨季時路會被水淹去一截。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  shrine_front:
    x_m: 214
    y_m: 328
    prototype_parent: grid_room
    key: 教堂前
    desc: 教堂前的石階朝東，階下就是河灣的葦叢。清晨的水氣順著石階往上爬，臺階很少乾過。船家上階前都會先在石欄上擦乾腳。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: village_green
  destination: village_end_north
  direction: n
- source: village_end_north
  destination: village_green
  direction: s
- source: village_green
  destination: village_end_south
  direction: s
- source: village_end_south
  destination: village_green
  direction: n
- source: village_green
  destination: shrine_front
  direction: e
- source: shrine_front
  destination: village_green
  direction: w
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: s
    destination_node: village_end_north
