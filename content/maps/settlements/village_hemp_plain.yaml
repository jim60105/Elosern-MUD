version: 1
kind: settlement
id: village_hemp_plain
location_ref: village_hemp_plain
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  village_green:
    x_m: 309
    y_m: 204
    prototype_parent: anchor_room
    key: 麻原綠地
    desc: 綠地中央的井旁架著麻繩絞盤，繩子被手磨得發亮。平原上的風大，晾麻的架子在綠地邊排成一列。
    anchor_key: village_hemp_plain
    typeclass:
    scene_archetype: city_street
  village_end_east:
    x_m: 518
    y_m: 204
    prototype_parent: grid_room
    key: 東村口
    desc: 東村口直通麥浪城，路面寬得能並行兩輛車。路旁堆著成捆的麻桿，等著商隊順路載走。商隊在此歇腳，順便打聽麥浪城的行情。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  village_end_west:
    x_m: 100
    y_m: 204
    prototype_parent: grid_room
    key: 西村口
    desc: 西村口往魔晶鎮的方向延伸，路邊的麻田一直鋪到天邊。夏末麻熟，村人整日在田裡剝麻皮。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  shrine_front:
    x_m: 309
    y_m: 100
    prototype_parent: grid_room
    key: 教堂前
    desc: 教堂前的空地朝南，曬著幾片剛染好的麻布。風一吹布角翻起，露出底下壓著的石塊。布角壓著石塊，免得被風掀走。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: village_green
  destination: village_end_east
  direction: e
- source: village_end_east
  destination: village_green
  direction: w
- source: village_green
  destination: village_end_west
  direction: w
- source: village_end_west
  destination: village_green
  direction: e
- source: village_green
  destination: shrine_front
  direction: s
- source: shrine_front
  destination: village_green
  direction: n
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: w
    destination_node: village_end_east
  - return_direction: e
    destination_node: village_end_west
