version: 1
kind: settlement
id: village_cattle_pasture
location_ref: village_cattle_pasture
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  village_green:
    x_m: 100
    y_m: 278
    prototype_parent: anchor_room
    key: 井邊牧地
    desc: 綠地邊的石井供著半個村子，井欄外就是牛隻過夜的圍欄，草料堆在牆邊，空氣裡混著乾草與牛糞的味道。
    anchor_key: village_cattle_pasture
    typeclass:
    scene_archetype: city_street
  village_end_north:
    x_m: 100
    y_m: 456
    prototype_parent: grid_room
    key: 北村口
    desc: 北村口朝東河城的方向，牛群每天清晨從這裡被趕上坡，路面留著一層薄泥，牧人會在路口清點牛隻的數目。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  village_end_south:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 南村口
    desc: 南村口通往斷崖鎮，坡道兩旁的牧草長得齊膝，黃昏時牧人趕著牛隻回村，牛鈴的聲音在山坳裡傳得很遠。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  shrine_front:
    x_m: 189
    y_m: 278
    prototype_parent: grid_room
    key: 教堂前
    desc: 教堂在綠地東側，鐘樓下方是一片矮牆圍起的墓地，牆外的牛群低頭吃草，偶爾有幾頭隔著矮牆探頭張望。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: village_green
  destination: village_end_north
  direction: n
- source: village_end_north
  destination: village_green
  direction: s
- source: village_green
  destination: village_end_south
  direction: s
- source: village_end_south
  destination: village_green
  direction: n
- source: village_green
  destination: shrine_front
  direction: e
- source: shrine_front
  destination: village_green
  direction: w
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: s
    destination_node: village_end_north
  - return_direction: n
    destination_node: village_end_south
