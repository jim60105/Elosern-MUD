version: 1
kind: settlement
id: hamlet_tide_shore
location_ref: hamlet_tide_shore
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  crossing:
    x_m: 100
    y_m: 178
    prototype_parent: anchor_room
    key: 路口
    desc: 路口往南接潮風鎮的港道，往北是通往日出鎮的海岸路。路旁的草被鹽風吹得伏地，葉尖帶著白霜。
    anchor_key: hamlet_tide_shore
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 農舍前
    desc: 農舍前的空地朝北，屋後是一片曬鹽的淺灘。日頭落下時，灘上的水光一直亮到日出鎮的方向。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
  direction: s
- source: homestead_front
  destination: crossing
  direction: n
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: s
    destination_node: crossing
  - return_direction: n
    destination_node: homestead_front
