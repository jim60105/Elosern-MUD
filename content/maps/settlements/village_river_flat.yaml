version: 1
kind: settlement
id: village_river_flat
location_ref: village_river_flat
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  village_green:
    x_m: 100
    y_m: 253
    prototype_parent: anchor_room
    key: 河窪綠地
    desc: 綠地靠著帝河沖積的窪地，井水清冽，井邊繫著兩頭等著拉水的驢。驢子不耐煩地刨著蹄下的軟土。
    anchor_key: village_river_flat
    typeclass:
    scene_archetype: city_street
  village_end_north:
    x_m: 100
    y_m: 469
    prototype_parent: grid_room
    key: 北村口
    desc: 北村口沿河直上雙流城，河風把帆影吹得貼近岸邊。水聲整日不停，夜裡也能聽見船夫撐篙的聲響。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  village_end_southeast:
    x_m: 253
    y_m: 100
    prototype_parent: grid_room
    key: 東南村口
    desc: 東南村口接往東灣港的官道，路肩外就是帝河的淺灘。退水時露出一片卵石，孩子們蹲在那裡翻找河蚌。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  shrine_front:
    x_m: 208
    y_m: 253
    prototype_parent: grid_room
    key: 教堂前
    desc: 教堂前朝東，正對著河面升起的日頭。階前的石板被晨光曬得溫熱，坐著曬太陽的老人總捨不得起身。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: village_green
  destination: village_end_north
  direction: n
- source: village_end_north
  destination: village_green
  direction: s
- source: village_green
  destination: village_end_southeast
  direction: se
- source: village_end_southeast
  destination: village_green
  direction: nw
- source: village_green
  destination: shrine_front
  direction: e
- source: shrine_front
  destination: village_green
  direction: w
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: s
    destination_node: village_end_north
  - return_direction: nw
    destination_node: village_end_southeast
