version: 1
kind: settlement
id: village_horse_ridge
location_ref: village_horse_ridge
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  village_green:
    x_m: 204
    y_m: 204
    prototype_parent: anchor_room
    key: 飲馬井台
    desc: 村中空地的石井旁臥著飲馬槽，井台四周拴滿待售的馬匹，鞍具排在牆邊曬太陽。
    anchor_key: village_horse_ridge
    typeclass:
    scene_archetype: city_street
  village_end_southeast:
    x_m: 308
    y_m: 100
    prototype_parent: grid_room
    key: 東南村口
    desc: 東南村口的馬道通往葡萄鎮，路面被馬蹄踏得結實，坡下傳來馴馬人的呼喝聲。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  village_end_northwest:
    x_m: 100
    y_m: 308
    prototype_parent: grid_room
    key: 西北村口
    desc: 西北村口朝互市城的方向翻過稜線，路肩插著防風的短樁，遠處可見界橋一帶的河光。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  shrine_front:
    x_m: 152
    y_m: 152
    prototype_parent: grid_room
    key: 教堂前庭
    desc: 小教堂立在矮牆之後，庭前空地被馬蹄踩出淺坑，西南方的草坡上散著幾匹牧馬。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: village_green
  destination: village_end_southeast
  direction: se
- source: village_end_southeast
  destination: village_green
  direction: nw
- source: village_green
  destination: village_end_northwest
  direction: nw
- source: village_end_northwest
  destination: village_green
  direction: se
- source: village_green
  destination: shrine_front
  direction: sw
- source: shrine_front
  destination: village_green
  direction: ne
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: nw
    destination_node: village_end_southeast
  - return_direction: se
    destination_node: village_end_northwest
