version: 1
kind: settlement
id: hamlet_pasture_plain
location_ref: hamlet_pasture_plain
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  crossing:
    x_m: 165
    y_m: 100
    prototype_parent: anchor_room
    key: 岔路口
    desc: 岔路口往東南接上牧道，牧道繞過草原，北面通往東牧鎮。路旁的水槽裡積著雨水，牛群經過時總要停下來飲上一陣。
    anchor_key: hamlet_pasture_plain
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 165
    prototype_parent: grid_room
    key: 農舍前
    desc: 農舍前的西北小路通往雙流城方向，欄裡養著幾頭乳牛。屋簷下掛著奶桶，桶沿被繩子磨得發亮。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
  direction: nw
- source: homestead_front
  destination: crossing
  direction: se
