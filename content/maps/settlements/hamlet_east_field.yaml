version: 1
kind: settlement
id: hamlet_east_field
location_ref: hamlet_east_field
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  crossing:
    x_m: 100
    y_m: 189
    prototype_parent: anchor_room
    key: 岔路口
    desc: 岔路口往北接往東牧鎮的牧道，路兩旁是低矮的柵欄。欄外的草被啃得整齊，路上散著新鮮的牛糞。
    anchor_key: hamlet_east_field
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 農舍前
    desc: 農舍前的南邊小路通往雙流城方向，屋後拴著兩匹役馬。院裡放著一副舊犁，犁頭擦得發亮。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
  direction: s
- source: homestead_front
  destination: crossing
  direction: n
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: s
    destination_node: crossing
  - return_direction: n
    destination_node: homestead_front
