version: 1
kind: settlement
id: village_stone_pit
location_ref: village_stone_pit
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  village_green:
    x_m: 213
    y_m: 213
    prototype_parent: anchor_room
    key: 石坑井台
    desc: 村中的石井旁堆著鑿出的石料，井水微濁，石匠在空地上打磨石磨與門柱。
    anchor_key: village_stone_pit
    typeclass:
    scene_archetype: city_street
  village_end_southeast:
    x_m: 326
    y_m: 100
    prototype_parent: grid_room
    key: 東南村口
    desc: 東南村口的路順著坑壁繞出去，路邊整齊碼著石板，車轍深得能蓄住雨水。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  village_end_northwest:
    x_m: 100
    y_m: 326
    prototype_parent: grid_room
    key: 西北村口
    desc: 西北村口朝著遺跡鎮的方向穿過乾旱的稜線，路旁的取石坑一個接著一個。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  shrine_front:
    x_m: 156
    y_m: 156
    prototype_parent: grid_room
    key: 教堂前庭
    desc: 小教堂前的庭地舖著切割過的石板，西南方望得見層層的岩階，風起時塵土貼地而行。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: village_green
  destination: village_end_southeast
  direction: se
- source: village_end_southeast
  destination: village_green
  direction: nw
- source: village_green
  destination: village_end_northwest
  direction: nw
- source: village_end_northwest
  destination: village_green
  direction: se
- source: village_green
  destination: shrine_front
  direction: sw
- source: shrine_front
  destination: village_green
  direction: ne
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: nw
    destination_node: village_end_southeast
  - return_direction: se
    destination_node: village_end_northwest
