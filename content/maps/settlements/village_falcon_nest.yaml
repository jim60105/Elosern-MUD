version: 1
kind: settlement
id: village_falcon_nest
location_ref: village_falcon_nest
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  village_green:
    x_m: 227
    y_m: 227
    prototype_parent: anchor_room
    key: 隼形圖騰
    desc: 寨心的隼形圖騰柱細長，柱頂的木雕張著翅。柱下是族中輪值守夜的位置，夜裡總有一盞燈。
    anchor_key: village_falcon_nest
    typeclass:
    scene_archetype: city_street
  village_end_southeast:
    x_m: 354
    y_m: 100
    prototype_parent: grid_room
    key: 東南寨門
    desc: 東南寨門通往疾風城，門外那道風口常年不停。守門人用獸皮裹住臉才站得住。風口兩側的草被吹得貼地，門柱上綁著加重的石塊。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  village_end_northwest:
    x_m: 100
    y_m: 354
    prototype_parent: grid_room
    key: 西北寨門
    desc: 西北寨門朝西渡營的方向，門前一段路穿過低矮的灌木。灌木上結著細小的紅果，是守門人打發時間的零嘴。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  shrine_front:
    x_m: 163
    y_m: 163
    prototype_parent: grid_room
    key: 祖靈祭壇
    desc: 祖靈祭壇在寨子西南的土坡上，壇旁設了養鷹的木架。祭壇的香火味和鷹身上的氣味混在一起。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: village_green
  destination: village_end_southeast
  direction: se
- source: village_end_southeast
  destination: village_green
  direction: nw
- source: village_green
  destination: village_end_northwest
  direction: nw
- source: village_end_northwest
  destination: village_green
  direction: se
- source: village_green
  destination: shrine_front
  direction: sw
- source: shrine_front
  destination: village_green
  direction: ne
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: nw
    destination_node: village_end_southeast
  - return_direction: se
    destination_node: village_end_northwest
