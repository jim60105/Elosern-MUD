version: 1
kind: settlement
id: village_buckwheat_hollow
location_ref: village_buckwheat_hollow
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  village_green:
    x_m: 232
    y_m: 232
    prototype_parent: anchor_room
    key: 井坳綠地
    desc: 綠地圍著一口淺井，井欄上搭著蕎麥桿編的遮棚。坳地擋住風，正午的綠地熱烘烘，曬穀的人都在此歇腳。
    anchor_key: village_buckwheat_hollow
    typeclass:
    scene_archetype: city_street
  village_end_northeast:
    x_m: 364
    y_m: 364
    prototype_parent: grid_room
    key: 東北村口
    desc: 東北村口順著往魔晶鎮的路爬出坳口，兩旁是成片的蕎麥花。花開時白得刺眼，蜂子整日在坡上嗡嗡作響。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  village_end_southwest:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 西南村口
    desc: 西南村口接上黑土鎮的來路，路面是踩實的黑土。雨後泥濘深陷車輪，村人便在路邊備了碎石。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  shrine_front:
    x_m: 298
    y_m: 166
    prototype_parent: grid_room
    key: 教堂前
    desc: 教堂前的石板地朝東南，坡上吹來的風帶著蕎麥的甜味。石縫裡長著細草，孩子常蹲在那裡挑石子。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: village_green
  destination: village_end_northeast
  direction: ne
- source: village_end_northeast
  destination: village_green
  direction: sw
- source: village_green
  destination: village_end_southwest
  direction: sw
- source: village_end_southwest
  destination: village_green
  direction: ne
- source: village_green
  destination: shrine_front
  direction: se
- source: shrine_front
  destination: village_green
  direction: nw
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: sw
    destination_node: village_end_northeast
  - return_direction: ne
    destination_node: village_end_southwest
city_gate:
