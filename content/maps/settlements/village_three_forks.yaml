version: 1
kind: settlement
id: village_three_forks
location_ref: village_three_forks
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  village_green:
    x_m: 341
    y_m: 220
    prototype_parent: anchor_room
    key: 三叉綠地
    desc: 大道在此交會，綠地就長在路口圍出的空地上。井欄邊擺著賣鹽與賣魚的兩排攤子，清早最為熱鬧。
    anchor_key: village_three_forks
    typeclass:
    scene_archetype: city_street
  village_end_east:
    x_m: 582
    y_m: 220
    prototype_parent: grid_room
    key: 東村口
    desc: 東村口正對橄欖津方向的路，鹽車與漁車在此換道。路心的石板被壓出兩道深深的車轍，雨天積著水。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  village_end_west:
    x_m: 100
    y_m: 220
    prototype_parent: grid_room
    key: 西村口
    desc: 西村口通往鹽津城與南潮港的分岔，口邊有一座給旅人歇腳的涼棚。黃昏時棚下坐滿了等天涼再趕路的人。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  shrine_front:
    x_m: 341
    y_m: 100
    prototype_parent: grid_room
    key: 教堂前
    desc: 教堂前的石階面向南邊的平原，階旁種著一排防風的樹。節慶時村人把供桌擺到階下，香煙順著南風散開。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: village_green
  destination: village_end_east
  direction: e
- source: village_end_east
  destination: village_green
  direction: w
- source: village_green
  destination: village_end_west
  direction: w
- source: village_end_west
  destination: village_green
  direction: e
- source: village_green
  destination: shrine_front
  direction: s
- source: shrine_front
  destination: village_green
  direction: n
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: w
    destination_node: village_end_east
  - return_direction: e
    destination_node: village_end_west
