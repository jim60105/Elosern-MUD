    desc: 岔路口往東接上海岸官道，順路下去便是東南方的東灣港。路口鋪著壓實的貝殼與細沙，車輪走過留下淺淺的印子。
    anchor_key: hamlet_bay_flat
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 農舍前
    desc: 農舍前的西邊小路通向雙流城方向，路旁是低矮的防風籬。屋簷下晾著幾張補過的網，海風一吹便輕輕擺動。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
