    desc: 路口往東北的小徑接上海岸路，路邊是一方長滿蘆葦的池塘。葦叢密得看不見水面，只有水鳥的叫聲傳出來。
    anchor_key: hamlet_reed_pond
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 152
    y_m: 152
    prototype_parent: grid_room
    key: 農舍前
    desc: 農舍前的空地朝西南，屋後是塘邊的葦地。秋天割葦時，村人把葦捆靠在牆邊晾著。葦捆曬乾後要浸水一天，才好剖成細條。
    anchor_key:
    typeclass:
    scene_archetype: city_street
