version: 1
kind: settlement
id: village_creek_flat
location_ref: village_creek_flat
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  village_green:
    x_m: 100
    y_m: 297
    prototype_parent: anchor_room
    key: 溪埔綠地
    desc: 綠地旁有一道引水的小渠，從上游大河分出，井就鑿在渠邊。村人把成束的稻穗攤在綠地上曬。
    anchor_key: village_creek_flat
    typeclass:
    scene_archetype: city_street
  village_end_north:
    x_m: 100
    y_m: 494
    prototype_parent: grid_room
    key: 北村口
    desc: 北村口通往鹽津城，口外的路沿著河岸往上游走。運穀的牛車常在此停下讓牲口飲水，轍印陷進濕土。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  village_end_south:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 南村口
    desc: 南村口下坡就是白帆港的灘頭，能聞到海水的味道。出去的船家把空魚簍靠在口邊的矮牆上，回程再取。
    anchor_key:
    typeclass:
    scene_archetype: city_street
  shrine_front:
    x_m: 198
    y_m: 297
    prototype_parent: grid_room
    key: 教堂前渠
    desc: 教堂前的地坪靠著水渠，階前的石槽是公用洗衣的地方。傍晚婦女在槽邊捶衣，水聲與鐘聲混在一起。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: village_green
  destination: village_end_north
  direction: n
- source: village_end_north
  destination: village_green
  direction: s
- source: village_green
  destination: village_end_south
  direction: s
- source: village_end_south
  destination: village_green
  direction: n
- source: village_green
  destination: shrine_front
  direction: e
- source: shrine_front
  destination: village_green
  direction: w
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
  - return_direction: s
    destination_node: village_end_north
  - return_direction: n
    destination_node: village_end_south
