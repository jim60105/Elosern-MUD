version: 1
kind: settlement
id: hamlet_wolf_bend
location_ref: hamlet_wolf_bend
options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  crossing:
    x_m: 171
    y_m: 171
    prototype_parent: anchor_room
    key: 狼首圖騰
    desc: 圖騰柱上刻著狼首，柱頂繫著幾束曬乾的草繩。營地四周的林地靜得只剩風聲。火塘的煙在樹冠下散不開。
    anchor_key: hamlet_wolf_bend
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 100
    y_m: 100
    prototype_parent: grid_room
    key: 公用火塘
    desc: 火塘挖在土坡背風的一面，柴火整齊堆在旁邊。往東的路通往虎嘯城，往西則是咆哮王城。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
  direction: sw
- source: homestead_front
  destination: crossing
  direction: ne
wilderness_entry:
  shape:
  - '#'
  offset:
    dx: 0
    dy: 0
  single_cell_footprint: true
  gates:
