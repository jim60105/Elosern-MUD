options:
  map_visual_range: 2
  map_mode: nodes
exit_prototype:
  prototype_parent: xyz_exit
  typeclass: typeclasses.exits.CostedXYZExit
nodes:
  crossing:
    x_m: 100
    y_m: 171
    prototype_parent: anchor_room
    key: 路口
    desc: 路口往南通往帝河津，往西北則是帝都的官道。河灣的水面浮著一層萍葉，風一吹就散開又合攏。
    anchor_key: hamlet_duckweed_bend
    typeclass:
    scene_archetype: city_street
  homestead_front:
    x_m: 171
    y_m: 100
    prototype_parent: grid_room
    key: 農舍前
    desc: 農舍前的空地朝西北，屋後是河堤的一段。堤上種著柳樹，根鬚被水沖得露在外面。堤面的土被踩得很實，走起來不留腳印。
    anchor_key:
    typeclass:
    scene_archetype: city_street
roads:
- source: crossing
  destination: homestead_front
