    name_zh: 聖潔王都光明神殿
    desc_zh: 光明神殿的光比屋子先到，長窗沿中殿一路開到屋頂，晨光從窗格斜斜落下來，亮得幾乎可以用手捧住。長椅對著墊高的臺，主祭在那裡誦讀、祝禱、回答提問；空氣裡留著一點今日焚香的氣息。近處的牆邊，中殿沒有任何隔斷或簾幔，直接敞進聖所自己的大廳，那裡是教會行愛之工的地方，從長椅上就看得見那裡的商品櫃。祝禱、事工與買賣是同一份信仰的三座櫃檯，並排站在同一片光裡；這座城市裡沒有人會覺得提起它們其中任何一樣時該壓低聲音。
