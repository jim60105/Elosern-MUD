    name_zh: 聖潔王都光明神殿
    desc_zh: 光明神殿的光先落在中殿，長窗沿著中殿一路開到屋頂，晨光從窗格斜著落下來，照得地面一片亮。長椅對著墊高的臺，主祭在那裡誦讀、祝禱、回答提問；空氣裡留著一點今日焚香的氣息。近處的牆邊沒有任何隔斷或簾幔，中殿直接敞進聖所自己的大廳，那裡是教會行愛之工的地方，從長椅上就看得見商品櫃。祝禱、事工與買賣在同一座屋簷下並排進行，這座城市裡沒有人會覺得提起它們其中任何一樣時該壓低聲音。
