    desc_zh: 聖潔王都的王座通道在自己屋簷下升起，磨亮的石材正是這座王都立足的崖壁顏色，立柱之間的寬度夠得過一支儀仗，最遠端是三級臺的矮臺，王椅在臺後俯瞰整座大殿的全長。它宏偉、潔淨，而且正在等待，門口沒有衛兵，地上沒有跪求的人，沒有任何聲音在大理石上迴盪。這間屋子遲早要裝進的東西、一座王宮該有的每個故事，都還沒有被寫出來，大殿也懶得假裝不是這樣。沿著它走完一趟的人會聽見的唯一聲音是自己的腳步，那才是這座城市頭上這頂王冠最忠實的描述。
