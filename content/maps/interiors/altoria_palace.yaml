    desc_zh: 聖潔王都的王座通道在自己屋簷下向上延伸，磨亮的石材帶著這座王都立足的崖壁顏色，立柱之間寬得能過一支儀仗，最遠端是一座三級矮臺，王椅在臺後俯瞰整座大殿。它宏偉、潔淨，也還在等待，門口沒有衛兵，地上沒有跪求的人，沒有任何聲音在大理石上迴盪。一座王宮該有的排場，這裡還沒有出現，大殿也不假裝自己有。沿著它走完一趟的人只會聽見自己的腳步，那正是這座城市頭上這頂王冠的實情。
