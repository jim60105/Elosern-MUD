    name_zh: 聖潔王都校場
    desc_zh: 聖潔王都的校場是上城牆下一片耙平的泥地，練習樁沿場邊立成一列，圍繩的握處磨得發白，一條長凳擺在場邊，一整個上午的招式練下來，每個人都會一身汗。王都的徵兵白天在此操練，公會到傍晚才來用屬於它的時段，樁上的痕跡來自上百雙不同的手。場子裡沒有任何東西會替人磨快一刀，也不會替人評定階級；這裡只承接這座城市練功的功課，而在這裡，每個人都看得見標準在哪裡。
