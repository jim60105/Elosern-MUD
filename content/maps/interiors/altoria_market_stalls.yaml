    name_zh: 聖潔王都市集棚
    desc_zh: 聖潔王都的市集棚是蓋在別人攤位上頭的一片屋頂，長長一座棚子，支架撐著帆布與攔板，日光從縫隙漏下來，在空蕩的攤位排之間拖出淡淡的光條。每個攤位都掃過了、也都不屬於誰，賣果子的天亮推車進來、黃昏推車出去，賣唱的佔西門那片寬地，這塊地本身不養任何固定的店主。一條街的生意靠的是只站今天一天的人，而棚子蓋來就是為了等那樣的人，什麼都不問，什麼都不留。
