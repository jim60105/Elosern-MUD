    name_zh: 菲爾溫的家
    desc_zh: 這是樹冠吊橋上最高的一間平台屋，三面朝著枝葉敞開，風一來，掛著的布幔就往裡翻。門邊的木釘上搭著一件長披風，顏色已經洗淡；牆上掛著一把長弓，弓身比王國還古老，弦早卸了下來。屋裡沒有幾件東西，一張低榻、一個煮水的壺，還有一塊坐得發亮的板面，正好對著外面的樹梢。
