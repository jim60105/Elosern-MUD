    name_zh: 聖潔王都衛兵駐所
    desc_zh: 聖潔王都的衛兵駐所站在南門的陰影裡，一間溫暖的屋子對著拱門下冰冷的通道，一面牆邊擺著長凳與兵器架，火盆把天花板燻得黝黑，半開的木窗板俯瞰門洞，值更的人坐在爐邊就能看見門洞前後的動靜。靴子按整點進出這裡，牆上的輿圖標出每一條出城的路。這是當值的場所，駐所該掛在輿圖旁邊的東西，告示、公文、賞金名單，這裡一概沒有；王都的活兒從公會那扇門進來，這扇門不發活。
