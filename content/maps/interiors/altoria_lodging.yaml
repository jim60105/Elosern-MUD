    name_zh: 聖潔王都爐火旅店
    desc_zh: 聖潔王都的爐火旅店把公共大廳圍在一道嵌牆的火塘邊，那面牆正是它與酒館共用的隔牆，巷子裡的兩扇門因此暖著同一間長屋。上了樓梯，客房的門一字排開，門後各自私密，一張床、一個臉盆、一道扣得住的門閂。這座城市在這裡把旅途睡回去，歇著、一覺到天亮，或是趁著安靜的幾個小時修煉。樓梯對每個使用它的人都不作任何要求。
