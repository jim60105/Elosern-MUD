    desc_zh: 聖所開在中殿旁邊，同一個屋簷、同一排窗，暖的光、洗淨的亞麻布、臉盆裡備好的溫水，一面牆邊是一張和城裡任何店面沒有兩樣的商品櫃，禮儀與安養器物的層架、玻璃瓶、軟布祭袍摺得整整齊齊，標價與補貨的方式跟雜貨店一模一樣。執事們手臂下夾著賬簿，在櫃檯與廊底客房之間來回，喊執事名字的聲調跟喊祝禱時完全一樣。敬拜、事工、買賣在同一棟屋簷下、毫不避人。光明教會就是這樣過日子，聖所公開營生這件事，整個大陸都知道，跟酒館賣酒沒有兩樣。
