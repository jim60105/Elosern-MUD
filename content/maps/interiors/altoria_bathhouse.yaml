    name_zh: 聖潔王都公共浴場
    desc_zh: 聖潔王都的公共浴場，人還沒走到門口，蒸氣就先漫過浴場前的路緣。屋內隔成男側與女側，各有各深的河水池，也各有各愛大喊大潑水的老主顧，中間隔著一道高牆，管理員的喊聲整天沿著牆傳過來。這裡守的是王都人族與獸人的規矩，寬衣一事各人自己處理，不給旁人看；而這棟建築是唯一讓它在陌生人面前、隔著一堵牆進行的所在。精靈和他們共浴，會覺得沒有什麼值得隔牆；這道分歧也成了浴場的一處標記，伊莎貝爾對它很有意見，問起就說給你聽。
