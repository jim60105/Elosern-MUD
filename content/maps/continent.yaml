regions:
  central_mountains:
    display_name_zh: 中央山脈
    nation_key:
    terrain_flavor_zh:
    - 陡峭的山壁直插雲霄，寒風中隱約傳來難以辨明來源的歌聲。
    - 林木稀疏的山徑蜿蜒而上，碎石在腳下滑動，四周異常寂靜。
    - 雲霧終年繚繞山腰，據說深處藏著人族從未涉足之地。
    nominal_nation_keys:
    - altoria
    - grandia
    - valhalla
    scene_archetype: mountain_path
  eastern_plains:
    display_name_zh: 東部大平原
    nation_key: grandia
    terrain_flavor_zh:
    - 一望無際的麥田隨風起伏，遠方農莊的炊煙筆直升起。
    - 平整的官道兩側是修剪整齊的果園，牛車緩緩碾過塵土。
    - 肥沃的黑土地上阡陌縱橫，灌溉渠道映著天光。
    nominal_nation_keys:
    - grandia
    scene_archetype: wilderness_path
  north_deep_forest:
    display_name_zh: 北部深林
    nation_key:
    terrain_flavor_zh:
    - 巨木遮蔽天日，林間彌漫著潮濕腐葉的氣息，寂靜得令人不安。
    - 糾結的藤蔓封鎖了視野，遠處似乎有什麼龐然大物正在移動。
    - 無人踏足的密林深處，偶爾傳來不知名生物的低吼。
    nominal_nation_keys:
    - grandia
    - valhalla
    scene_archetype: forest_path
  northwest_highland_forest:
    display_name_zh: 西北高地森林
    nation_key: valhalla
    terrain_flavor_zh:
    - 高聳的針葉林間，獸群的足跡清晰可辨，空氣中帶著松脂的氣味。
    - 起伏的高地覆蓋著濃密的森林，獵人的營火痕跡散落其間。
    - 礦脈裸露的岩壁旁，成群的野獸在林間空地遊蕩。
    nominal_nation_keys:
    - valhalla
    scene_archetype: forest_path
  southeast_coast:
    display_name_zh: 東南海岸
    nation_key: grandia
    terrain_flavor_zh:
    - 鹹濕的海風夾雜著魚市的喧鬧，遠方帆影點點。
    - 石砌的碼頭邊堆滿待運的貨箱，海鳥在桅杆間盤旋。
    - 潮水拍打著防波堤，港區小巷瀰漫著海產與香料的氣味。
    nominal_nation_keys:
    - grandia
    scene_archetype: coastal_path
  southwest_coast:
    display_name_zh: 西南海岸
    nation_key: altoria
    terrain_flavor_zh:
    - 精工打磨的木船停靠在小巧的港灣，工匠的敲打聲不絕於耳。
    - 海崖下的漁村炊煙裊裊，曬鹽場在陽光下泛著白光。
    - 商船的旗幟在海風中獵獵作響，岸邊堆滿待售的精工器物。
    nominal_nation_keys:
    - altoria
    scene_archetype: coastal_path
  western_hills_valleys:
    display_name_zh: 西部丘陵與谷地
    nation_key: altoria
    terrain_flavor_zh:
    - 起伏的丘陵間點綴著石砌梯田，遠處傳來礦坑鑿擊的回聲。
    - 谷地間河流蜿蜒，兩岸散落著手工業者的作坊與磨坊。
    - 低緩的丘陵覆滿灌木與野花，羊群在坡地上安靜地啃食。
    nominal_nation_keys:
    - altoria
    scene_archetype: wilderness_path
