# Item catalogue slice: core items.
# Each row authors its own definition and its dedicated effects.
items:
  - key: meal
    display_name_zh: 普通餐食
    price_table_key: meal
    sellable: true
    presentation:
      kind: food
      icon_key: food
      rarity: common
      summary_zh: 供旅人充飢的普通餐食。
    use_mechanics:
      consumable: true
      combat_allowed: false
      effects:
        - stat: hp
          amount: 4
        - stat: sp
          amount: 6
