# Item catalogue slice: regional equipment.
# Each row authors its own definition and its dedicated effects.
items:
  - key: beastfolk_warhammer
    display_name_zh: 獸人重鎚
    price_table_key: mundane_weapon
    sellable: true
    presentation:
      kind: weapon
      icon_key: weapon
      rarity: uncommon
      summary_zh: 部族鍛爐打造的巨型戰鎚，非獸人臂力難以掄動。
    equipment_slot: weapon_main
    equipment_effects:
      adjustments:
        atk_phys: 6
        agility: -6%
      weapon_damage_multiplier: 1.1
