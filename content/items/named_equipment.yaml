  - key: elven_traditional_robe
    display_name_zh: 精靈傳統服飾
    price_table_key: masterwork_gear
    sellable: true
    presentation:
      kind: armor
      icon_key: armor
      rarity: legendary
      summary_zh: 精靈族的白色蛛絲傳統服飾，精靈村商店的鎮店商品，體現「以坦露為聖」的文化。
