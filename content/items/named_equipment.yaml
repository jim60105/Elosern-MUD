# Item catalogue slice: named equipment.
# Each row authors its own definition and its dedicated effects.
items:
  - key: baptismal_holy_water
    display_name_zh: 受洗聖水
    price_table_key: potion
    sellable: true
    presentation:
      kind: potion
      icon_key: potion
      rarity: uncommon
      summary_zh: 光明教會祝禱的受洗聖水，能移除身上所有負面狀態。
    use_mechanics:
      consumable: true
      combat_allowed: true
      effects:
        - remove_status: negative
  - key: greater_healing_potion
    display_name_zh: 強效治療藥水
    price_table_key: potion
    sellable: true
    presentation:
      kind: potion
      icon_key: potion
      rarity: rare
      summary_zh: 濃縮煉製的高階治療藥劑。
