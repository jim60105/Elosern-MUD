    equipment_effects:
      adjustments:
        defense: 3
        pleasure_gain: +20%
      exposure_bias: 2
  - key: royal_signet_ring
    display_name_zh: 薇歐蕾特的誕生細金戒
    price_table_key: relic
    sellable: false
    presentation:
      kind: accessory
      icon_key: accessory
      rarity: rare
      summary_zh: 王室在長女誕生之年打造的紋章細金戒，全王國只鍛了這一枚；她戴在右手無名指的這枚細金戒，是隨身攜帶的唯一身分象徵。
