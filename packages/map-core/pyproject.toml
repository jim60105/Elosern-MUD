[project]
name = "elosern-map-core"
version = "0.1.0"
description = "Pure authoring documents, restricted YAML codec, map geometry, sparse routing and terrain rules for the Elosern map layers."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ruamel-yaml>=0.19.1",
]

[project.optional-dependencies]
# Offline district-partition generation only. Runtime decoding, metadata and
# freshness checks stay on the standard library and never import this extra.
generation = [
    "numpy>=2.3",
    "scipy>=1.16",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["elosern_map_core"]

[tool.uv]
required-version = ">=0.12.0"

[dependency-groups]
dev = ["pytest>=8.4.2"]
