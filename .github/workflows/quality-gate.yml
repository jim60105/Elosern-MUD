name: Quality gate

on:
  push:
  pull_request:

permissions:
  contents: read

# A job that runs in a container gets ``sh`` as its default shell, while the
# same step on a host runner gets ``bash``. Every step here is authored against
# bash (``"$(<file)"`` and the like), so the shell is pinned at the workflow
# level rather than drifting with the execution environment.
defaults:
  run:
    shell: bash

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      browser-shards: ${{ steps.shards.outputs.matrix }}
      evennia-shards: ${{ steps.evennia-shards.outputs.matrix }}
      top-level-shards: ${{ steps.top-level-shards.outputs.matrix }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install OpenSpec
        run: npm install --global @fission-ai/openspec@1.13.0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.0"
          enable-cache: true
          prune-cache: true

      - name: Install pinned Python
        run: uv python install "$(<.python-version)"

      - name: Sync locked environment
        run: uv sync --locked

      - name: Validate OpenSpec
        run: openspec validate --all --strict

      - name: Validate static requirement traceability
        run: uv run --locked python -m tools.spec_traceability check

      - name: Run observability lint
        run: uv run --locked python -m tools.observability_lint check

      - name: Run test-data independence lint
        run: uv run --locked python -m tools.test_data_lint check

      - name: Run map-core package tests
        # The pure map package keeps its own project and lock; it must stay
        # importable and green without Evennia or Django in the environment.
        # The generation extra is only for the offline partition generator;
        # the runtime codec/freshness tests also run without it in the root suite.
        working-directory: packages/map-core
        run: uv run --locked --extra generation python -m pytest tests

      - name: Validate map reference context freshness
        run: uv run --locked python -m tools.map_reference_context --check

      - name: Run Node DOM-independent test suite
        run: node --test web/static/webclient/js/tests/*.test.js

      - name: Validate execution shard manifests
        # The repository contract gate (tools/contract_gate.py): shard manifest
        # structure plus the shard-ownership and frozen-audit contracts. The
        # traceability and lint gates it also bundles run in their own steps.
        run: uv run --locked python -m tools.contract_gate manifests contracts

      - name: Compute browser shard matrix
        id: shards
        run: >-
          echo "matrix=$(uv run --locked python -c
          "import json; print(json.dumps(json.load(open('.github/browser-shards.json'))['shards']))")"
          >> "$GITHUB_OUTPUT"

      - name: Compute evennia shard matrix
        id: evennia-shards
        run: >-
          echo "matrix=$(uv run --locked python -c
          "import json; print(json.dumps(json.load(open('.github/evennia-shards.json'))['shards']))")"
          >> "$GITHUB_OUTPUT"

      - name: Compute top-level shard matrix
        id: top-level-shards
        run: >-
          echo "matrix=$(uv run --locked python -c
          "import json; print(json.dumps(json.load(open('.github/top-level-shards.json'))['shards']))")"
          >> "$GITHUB_OUTPUT"

  map-editor:
    # The standalone editor service suite keeps its own project and lock and
    # must run without Evennia, Django or the game's dependency set, so it is a
    # job of its own after the cheap preflight gates and before the gate. Its
    # outcome has nothing to do with the Evennia, browser and top-level shards,
    # so it must not be a step of the preflight job they all wait on: an editor
    # failure there would skip every shard job. The suite stays a preflight-free
    # member of the gate. It needs no Node, no pnpm and no built frontend — the
    # service suite asserts the "frontend is not built" 503 path and starts the
    # service with a scrubbed PATH.
    needs: preflight
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.0"
          enable-cache: true
          prune-cache: true

      - name: Install pinned Python
        run: uv python install "$(<.python-version)"

      - name: Run map-editor service tests
        working-directory: tools/map-editor
        run: uv run --locked python -m pytest tests

  evennia:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.preflight.outputs.evennia-shards) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.0"
          enable-cache: true
          prune-cache: true

      - name: Install pinned Python
        run: uv python install "$(<.python-version)"

      - name: Sync locked environment
        run: uv sync --locked

      # The web.webclient evidence bridges execute the Vue showcase gates
      # (Vite build, Vitest, Storybook, component coverage) as requirement
      # evidence, so the shard needs the same locked Node toolchain the
      # frontend job installs (webclient-vue-02-showcase-core, B2).
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install locked pnpm toolchain
        run: |
          npm install --global pnpm@12.5.1
          pnpm install --frozen-lockfile

      - name: Prepare Evennia runtime directories
        run: mkdir -p server/db server/logs

      - name: Run evennia shard ${{ matrix.index }}
        # ``matrix.workers`` comes from the shard manifest: four outer Django
        # workers everywhere except the frontend evidence shards, where Vitest
        # and Storybook own their worker pools and parallel Django classes
        # would launch competing Vitest/build pools.
        # ``--durations 0`` prints every test's wall time: a shard rebalance is
        # measured from this log rather than from a local timing run.
        env:
          COVERAGE_FILE: coverage-evennia-shard-${{ matrix.index }}
          MUD_TEST_SETTINGS: "1"
          OPENSPEC_TEST_EVIDENCE: evidence.evennia-shard-${{ matrix.index }}.jsonl
        run: >-
          uv run --locked coverage run
          --concurrency=multiprocessing --parallel-mode
          -m evennia test --settings test_settings.py --noinput
          --durations 0
          --parallel ${{ matrix.workers }} ${{ join(matrix.labels, ' ') }}

      - name: Upload coverage and evidence artifacts
        uses: actions/upload-artifact@v7
        with:
          name: evennia-shard-${{ matrix.index }}-artifacts
          if-no-files-found: error
          path: |
            coverage-evennia-shard-${{ matrix.index }}*
            evidence.evennia-shard-${{ matrix.index }}.jsonl

  browser:
    needs: preflight
    runs-on: ubuntu-latest
    # The acceptance suite launches real Chromium and Firefox. Installing them
    # with ``--with-deps`` in every shard job costs the apt archive and the
    # Playwright CDN two dozen connections per shard; on a full matrix that
    # throttling alone reached twenty minutes per job (run 42037867084). The
    # published Playwright image pins the exact browser build and every system
    # dependency, so a shard only starts its own work.
    container:
      image: mcr.microsoft.com/playwright/python:v1.62.0-noble
      options: --ipc=host
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.preflight.outputs.browser-shards) }}

    steps:
      - name: Check out repository workspace A
        uses: actions/checkout@v7
        with:
          path: w-a

      - name: Check out repository workspace B
        uses: actions/checkout@v7
        with:
          path: w-b

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.0"
          enable-cache: true
          prune-cache: true

      - name: Install pinned Python
        run: uv python install "$(<w-a/.python-version)"

      - name: Sync locked environment in workspace A
        run: uv sync --locked
        working-directory: w-a

      - name: Sync locked environment in workspace B
        run: uv sync --locked
        working-directory: w-b

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      # The Vue dist is built into each checkout so the portal serves the
      # bundle from the project origin in both two-process workspaces
      # (webclient-vue-01-foundation, design D2); the GM bundle is built
      # alongside it (gm-portal-s1-foundation).
      - name: Build Vue dist in browser workspaces
        run: |
          npm install --global pnpm@12.5.1
          (cd w-a && pnpm install --frozen-lockfile && pnpm run build && pnpm run build:gm)
          (cd w-b && pnpm install --frozen-lockfile && pnpm run build && pnpm run build:gm)
          # The standalone map editor frontend has its own pnpm workspace/lock;
          # its browser tests serve this dist from the editor service, and the
          # capture-surface and capture-command journeys open the file-loadable
          # capture page (capture-dist) directly.
          (cd w-a/tools/map-editor/frontend && pnpm install --frozen-lockfile && pnpm run build)
          (cd w-b/tools/map-editor/frontend && pnpm install --frozen-lockfile && pnpm run build)
          (cd w-a/tools/map-editor/frontend && pnpm run build:capture)
          (cd w-b/tools/map-editor/frontend && pnpm run build:capture)

      - name: Verify the container's browser bundle
        # The image ships both browsers and their system libraries; this smoke
        # check fails loudly instead of letting a journey report a launch error
        # half-way through a shard.
        run: |
          uv run --locked python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              for name in ("chromium", "firefox"):
                  browser = getattr(playwright, name).launch(headless=True)
                  browser.close()
                  print(f"browser bundle ok: {name}")
          PY
        working-directory: w-a

      - name: Prepare Evennia runtime directories
        run: |
          mkdir -p w-a/server/db w-a/server/logs
          mkdir -p w-b/server/db w-b/server/logs

      - name: Run browser shard ${{ matrix.index }}
        env:
          COVERAGE_FILE: coverage-browser-shard-${{ matrix.index }}-p1
          OPENSPEC_TEST_EVIDENCE: evidence.browser-shard-${{ matrix.index }}-p1.jsonl
        run: |
          status1=0
          status2=0
          # The driver primes Django/Evennia (like seed.main) before unittest
          # loads the labels: journey bodies lazy-import rules-chain modules
          # that read django settings at import time.
          (cd w-a && COVERAGE_FILE="coverage-browser-shard-${{ matrix.index }}-p1" OPENSPEC_TEST_EVIDENCE="evidence.browser-shard-${{ matrix.index }}-p1.jsonl" uv run --locked coverage run -m web.tests.browser.unittest_driver ${{ join(matrix.files_a, ' ') }}) &
          pid1=$!
          (cd w-b && COVERAGE_FILE="coverage-browser-shard-${{ matrix.index }}-p2" OPENSPEC_TEST_EVIDENCE="evidence.browser-shard-${{ matrix.index }}-p2.jsonl" uv run --locked coverage run -m web.tests.browser.unittest_driver ${{ join(matrix.files_b, ' ') }}) &
          pid2=$!
          wait "$pid1" || status1=$?
          wait "$pid2" || status2=$?
          # Merge only the evidence files that exist (a process that fails early may not
          # write its file); missing files on a failed run are warnings, not errors.
          : > "evidence.browser-shard-${{ matrix.index }}.jsonl"
          for f in "w-a/evidence.browser-shard-${{ matrix.index }}-p1.jsonl" "w-b/evidence.browser-shard-${{ matrix.index }}-p2.jsonl"; do
            if [ -f "$f" ]; then
              cat "$f" >> "evidence.browser-shard-${{ matrix.index }}.jsonl"
            else
              echo "warning: missing evidence file: $f" >&2
            fi
          done
          # Copy only the coverage files that exist.
          for f in w-a/coverage-browser-shard-${{ matrix.index }}-p1* w-b/coverage-browser-shard-${{ matrix.index }}-p2*; do
            if [ -f "$f" ]; then
              cp "$f" .
            else
              echo "warning: missing coverage file: $f" >&2
            fi
          done
          # If either process failed, report the real test status (p1 takes precedence).
          if [ "$status1" -ne 0 ]; then
            echo "browser shard ${{ matrix.index }} p1 failed with status $status1" >&2
            exit "$status1"
          fi
          if [ "$status2" -ne 0 ]; then
            echo "browser shard ${{ matrix.index }} p2 failed with status $status2" >&2
            exit "$status2"
          fi
          # Both processes succeeded: any missing evidence file is an infrastructure error.
          for f in "w-a/evidence.browser-shard-${{ matrix.index }}-p1.jsonl" "w-b/evidence.browser-shard-${{ matrix.index }}-p2.jsonl"; do
            if [ ! -f "$f" ]; then
              echo "evidence file missing despite a successful run: $f" >&2
              exit 1
            fi
          done
          exit 0

      - name: Upload coverage and evidence artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-shard-${{ matrix.index }}-artifacts
          if-no-files-found: warn
          path: |
            coverage-browser-shard-${{ matrix.index }}-p1*
            coverage-browser-shard-${{ matrix.index }}-p2*
            evidence.browser-shard-${{ matrix.index }}.jsonl

  frontend:
    needs: preflight
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install locked pnpm toolchain
        run: |
          npm install --global pnpm@12.5.1
          pnpm install --frozen-lockfile

      - name: Build Vue application with Vite
        run: pnpm run build

      - name: Build GM portal with Vite
        run: pnpm run build:gm

      - name: Check GM import boundary
        run: pnpm run test:gm-boundary

      - name: Run Vue component tests with Vitest
        run: pnpm test

      - name: Run map-view primitive tests
        run: pnpm run test:map-view

      - name: Install standalone map editor frontend
        run: pnpm --dir tools/map-editor/frontend install --frozen-lockfile

      - name: Check map editor import boundary
        run: pnpm --dir tools/map-editor/frontend run test:boundary

      - name: Run map editor frontend tests
        run: pnpm --dir tools/map-editor/frontend test

      - name: Build map editor frontend with Vite
        run: pnpm --dir tools/map-editor/frontend run build

      - name: Build the offline capture page with Vite
        run: pnpm --dir tools/map-editor/frontend run build:capture

      - name: Build Storybook component showcase
        run: pnpm run build-storybook

      - name: Check component coverage
        run: pnpm run showcase-coverage

      - name: Verify dist artifact
        run: |
          test -s web/static/webclient/app/dist/index.js
          test -s web/static/webclient/app/dist/index.css
          test -s web/static/gm/dist/index.js
          test -s web/static/gm/dist/index.css
          test -s tools/map-editor/frontend/dist/index.html
          test -s tools/map-editor/frontend/capture-dist/index.html

  top-level:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.preflight.outputs.top-level-shards) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install locked pnpm toolchain
        run: npm install --global pnpm@12.5.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.0"
          enable-cache: true
          prune-cache: true

      - name: Install pinned Python
        run: uv python install "$(<.python-version)"

      - name: Sync locked environment
        run: uv sync --locked

      - name: Prepare the map editor capture toolchain
        # tests/test_map_image_capture.py runs the offline capture command,
        # which loads the file-loadable capture page and renders it in
        # headless Chromium from the editor's own capture environment
        # (capture.py::build_missing and ::SETUP_GUIDANCE name both halves).
        run: |
          pnpm --dir tools/map-editor/frontend install --frozen-lockfile
          pnpm --dir tools/map-editor/frontend run build:capture
          uv run --locked --project tools/map-editor --group capture playwright install --with-deps chromium

      - name: Run top-level regression suite with coverage
        env:
          COVERAGE_FILE: coverage-top-level-shard-${{ matrix.index }}
          OPENSPEC_TEST_EVIDENCE: evidence.top-level-shard-${{ matrix.index }}.jsonl
        # ``--durations 0`` prints every test's wall time: a shard rebalance is
        # measured from this log rather than from a local timing run.
        run: >-
          uv run --locked coverage run -m unittest
          --durations 0
          ${{ join(matrix.labels, ' ') }}

      - name: Upload coverage and evidence artifacts
        uses: actions/upload-artifact@v7
        with:
          name: top-level-shard-${{ matrix.index }}-artifacts
          if-no-files-found: error
          path: |
            coverage-top-level-shard-${{ matrix.index }}*
            evidence.top-level-shard-${{ matrix.index }}.jsonl

  gate:
    needs: [evennia, browser, top-level, frontend, map-editor]
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.0"
          enable-cache: true
          prune-cache: true

      - name: Install pinned Python
        run: uv python install "$(<.python-version)"

      - name: Sync locked environment
        run: uv sync --locked

      - name: Download all execution artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: "*-artifacts"
          merge-multiple: true

      - name: Validate artifact completeness
        run: |
          set -euo pipefail
          shopt -s nullglob
          check_glob() {
            local label="$1" pattern="$2"
            local files=(${pattern})
            [ ${#files[@]} -gt 0 ] || { echo "missing ${pattern} for ${label}"; exit 1; }
            for file in "${files[@]}"; do
              test -s "$file" || { echo "${label} coverage artifact ${file} is empty"; exit 1; }
            done
          }
          while read -r index; do
            check_glob "evennia-shard-${index}" "coverage-evennia-shard-${index}*"
            test -s "evidence.evennia-shard-${index}.jsonl" || { echo "evidence.evennia-shard-${index}.jsonl is missing or empty"; exit 1; }
          done < <(uv run --locked python -c \
            "import json; print('\n'.join(str(s['index']) for s in json.load(open('.github/evennia-shards.json'))['shards']))")
          while read -r index; do
            check_glob "top-level-shard-${index}" "coverage-top-level-shard-${index}*"
            test -s "evidence.top-level-shard-${index}.jsonl" || { echo "evidence.top-level-shard-${index}.jsonl is missing or empty"; exit 1; }
          done < <(uv run --locked python -c \
            "import json; print('\n'.join(str(s['index']) for s in json.load(open('.github/top-level-shards.json'))['shards']))")
          while read -r index; do
            check_glob "browser-shard-${index}" "coverage-browser-shard-${index}*"
            test -s "evidence.browser-shard-${index}.jsonl" || { echo "evidence.browser-shard-${index}.jsonl is missing or empty"; exit 1; }
          done < <(uv run --locked python -c \
            "import json; print('\n'.join(str(s['index']) for s in json.load(open('.github/browser-shards.json'))['shards']))")

      - name: Concatenate requirement evidence in entry-point order
        run: >-
          cat evidence.evennia-shard-*.jsonl evidence.browser-shard-*.jsonl evidence.top-level-shard-*.jsonl
          > evidence.combined.jsonl

      - name: Verify successful requirement execution
        run: >-
          uv run --locked python -m tools.spec_traceability verify
          --evidence evidence.combined.jsonl

      - name: Combine coverage data
        run: >-
          uv run --locked coverage combine
          coverage-evennia* coverage-browser-shard-* coverage-top-level*

      - name: Verify coverage source roots
        run: |
          uv run --locked coverage json --fail-under=0 -o coverage.json
          uv run --locked python -m tools.verify_coverage_roots coverage.json

      - name: Enforce aggregate coverage threshold
        run: uv run --locked coverage report --fail-under=80

      - name: Generate aggregate coverage XML
        run: uv run --locked coverage xml -o coverage.xml

      # The Codecov action fetches its CLI from an unpinned CDN at run time, so
      # a transient refusal of that download (a TLS handshake alert, a CDN edge
      # error) must not turn a fully verified coverage report into a red gate.
      # A genuinely unavailable upload still fails the job: the first attempt
      # only continues the job so the retry can run, and the guard step below
      # fails it when neither attempt completed.
      - name: Upload coverage reports to Codecov
        id: codecov-upload
        continue-on-error: true
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          disable_search: true
          fail_ci_if_error: true

      - name: Retry the Codecov upload once
        id: codecov-upload-retry
        if: steps.codecov-upload.outcome == 'failure'
        continue-on-error: true
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          disable_search: true
          fail_ci_if_error: true

      - name: Fail when the Codecov upload never completed
        if: >-
          steps.codecov-upload.outcome == 'failure'
          && steps.codecov-upload-retry.outcome == 'failure'
        run: |
          echo "The Codecov upload failed on both attempts; the gate cannot report coverage." >&2
          exit 1
