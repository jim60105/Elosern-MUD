name: Quality gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      browser-shards: ${{ steps.shards.outputs.matrix }}
      evennia-shards: ${{ steps.evennia-shards.outputs.matrix }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install OpenSpec
        run: npm install --global @fission-ai/openspec@1.6.0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          version: "0.12.0"
          enable-cache: true
          prune-cache: true

      - name: Install pinned Python
        run: uv python install "$(<.python-version)"

      - name: Sync locked environment
        run: uv sync --locked

      - name: Validate OpenSpec
        run: openspec validate --all --strict

      - name: Validate static requirement traceability
        run: uv run --locked python -m tools.spec_traceability check

      - name: Run Node DOM-independent test suite
        run: node --test web/static/webclient/js/tests/*.test.js

      - name: Validate execution shard manifests
        run: |
          uv run --locked python - <<'PY'
          import json
          import sys
          for name in ("evennia-shards", "browser-shards"):
              manifest = json.load(open(f".github/{name}.json"))
              shards = manifest.get("shards")
              if not shards:
                  print(f"{name}: manifest declares no shards")
                  sys.exit(1)
              indices = [shard["index"] for shard in shards]
              if indices != sorted(indices) or len(indices) != len(set(indices)):
                  print(f"{name}: shard indices must be unique and sorted")
                  sys.exit(1)
              for shard in shards:
                  if name == "browser-shards":
                      files_a = shard.get("files_a") or []
                      files_b = shard.get("files_b") or []
                      if not files_a or not files_b:
                          print(
                              f"{name}: shard {shard.get('index')} must declare "
                              "non-empty files_a and files_b"
                          )
                          sys.exit(1)
                      items = [*files_a, *files_b]
                  else:
                      items = shard.get("labels") or shard.get("files")
                  if not items or not all(
                      isinstance(item, str) and item for item in items
                  ):
                      print(f"{name}: shard {shard.get('index')} must declare non-empty string labels/files")
                      sys.exit(1)
          PY

      - name: Compute browser shard matrix
        id: shards
        run: >-
          echo "matrix=$(uv run --locked python -c
          "import json; print(json.dumps(json.load(open('.github/browser-shards.json'))['shards']))")"
          >> "$GITHUB_OUTPUT"

      - name: Compute evennia shard matrix
        id: evennia-shards
        run: >-
          echo "matrix=$(uv run --locked python -c
          "import json; print(json.dumps(json.load(open('.github/evennia-shards.json'))['shards']))")"
          >> "$GITHUB_OUTPUT"

  evennia:
    needs: preflight
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.preflight.outputs.evennia-shards) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          version: "0.12.0"
          enable-cache: true
          prune-cache: true

      - name: Install pinned Python
        run: uv python install "$(<.python-version)"

      - name: Sync locked environment
        run: uv sync --locked

      - name: Prepare Evennia runtime directories
        run: mkdir -p server/db server/logs

      - name: Run evennia shard ${{ matrix.index }}
        env:
          COVERAGE_FILE: coverage-evennia-shard-${{ matrix.index }}
          MUD_TEST_SETTINGS: "1"
          OPENSPEC_TEST_EVIDENCE: evidence.evennia-shard-${{ matrix.index }}.jsonl
        run: >-
          uv run --locked coverage run
          --concurrency=multiprocessing --parallel-mode
          -m evennia test --settings test_settings.py --noinput
          --parallel 4 ${{ join(matrix.labels, ' ') }}

      - name: Upload coverage and evidence artifacts
        uses: actions/upload-artifact@v7
        with:
          name: evennia-shard-${{ matrix.index }}-artifacts
          if-no-files-found: error
          path: |
            coverage-evennia-shard-${{ matrix.index }}*
            evidence.evennia-shard-${{ matrix.index }}.jsonl

  browser:
    needs: preflight
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.preflight.outputs.browser-shards) }}

    steps:
      - name: Check out repository workspace A
        uses: actions/checkout@v7
        with:
          path: w-a

      - name: Check out repository workspace B
        uses: actions/checkout@v7
        with:
          path: w-b

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          version: "0.12.0"
          enable-cache: true
          prune-cache: true

      - name: Install pinned Python
        run: uv python install "$(<w-a/.python-version)"

      - name: Sync locked environment in workspace A
        run: uv sync --locked
        working-directory: w-a

      - name: Sync locked environment in workspace B
        run: uv sync --locked
        working-directory: w-b

      - name: Install Chromium for browser acceptance
        run: uv run --locked playwright install --with-deps chromium
        working-directory: w-a

      - name: Prepare Evennia runtime directories
        run: |
          mkdir -p w-a/server/db w-a/server/logs
          mkdir -p w-b/server/db w-b/server/logs

      - name: Run browser shard ${{ matrix.index }}
        env:
          COVERAGE_FILE: coverage-browser-shard-${{ matrix.index }}-p1
          OPENSPEC_TEST_EVIDENCE: evidence.browser-shard-${{ matrix.index }}-p1.jsonl
        run: |
          status1=0
          status2=0
          (cd w-a && COVERAGE_FILE="coverage-browser-shard-${{ matrix.index }}-p1" OPENSPEC_TEST_EVIDENCE="evidence.browser-shard-${{ matrix.index }}-p1.jsonl" uv run --locked coverage run -m unittest ${{ join(matrix.files_a, ' ') }}) &
          pid1=$!
          (cd w-b && COVERAGE_FILE="coverage-browser-shard-${{ matrix.index }}-p2" OPENSPEC_TEST_EVIDENCE="evidence.browser-shard-${{ matrix.index }}-p2.jsonl" uv run --locked coverage run -m unittest ${{ join(matrix.files_b, ' ') }}) &
          pid2=$!
          wait "$pid1" || status1=$?
          wait "$pid2" || status2=$?
          cp w-a/coverage-browser-shard-${{ matrix.index }}-p1* .
          cp w-b/coverage-browser-shard-${{ matrix.index }}-p2* .
          cat w-a/evidence.browser-shard-${{ matrix.index }}-p1.jsonl w-b/evidence.browser-shard-${{ matrix.index }}-p2.jsonl > evidence.browser-shard-${{ matrix.index }}.jsonl
          test "$status1" -eq 0 && test "$status2" -eq 0

      - name: Upload coverage and evidence artifacts
        uses: actions/upload-artifact@v7
        with:
          name: browser-shard-${{ matrix.index }}-artifacts
          if-no-files-found: error
          path: |
            coverage-browser-shard-${{ matrix.index }}-p1*
            coverage-browser-shard-${{ matrix.index }}-p2*
            evidence.browser-shard-${{ matrix.index }}.jsonl

  top-level:
    needs: preflight
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          version: "0.12.0"
          enable-cache: true
          prune-cache: true

      - name: Install pinned Python
        run: uv python install "$(<.python-version)"

      - name: Sync locked environment
        run: uv sync --locked

      - name: Run top-level regression suite with coverage
        env:
          COVERAGE_FILE: coverage-top-level
          OPENSPEC_TEST_EVIDENCE: evidence.top-level.jsonl
        run: uv run --locked coverage run -m unittest discover -s tests -t .

      - name: Upload coverage and evidence artifacts
        uses: actions/upload-artifact@v7
        with:
          name: top-level-artifacts
          if-no-files-found: error
          path: |
            coverage-top-level*
            evidence.top-level.jsonl

  gate:
    needs: [evennia, browser, top-level]
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          version: "0.12.0"
          enable-cache: true
          prune-cache: true

      - name: Install pinned Python
        run: uv python install "$(<.python-version)"

      - name: Sync locked environment
        run: uv sync --locked

      - name: Download all execution artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: "*-artifacts"
          merge-multiple: true

      - name: Validate artifact completeness
        run: |
          set -euo pipefail
          shopt -s nullglob
          check_glob() {
            local label="$1" pattern="$2"
            local files=(${pattern})
            [ ${#files[@]} -gt 0 ] || { echo "missing ${pattern} for ${label}"; exit 1; }
            for file in "${files[@]}"; do
              test -s "$file" || { echo "${label} coverage artifact ${file} is empty"; exit 1; }
            done
          }
          while read -r index; do
            check_glob "evennia-shard-${index}" "coverage-evennia-shard-${index}*"
            test -s "evidence.evennia-shard-${index}.jsonl" || { echo "evidence.evennia-shard-${index}.jsonl is missing or empty"; exit 1; }
          done < <(uv run --locked python -c \
            "import json; print('\n'.join(str(s['index']) for s in json.load(open('.github/evennia-shards.json'))['shards']))")
          check_glob "top-level" 'coverage-top-level*'
          test -s evidence.top-level.jsonl || { echo "evidence.top-level.jsonl is missing or empty"; exit 1; }
          while read -r index; do
            check_glob "browser-shard-${index}" "coverage-browser-shard-${index}*"
            test -s "evidence.browser-shard-${index}.jsonl" || { echo "evidence.browser-shard-${index}.jsonl is missing or empty"; exit 1; }
          done < <(uv run --locked python -c \
            "import json; print('\n'.join(str(s['index']) for s in json.load(open('.github/browser-shards.json'))['shards']))")

      - name: Concatenate requirement evidence in entry-point order
        run: >-
          cat evidence.evennia-shard-*.jsonl evidence.browser-shard-*.jsonl evidence.top-level.jsonl
          > evidence.combined.jsonl

      - name: Verify successful requirement execution
        run: >-
          uv run --locked python -m tools.spec_traceability verify
          --evidence evidence.combined.jsonl

      - name: Combine coverage data
        run: >-
          uv run --locked coverage combine
          coverage-evennia* coverage-browser-shard-* coverage-top-level*

      - name: Verify coverage source roots
        run: |
          uv run --locked coverage json --fail-under=0 -o coverage.json
          uv run --locked python -m tools.verify_coverage_roots coverage.json

      - name: Enforce aggregate coverage threshold
        run: uv run --locked coverage report --fail-under=80

      - name: Generate aggregate coverage XML
        run: uv run --locked coverage xml -o coverage.xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          disable_search: true
          fail_ci_if_error: true
