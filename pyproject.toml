[project]
name = "elosern-mud"
version = "0.1.0"
description = "Containerized Evennia foundation for the Elosern MUD."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "evennia==6.1.0",
    "jsonschema==4.25.1",
    "scipy==1.16.0",
]

[tool.uv]
package = false
required-version = ">=0.12.0"

[dependency-groups]
dev = [
    "coverage>=7.15.2",
    "playwright>=1.62.0",
    "tblib>=3.2.2",
]

[tool.coverage.run]
branch = true
source = [
    "commands",
    "server",
    "typeclasses",
    "web",
    "world",
]
# Store source paths relative to the run cwd so data measured inside a
# workspace subdirectory (the two-process browser shards run from w-a/w-b)
# resolves against the gate's own checkout, whose sources sit at the root.
relative_files = true

[tool.coverage.report]
fail_under = 80
omit = ["*/tests/*"]
show_missing = true
